# ArchUnit config.
#
# failOnEmptyShould=false — ĐÚNG BẢN CHẤT cho rule kiểu noClasses().should().dependOn(<cấm>):
#   kết quả rỗng nghĩa là "không class nào phạm luật" = trạng thái lành mạnh, KHÔNG phải lỗi.
#   Guard mặc định (true) hợp cho rule dạng classes().that()...should() (rỗng = filter sai),
#   nhưng sai với rule cấm-phụ-thuộc của ta. Cũng cho phép Phase 0 (module rỗng) build xanh.
archRule.failOnEmptyShould=false
