# libs.versions.toml — NGUỒN VERSION DUY NHẤT của dự án (TECHNOLOGY-STACK.md §3)
#
# ✅ = đã verify trên web (07/2026).  ⚠️ = baseline chưa verify — để Dependabot chốt.
# Đổi version ở đây, không hardcode trong build.gradle.kts.

[versions]
# --- Runtime ---
java = "25"                       # ✅ Temurin 25 (LTS) — ADR-001

# --- Client (libGDX) ---
libgdx = "1.14.2"                 # ✅ latest 05/2026 (ADR-002 ghi 1.13.x — đã cũ)

# --- Server ---
netty = "4.1.136.Final"           # ✅ latest 4.1.x 07/2026 — ADR-003
protobuf = "4.35.1"               # ✅ latest 06/2026
hikaricp = "7.1.0"                # ⚠️ verify — HikariCP (ADR-004)
postgresql = "42.7.9"             # ⚠️ verify — JDBC driver
flyway = "13.0.0"                 # ✅ latest 07/2026 — ADR-013
jedis = "7.5.3"                    # ✅ latest 07/2026 — Redis client (ADR-005)
graaljs = "25.1.3"                 # ✅ latest 07/2026 (org.graalvm.polyglot:js, published ~07/2026) — ADR-016
slf4j = "2.0.18"                  # ✅ verified 07/2026 (transitive qua logback-classic)
logback = "1.5.31"                # ✅ latest 02/2026
micrometer = "1.17.0"             # ✅ latest 07/2026 — ADR-015 (Metrics, Prometheus registry)
opentelemetry = "1.64.0"          # ✅ latest 07/2026 (opentelemetry-bom) — ADR-015 (Tracing)

# --- Test ---
junit = "6.1.2"                  # ✅ junit-bom latest 04/2026
assertj = "3.27.7"                # ⚠️ verify
mockito = "5.23.0"                # ⚠️ verify
testcontainers = "2.0.5"          # ✅ latest 07/2026 — 1.21.3 không tương thích Docker 29 API (min 1.40, xem PostgresAccountAdapterIntegrationTest)
archunit = "1.4.2"                # ✅ latest 04/2026 — ADR-011

# --- Static analysis (tool versions) ---
checkstyle = "10.21.0"            # ⚠️ verify — tool version, dùng trong quality convention
pmd = "7.26.0"                    # ✅ verify 08/2026 — bump từ 7.10.0, fix StackOverflowError type-inference trên JDK 25 (xem STATIC-ANALYSIS.md)
errorprone = "2.50.0"             # ✅ latest verify 07/2026 (BUILD.md Bước 3 — javadoc.io "latest" redirect)
findsecbugs = "1.14.0"            # ✅ latest verify 07/2026 — SpotBugs plugin bắt SQL injection (STATIC-ANALYSIS.md §7, ADR-004)

# --- Gradle plugins ---
spotless = "8.9.0"                 # ✅ latest verify 07/2026 — Gradle 9 OK từ 8.5.0 (CHANGES.md, min Gradle 8.1 từ 8.1.0)
spotbugsPlugin = "6.5.13"          # ✅ SpotBugs Gradle plugin 07/2026
errorpronePlugin = "5.1.0"        # ✅ latest verify 07/2026 — net.ltgt.errorprone (khớp PR Dependabot đang chờ)
protobufPlugin = "0.10.0"         # ✅ latest 07/2026 — com.google.protobuf Gradle plugin
jmhPlugin = "0.7.3"                # ✅ latest (verified 07/2026, no release since 01/2025) — me.champeau.jmh
jmh = "1.37"                       # ✅ latest — org.openjdk.jmh core (BENCHMARK.md §2-3)

[libraries]
# --- libGDX ---
gdx-core = { module = "com.badlogicgames.gdx:gdx", version.ref = "libgdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "libgdx" }
# Native binary cho LWJGL3 desktop. TOML không có key "classifier" — áp dụng bằng
# variantOf(libs.gdx.platform) { classifier("natives-desktop") } ở nơi khai báo dependency
# (client-desktop/build.gradle.kts). Thiếu native = app crash LÚC CHẠY, không lúc compile.
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "libgdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "libgdx" }
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "libgdx" }
gdx-box2d = { module = "com.badlogicgames.gdx:gdx-box2d", version.ref = "libgdx" }
# ADR-029 — TexturePacker cho tools:asset-pipeline. Build-time only, không vào bundle game.
gdx-tools = { module = "com.badlogicgames.gdx:gdx-tools", version.ref = "libgdx" }
# ADR-031 — nạp model glTF cho nhánh render 3D thời gian thực (nhân vật/quái/NPC).
# KHÔNG có trên Maven Central. Jar 318 KB Apache-2.0 đóng gói sẵn trong repo tại
# third-party/m2/ theo ADR-032 (JitPack build theo yêu cầu ⇒ repo gốc mất là build
# gãy vĩnh viễn). Kéo theo đúng 1 phụ thuộc bắc cầu: gdx 1.9.11 — dự án vốn đã có
# gdx 1.14.2 nên không thêm gì mới vào graph.
# ⚠️ libGDX 1.14.2 là phiên bản đã hoàn tác các thay đổi collection từng làm
# gdx-gltf crash lúc chạy — đừng nâng libgdx tuỳ tiện (ADR-031 Consequences).
gdx-gltf = { module = "com.github.mgsx-dev.gdx-gltf:gltf", version = "2.3.0" }
# ⚠️ Ashley ECS: chỉ engine-ecs được dùng (ADR-006). ArchUnit chặn nơi khác.
gdx-ashley = { module = "com.badlogicgames.ashley:ashley", version = "1.7.4" }  # ✅ latest (verified 07/2026)

# --- Server ---
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
graaljs-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graaljs" }
graaljs-js = { module = "org.graalvm.polyglot:js", version.ref = "graaljs" }
# js-isolate-community (SandboxPolicy.ISOLATED/UNTRUSTED thật) CHƯA thêm — xem javadoc
# dev.kage.engine.scripting.ScriptSandbox: đóng gói Maven lỗi thật ở 25.1.3 (thiếu
# darwin-amd64, không variant-aware theo OS/arch) — cần chốt nền tảng server mục tiêu trước.

# --- Logging ---
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# --- Observability (ADR-015) ---
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
# Tracing (ADR-015 — OpenTelemetry, KHÔNG dùng Micrometer Tracing). BOM chốt version, module con
# không ghi version riêng (theo BOM). exporter-otlp dùng OTLP/HTTP (không phải gRPC) — tránh
# transitive grpc-netty-shaded đụng version với netty-all 4.1.136.Final dự án đã dùng (Điều 23).
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# --- Test ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }              # version từ BOM
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

[bundles]
gdx-desktop = ["gdx-core", "gdx-backend-lwjgl3", "gdx-box2d", "gdx-freetype"]
test-unit = ["junit-jupiter", "assertj-core"]
test-integration = ["testcontainers-junit", "testcontainers-postgresql"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
