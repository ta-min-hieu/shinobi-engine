name: CI

# ⚠️ PHÁT HIỆN THẬT (2026-07-30): repo này CHỈ CÓ nhánh `master` (`git remote show origin` → "HEAD
# branch: master") — GIT-WORKFLOW.md §2 tả quy trình dùng `main`/`develop`, nhưng chưa từng áp dụng
# thật (dự án cá nhân, luôn push thẳng `master`). Trigger dưới đây dùng `master` để KHỚP THỰC TẾ —
# nếu sau này đổi sang quy trình main/develop thật (đổi tên nhánh mặc định trên GitHub), sửa lại đây.
on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:

# Huỷ run cũ khi push mới lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Không huỷ run trên master (dòng 63(ii), 2026-10-17): job docker-build-push chỉ chạy ở đó, huỷ giữa
  # chừng là image dở dang; các nhánh khác thì huỷ run cũ như trước.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # README bảng chờ dòng 60, phương án B (2026-10-04): checkout KHÔNG bật `lfs: true` (sẽ kéo cả
      # `.blend` nặng, ăn quota băng thông LFS) — chỉ kéo font, thứ duy nhất build/test cần
      # (`FontFactoryVietnameseGlyphTest` ở client-core đọc `assets/raw/fonts/*.ttf` thật, không phải
      # con trỏ LFS). Runner ubuntu-latest có sẵn git-lfs; `install --local` gắn filter cho repo này
      # để `git status` không thấy font là "đã sửa" sau khi pull.
      - name: Kéo font LFS (chỉ assets/raw/fonts)
        run: |
          git lfs install --local
          git lfs pull --include="assets/raw/fonts/**"

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `git ls-files -s gradlew` → mode 100644 (Windows checkout, không giữ exec bit) — actions/
      # checkout lấy đúng bit đó, ubuntu-latest chạy "./gradlew" thẳng sẽ "Permission denied" (exit
      # 126). CÙNG PHÁT HIỆN đã sửa ở server.Dockerfile (DOCKER.md/BUILD.md) nhưng ci.yml lúc đó
      # KHÔNG được sửa theo — 2 lần push thẳng vào master sau đó (`c2dd43a`, `b9a0ee3`) đều fail
      # NGAY ở bước này (31s, chưa từng chạy tới Gradle thật), phát hiện lúc kiểm tra CI thật qua
      # GitHub UI (2026-07-31, không phải suy đoán).
      - name: Fix quyền thực thi gradlew
        run: chmod +x gradlew

      # Thứ nhanh + hay fail nhất chạy trước (CI-CD §2). Error Prone chạy NGAY TRONG bước này
      # (javac plugin, không phải task riêng) — mọi lỗi ERROR-severity chặn compile ở đây.
      - name: Build (không test)
        run: ./gradlew build -x test

      # PMD 7.26.0 (2026-08-02) — bump từ 7.10.0, fix StackOverflowError type-inference thật gặp
      # trên JDK 25 (xem BUILD.md "Bước 3"). PMD chạy thật ở đây từ giờ, không còn -x pmdMain/pmdTest.
      - name: Static analysis (Checkstyle + Spotless + SpotBugs + PMD)
        run: ./gradlew checkstyleMain spotlessCheck spotbugsMain pmdMain pmdTest

      - name: Unit test + ArchUnit (ADR-011)
        run: ./gradlew test

      - name: Upload báo cáo khi fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'

  # Secret scan (OWASP.md §2) — hàng rào chặn THẬT, không phụ thuộc máy dev nào có cài gitleaks hay
  # không (local pre-commit hook .githooks/pre-commit chỉ là fast pre-check, tự bỏ qua nếu máy chưa
  # cài gitleaks). Quét TOÀN BỘ git history mỗi lần chạy (không chỉ diff) — đơn giản hơn quét
  # riêng PR diff và bắt được cả trường hợp secret lọt vào một commit cũ rồi bị "xoá" ở commit sau
  # (secret vẫn còn trong history, `git diff` của PR sẽ không thấy).
  #
  # KHÔNG dùng gitleaks/gitleaks-action: action đó license theo gitleaks.io EULA (cần license key
  # trả phí nếu repo thuộc GitHub Organization — repo này là personal account nên hiện tại không
  # cần, nhưng phụ thuộc license bên thứ 3 cho việc chỉ là tải+chạy 1 binary là không cần thiết).
  # Tải thẳng gitleaks CLI từ GitHub Releases + verify checksum — cùng version với hook local
  # (.githooks/pre-commit) dùng, 1 nguồn sự thật duy nhất cho version (env GITLEAKS_VERSION dưới).
  # Version xác nhận THẬT qua GitHub API (releases/latest) ngày 2026-08-02, không copy từ trí nhớ.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cần full history — gitleaks quét toàn bộ commit, không chỉ commit mới nhất

      - name: Cài gitleaks ${{ env.GITLEAKS_VERSION }} (tải + verify checksum từ GitHub Releases)
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          EXPECTED=$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum gitleaks.tar.gz | awk '{print $1}')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch cho gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz — dừng, không chạy binary chưa verify được." >&2
            exit 1
          fi
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: gitleaks — quét secret toàn bộ git history
        run: ./gitleaks git --redact -v

  # Integration test (Testcontainers) tách job song song — không chặn feedback nhanh (CI-CD §3).
  # Bật khi có integration test đầu tiên (Phase 3).
  # integration-test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-java@v5
  #       with: { java-version: '25', distribution: 'temurin' }
  #     - uses: gradle/actions/setup-gradle@v6
  #     - run: ./gradlew integrationTest

  # Docker build + push (CI-CD.md §7, Phase 10 2026-07-30) — CHỈ chạy sau khi build-and-verify PASS,
  # và CHỈ trên push thật vào master (nhánh production thật của repo — xem ghi chú ⚠️ ở "on:" trên
  # đầu file) hoặc tag version — KHÔNG BAO GIỜ build/push image từ PR (đúng bảng CI-CD.md §7:
  # "PR ❌ Không build image").
  docker-build-push:
    needs: build-and-verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag theo tinh thần CI-CD.md §7 ("main-<sha>" trong doc — đổi thành "master-<sha>" cho khớp
      # tên nhánh thật, xem ghi chú ⚠️ đầu file): merge master → master-<sha>; tag v1.2.3 → 1.2.3 + latest.
      - name: Tính tag image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/server-gateway
          tags: |
            type=raw,value=master-{{sha}},enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dòng 63(i), lô 18 (2026-10-23): cache layer qua GitHub Actions cache — lần build sau không kéo lại
          # base image + tầng dependency. mode=max lưu cả tầng của stage trung gian.
          cache-from: type=gha
          cache-to: type=gha,mode=max
