name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

# Huỷ run cũ khi push mới lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Thứ nhanh + hay fail nhất chạy trước (CI-CD §2)
      - name: Build (không test)
        run: ./gradlew build -x test

      - name: Static analysis (Checkstyle + PMD)
        run: ./gradlew checkstyleMain pmdMain

      - name: Unit test + ArchUnit (ADR-011)
        run: ./gradlew test

      # Bổ sung sau khi wire (xem BUILD.md):
      # - name: Spotless
      #   run: ./gradlew spotlessCheck
      # - name: SpotBugs
      #   run: ./gradlew spotbugsMain

      - name: Upload báo cáo khi fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'

  # Integration test (Testcontainers) tách job song song — không chặn feedback nhanh (CI-CD §3).
  # Bật khi có integration test đầu tiên (Phase 3).
