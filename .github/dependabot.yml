# Dependabot — tự chốt/nâng các version ⚠️ chưa verify trong libs.versions.toml (OWASP.md §1).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "gradle"
    directory: "/build-logic"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image của server.Dockerfile đã pin theo digest (README dòng 61, 2026-10-17) — Dependabot giữ
  # digest không mục. Compose (postgres/redis/prometheus...) cùng thư mục, ecosystem riêng.
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
