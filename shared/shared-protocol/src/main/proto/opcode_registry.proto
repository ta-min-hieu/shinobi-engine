syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Nguồn chân lý của bảng opcode (NETWORK.md §4). Dải số cố định theo domain — tránh đụng độ
// khi nhiều người/AI thêm packet song song. Chỉ cấp phát tuần tự TRONG dải của domain, không
// bao giờ tái sử dụng số đã cấp (kể cả khi packet đó bị xoá sau này — Điều 37 tinh thần ADR).
//
// ⚠️ PHÁT HIỆN THẬT (Phase 3): file này trước đây tên opcode.proto — NETWORK.md §4 nói nguồn
// chân lý PHẢI là opcode_registry.proto, đã đổi tên khớp lại đúng lúc thêm dải Character.
//
//   0–99      System (handshake, heartbeat, error)     ← Phase 2 dùng dải này
//   100–199   Account / Login                          ← Phase 3
//   200–299   Character                                ← Phase 3
//   300–399   Movement / World                          ← Phase 3
//   400–499   Combat / Skill                            ← Phase 4
//   500–599   Inventory / Equipment                     ← Phase 5
//   600–699   Quest / NPC / Dialogue                     ← Phase 6 (NPC/Dialogue dùng chung dải
//             Quest — cùng cách Monster spawn/despawn dùng chung dải Combat/Skill thay vì xin
//             dải riêng, xem feature-quest/CLAUDE.md khi module đó tồn tại)
//   700–799   Guild                                     ← Phase 7
//   800–899   Chat                                      ← Phase 6-7
//   900–999   Mail                                      ← Phase 6-7
//   1000–1099 Shop / Auction                            ← Phase 5, 8
//   1100–1199 Friend                                    ← Phase 6-7
//   1200–1299 Ranking                                   ← Phase 8
//   1300–1399 Party                                     ← Phase 7
//   1400–1499 Trade                                     ← Phase 7
//   1500–1599 Dungeon                                   ← Phase 8
//   1600–1699 Arena (PvP 1v1)                           ← Phase 8
//   1700–1799 Achievement / Title                       ← ADR-062 (2026-10-18)
enum Opcode {
  OPCODE_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho packet thật.

  // --- System (0-99) ---
  OPCODE_PING = 1;
  OPCODE_PONG = 2;
  OPCODE_CONNECT_REQUEST = 3;
  OPCODE_CONNECT_RESPONSE = 4;
  OPCODE_ERROR = 5;
  OPCODE_SERVER_SHUTTING_DOWN_EVENT = 6;

  // --- Character (200-299) ---
  OPCODE_LIST_CHARACTERS_REQUEST = 200;
  OPCODE_LIST_CHARACTERS_RESPONSE = 201;
  OPCODE_CREATE_CHARACTER_REQUEST = 202;
  OPCODE_CREATE_CHARACTER_RESPONSE = 203;
  OPCODE_SELECT_CHARACTER_REQUEST = 204;
  OPCODE_SELECT_CHARACTER_RESPONSE = 205;
  OPCODE_SELECT_FACTION_REQUEST = 206;
  OPCODE_SELECT_FACTION_RESPONSE = 207;
  OPCODE_EXPERIENCE_CHANGED_EVENT = 208; // vạch kinh nghiệm (chủ dự án 2026-08-09)
  OPCODE_GOLD_CHANGED_EVENT = 209; // số vàng của chính mình (ADR-035, Accepted 2026-08-27)
  // ADR-056 (Accepted 2026-10-18) — bảng nhân vật + Lực Chiến. Chỉ thêm, protocolVersion không tăng.
  OPCODE_GET_CHARACTER_STATS_REQUEST = 210;
  OPCODE_GET_CHARACTER_STATS_RESPONSE = 211;

  // --- Movement / World (300-399) ---
  OPCODE_MOVE_COMMAND = 300;
  OPCODE_MOVE_RESPONSE = 301;
  OPCODE_CHARACTER_MOVED_EVENT = 302;
  OPCODE_CHARACTER_SPAWNED_EVENT = 303;
  OPCODE_CHARACTER_DESPAWNED_EVENT = 304;
  OPCODE_CHARACTER_RESPAWNED_EVENT = 305;
  OPCODE_JUMP_COMMAND = 306; // ADR-033 — nhảy thật kiểu Ninja School Online.
  // ADR-045 — ngoại hình của MỘT nhân vật khác vừa đổi (đổi hệ phái giữa phiên). Nằm ở dải
  // Movement/World chứ không phải Character (200-299) vì nó nói về một nhân vật KHÁC trong world,
  // cùng nhóm với spawn/despawn/respawn ở trên.
  OPCODE_CHARACTER_APPEARANCE_CHANGED_EVENT = 307;
  // ADR-051 — CHÍNH mình vừa được đưa sang World khác (hầm ngục, đấu trường, về world chính).
  // Một event cho MỌI cú đổi World, luôn tới TRƯỚC spawn đầu tiên của World mới.
  OPCODE_WORLD_CHANGED_EVENT = 308;
  // ADR-067 — sự kiện nhân đôi EXP/rơi đồ đang chạy (cả server). Gửi lúc vào world nếu có và mỗi lần
  // ADMIN bật/tắt. Chỉ thêm, protocolVersion không tăng.
  OPCODE_GAME_EVENTS_CHANGED_EVENT = 309;
  // ADR-070 — tốc độ phi kiếm của CHÍNH mình (dự đoán di chuyển). Gửi lúc vào world + sau mỗi lần mặc/gỡ đồ.
  OPCODE_MOVE_SPEED_CHANGED_EVENT = 310;
  // ADR-073 — hiệu ứng tốc độ/choáng trên CHÍNH mình vừa đổi (dự đoán di chuyển). Chỉ thêm, protocolVersion không tăng.
  OPCODE_MOVEMENT_MODIFIER_CHANGED_EVENT = 311;

  // --- Combat / Skill (400-499) ---
  OPCODE_SET_TARGET_COMMAND = 400;
  OPCODE_ATTACK_RESULT_EVENT = 401;
  OPCODE_MONSTER_SPAWNED_EVENT = 402;
  OPCODE_MONSTER_DESPAWNED_EVENT = 403;
  OPCODE_MONSTER_MOVED_EVENT = 404;
  OPCODE_USE_SKILL_COMMAND = 405;
  OPCODE_SKILL_RESULT_EVENT = 406;
  OPCODE_ATTACK_COMMAND = 407; // đánh thường BẰNG TAY (chủ dự án 2026-08-09) — xem combat.proto
  // ADR-046 — HP của một entity vừa đổi mà KHÔNG do đòn đánh nào (hồi máu ngoài chiến đấu,
  // vùng an toàn, đan dược, quái về tới điểm spawn). Xem combat.proto HealthChangedEvent.
  OPCODE_HEALTH_CHANGED_EVENT = 408;
  // ADR-071 — điểm công pháp: liệt kê bậc chiêu + nâng một bậc. Chỉ thêm, protocolVersion không tăng.
  OPCODE_LIST_SKILL_RANKS_REQUEST = 409;
  OPCODE_LIST_SKILL_RANKS_RESPONSE = 410;
  OPCODE_UPGRADE_SKILL_COMMAND = 411;
  OPCODE_UPGRADE_SKILL_RESPONSE = 412;

  // --- Inventory / Equipment (500-599) ---
  OPCODE_ITEM_GRANTED_EVENT = 500;
  OPCODE_EQUIP_ITEM_COMMAND = 501;
  OPCODE_EQUIP_ITEM_RESPONSE = 502;
  OPCODE_UNEQUIP_ITEM_COMMAND = 503;
  OPCODE_UNEQUIP_ITEM_RESPONSE = 504;
  OPCODE_ENHANCE_ITEM_COMMAND = 505;
  OPCODE_ENHANCE_ITEM_RESPONSE = 506;
  // ADR-035 (Accepted 2026-08-27) — 4 số dưới đây mở khoá giao diện túi đồ/trang bị/cửa hàng.
  OPCODE_LIST_INVENTORY_REQUEST = 507;
  OPCODE_LIST_INVENTORY_RESPONSE = 508;
  OPCODE_GET_ITEM_CATALOG_REQUEST = 509;
  OPCODE_ITEM_CATALOG_RESPONSE = 510;

  // ADR-046 D5 — dùng vật phẩm (đan dược hồi máu). Máu mới KHÔNG về trong response mà qua
  // OPCODE_HEALTH_CHANGED_EVENT (408): world là bất đồng bộ, xem ADR-046 D5.
  // ⚠️ 512/513 chứ không phải 511/512: ADR-046 D5 lấy 511 trước rồi mới thấy dòng giữ chỗ ngay
  // dưới đây. Số 511 GIỮ NGUYÊN chỗ trống của nó.
  OPCODE_USE_ITEM_COMMAND = 512;
  OPCODE_USE_ITEM_RESPONSE = 513;
  // ADR-061 (Accepted 2026-10-18) — kho đồ tông môn. Chỉ thêm, protocolVersion không tăng.
  OPCODE_LIST_STORAGE_REQUEST = 514;
  OPCODE_LIST_STORAGE_RESPONSE = 515;
  OPCODE_DEPOSIT_ITEM_COMMAND = 516;
  OPCODE_DEPOSIT_ITEM_RESPONSE = 517;
  OPCODE_WITHDRAW_ITEM_COMMAND = 518;
  OPCODE_WITHDRAW_ITEM_RESPONSE = 519;
  // ADR-064 (Accepted 2026-10-18) — khảm Linh Ngọc.
  OPCODE_SOCKET_GEM_COMMAND = 520;
  OPCODE_SOCKET_GEM_RESPONSE = 521;
  // 511 để TRỐNG CÓ CHỦ Ý — dành sẵn cho ITEM_REMOVED_EVENT (ADR-035 Revisit Trigger #3, chỉ
  // thêm khi ĐO thấy việc hỏi lại toàn bộ túi sau mỗi hành động tốn thật). ĐỪNG cấp cho packet khác.

  // --- Quest / NPC / Dialogue (600-699) ---
  OPCODE_NPC_SPAWNED_EVENT = 600;
  OPCODE_NPC_DESPAWNED_EVENT = 601;
  OPCODE_TALK_TO_NPC_COMMAND = 602;
  OPCODE_DIALOGUE_NODE_RESPONSE = 603;
  OPCODE_SELECT_DIALOGUE_OPTION_COMMAND = 604;
  OPCODE_DIALOGUE_ENDED_RESPONSE = 605;
  OPCODE_ACCEPT_QUEST_RESPONSE = 606;
  OPCODE_QUEST_STATUS_CHANGED_EVENT = 607;
  OPCODE_CLAIM_QUEST_REWARD_COMMAND = 608;
  OPCODE_CLAIM_QUEST_REWARD_RESPONSE = 609;
  // ADR-035 — nhật ký nhiệm vụ; gỡ bế tắc "nhận quest rồi relog là mất thưởng vĩnh viễn".
  OPCODE_LIST_QUESTS_REQUEST = 610;
  OPCODE_LIST_QUESTS_RESPONSE = 611;
  // ADR-054 (Accepted 2026-10-18) — bỏ nhiệm vụ đang làm. Chỉ thêm, protocolVersion không tăng.
  OPCODE_ABANDON_QUEST_COMMAND = 612;
  OPCODE_ABANDON_QUEST_RESPONSE = 613;

  // --- Guild (700-799) ---
  OPCODE_CREATE_GUILD_COMMAND = 700;
  OPCODE_CREATE_GUILD_RESPONSE = 701;
  OPCODE_SEND_GUILD_JOIN_REQUEST_COMMAND = 702;
  OPCODE_SEND_GUILD_JOIN_REQUEST_RESPONSE = 703;
  OPCODE_APPROVE_GUILD_JOIN_REQUEST_COMMAND = 704;
  OPCODE_APPROVE_GUILD_JOIN_REQUEST_RESPONSE = 705;
  OPCODE_REJECT_GUILD_JOIN_REQUEST_COMMAND = 706;
  OPCODE_REJECT_GUILD_JOIN_REQUEST_RESPONSE = 707;
  OPCODE_LEAVE_GUILD_COMMAND = 708;
  OPCODE_LEAVE_GUILD_RESPONSE = 709;
  OPCODE_DISBAND_GUILD_COMMAND = 710;
  OPCODE_DISBAND_GUILD_RESPONSE = 711;
  OPCODE_KICK_GUILD_MEMBER_COMMAND = 712;
  OPCODE_KICK_GUILD_MEMBER_RESPONSE = 713;
  OPCODE_LIST_GUILD_MEMBERS_REQUEST = 714;
  OPCODE_LIST_GUILD_MEMBERS_RESPONSE = 715;
  OPCODE_LIST_PENDING_GUILD_JOIN_REQUESTS_REQUEST = 716;
  OPCODE_LIST_PENDING_GUILD_JOIN_REQUESTS_RESPONSE = 717;
  OPCODE_GET_MY_GUILD_REQUEST = 718;
  OPCODE_GET_MY_GUILD_RESPONSE = 719;
  OPCODE_GUILD_CHANGED_EVENT = 720; // ADR-059 (2026-10-18) — bang vừa đổi thành viên
  // ADR-068 — góp linh thạch cho bang. Chỉ thêm, protocolVersion không tăng.
  OPCODE_DONATE_TO_GUILD_COMMAND = 721;
  OPCODE_DONATE_TO_GUILD_RESPONSE = 722;

  // --- Chat (800-899) ---
  OPCODE_SEND_CHAT_MESSAGE_COMMAND = 800;
  OPCODE_SEND_CHAT_MESSAGE_RESPONSE = 801;
  OPCODE_CHAT_MESSAGE_EVENT = 802;

  // --- Mail (900-999) ---
  OPCODE_SEND_MAIL_COMMAND = 900;
  OPCODE_SEND_MAIL_RESPONSE = 901;
  OPCODE_LIST_MAIL_REQUEST = 902;
  OPCODE_LIST_MAIL_RESPONSE = 903;
  OPCODE_CLAIM_MAIL_COMMAND = 904;
  OPCODE_CLAIM_MAIL_RESPONSE = 905;
  OPCODE_DELETE_MAIL_COMMAND = 906;
  OPCODE_DELETE_MAIL_RESPONSE = 907;
  OPCODE_NEW_MAIL_EVENT = 908;

  // --- Shop (1000-1099) ---
  OPCODE_LIST_SHOP_ITEMS_REQUEST = 1000;
  OPCODE_LIST_SHOP_ITEMS_RESPONSE = 1001;
  OPCODE_BUY_ITEM_COMMAND = 1002;
  OPCODE_BUY_ITEM_RESPONSE = 1003;
  OPCODE_SELL_ITEM_COMMAND = 1004;
  OPCODE_SELL_ITEM_RESPONSE = 1005;
  // ADR-063 (Accepted 2026-10-18) — phường thị. Chỉ thêm, protocolVersion không tăng.
  OPCODE_LIST_MARKET_REQUEST = 1006;
  OPCODE_LIST_MARKET_RESPONSE = 1007;
  OPCODE_CREATE_LISTING_COMMAND = 1008;
  OPCODE_CREATE_LISTING_RESPONSE = 1009;
  OPCODE_BUY_LISTING_COMMAND = 1010;
  OPCODE_BUY_LISTING_RESPONSE = 1011;
  OPCODE_CANCEL_LISTING_COMMAND = 1012;
  OPCODE_CANCEL_LISTING_RESPONSE = 1013;
  OPCODE_LISTING_SOLD_EVENT = 1014;

  // --- Friend (1100-1199) ---
  OPCODE_SEND_FRIEND_REQUEST_COMMAND = 1100;
  OPCODE_SEND_FRIEND_REQUEST_RESPONSE = 1101;
  OPCODE_ACCEPT_FRIEND_REQUEST_COMMAND = 1102;
  OPCODE_ACCEPT_FRIEND_REQUEST_RESPONSE = 1103;
  OPCODE_REJECT_FRIEND_REQUEST_COMMAND = 1104;
  OPCODE_REJECT_FRIEND_REQUEST_RESPONSE = 1105;
  OPCODE_REMOVE_FRIEND_COMMAND = 1106;
  OPCODE_REMOVE_FRIEND_RESPONSE = 1107;
  OPCODE_LIST_FRIENDS_REQUEST = 1108;
  OPCODE_LIST_FRIENDS_RESPONSE = 1109;
  OPCODE_LIST_PENDING_FRIEND_REQUESTS_REQUEST = 1110;
  OPCODE_LIST_PENDING_FRIEND_REQUESTS_RESPONSE = 1111;
  OPCODE_FRIEND_ONLINE_EVENT = 1112;
  OPCODE_FRIEND_OFFLINE_EVENT = 1113;
  // ADR-074 — rút lời mời kết bạn đã gửi. Chỉ thêm, protocolVersion không tăng.
  OPCODE_CANCEL_FRIEND_REQUEST_COMMAND = 1114;
  OPCODE_CANCEL_FRIEND_REQUEST_RESPONSE = 1115;

  // --- Party (1300-1399) ---
  OPCODE_CREATE_PARTY_COMMAND = 1300;
  OPCODE_CREATE_PARTY_RESPONSE = 1301;
  OPCODE_INVITE_PARTY_MEMBER_COMMAND = 1302;
  OPCODE_INVITE_PARTY_MEMBER_RESPONSE = 1303;
  OPCODE_ACCEPT_PARTY_INVITE_COMMAND = 1304;
  OPCODE_ACCEPT_PARTY_INVITE_RESPONSE = 1305;
  OPCODE_REJECT_PARTY_INVITE_COMMAND = 1306;
  OPCODE_REJECT_PARTY_INVITE_RESPONSE = 1307;
  OPCODE_LEAVE_PARTY_COMMAND = 1308;
  OPCODE_LEAVE_PARTY_RESPONSE = 1309;
  OPCODE_KICK_PARTY_MEMBER_COMMAND = 1310;
  OPCODE_KICK_PARTY_MEMBER_RESPONSE = 1311;
  OPCODE_LIST_PARTY_MEMBERS_REQUEST = 1312;
  OPCODE_LIST_PARTY_MEMBERS_RESPONSE = 1313;
  OPCODE_LIST_PENDING_PARTY_INVITES_REQUEST = 1314;
  OPCODE_LIST_PENDING_PARTY_INVITES_RESPONSE = 1315;
  OPCODE_GET_MY_PARTY_REQUEST = 1316;
  OPCODE_GET_MY_PARTY_RESPONSE = 1317;
  OPCODE_PARTY_CHANGED_EVENT = 1318; // ADR-059 (2026-10-18) — nhóm vừa đổi thành viên/trưởng nhóm

  // --- Trade (1400-1499) ---
  OPCODE_REQUEST_TRADE_COMMAND = 1400;
  OPCODE_REQUEST_TRADE_RESPONSE = 1401;
  OPCODE_ACCEPT_TRADE_REQUEST_COMMAND = 1402;
  OPCODE_ACCEPT_TRADE_REQUEST_RESPONSE = 1403;
  OPCODE_CANCEL_TRADE_COMMAND = 1404;
  OPCODE_CANCEL_TRADE_RESPONSE = 1405;
  OPCODE_SET_TRADE_OFFER_COMMAND = 1406;
  OPCODE_SET_TRADE_OFFER_RESPONSE = 1407;
  OPCODE_CONFIRM_TRADE_COMMAND = 1408;
  OPCODE_CONFIRM_TRADE_RESPONSE = 1409;
  OPCODE_GET_TRADE_STATUS_REQUEST = 1410;
  OPCODE_GET_TRADE_STATUS_RESPONSE = 1411;
  OPCODE_TRADE_REQUESTED_EVENT = 1412;
  OPCODE_TRADE_UPDATED_EVENT = 1413;
  OPCODE_TRADE_CLOSED_EVENT = 1414;

  // --- Ranking (1200-1299) ---
  OPCODE_GET_PVP_RATING_REQUEST = 1200;
  OPCODE_GET_PVP_RATING_RESPONSE = 1201;
  // ADR-057 (Accepted 2026-10-18) — Bia Anh Danh. 1200/1201 đã thuộc GetPvpRating nên lấy số kế tiếp.
  OPCODE_GET_LEADERBOARD_REQUEST = 1202;
  OPCODE_GET_LEADERBOARD_RESPONSE = 1203;

  // --- Dungeon (1500-1599) ---
  OPCODE_ENTER_DUNGEON_COMMAND = 1500;
  OPCODE_ENTER_DUNGEON_RESPONSE = 1501;
  OPCODE_EXIT_DUNGEON_COMMAND = 1502;
  OPCODE_EXIT_DUNGEON_RESPONSE = 1503;
  // ADR-047 (Accepted 2026-09-13, phương án B) — EVENT ĐẦU TIÊN của dải Dungeon.
  OPCODE_DUNGEON_ENTERED_EVENT = 1504;

  // --- Arena / PvP 1v1 (1600-1699) ---
  OPCODE_CHALLENGE_DUEL_COMMAND = 1600;
  OPCODE_CHALLENGE_DUEL_RESPONSE = 1601;
  OPCODE_ACCEPT_DUEL_COMMAND = 1602;
  OPCODE_ACCEPT_DUEL_RESPONSE = 1603;
  OPCODE_DECLINE_DUEL_COMMAND = 1604;
  OPCODE_DECLINE_DUEL_RESPONSE = 1605;
  OPCODE_EXIT_DUEL_COMMAND = 1606;
  OPCODE_EXIT_DUEL_RESPONSE = 1607;
  OPCODE_DUEL_CHALLENGE_RECEIVED_EVENT = 1608;
  OPCODE_DUEL_CHALLENGE_DECLINED_EVENT = 1609;
  OPCODE_DUEL_STARTED_EVENT = 1610;
  OPCODE_DUEL_RESULT_EVENT = 1611;

  // --- Achievement / Title (1700-1799) — ADR-062 (Accepted 2026-10-18) ---
  OPCODE_LIST_ACHIEVEMENTS_REQUEST = 1700;
  OPCODE_LIST_ACHIEVEMENTS_RESPONSE = 1701;
  OPCODE_SET_ACTIVE_TITLE_COMMAND = 1702;
  OPCODE_SET_ACTIVE_TITLE_RESPONSE = 1703;
  OPCODE_ACHIEVEMENT_UNLOCKED_EVENT = 1704;
}
