syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Nguồn chân lý của bảng opcode (NETWORK.md §4). Dải số cố định theo domain — tránh đụng độ
// khi nhiều người/AI thêm packet song song. Chỉ cấp phát tuần tự TRONG dải của domain, không
// bao giờ tái sử dụng số đã cấp (kể cả khi packet đó bị xoá sau này — Điều 37 tinh thần ADR).
//
// ⚠️ PHÁT HIỆN THẬT (Phase 3): file này trước đây tên opcode.proto — NETWORK.md §4 nói nguồn
// chân lý PHẢI là opcode_registry.proto, đã đổi tên khớp lại đúng lúc thêm dải Character.
//
//   0–99      System (handshake, heartbeat, error)     ← Phase 2 dùng dải này
//   100–199   Account / Login                          ← Phase 3
//   200–299   Character                                ← Phase 3
//   300–399   Movement / World                          ← Phase 3
//   400–499   Combat / Skill                            ← Phase 4
//   500–599   Inventory / Equipment                     ← Phase 5
//   600–699   Quest / NPC / Dialogue                     ← Phase 6 (NPC/Dialogue dùng chung dải
//             Quest — cùng cách Monster spawn/despawn dùng chung dải Combat/Skill thay vì xin
//             dải riêng, xem feature-quest/CLAUDE.md khi module đó tồn tại)
//   700–799   Guild                                     ← Phase 7
//   800–899   Chat                                      ← Phase 6-7
//   900–999   Mail                                      ← Phase 6-7
//   1000–1099 Shop / Auction                            ← Phase 5, 8
//   1100–1199 Friend                                    ← Phase 6-7
//   1200–1299 Ranking                                   ← Phase 8
//   1300–1399 Party                                     ← Phase 7
//   1400–1499 Trade                                     ← Phase 7
//   1500–1599 Dungeon                                   ← Phase 8
//   1600–1699 Arena (PvP 1v1)                           ← Phase 8
//   1700–1799 Achievement / Title                       ← ADR-062 (2026-10-18)
enum Opcode {
  OPCODE_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho packet thật.

