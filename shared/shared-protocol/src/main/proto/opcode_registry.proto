  OPCODE_SPIN_LUCKY_WHEEL_RESPONSE = 235;
  OPCODE_GET_REALM_MILESTONES_REQUEST = 236;  // ADR-153 (2026-11-02) — quà mốc cảnh giới
  OPCODE_GET_REALM_MILESTONES_RESPONSE = 237;
  OPCODE_CLAIM_REALM_MILESTONE_COMMAND = 238;
  OPCODE_CLAIM_REALM_MILESTONE_RESPONSE = 239;
