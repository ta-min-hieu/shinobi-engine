  OPCODE_PING = 1;
  OPCODE_PONG = 2;
  OPCODE_CONNECT_REQUEST = 3;
  OPCODE_CONNECT_RESPONSE = 4;
  OPCODE_ERROR = 5;
  OPCODE_SERVER_SHUTTING_DOWN_EVENT = 6;
  OPCODE_SERVER_NOTICE_EVENT = 7;  // ADR-103 (2026-10-25) — thông báo server lúc vào world
  OPCODE_GET_SECURITY_PIN_STATUS_REQUEST = 8;  // ADR-115 (2026-10-30) — khoá an toàn (PIN cấp 2)
  OPCODE_GET_SECURITY_PIN_STATUS_RESPONSE = 9;
  OPCODE_SET_SECURITY_PIN_COMMAND = 10;
  OPCODE_SET_SECURITY_PIN_RESPONSE = 11;
  OPCODE_VERIFY_SECURITY_PIN_COMMAND = 12;
  OPCODE_VERIFY_SECURITY_PIN_RESPONSE = 13;

