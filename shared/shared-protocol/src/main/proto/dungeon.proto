syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Dungeon (NETWORK.md §4, dải 1500-1599). Phase 8 lát cắt 1 — hạ tầng instance (ADR-026):
// cả party cùng vào 1 World riêng, tick độc lập world chính. CHƯA có Boss AI/loot đặc biệt — dungeon
// lát cắt này là map trống, chỉ chứng minh cơ chế tách world hoạt động thật. KHÔNG có
// idempotencyKey — vào/ra dungeon không sinh hiệu ứng kinh tế trùng lặp được (ADR-025 chỉ áp dụng
// Command có side-effect tài chính/vật phẩm).

// dungeon_code cho phép nhiều dungeon về sau — lát cắt này chỉ có 1 giá trị hợp lệ (server hardcode).
message EnterDungeonCommand {
  string dungeon_code = 1;
}

enum EnterDungeonOutcome {
  ENTER_DUNGEON_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  ENTER_DUNGEON_OUTCOME_OK = 1;
  ENTER_DUNGEON_OUTCOME_NOT_IN_PARTY = 2;
  ENTER_DUNGEON_OUTCOME_PARTY_MEMBER_OFFLINE = 3;
  ENTER_DUNGEON_OUTCOME_ALREADY_IN_DUNGEON = 4;
  ENTER_DUNGEON_OUTCOME_UNKNOWN_DUNGEON = 5;
  // Chỉ THÊM (2026-10-14, README dòng 36(iii)): người bấm đang đấu Arena. Trước đó nhận
  // ALREADY_IN_DUNGEON — đọc sai lý do, và client coi đó là "đã ở trong bí cảnh". protocolVersion
  // KHÔNG tăng; chiều ngược là CHALLENGE_DUEL_OUTCOME_IN_DUNGEON (arena.proto).
  ENTER_DUNGEON_OUTCOME_IN_DUEL = 6;
}

message EnterDungeonResponse {
  EnterDungeonOutcome outcome = 1;
}

// Rời dungeon hiện tại — không cần tham số, server tự tra nhân vật đang ở instance nào.
message ExitDungeonCommand {
}

enum ExitDungeonOutcome {
  EXIT_DUNGEON_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  EXIT_DUNGEON_OUTCOME_OK = 1;
  EXIT_DUNGEON_OUTCOME_NOT_IN_DUNGEON = 2;
}

message ExitDungeonResponse {
  ExitDungeonOutcome outcome = 1;
}

// -----------------------------------------------------------------------------------------------
// ADR-047 (Accepted 2026-09-13) — phương án B. Event ĐẦU TIÊN của dải Dungeon; trước nó dải này chỉ
// có hai cặp Command/Response, nên người bị KÉO vào hầm ngục theo nhóm không nhận một gói nào nói
// ra chuyện đó (đã tái hiện qua socket thật). CHỈ THÊM ⇒ `protocolVersion` KHÔNG tăng (NETWORK.md
// §6), cùng khuôn `DuelStartedEvent` của Arena — nơi đã gặp đúng bài toán "người kia không gửi lệnh
// gì mà vẫn phải được báo".
//
// ⚠️ Người GỬI `EnterDungeonCommand` KHÔNG nhận event này: họ đã có `EnterDungeonResponse` (D1).
// Hai đường quyền lực cho cùng một sự kiện là thứ ADR-045 đã cố ý tránh.
//
// ⚠️ THỨ TỰ là một phần của quyết định (D3): server ghi gói này vào kênh của người bị kéo TRƯỚC khi
// `attachCharacter` của họ được xếp vào hộp thư World hầm ngục. Client dọn sạch thực thể khi nhận
// gói này, nên nếu nó tới SAU spawn thì cú dọn xoá mất boss và đồng đội — và server KHÔNG phát lại.
// -----------------------------------------------------------------------------------------------
message DungeonEnteredEvent {
  string dungeon_code = 1;
  // Ai bấm. Client hiện CHƯA hiện tên ra chữ (chưa có đường tra tên từ id cho người ngoài tầm
  // nhìn); field nằm sẵn ở đây để lúc có đường đó thì không phải đổi protocol lần nữa.
  int64 initiator_character_id = 2;
}
