syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Bạn bè (NETWORK.md §4, dải 1100-1199). Phase 6 lát cắt 4. Trạng thái online KHÔNG lưu DB
// (feature-friend/CLAUDE.md) — server-gateway tự ghép `online` khi build FriendView từ
// ConnectedCharacterRegistry, KHÔNG phải field do feature-friend trả về.

// Client gửi TÊN nhân vật (không phải ID) — server-gateway tự tra CharacterFacade.findByName
// TRƯỚC khi gọi FriendFacade (Điều 24, feature-friend không biết tên, chỉ biết characterId).
message SendFriendRequestCommand {
  string target_name = 1;
}

enum SendFriendRequestOutcome {
  SEND_FRIEND_REQUEST_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  SEND_FRIEND_REQUEST_OUTCOME_OK = 1;
  SEND_FRIEND_REQUEST_OUTCOME_TARGET_NOT_FOUND = 2;
  SEND_FRIEND_REQUEST_OUTCOME_CANNOT_FRIEND_SELF = 3;
  SEND_FRIEND_REQUEST_OUTCOME_ALREADY_FRIENDS = 4;
  SEND_FRIEND_REQUEST_OUTCOME_REQUEST_ALREADY_PENDING = 5;
}

message SendFriendRequestResponse {
  SendFriendRequestOutcome outcome = 1;
}

message AcceptFriendRequestCommand {
  int64 friendship_id = 1;
}

enum AcceptFriendRequestOutcome {
  ACCEPT_FRIEND_REQUEST_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  ACCEPT_FRIEND_REQUEST_OUTCOME_OK = 1;
  ACCEPT_FRIEND_REQUEST_OUTCOME_NOT_FOUND = 2;
}

message AcceptFriendRequestResponse {
  AcceptFriendRequestOutcome outcome = 1;
}

message RejectFriendRequestCommand {
  int64 friendship_id = 1;
}

enum RejectFriendRequestOutcome {
  REJECT_FRIEND_REQUEST_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  REJECT_FRIEND_REQUEST_OUTCOME_OK = 1;
  REJECT_FRIEND_REQUEST_OUTCOME_NOT_FOUND = 2;
}

message RejectFriendRequestResponse {
  RejectFriendRequestOutcome outcome = 1;
}

// target_name (không phải ID) — cùng lý do SendFriendRequestCommand ở trên.
message RemoveFriendCommand {
  string target_name = 1;
}

enum RemoveFriendOutcome {
  REMOVE_FRIEND_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  REMOVE_FRIEND_OUTCOME_OK = 1;
  REMOVE_FRIEND_OUTCOME_TARGET_NOT_FOUND = 2;
  REMOVE_FRIEND_OUTCOME_NOT_FRIENDS = 3;
}

message RemoveFriendResponse {
  RemoveFriendOutcome outcome = 1;
}

// ADR-074 (2026-10-23) — người gửi rút lời mời kết bạn còn chờ, theo TÊN người nhận (client không có danh sách
// lời mời đã gửi). Chỉ thêm, protocolVersion không tăng.
message CancelFriendRequestCommand {
  string target_name = 1;
}

enum CancelFriendRequestOutcome {
  CANCEL_FRIEND_REQUEST_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  CANCEL_FRIEND_REQUEST_OUTCOME_OK = 1;
  CANCEL_FRIEND_REQUEST_OUTCOME_TARGET_NOT_FOUND = 2;
  CANCEL_FRIEND_REQUEST_OUTCOME_NOT_PENDING = 3; // không có lời mời MÌNH gửi người đó còn chờ
}

message CancelFriendRequestResponse {
  CancelFriendRequestOutcome outcome = 1;
}

message ListFriendsRequest {
}

// online do gateway tự ghép (ConnectedCharacterRegistry), KHÔNG phải dữ liệu từ feature-friend.
message FriendView {
  int64 character_id = 1;
  string name = 2;
  bool online = 3;
  int32 intimacy = 4; // ADR-084 — thân mật của cặp bạn (tăng khi tặng quà)
  bool dao_lu = 5;     // ADR-094 — người này là đạo lữ của mình
  string note = 6;     // ADR-173 — ghi chú RIÊNG của mình về người bạn này ("" = không có)
  int64 last_online_epoch_seconds = 7; // ADR-192 — lần cuối rời world; 0 = đang online hoặc chưa từng có mốc
}

message ListFriendsResponse {
  repeated FriendView friends = 1;
}

message ListPendingFriendRequestsRequest {
}

message PendingFriendRequestView {
  int64 friendship_id = 1;
  int64 requester_id = 2;
  string requester_name = 3;
}

message ListPendingFriendRequestsResponse {
  repeated PendingFriendRequestView requests = 1;
}

// Đẩy cho bạn bè ĐANG online khi characterId (người vừa login/logout) đổi trạng thái — server tự
// tra danh sách bạn bè của characterId rồi lọc người đang online, không phải nhân vật tự gửi.
message FriendOnlineEvent {
  int64 character_id = 1;
}

message FriendOfflineEvent {
  int64 character_id = 1;
}

// ===== ADR-084 — tặng quà bạn bè: mỗi ngày một món mỗi bạn, tốn linh thạch, cộng thân mật. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_SEND_FRIEND_GIFT_COMMAND = 1116). Theo TÊN, như RemoveFriendCommand.
message SendFriendGiftCommand {
  string target_name = 1;
}

enum SendFriendGiftOutcome {
  SEND_FRIEND_GIFT_OUTCOME_UNSPECIFIED = 0;
  SEND_FRIEND_GIFT_OUTCOME_OK = 1;
  SEND_FRIEND_GIFT_OUTCOME_TARGET_NOT_FOUND = 2;
  SEND_FRIEND_GIFT_OUTCOME_NOT_FRIENDS = 3;
  SEND_FRIEND_GIFT_OUTCOME_ALREADY_GIFTED_TODAY = 4;
  SEND_FRIEND_GIFT_OUTCOME_INSUFFICIENT_GOLD = 5;
  SEND_FRIEND_GIFT_OUTCOME_CANNOT_GIFT_SELF = 6;
}

// Response: Server -> Client (OPCODE_SEND_FRIEND_GIFT_RESPONSE = 1117).
message SendFriendGiftResponse {
  SendFriendGiftOutcome outcome = 1;
  int32 intimacy = 2;   // thân mật SAU lần tặng (0 nếu từ chối)
  int32 milestone = 3;  // mốc thân mật vừa chạm (thư thưởng đã gửi cho cả hai); 0 = không
}

// ===== ADR-091 — chặn người chơi. CHỈ THÊM. Người bị chặn (theo CẢ HAI chiều) không chat riêng, mời kết bạn, mời
// nhóm, mời giao dịch, thách đấu, tặng quà, bái sư hay cầu đạo lữ được — gateway trả ErrorResponse error.blocked. =====

// Command: Client -> Server (OPCODE_BLOCK_CHARACTER_COMMAND = 1118). Chặn xong thì tình bạn (và lời mời) giữa hai
// người bị xoá.
message BlockCharacterCommand {
  string target_name = 1;
}

enum BlockCharacterOutcome {
  BLOCK_CHARACTER_OUTCOME_UNSPECIFIED = 0;
  BLOCK_CHARACTER_OUTCOME_OK = 1;
  BLOCK_CHARACTER_OUTCOME_TARGET_NOT_FOUND = 2;
  BLOCK_CHARACTER_OUTCOME_CANNOT_BLOCK_SELF = 3;
  BLOCK_CHARACTER_OUTCOME_ALREADY_BLOCKED = 4;
  BLOCK_CHARACTER_OUTCOME_LIST_FULL = 5;
}

// Response: Server -> Client (OPCODE_BLOCK_CHARACTER_RESPONSE = 1119).
message BlockCharacterResponse {
  BlockCharacterOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_UNBLOCK_CHARACTER_COMMAND = 1120).
message UnblockCharacterCommand {
  string target_name = 1;
}

enum UnblockCharacterOutcome {
  UNBLOCK_CHARACTER_OUTCOME_UNSPECIFIED = 0;
  UNBLOCK_CHARACTER_OUTCOME_OK = 1;
  UNBLOCK_CHARACTER_OUTCOME_NOT_BLOCKED = 2;
}

// Response: Server -> Client (OPCODE_UNBLOCK_CHARACTER_RESPONSE = 1121).
message UnblockCharacterResponse {
  UnblockCharacterOutcome outcome = 1;
}

// Request: Client -> Server (OPCODE_GET_RELATIONSHIPS_REQUEST = 1122) — mọi quan hệ lô 21 của chính mình trong MỘT
// gói: sư phụ, đồ đệ (ADR-093), đạo lữ (ADR-094), danh sách chặn (ADR-091).
message GetRelationshipsRequest {
}

message RelationMemberView {
  int64 character_id = 1;
  string name = 2;
  int32 level = 3;
  bool online = 4;
}

// Response: Server -> Client (OPCODE_GET_RELATIONSHIPS_RESPONSE = 1123). Client dùng danh sách chặn để ẩn tin chat
// kênh chung (thế giới/khu vực/bang) của người bị chặn — việc hiển thị, không phải luật server.
message GetRelationshipsResponse {
  RelationMemberView mentor = 1;               // không set = chưa có sư phụ
  repeated RelationMemberView disciples = 2;
  RelationMemberView dao_lu = 3;               // không set = chưa có đạo lữ
  repeated RelationMemberView blocked = 4;
  repeated RelationMemberView sworn = 5;      // ADR-110 — huynh đệ kết nghĩa (không gồm chính mình)
}

// ===== ADR-093 — sư đồ. CHỈ THÊM. Đồ đệ (< Lv30) bái sư người Lv>=40; sư phụ nhận tối đa 3 đồ đệ. Đồ đệ chạm
// Lv10/20/30 ⇒ thư thưởng cho CẢ HAI; Lv30 là xuất sư (quan hệ khép lại). =====

// Command: Client -> Server (OPCODE_REQUEST_MENTOR_COMMAND = 1124) — đồ đệ xin bái sư. Xem quan hệ hiện có qua
// GetRelationshipsRequest (1122).
message RequestMentorCommand {
  string mentor_name = 1;
}

enum MentorshipOutcome {
  MENTORSHIP_OUTCOME_UNSPECIFIED = 0;
  MENTORSHIP_OUTCOME_OK = 1;
  MENTORSHIP_OUTCOME_TARGET_NOT_FOUND = 2;
  MENTORSHIP_OUTCOME_TARGET_OFFLINE = 3;
  MENTORSHIP_OUTCOME_DISCIPLE_LEVEL_TOO_HIGH = 4;  // đồ đệ đã Lv30 trở lên
  MENTORSHIP_OUTCOME_MENTOR_LEVEL_TOO_LOW = 5;     // sư phụ chưa Lv40
  MENTORSHIP_OUTCOME_ALREADY_HAS_MENTOR = 6;
  MENTORSHIP_OUTCOME_MENTOR_FULL = 7;              // sư phụ đã đủ 3 đồ đệ
  MENTORSHIP_OUTCOME_NO_PENDING_REQUEST = 8;       // không có lời bái sư (hoặc đã hết hạn 5 phút)
  MENTORSHIP_OUTCOME_NOT_RELATED = 9;              // hai người không phải sư đồ
  MENTORSHIP_OUTCOME_CANNOT_TARGET_SELF = 10;
}

// Response: Server -> Client (OPCODE_REQUEST_MENTOR_RESPONSE = 1125).
message RequestMentorResponse {
  MentorshipOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_MENTOR_REQUEST_RECEIVED_EVENT = 1126) — báo sư phụ tương lai có người xin bái sư.
message MentorRequestReceivedEvent {
  int64 disciple_id = 1;
  string disciple_name = 2;
  int32 disciple_level = 3;
}

// Command: Client -> Server (OPCODE_ACCEPT_DISCIPLE_COMMAND = 1127) — sư phụ nhận lời bái sư.
message AcceptDiscipleCommand {
  string disciple_name = 1;
}

// Response: Server -> Client (OPCODE_ACCEPT_DISCIPLE_RESPONSE = 1128).
message AcceptDiscipleResponse {
  MentorshipOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_LEAVE_MENTORSHIP_COMMAND = 1129) — một trong hai bên cắt quan hệ (không mất gì).
message LeaveMentorshipCommand {
  string other_name = 1;
}

// Response: Server -> Client (OPCODE_LEAVE_MENTORSHIP_RESPONSE = 1130).
message LeaveMentorshipResponse {
  MentorshipOutcome outcome = 1;
}

// ===== ADR-094 — đạo lữ. CHỈ THÊM. Hai người bạn thân mật >= 600 kết đạo lữ (người cầu tốn 5.000 linh thạch lúc
// được nhận lời); cùng nhóm thì EXP đánh quái +10%; một trong hai giải được bất cứ lúc nào. =====

// Command: Client -> Server (OPCODE_PROPOSE_DAO_LU_COMMAND = 1131).
message ProposeDaoLuCommand {
  string target_name = 1;
}

enum DaoLuOutcome {
  DAO_LU_OUTCOME_UNSPECIFIED = 0;
  DAO_LU_OUTCOME_OK = 1;
  DAO_LU_OUTCOME_TARGET_NOT_FOUND = 2;
  DAO_LU_OUTCOME_TARGET_OFFLINE = 3;
  DAO_LU_OUTCOME_INTIMACY_TOO_LOW = 4;       // chưa là bạn, hoặc thân mật < 600
  DAO_LU_OUTCOME_ALREADY_BOUND = 5;          // một trong hai đã có đạo lữ
  DAO_LU_OUTCOME_INSUFFICIENT_GOLD = 6;      // người cầu không đủ linh thạch
  DAO_LU_OUTCOME_NO_PENDING_PROPOSAL = 7;
  DAO_LU_OUTCOME_NOT_BOUND = 8;
  DAO_LU_OUTCOME_CANNOT_TARGET_SELF = 9;
}

// Response: Server -> Client (OPCODE_PROPOSE_DAO_LU_RESPONSE = 1132).
message ProposeDaoLuResponse {
  DaoLuOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_DAO_LU_PROPOSAL_EVENT = 1133).
message DaoLuProposalEvent {
  int64 proposer_id = 1;
  string proposer_name = 2;
}

// Command: Client -> Server (OPCODE_ACCEPT_DAO_LU_COMMAND = 1134).
message AcceptDaoLuCommand {
  string proposer_name = 1;
}

// Response: Server -> Client (OPCODE_ACCEPT_DAO_LU_RESPONSE = 1135).
message AcceptDaoLuResponse {
  DaoLuOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_DISSOLVE_DAO_LU_COMMAND = 1136).
message DissolveDaoLuCommand {
}

// Response: Server -> Client (OPCODE_DISSOLVE_DAO_LU_RESPONSE = 1137).
message DissolveDaoLuResponse {
  DaoLuOutcome outcome = 1;
}

// ===== ADR-110 (2026-10-25) — kết nghĩa huynh đệ. CHỈ THÊM. =====

enum SwornOutcome {
  SWORN_OUTCOME_UNSPECIFIED = 0;
  SWORN_OUTCOME_OK = 1;
  SWORN_OUTCOME_TARGET_NOT_FOUND = 2;
  SWORN_OUTCOME_CANNOT_TARGET_SELF = 3;
  SWORN_OUTCOME_INTIMACY_TOO_LOW = 4;       // cần thân mật >= 300
  SWORN_OUTCOME_ALREADY_SWORN = 5;          // người được mời đã ở nhóm khác
  SWORN_OUTCOME_GROUP_FULL = 6;             // nhóm đã đủ 5 người
  SWORN_OUTCOME_NO_PENDING_INVITE = 7;
  SWORN_OUTCOME_INSUFFICIENT_GOLD = 8;      // người mời thiếu vàng (3.000 lập nhóm / 1.000 thêm người)
  SWORN_OUTCOME_NOT_SWORN = 9;
}

// Command: Client -> Server (OPCODE_INVITE_SWORN_COMMAND = 1138).
message InviteSwornCommand {
  string target_name = 1;
}

// Response: Server -> Client (OPCODE_INVITE_SWORN_RESPONSE = 1139).
message InviteSwornResponse {
  SwornOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_SWORN_INVITE_EVENT = 1140) — gửi người được mời nếu đang online.
message SwornInviteEvent {
  string inviter_name = 1;
}

// Command: Client -> Server (OPCODE_ACCEPT_SWORN_COMMAND = 1141).
message AcceptSwornCommand {
  string inviter_name = 1;
}

// Response: Server -> Client (OPCODE_ACCEPT_SWORN_RESPONSE = 1142).
message AcceptSwornResponse {
  SwornOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_LEAVE_SWORN_COMMAND = 1143).
message LeaveSwornCommand {}

// Response: Server -> Client (OPCODE_LEAVE_SWORN_RESPONSE = 1144).
message LeaveSwornResponse {
  SwornOutcome outcome = 1;
}

// ===== ADR-173 — ghi chú bạn bè. CHỈ THÊM. Ghi chú riêng của mình, người kia không thấy; trả về trong FriendView.note.

// Command: Client -> Server (OPCODE_SET_FRIEND_NOTE_COMMAND = 1145). Theo TÊN, như RemoveFriendCommand.
// note rỗng (sau khi bỏ khoảng trắng) = xoá ghi chú. Tối đa 24 ký tự.
message SetFriendNoteCommand {
  string target_name = 1;
  string note = 2;
}

enum SetFriendNoteOutcome {
  SET_FRIEND_NOTE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SET_FRIEND_NOTE_OUTCOME_OK = 1;
  SET_FRIEND_NOTE_OUTCOME_TARGET_NOT_FOUND = 2;
  SET_FRIEND_NOTE_OUTCOME_NOT_FRIENDS = 3;
  SET_FRIEND_NOTE_OUTCOME_TOO_LONG = 4;
}

// Response: Server -> Client (OPCODE_SET_FRIEND_NOTE_RESPONSE = 1146).
message SetFriendNoteResponse {
  SetFriendNoteOutcome outcome = 1;
  string target_name = 2; // tên đúng của người bạn (khi tìm thấy)
  string note = 3;        // ghi chú ĐÃ chuẩn hoá được lưu ("" = đã xoá)
}

// ===== ADR-182 — báo bạn bè đột phá + chúc mừng. CHỈ THÊM. Không ghi DB: nhịp "vừa đột phá" chỉ trong bộ nhớ server.

// Event: Server -> Client (OPCODE_FRIEND_BREAKTHROUGH_EVENT = 1147). Một người bạn vừa mở cảnh giới mới (cấp
// 19/37/55/73/91) — gửi mọi người bạn đang online của họ. realm = chỉ số cảnh giới (0 = Luyện Khí … 5 = Hoá Thần).
message FriendBreakthroughEvent {
  int64 friend_character_id = 1;
  string friend_name = 2;
  int32 realm = 3;
  int32 level = 4;
}

// Command: Client -> Server (OPCODE_CONGRATULATE_FRIEND_COMMAND = 1148). Theo TÊN. Chỉ được trong 30 phút sau lần đột
// phá, mỗi người một lần cho mỗi lần đột phá.
message CongratulateFriendCommand {
  string friend_name = 1;
}

enum CongratulateFriendOutcome {
  CONGRATULATE_FRIEND_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  CONGRATULATE_FRIEND_OUTCOME_OK = 1;
  CONGRATULATE_FRIEND_OUTCOME_TARGET_NOT_FOUND = 2;
  CONGRATULATE_FRIEND_OUTCOME_NOT_FRIENDS = 3;
  CONGRATULATE_FRIEND_OUTCOME_NO_RECENT_BREAKTHROUGH = 4; // chưa đột phá, hoặc đã quá 30 phút
  CONGRATULATE_FRIEND_OUTCOME_ALREADY_CONGRATULATED = 5;
}

// Response: Server -> Client (OPCODE_CONGRATULATE_FRIEND_RESPONSE = 1149).
message CongratulateFriendResponse {
  CongratulateFriendOutcome outcome = 1;
  string friend_name = 2;
}

// Event: Server -> Client (OPCODE_FRIEND_CONGRATULATED_EVENT = 1150) — gửi người vừa đột phá (nếu đang online).
message FriendCongratulatedEvent {
  string from_name = 1;
  int32 realm = 2;
}

// ADR-211 (2026-11-07) — gợi ý kết bạn. Request: Client -> Server (OPCODE_SUGGEST_FRIENDS_REQUEST).
message SuggestFriendsRequest {}

message FriendSuggestion {
  string name = 1;
  int32 level = 2;
}

// Response: Server -> Client (OPCODE_SUGGEST_FRIENDS_RESPONSE). Tối đa 10 người đang online, cảnh giới gần mình, chưa là
// bạn, không chặn nhau, chưa gửi lời mời cho mình.
message SuggestFriendsResponse {
  repeated FriendSuggestion suggestions = 1;
}

// ADR-236/237 (2026-11-08) — riêng tư liên lạc. Command: Client -> Server (OPCODE_SET_CONTACT_PRIVACY_COMMAND).
enum ContactPrivacySetting {
  CONTACT_PRIVACY_SETTING_UNSPECIFIED = 0;       // chỉ hỏi trạng thái
  CONTACT_PRIVACY_SETTING_DO_NOT_DISTURB = 1;     // chặn tin riêng + mọi lời mời từ người không phải bạn
  CONTACT_PRIVACY_SETTING_BLOCK_STRANGER_INVITES = 2;  // chặn lời mời nhóm/giao dịch từ người không phải bạn/cùng bang
}

message SetContactPrivacyCommand {
  ContactPrivacySetting setting = 1;
  bool enabled = 2;
}

// Response: Server -> Client (OPCODE_SET_CONTACT_PRIVACY_RESPONSE). Trạng thái sau khi đổi.
message SetContactPrivacyResponse {
  bool do_not_disturb = 1;
  bool block_stranger_invites = 2;
}
