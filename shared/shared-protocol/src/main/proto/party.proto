syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Party (NETWORK.md §4, dải 1300-1399). Phase 7 lát cắt 2 — chỉ thành viên (tạo/mời/chấp
// nhận-từ chối/rời/kick) + kênh chat Party (xem chat.proto). Chia EXP KHÔNG có ở đây — chưa có cơ
// chế cấp EXP từ giết quái solo (feature-party/CLAUDE.md), ngoài phạm vi lát cắt này.

// Luồng gia nhập: MỜI + CHẤP NHẬN (giống friend.proto, khác guild.proto "xin gia nhập") — leader
// mời trực tiếp theo tên nhân vật.

message CreatePartyCommand {
}

enum CreatePartyOutcome {
  CREATE_PARTY_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  CREATE_PARTY_OUTCOME_OK = 1;
  CREATE_PARTY_OUTCOME_ALREADY_IN_PARTY = 2;
}

message CreatePartyResponse {
  CreatePartyOutcome outcome = 1;
  int64 party_id = 2; // chỉ có ý nghĩa khi outcome = OK
}

// target_name (không phải ID) — server-gateway tự tra CharacterFacade.findByName TRƯỚC khi gọi
// PartyFacade.invite, cùng lý do SendFriendRequestCommand ở friend.proto.
message InvitePartyMemberCommand {
  string target_name = 1;
}

enum InvitePartyMemberOutcome {
  INVITE_PARTY_MEMBER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  INVITE_PARTY_MEMBER_OUTCOME_OK = 1;
  INVITE_PARTY_MEMBER_OUTCOME_NOT_LEADER = 2;
  INVITE_PARTY_MEMBER_OUTCOME_CANNOT_INVITE_SELF = 3;
  INVITE_PARTY_MEMBER_OUTCOME_TARGET_ALREADY_IN_PARTY = 4;
  INVITE_PARTY_MEMBER_OUTCOME_PARTY_FULL = 5;
  INVITE_PARTY_MEMBER_OUTCOME_INVITE_ALREADY_PENDING = 6;
  INVITE_PARTY_MEMBER_OUTCOME_TARGET_NOT_FOUND = 7; // tên không tồn tại (character)
}

message InvitePartyMemberResponse {
  InvitePartyMemberOutcome outcome = 1;
}

message AcceptPartyInviteCommand {
  int64 invite_id = 1;
}

enum AcceptPartyInviteOutcome {
  ACCEPT_PARTY_INVITE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  ACCEPT_PARTY_INVITE_OUTCOME_OK = 1;
  ACCEPT_PARTY_INVITE_OUTCOME_NOT_FOUND = 2;
  ACCEPT_PARTY_INVITE_OUTCOME_ALREADY_IN_PARTY = 3;
  ACCEPT_PARTY_INVITE_OUTCOME_PARTY_FULL = 4;
}

message AcceptPartyInviteResponse {
  AcceptPartyInviteOutcome outcome = 1;
}

message RejectPartyInviteCommand {
  int64 invite_id = 1;
}

enum RejectPartyInviteOutcome {
  REJECT_PARTY_INVITE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  REJECT_PARTY_INVITE_OUTCOME_OK = 1;
  REJECT_PARTY_INVITE_OUTCOME_NOT_FOUND = 2;
}

message RejectPartyInviteResponse {
  RejectPartyInviteOutcome outcome = 1;
}

// Dùng chung cho CẢ leader lẫn member thường — leader rời tự động thăng thành viên vào sớm nhất
// (feature-party/CLAUDE.md), không có DisbandPartyCommand riêng như guild.proto.
message LeavePartyCommand {
}

enum LeavePartyOutcome {
  LEAVE_PARTY_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  LEAVE_PARTY_OUTCOME_OK = 1;
  LEAVE_PARTY_OUTCOME_NOT_IN_PARTY = 2;
}

message LeavePartyResponse {
  LeavePartyOutcome outcome = 1;
}

// target_name (không phải ID) — cùng lý do InvitePartyMemberCommand ở trên.
message KickPartyMemberCommand {
  string target_name = 1;
}

enum KickPartyMemberOutcome {
  KICK_PARTY_MEMBER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  KICK_PARTY_MEMBER_OUTCOME_OK = 1;
  KICK_PARTY_MEMBER_OUTCOME_CANNOT_KICK_SELF = 2;
  KICK_PARTY_MEMBER_OUTCOME_TARGET_NOT_FOUND = 3; // tên không tồn tại (character)
  KICK_PARTY_MEMBER_OUTCOME_NOT_FOUND = 4; // không phải leader, HOẶC target không phải thành viên cùng party
}

message KickPartyMemberResponse {
  KickPartyMemberOutcome outcome = 1;
}

message ListPartyMembersRequest {
}

// online do gateway tự ghép (ConnectedCharacterRegistry), KHÔNG phải dữ liệu từ feature-party.
message PartyMemberView {
  int64 character_id = 1;
  string name = 2;
  bool is_leader = 3;
  bool online = 4;
}

message ListPartyMembersResponse {
  repeated PartyMemberView members = 1;
}

message ListPendingPartyInvitesRequest {
}

message PendingPartyInviteView {
  int64 invite_id = 1;
  int64 party_id = 2;
}

message ListPendingPartyInvitesResponse {
  repeated PendingPartyInviteView invites = 1;
}

message GetMyPartyRequest {
}

message GetMyPartyResponse {
  bool in_party = 1;
  int64 party_id = 2; // chỉ có ý nghĩa khi in_party = true
  bool is_leader = 3;
}

// ADR-059 (Accepted 2026-10-18) — "nhóm của bạn vừa đổi". CHỈ THÊM, protocolVersion không tăng. Event là
// lời nhắc dữ liệu đã cũ: client nói một câu theo lý do rồi tự hỏi lại GetMyParty/ListPartyMembers.
enum PartyChangeReason {
  PARTY_CHANGE_REASON_UNSPECIFIED = 0;
  PARTY_CHANGE_REASON_MEMBER_JOINED = 1;
  PARTY_CHANGE_REASON_MEMBER_LEFT = 2;
  PARTY_CHANGE_REASON_MEMBER_KICKED = 3;
  PARTY_CHANGE_REASON_YOU_WERE_KICKED = 4;
  PARTY_CHANGE_REASON_LEADER_CHANGED = 5;
}

// Event: Server -> Client (OPCODE_PARTY_CHANGED_EVENT = 1318). subject = người vào/rời/bị kick/lên trưởng nhóm.
message PartyChangedEvent {
  PartyChangeReason reason = 1;
  int64 subject_character_id = 2;
}

// ===== ADR-082 — bảng tìm nhóm (chỉ RAM, tin hết hạn 10 phút). CHỈ THÊM. =====

enum PartyGoal {
  PARTY_GOAL_UNSPECIFIED = 0;
  PARTY_GOAL_LEVELING = 1;
  PARTY_GOAL_QUEST = 2;
  PARTY_GOAL_DUNGEON = 3;
  PARTY_GOAL_WORLD_BOSS = 4;
}

message PartyFinderListingView {
  int64 leader_character_id = 1;
  string leader_name = 2;
  PartyGoal goal = 3;
  int32 min_level = 4;
  int64 expires_in_seconds = 5;
}

// Request: Client -> Server (OPCODE_LIST_PARTY_FINDER_REQUEST = 1319).
message ListPartyFinderRequest {}

// Response: Server -> Client (OPCODE_LIST_PARTY_FINDER_RESPONSE = 1320). Mới nhất trước.
message ListPartyFinderResponse {
  repeated PartyFinderListingView listings = 1;
}

// Command: Client -> Server (OPCODE_POST_PARTY_FINDER_COMMAND = 1321). Chưa có nhóm thì server lập nhóm trước.
message PostPartyFinderCommand {
  PartyGoal goal = 1;
  int32 min_level = 2;
}

enum PostPartyFinderOutcome {
  POST_PARTY_FINDER_OUTCOME_UNSPECIFIED = 0;
  POST_PARTY_FINDER_OUTCOME_OK = 1;
  POST_PARTY_FINDER_OUTCOME_NOT_LEADER = 2;
  POST_PARTY_FINDER_OUTCOME_INVALID_GOAL = 3;
}

// Response: Server -> Client (OPCODE_POST_PARTY_FINDER_RESPONSE = 1322).
message PostPartyFinderResponse {
  PostPartyFinderOutcome outcome = 1;
  ListPartyFinderResponse board = 2;
}

// Command: Client -> Server (OPCODE_JOIN_PARTY_FINDER_COMMAND = 1323). Vào ngay nếu đủ cấp và còn chỗ.
message JoinPartyFinderCommand {
  int64 leader_character_id = 1;
}

enum JoinPartyFinderOutcome {
  JOIN_PARTY_FINDER_OUTCOME_UNSPECIFIED = 0;
  JOIN_PARTY_FINDER_OUTCOME_OK = 1;
  JOIN_PARTY_FINDER_OUTCOME_NOT_FOUND = 2;      // tin không còn (hết hạn/đã gỡ/nhóm giải tán)
  JOIN_PARTY_FINDER_OUTCOME_LEVEL_TOO_LOW = 3;
  JOIN_PARTY_FINDER_OUTCOME_ALREADY_IN_PARTY = 4;
  JOIN_PARTY_FINDER_OUTCOME_PARTY_FULL = 5;
  JOIN_PARTY_FINDER_OUTCOME_INVITE_PENDING = 6;  // đang có lời mời nhóm khác chờ trả lời
  JOIN_PARTY_FINDER_OUTCOME_OWN_LISTING = 7;
}

// Response: Server -> Client (OPCODE_JOIN_PARTY_FINDER_RESPONSE = 1324).
message JoinPartyFinderResponse {
  JoinPartyFinderOutcome outcome = 1;
  ListPartyFinderResponse board = 2;
}

// Command: Client -> Server (OPCODE_REMOVE_PARTY_FINDER_COMMAND = 1325). Gỡ tin của chính mình.
message RemovePartyFinderCommand {}

// Response: Server -> Client (OPCODE_REMOVE_PARTY_FINDER_RESPONSE = 1326).
message RemovePartyFinderResponse {
  bool removed = 1;
  ListPartyFinderResponse board = 2;
}

// ADR-150 (2026-11-02) — tung xúc xắc chia đồ hiếm trong nhóm.
enum LootRollChoice {
  LOOT_ROLL_CHOICE_UNSPECIFIED = 0;
  LOOT_ROLL_CHOICE_NEED = 1;   // Cần — thắng mọi người chọn Tham
  LOOT_ROLL_CHOICE_GREED = 2;  // Tham
  LOOT_ROLL_CHOICE_PASS = 3;   // Bỏ (không chọn trong hạn cũng là Bỏ)
}

// Event: Server -> Client (OPCODE_LOOT_ROLL_STARTED_EVENT = 1328) — gửi MỌI người được chia, kể cả người ra đòn cuối.
message LootRollStartedEvent {
  int64 roll_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int32 seconds = 4;
}

// Command: Client -> Server (OPCODE_LOOT_ROLL_CHOICE_COMMAND = 1329).
message LootRollChoiceCommand {
  int64 roll_id = 1;
  LootRollChoice choice = 2;
}

enum LootRollChoiceOutcome {
  LOOT_ROLL_CHOICE_OUTCOME_UNSPECIFIED = 0;
  LOOT_ROLL_CHOICE_OUTCOME_OK = 1;
  LOOT_ROLL_CHOICE_OUTCOME_NOT_FOUND = 2;       // lượt tung đã xong / không tồn tại
  LOOT_ROLL_CHOICE_OUTCOME_NOT_ELIGIBLE = 3;    // không nằm trong danh sách được chia
  LOOT_ROLL_CHOICE_OUTCOME_ALREADY_CHOSEN = 4;
  LOOT_ROLL_CHOICE_OUTCOME_INVALID_CHOICE = 5;
}

// Response: Server -> Client (OPCODE_LOOT_ROLL_CHOICE_RESPONSE = 1330).
message LootRollChoiceResponse {
  int64 roll_id = 1;
  LootRollChoiceOutcome outcome = 2;
}

// Một người trong kết quả. roll = 0 khi Bỏ.
message LootRollEntry {
  int64 character_id = 1;
  string name = 2;
  LootRollChoice choice = 3;
  int32 roll = 4;
}

// Event: Server -> Client (OPCODE_LOOT_ROLL_RESULT_EVENT = 1331) — gửi mọi người được chia. Cả nhóm Bỏ ⇒ món về người
// ra đòn cuối. by_mail = túi người thắng đầy, món đi bằng thư hệ thống.
message LootRollResultEvent {
  int64 roll_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int64 winner_character_id = 4;
  string winner_name = 5;
  repeated LootRollEntry entries = 6;
  bool by_mail = 7;
}

// ===== ADR-191 (Accepted 2026-11-07, chủ dự án chọn) — nhường trưởng nhóm khi vẫn ở trong nhóm. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_TRANSFER_PARTY_LEADER_COMMAND = 1332). target_name (không phải ID) — cùng lý do
// InvitePartyMemberCommand.
message TransferPartyLeaderCommand {
  string target_name = 1;
}

enum TransferPartyLeaderOutcome {
  TRANSFER_PARTY_LEADER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  TRANSFER_PARTY_LEADER_OUTCOME_OK = 1;
  TRANSFER_PARTY_LEADER_OUTCOME_NOT_LEADER = 2; // chưa vào nhóm, hoặc không phải trưởng nhóm
  TRANSFER_PARTY_LEADER_OUTCOME_TARGET_NOT_IN_PARTY = 3; // tên không tồn tại, hoặc không cùng nhóm
  TRANSFER_PARTY_LEADER_OUTCOME_CANNOT_TRANSFER_TO_SELF = 4;
}

// Response: Server -> Client (OPCODE_TRANSFER_PARTY_LEADER_RESPONSE = 1333). Thành công ⇒ cả nhóm (đang online) nhận
// PartyChangedEvent LEADER_CHANGED.
message TransferPartyLeaderResponse {
  TransferPartyLeaderOutcome outcome = 1;
  string target_name = 2;
}

// ADR-213 (2026-11-07) — đánh dấu mục tiêu nhóm. Command: Client -> Server (OPCODE_MARK_PARTY_TARGET_COMMAND).
// Chỉ trưởng nhóm; target_entity_id = 0 là bỏ đánh dấu. Server không kiểm entity tồn tại: dấu chỉ là gợi ý cho đồng
// đội, mỗi client tự nhắm (và server vẫn kiểm mọi đòn đánh như thường).
message MarkPartyTargetCommand {
  int64 target_entity_id = 1;
}

enum MarkPartyTargetOutcome {
  MARK_PARTY_TARGET_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  MARK_PARTY_TARGET_OUTCOME_OK = 1;
  MARK_PARTY_TARGET_OUTCOME_NOT_LEADER = 2;     // chưa vào nhóm, hoặc không phải trưởng nhóm
  MARK_PARTY_TARGET_OUTCOME_INVALID_TARGET = 3; // id âm
}

// Response: Server -> Client (OPCODE_MARK_PARTY_TARGET_RESPONSE).
message MarkPartyTargetResponse {
  MarkPartyTargetOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_PARTY_TARGET_MARKED_EVENT) — tới mọi thành viên đang online, kể cả trưởng nhóm.
message PartyTargetMarkedEvent {
  int64 target_entity_id = 1; // 0 = bỏ đánh dấu
  string leader_name = 2;
}

// ===== ADR-263 (2026-11-08) — kiểm tra sẵn sàng nhóm. CHỈ THÊM. Trạng thái trong RAM gateway (mất khi khởi động lại);
// lời mời và kết quả tới mọi thành viên đang online bằng dòng chat hệ thống (ChatMessageEvent, kênh UNSPECIFIED). =====

// Command: Client -> Server (OPCODE_START_READY_CHECK_COMMAND). Chỉ trưởng nhóm; hết hạn sau 30 giây.
message StartReadyCheckCommand {}

enum StartReadyCheckOutcome {
  START_READY_CHECK_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  START_READY_CHECK_OUTCOME_OK = 1;
  START_READY_CHECK_OUTCOME_NOT_LEADER = 2;     // chưa vào nhóm, hoặc không phải trưởng nhóm
  START_READY_CHECK_OUTCOME_ALREADY_ACTIVE = 3; // nhóm đang có một lượt kiểm tra chưa xong
}

// Response: Server -> Client (OPCODE_START_READY_CHECK_RESPONSE).
message StartReadyCheckResponse {
  StartReadyCheckOutcome outcome = 1;
  int32 seconds = 2; // thời hạn trả lời
}

// Command: Client -> Server (OPCODE_RESPOND_READY_CHECK_COMMAND). Thành viên có mặt lúc mở lượt kiểm tra trả lời.
message RespondReadyCheckCommand {
  bool ready = 1;
}

enum RespondReadyCheckOutcome {
  RESPOND_READY_CHECK_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  RESPOND_READY_CHECK_OUTCOME_OK = 1;
  RESPOND_READY_CHECK_OUTCOME_NO_CHECK = 2; // nhóm không có lượt kiểm tra nào, hoặc mình vào nhóm sau khi nó mở
}

// Response: Server -> Client (OPCODE_RESPOND_READY_CHECK_RESPONSE).
message RespondReadyCheckResponse {
  RespondReadyCheckOutcome outcome = 1;
}

// ===== ADR-264 (2026-11-08) — đếm ngược nhóm. CHỈ THÊM. Server phát "N…" mỗi giây rồi "Bắt đầu!" bằng dòng chat hệ
// thống cho mọi thành viên đang online. =====

// Command: Client -> Server (OPCODE_START_PARTY_COUNTDOWN_COMMAND). Chỉ trưởng nhóm; seconds 3–10.
message StartPartyCountdownCommand {
  int32 seconds = 1;
}

enum StartPartyCountdownOutcome {
  START_PARTY_COUNTDOWN_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  START_PARTY_COUNTDOWN_OUTCOME_OK = 1;
  START_PARTY_COUNTDOWN_OUTCOME_NOT_LEADER = 2;
  START_PARTY_COUNTDOWN_OUTCOME_INVALID_SECONDS = 3; // ngoài 3–10
  START_PARTY_COUNTDOWN_OUTCOME_ALREADY_ACTIVE = 4;  // nhóm đang đếm
}

// Response: Server -> Client (OPCODE_START_PARTY_COUNTDOWN_RESPONSE).
message StartPartyCountdownResponse {
  StartPartyCountdownOutcome outcome = 1;
}

// ===== ADR-278 (2026-11-08) — chia vàng cho nhóm. CHỈ THÊM. Trừ vàng người chia, cộng đều cho đồng đội ĐANG online
// cùng World trong MỘT giao dịch DB, mỗi bên một dòng audit (sổ vàng ADR-169). Phần dư (không chia hết) ở lại người
// chia. Vàng rời túi ⇒ cần khoá an toàn (ADR-115) như giao dịch. =====

// Command: Client -> Server (OPCODE_SPLIT_PARTY_GOLD_COMMAND).
message SplitPartyGoldCommand {
  int64 amount = 1; // tổng muốn chia, 1 – 1.000.000.000
}

enum SplitPartyGoldOutcome {
  SPLIT_PARTY_GOLD_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SPLIT_PARTY_GOLD_OUTCOME_OK = 1;
  SPLIT_PARTY_GOLD_OUTCOME_NOT_IN_PARTY = 2;
  SPLIT_PARTY_GOLD_OUTCOME_NO_RECIPIENT = 3;      // không đồng đội nào online cùng World
  SPLIT_PARTY_GOLD_OUTCOME_INVALID_AMOUNT = 4;    // ngoài khoảng, hoặc nhỏ hơn số người nhận (mỗi người < 1)
  SPLIT_PARTY_GOLD_OUTCOME_NOT_ENOUGH_GOLD = 5;
}

// Response: Server -> Client (OPCODE_SPLIT_PARTY_GOLD_RESPONSE).
message SplitPartyGoldResponse {
  SplitPartyGoldOutcome outcome = 1;
  int64 each = 2;       // mỗi người nhận
  int32 recipients = 3; // số người nhận
  int64 gold_after = 4; // vàng còn lại của người chia
}

// ADR-286 (2026-11-12) — tự nhận lời mời nhóm từ bạn bè. Command: Client -> Server (OPCODE_SET_PARTY_AUTO_ACCEPT_COMMAND).
// Bật thì một người BẠN mời vào nhóm ⇒ server tự chấp nhận ngay (người không phải bạn vẫn là lời mời thường).
message SetPartyAutoAcceptCommand {
  bool query_only = 1;
  bool enabled = 2;
}

// Response: Server -> Client (OPCODE_SET_PARTY_AUTO_ACCEPT_RESPONSE). Trạng thái sau khi đổi.
message SetPartyAutoAcceptResponse {
  bool enabled = 1;
}

// ADR-329 (2026-11-13) — người vừa chơi cùng. Request: Client -> Server (OPCODE_GET_RECENT_PLAYERS_REQUEST).
message GetRecentPlayersRequest {}

message RecentPlayer {
  string name = 1;
  int32 level = 2;
  bool online = 3;
  int64 met_at_epoch_seconds = 4;
}

// Response: Server -> Client (OPCODE_GET_RECENT_PLAYERS_RESPONSE). Mới trước, tối đa 10 người.
message GetRecentPlayersResponse {
  repeated RecentPlayer players = 1;
}
