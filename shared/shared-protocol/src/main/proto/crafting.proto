syntax = "proto3";

package kage.protocol;

option java_multiple_files = true;
option java_package = "dev.kage.protocol";

// ADR-079 — luyện đan ở lò của trưởng lão Chu Hoành. Dải 1800–1899.

// Request: Client -> Server (OPCODE_LIST_RECIPES_REQUEST = 1800). Lựa chọn thoại "open_crafting" cũng trả 1801.
message ListRecipesRequest {}

message RecipeMaterialView {
  int64 item_template_id = 1;
  int32 quantity = 2;
}

message RecipeView {
  string code = 1;
  int64 output_item_template_id = 2; // tên tra catalog vật phẩm (ADR-035)
  int32 output_quantity = 3;
  int64 gold_cost = 4;
  int32 required_level = 5;
  repeated RecipeMaterialView materials = 6;
}

// Response: Server -> Client (OPCODE_LIST_RECIPES_RESPONSE = 1801).
message ListRecipesResponse {
  repeated RecipeView recipes = 1;
}

// Command: Client -> Server (OPCODE_CRAFT_ITEM_COMMAND = 1802). Server kiểm đứng gần lò, cấp, nguyên liệu, vàng, túi.
message CraftItemCommand {
  string recipe_code = 1;
}

enum CraftItemOutcome {
  CRAFT_ITEM_OUTCOME_UNSPECIFIED = 0;
  CRAFT_ITEM_OUTCOME_OK = 1;
  CRAFT_ITEM_OUTCOME_UNKNOWN_RECIPE = 2;
  CRAFT_ITEM_OUTCOME_LEVEL_TOO_LOW = 3;
  CRAFT_ITEM_OUTCOME_MISSING_MATERIALS = 4;
  CRAFT_ITEM_OUTCOME_INSUFFICIENT_GOLD = 5;
  CRAFT_ITEM_OUTCOME_BAG_FULL = 6;
  CRAFT_ITEM_OUTCOME_TOO_FAR = 7;
}

// Response: Server -> Client (OPCODE_CRAFT_ITEM_RESPONSE = 1803).
message CraftItemResponse {
  CraftItemOutcome outcome = 1;
}

// ADR-119 (2026-10-30) — linh điền. Mỗi nhân vật 4 ô (mở thêm tới 8 bằng linh thạch); gieo hạt giống từ túi, chín sau
// thời gian THẬT, thu hoạch ra linh thảo vào túi. Bạn bè tưới một lần mỗi vụ ⇒ sản lượng kỳ vọng +10%.
enum SpiritFieldOutcome {
  SPIRIT_FIELD_OUTCOME_UNSPECIFIED = 0;
  SPIRIT_FIELD_OUTCOME_OK = 1;
  SPIRIT_FIELD_OUTCOME_INVALID_PLOT = 2;
  SPIRIT_FIELD_OUTCOME_PLOT_OCCUPIED = 3;
  SPIRIT_FIELD_OUTCOME_PLOT_EMPTY = 4;
  SPIRIT_FIELD_OUTCOME_NOT_RIPE = 5;
  SPIRIT_FIELD_OUTCOME_UNKNOWN_SEED = 6;
  SPIRIT_FIELD_OUTCOME_NO_SEED = 7;
  SPIRIT_FIELD_OUTCOME_ALREADY_WATERED = 8;
  SPIRIT_FIELD_OUTCOME_MAX_PLOTS = 9;
  SPIRIT_FIELD_OUTCOME_INSUFFICIENT_GOLD = 10;
  SPIRIT_FIELD_OUTCOME_BAG_FULL = 11;
  SPIRIT_FIELD_OUTCOME_NOT_FRIEND = 12;        // xem/tưới ruộng của người không phải bạn bè
  SPIRIT_FIELD_OUTCOME_UNKNOWN_CHARACTER = 13;
}

message SpiritPlotView {
  int32 index = 1;
  int64 seed_item_template_id = 2;
  int64 yield_item_template_id = 3;
  int64 ripe_at_epoch_ms = 4;
  bool watered = 5;
}

message FieldSeedView {
  int64 item_template_id = 1;
  int32 grow_minutes = 2;
  int64 yield_item_template_id = 3;
  int32 yield_quantity = 4;
}

// Request: Client -> Server (OPCODE_GET_SPIRIT_FIELD_REQUEST = 1804). owner_name rỗng ⇒ ruộng của mình; khác ⇒ ruộng
// của một BẠN BÈ (để tưới).
message GetSpiritFieldRequest {
  string owner_name = 1;
}

// Response: Server -> Client (OPCODE_GET_SPIRIT_FIELD_RESPONSE = 1805). outcome khác OK (NOT_FRIEND, UNKNOWN_CHARACTER)
// thì các field khác rỗng. server_time_ms để client đếm ngược mà không tin đồng hồ máy mình.
message GetSpiritFieldResponse {
  SpiritFieldOutcome outcome = 1;
  string owner_name = 2;
  int32 plots = 3;
  repeated SpiritPlotView planted = 4;
  repeated FieldSeedView seeds = 5;
  int64 unlock_cost = 6;   // 0 khi đã đủ 8 ô
  int64 server_time_ms = 7;
}

// Command: Client -> Server (OPCODE_PLANT_SEED_COMMAND = 1806).
message PlantSeedCommand {
  int32 plot_index = 1;
  int64 seed_item_template_id = 2;
}

// Command: Client -> Server (OPCODE_HARVEST_PLOT_COMMAND = 1808).
message HarvestPlotCommand {
  int32 plot_index = 1;
}

// Command: Client -> Server (OPCODE_WATER_PLOT_COMMAND = 1810).
message WaterPlotCommand {
  string owner_name = 1;
  int32 plot_index = 2;
}

// Command: Client -> Server (OPCODE_UNLOCK_PLOT_COMMAND = 1812).
message UnlockPlotCommand {
}

// Response: Server -> Client (OPCODE_PLANT_SEED_RESPONSE = 1807).
message PlantSeedResponse {
  SpiritFieldOutcome outcome = 1;
}

// Response: Server -> Client (OPCODE_HARVEST_PLOT_RESPONSE = 1809).
message HarvestPlotResponse {
  SpiritFieldOutcome outcome = 1;
}

// Response: Server -> Client (OPCODE_WATER_PLOT_RESPONSE = 1811).
message WaterPlotResponse {
  SpiritFieldOutcome outcome = 1;
}

// Response: Server -> Client (OPCODE_UNLOCK_PLOT_RESPONSE = 1813).
message UnlockPlotResponse {
  SpiritFieldOutcome outcome = 1;
}

// ADR-120 (2026-10-31) — luyện khí ở lò của trưởng lão (chưa có NPC thợ rèn). Công thức cùng dạng RecipeView của luyện
// đan; mỗi lần ra đúng một món trang bị, server tung phẩm chất ⇒ số dòng tẩy luyện gieo sẵn.

// Request: Client -> Server (OPCODE_LIST_FORGE_RECIPES_REQUEST = 1814).
message ListForgeRecipesRequest {}

// Response: Server -> Client (OPCODE_LIST_FORGE_RECIPES_RESPONSE = 1815).
message ListForgeRecipesResponse {
  repeated RecipeView recipes = 1;
}

// Command: Client -> Server (OPCODE_FORGE_ITEM_COMMAND = 1816). Server kiểm đứng gần lò, cấp, nguyên liệu, vàng, túi.
message ForgeItemCommand {
  string recipe_code = 1;
}

enum ForgeQuality {
  FORGE_QUALITY_UNSPECIFIED = 0;   // lần luyện không thành
  FORGE_QUALITY_COMMON = 1;        // 0 dòng tẩy luyện
  FORGE_QUALITY_FINE = 2;          // 1 dòng
  FORGE_QUALITY_RARE = 3;          // 2 dòng
}

// Response: Server -> Client (OPCODE_FORGE_ITEM_RESPONSE = 1817). Dùng lại CraftItemOutcome của luyện đan.
message ForgeItemResponse {
  CraftItemOutcome outcome = 1;
  ForgeQuality quality = 2;
}
