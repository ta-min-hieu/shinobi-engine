syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Quest (NETWORK.md §4, dải 600-699 dùng chung với NPC/Dialogue). Phase 6 lát cắt 3 — nội
// dung quest (điều kiện hoàn thành, thưởng) là SCRIPT thật (Điều 27, GAMEPLAY.md §9.3), Java chỉ
// truyền tải kết quả. progress_json KHÔNG xuất hiện trong bất kỳ packet nào ở lát cắt này (chuỗi
// đục với Java, script tự quản — client hiện tại không cần hiển thị tiến độ chi tiết, chỉ cần biết
// trạng thái đổi).

// Không có OPCODE_ACCEPT_QUEST_COMMAND riêng — nhận quest đi qua
// SelectDialogueOptionCommand (dialogue.proto) với action="accept_quest:<code>", GATEWAY gọi
// QuestFacade.acceptQuest rồi trả response này (feature-dialogue không biết feature-quest tồn tại).

enum AcceptQuestOutcome {
  ACCEPT_QUEST_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  ACCEPT_QUEST_OUTCOME_OK = 1;
  ACCEPT_QUEST_OUTCOME_QUEST_NOT_FOUND = 2;
  ACCEPT_QUEST_OUTCOME_ALREADY_ACCEPTED = 3;
  // ADR-044 — quest tiên quyết (`quest_template.prerequisite_quest_id`) chưa LĨNH THƯỞNG xong.
  // Chỉ THÊM giá trị enum, không đổi/xoá giá trị nào ⇒ `protocolVersion` KHÔNG tăng
  // (NETWORK.md §6). Client cũ rơi vào nhánh "không rõ" sẵn có, không vỡ.
  //
  // KHÔNG gộp vào QUEST_NOT_FOUND: quest CÓ THẬT, chỉ là chưa tới lượt — nói "không có nhiệm
  // vụ này" là nói dối người chơi về một thứ họ sẽ nhận được sau vài phút nữa.
  ACCEPT_QUEST_OUTCOME_PREREQUISITE_NOT_MET = 4;
}

// Response: Server -> Client (OPCODE_ACCEPT_QUEST_RESPONSE).
message AcceptQuestResponse {
  AcceptQuestOutcome outcome = 1;
}

enum QuestStatus {
  QUEST_STATUS_UNSPECIFIED = 0;
  QUEST_STATUS_IN_PROGRESS = 1;
  QUEST_STATUS_COMPLETED = 2;
  QUEST_STATUS_CLAIMED = 3;
}

// Event: Server -> Client (OPCODE_QUEST_STATUS_CHANGED_EVENT). Chỉ phát khi quest VỪA chuyển
// COMPLETED (không phát cho mỗi lần tiến độ tăng — GAMEPLAY.md §9.3, tránh quá tải World tick).
message QuestStatusChangedEvent {
  string quest_code = 1;
  QuestStatus status = 2;
}

// Command: Client -> Server (OPCODE_CLAIM_QUEST_REWARD_COMMAND). Đứng riêng, KHÔNG qua dialogue ở
// lát cắt này (kiểm soát phạm vi — có thể gắn vào dialogue "trả nhiệm vụ" ở lát cắt sau).
// idempotency_key (ADR-025, thêm 2026-08-02 — retrofit, trao EXP/item thưởng thật giống
// ClaimMailCommand nhưng chưa enforce lúc code lát cắt gốc): UUID v4 client tự sinh, giữ nguyên
// khi tự retry cùng 1 lần nhận thưởng — server enforce unique ở bảng idempotency_key trong CÙNG
// transaction với hiệu ứng thật (EXP + item + đổi status CLAIMED), xem ClaimMailCommand (mail.proto)
// cho pattern gốc ("nhận thưởng 1 lần" gần nhất về ngữ nghĩa).
message ClaimQuestRewardCommand {
  string quest_code = 1;
  string idempotency_key = 2;
}

enum ClaimQuestRewardOutcome {
  CLAIM_QUEST_REWARD_OUTCOME_UNSPECIFIED = 0;
  CLAIM_QUEST_REWARD_OUTCOME_OK = 1;
  CLAIM_QUEST_REWARD_OUTCOME_QUEST_NOT_FOUND = 2;
  CLAIM_QUEST_REWARD_OUTCOME_NOT_ACCEPTED = 3;
  CLAIM_QUEST_REWARD_OUTCOME_NOT_COMPLETED_YET = 4;
  CLAIM_QUEST_REWARD_OUTCOME_DUPLICATE_REQUEST = 5; // ADR-025: idempotency_key đã dùng trước đó
}

message ItemRewardView {
  string item_template_code = 1;
  int32 quantity = 2;
}

// Response: Server -> Client (OPCODE_CLAIM_QUEST_REWARD_RESPONSE).
message ClaimQuestRewardResponse {
  ClaimQuestRewardOutcome outcome = 1;
  int64 exp_granted = 2;
  repeated ItemRewardView items_granted = 3;
}

// -----------------------------------------------------------------------------------------------
// ADR-035 (Accepted 2026-08-27) — nhật ký nhiệm vụ. CHỈ THÊM, không đổi message nào ở trên
// (NETWORK.md §6); ItemRewardView giữ nguyên vẹn kể cả sự chênh id-vs-code (Technical Decision #8).
// -----------------------------------------------------------------------------------------------

// Command: Client -> Server (OPCODE_LIST_QUESTS_REQUEST = 610). Không field — characterId từ session.
message ListQuestsRequest {
}

// 1 dòng nhật ký. quest_code là thứ ClaimQuestRewardCommand bắt buộc phải có, và hiện client chỉ
// lấy được nó từ chuỗi action của hội thoại lúc nhận — đây chính là gói gỡ bế tắc đó.
// KHÔNG mang progress_json: nó là chuỗi đục do script tự quản (quest.proto dòng 10), Java không đọc
// được và client không hiển thị được. Giữ nguyên ranh giới đó.
message QuestLogEntry {
  string quest_code = 1;
  QuestStatus status = 2;
}

// Response: Server -> Client (OPCODE_LIST_QUESTS_RESPONSE = 611). Gồm cả quest đã CLAIMED để client
// biết không mời lại — lọc phía server thì client không phân biệt được "chưa từng nhận" với "đã trả".
message ListQuestsResponse {
  repeated QuestLogEntry quests = 1;
}
