syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Bang hội (NETWORK.md §4, dải 700-799). Phase 7 lát cắt 1 — chỉ thành viên (tạo/xin gia
// nhập/duyệt/từ chối/rời/kick/giải tán) + kênh chat "Bang hội" (xem chat.proto). Kho bang + nhiệm
// vụ bang KHÔNG có ở đây (dời lát cắt sau, xem feature-guild/CLAUDE.md).

// Luồng gia nhập: XIN GIA NHẬP + LEADER DUYỆT (khác friend.proto là mời trực tiếp) — quyết định
// cùng chủ dự án 2026-07-23.

message CreateGuildCommand {
  string name = 1;
}

enum CreateGuildOutcome {
  CREATE_GUILD_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  CREATE_GUILD_OUTCOME_OK = 1;
  CREATE_GUILD_OUTCOME_ALREADY_IN_GUILD = 2;
  CREATE_GUILD_OUTCOME_NAME_TAKEN = 3;
}

message CreateGuildResponse {
  CreateGuildOutcome outcome = 1;
  int64 guild_id = 2; // chỉ có ý nghĩa khi outcome = OK
}

// Xin gia nhập theo TÊN BANG (không phải ID) — cùng lý do target_name ở friend.proto.
message SendGuildJoinRequestCommand {
  string guild_name = 1;
}

enum SendGuildJoinRequestOutcome {
  SEND_GUILD_JOIN_REQUEST_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SEND_GUILD_JOIN_REQUEST_OUTCOME_OK = 1;
  SEND_GUILD_JOIN_REQUEST_OUTCOME_ALREADY_IN_GUILD = 2;
  SEND_GUILD_JOIN_REQUEST_OUTCOME_GUILD_NOT_FOUND = 3;
  SEND_GUILD_JOIN_REQUEST_OUTCOME_REQUEST_ALREADY_PENDING = 4;
  SEND_GUILD_JOIN_REQUEST_OUTCOME_LEVEL_TOO_LOW = 5; // ADR-185 — bang đang chiêu mộ với cấp tối thiểu cao hơn cấp mình
}

message SendGuildJoinRequestResponse {
  SendGuildJoinRequestOutcome outcome = 1;
}

message ApproveGuildJoinRequestCommand {
  int64 request_id = 1;
}

enum ApproveGuildJoinRequestOutcome {
  APPROVE_GUILD_JOIN_REQUEST_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  APPROVE_GUILD_JOIN_REQUEST_OUTCOME_OK = 1;
  APPROVE_GUILD_JOIN_REQUEST_OUTCOME_NOT_FOUND = 2;
  APPROVE_GUILD_JOIN_REQUEST_OUTCOME_TARGET_ALREADY_IN_GUILD = 3;
}

message ApproveGuildJoinRequestResponse {
  ApproveGuildJoinRequestOutcome outcome = 1;
}

message RejectGuildJoinRequestCommand {
  int64 request_id = 1;
}

enum RejectGuildJoinRequestOutcome {
  REJECT_GUILD_JOIN_REQUEST_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  REJECT_GUILD_JOIN_REQUEST_OUTCOME_OK = 1;
  REJECT_GUILD_JOIN_REQUEST_OUTCOME_NOT_FOUND = 2;
}

message RejectGuildJoinRequestResponse {
  RejectGuildJoinRequestOutcome outcome = 1;
}

message LeaveGuildCommand {
}

enum LeaveGuildOutcome {
  LEAVE_GUILD_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  LEAVE_GUILD_OUTCOME_OK = 1;
  LEAVE_GUILD_OUTCOME_NOT_IN_GUILD = 2;
  LEAVE_GUILD_OUTCOME_LEADER_CANNOT_LEAVE = 3;
}

message LeaveGuildResponse {
  LeaveGuildOutcome outcome = 1;
}

message DisbandGuildCommand {
}

enum DisbandGuildOutcome {
  DISBAND_GUILD_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  DISBAND_GUILD_OUTCOME_OK = 1;
  DISBAND_GUILD_OUTCOME_NOT_LEADER = 2;
}

message DisbandGuildResponse {
  DisbandGuildOutcome outcome = 1;
}

// target_name (không phải ID) — server-gateway tự tra CharacterFacade.findByName TRƯỚC khi gọi
// GuildFacade.kickMember, cùng lý do RemoveFriendCommand ở friend.proto.
message KickGuildMemberCommand {
  string target_name = 1;
}

enum KickGuildMemberOutcome {
  KICK_GUILD_MEMBER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  KICK_GUILD_MEMBER_OUTCOME_OK = 1;
  KICK_GUILD_MEMBER_OUTCOME_CANNOT_KICK_SELF = 2;
  KICK_GUILD_MEMBER_OUTCOME_TARGET_NOT_FOUND = 3; // tên không tồn tại (character)
  KICK_GUILD_MEMBER_OUTCOME_NOT_FOUND = 4; // không phải leader, HOẶC target không phải thành viên cùng bang
}

message KickGuildMemberResponse {
  KickGuildMemberOutcome outcome = 1;
}

message ListGuildMembersRequest {
}

// online do gateway tự ghép (ConnectedCharacterRegistry), KHÔNG phải dữ liệu từ feature-guild.
message GuildMemberView {
  int64 character_id = 1;
  string name = 2;
  bool is_leader = 3;
  bool online = 4;
  int64 contribution = 5; // ADR-068 — điểm cống hiến
  bool is_vice_leader = 6; // ADR-184 — phó bang chủ
  int64 last_online_epoch_seconds = 7; // ADR-192 — lần cuối rời world; 0 = đang online hoặc chưa từng có mốc
}

message ListGuildMembersResponse {
  repeated GuildMemberView members = 1;
}

message ListPendingGuildJoinRequestsRequest {
}

message PendingGuildJoinRequestView {
  int64 request_id = 1;
  int64 character_id = 2;
  string character_name = 3;
}

message ListPendingGuildJoinRequestsResponse {
  repeated PendingGuildJoinRequestView requests = 1;
}

message GetMyGuildRequest {
}

message GetMyGuildResponse {
  bool in_guild = 1;
  int64 guild_id = 2; // chỉ có ý nghĩa khi in_guild = true
  string guild_name = 3;
  bool is_leader = 4;
  GuildProgressView progress = 5; // ADR-068/069 — chỉ có khi in_guild = true
  string notice = 6;              // ADR-179 — thông báo bang ("" = chưa có)
  bool is_vice_leader = 7;        // ADR-184 — mình là phó bang chủ (duyệt đơn, đăng thông báo)
}

// ADR-059 (Accepted 2026-10-18) — "bang của bạn vừa đổi". CHỈ THÊM, protocolVersion không tăng. Client nói
// một câu theo lý do rồi tự hỏi lại GetMyGuild/ListGuildMembers.
enum GuildChangeReason {
  GUILD_CHANGE_REASON_UNSPECIFIED = 0;
  GUILD_CHANGE_REASON_MEMBER_JOINED = 1;
  GUILD_CHANGE_REASON_MEMBER_LEFT = 2;
  GUILD_CHANGE_REASON_MEMBER_KICKED = 3;
  GUILD_CHANGE_REASON_YOU_WERE_KICKED = 4;
  GUILD_CHANGE_REASON_DISBANDED = 5;
  GUILD_CHANGE_REASON_YOU_WERE_ACCEPTED = 6;
  GUILD_CHANGE_REASON_LEVEL_UP = 7;                // ADR-068 — bang vừa lên cấp
  GUILD_CHANGE_REASON_WEEKLY_QUEST_COMPLETED = 8;  // ADR-069 — thưởng đã gửi qua thư
  GUILD_CHANGE_REASON_RENAMED = 9;                 // ADR-172 — bang vừa đổi tên
  GUILD_CHANGE_REASON_NOTICE_CHANGED = 10;         // ADR-179 — bang chủ vừa đổi thông báo bang
  GUILD_CHANGE_REASON_LEADER_CHANGED = 11;         // ADR-183 — bang có bang chủ mới (subject = bang chủ mới)
  GUILD_CHANGE_REASON_VICE_CHANGED = 12;           // ADR-184 — bổ nhiệm / bãi nhiệm phó bang chủ (subject = người đó)
}

// Event: Server -> Client (OPCODE_GUILD_CHANGED_EVENT = 720).
message GuildChangedEvent {
  GuildChangeReason reason = 1;
  int64 subject_character_id = 2;
}

// ADR-068/069 — cấp bang, cống hiến của chính người hỏi, nhiệm vụ tuần.
message GuildProgressView {
  int32 level = 1;
  int64 exp = 2;
  int64 exp_for_next_level = 3; // tổng kinh nghiệm cần cho cấp kế; 0 = đã tối đa
  int32 max_members = 4;
  int64 my_contribution = 5;
  int32 weekly_kills = 6;
  int32 weekly_target = 7;
  bool weekly_completed = 8;
}

// Command: Client -> Server (OPCODE_DONATE_TO_GUILD_COMMAND = 721). Bội số 1.000, tối đa 100.000.
message DonateToGuildCommand {
  int64 amount = 1;
  string idempotency_key = 2; // UUID (ADR-025)
}

enum DonateToGuildOutcome {
  DONATE_TO_GUILD_OUTCOME_UNSPECIFIED = 0;
  DONATE_TO_GUILD_OUTCOME_OK = 1;
  DONATE_TO_GUILD_OUTCOME_NOT_IN_GUILD = 2;
  DONATE_TO_GUILD_OUTCOME_INSUFFICIENT_GOLD = 3;
  DONATE_TO_GUILD_OUTCOME_INVALID_AMOUNT = 4;
  DONATE_TO_GUILD_OUTCOME_DUPLICATE_REQUEST = 5;
}

// Response: Server -> Client (OPCODE_DONATE_TO_GUILD_RESPONSE = 722). progress chỉ có khi OK.
message DonateToGuildResponse {
  DonateToGuildOutcome outcome = 1;
  GuildProgressView progress = 2;
}

// ===== ADR-080 — cửa hàng bang: đổi điểm cống hiến (tích luỹ − đã tiêu) lấy vật phẩm. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_GUILD_SHOP_REQUEST = 723).
message ListGuildShopRequest {}

message GuildShopItemView {
  int64 item_template_id = 1;    // tên tra catalog vật phẩm
  int64 contribution_cost = 2;
  int32 required_guild_level = 3;
}

// Response: Server -> Client (OPCODE_LIST_GUILD_SHOP_RESPONSE = 724).
message ListGuildShopResponse {
  repeated GuildShopItemView items = 1;
  bool in_guild = 2;
  int32 guild_level = 3;
  int64 contribution_available = 4;
}

// Command: Client -> Server (OPCODE_BUY_GUILD_SHOP_ITEM_COMMAND = 725).
message BuyGuildShopItemCommand {
  int64 item_template_id = 1;
}

enum BuyGuildShopItemOutcome {
  BUY_GUILD_SHOP_ITEM_OUTCOME_UNSPECIFIED = 0;
  BUY_GUILD_SHOP_ITEM_OUTCOME_OK = 1;
  BUY_GUILD_SHOP_ITEM_OUTCOME_NOT_IN_GUILD = 2;
  BUY_GUILD_SHOP_ITEM_OUTCOME_UNKNOWN_ITEM = 3;
  BUY_GUILD_SHOP_ITEM_OUTCOME_GUILD_LEVEL_TOO_LOW = 4;
  BUY_GUILD_SHOP_ITEM_OUTCOME_NOT_ENOUGH_CONTRIBUTION = 5;
  BUY_GUILD_SHOP_ITEM_OUTCOME_BAG_FULL = 6;
}

// Response: Server -> Client (OPCODE_BUY_GUILD_SHOP_ITEM_RESPONSE = 726). shop luôn là trạng thái MỚI NHẤT.
message BuyGuildShopItemResponse {
  BuyGuildShopItemOutcome outcome = 1;
  ListGuildShopResponse shop = 2;
}

// ===== ADR-085 — kỹ năng bang: buff thụ động cho mọi thành viên, bang chủ nâng bằng điểm (cấp bang × 2). =====

// Request: Client -> Server (OPCODE_LIST_GUILD_SKILLS_REQUEST = 727).
message ListGuildSkillsRequest {}

message GuildSkillView {
  string code = 1;      // insight | vitality | bulwark — khoá i18n guildskill.name.<code>
  int32 rank = 2;
  int32 max_rank = 3;
  int32 per_rank = 4;   // hiệu lực mỗi bậc (% EXP với insight, điểm chỉ số với hai kỹ năng kia)
}

// Response: Server -> Client (OPCODE_LIST_GUILD_SKILLS_RESPONSE = 728).
message ListGuildSkillsResponse {
  repeated GuildSkillView skills = 1;
  bool in_guild = 2;
  bool leader = 3;
  int32 points_total = 4;
  int32 points_available = 5;
}

// Command: Client -> Server (OPCODE_UPGRADE_GUILD_SKILL_COMMAND = 729). Chỉ bang chủ.
message UpgradeGuildSkillCommand {
  string code = 1;
}

enum UpgradeGuildSkillOutcome {
  UPGRADE_GUILD_SKILL_OUTCOME_UNSPECIFIED = 0;
  UPGRADE_GUILD_SKILL_OUTCOME_OK = 1;
  UPGRADE_GUILD_SKILL_OUTCOME_NOT_IN_GUILD = 2;
  UPGRADE_GUILD_SKILL_OUTCOME_NOT_LEADER = 3;
  UPGRADE_GUILD_SKILL_OUTCOME_MAX_RANK = 4;
  UPGRADE_GUILD_SKILL_OUTCOME_NO_POINTS = 5;
  UPGRADE_GUILD_SKILL_OUTCOME_UNKNOWN_SKILL = 6;
}

// Response: Server -> Client (OPCODE_UPGRADE_GUILD_SKILL_RESPONSE = 730). sheet luôn là trạng thái MỚI NHẤT.
message UpgradeGuildSkillResponse {
  UpgradeGuildSkillOutcome outcome = 1;
  ListGuildSkillsResponse sheet = 2;
}

// ===== ADR-090 — Tranh đoạt Linh Mạch (bản đầu). CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_SPIRIT_VEIN_STATUS_REQUEST = 731).
message GetSpiritVeinStatusRequest {}

// Điểm một bang trong khung đang mở.
message SpiritVeinScoreView {
  string guild_name = 1;
  int32 points = 2;
}

message SpiritVeinView {
  string code = 1;
  string name_key = 2;                 // khoá i18n tên Linh Mạch
  float min_x = 3;                     // dải X trên world chính tính là "trong Linh Mạch"
  float max_x = 4;
  bool active = 5;                     // khung tranh đoạt đang mở
  int64 seconds_until_change = 6;      // active: tới lúc đóng; không: tới lúc mở khung sau
  string holder_guild_name = 7;        // rỗng = chưa bang nào giữ
  int64 held_until_epoch_seconds = 8;  // 0 khi không ai giữ
  repeated SpiritVeinScoreView scores = 9;  // chỉ khi active, xếp theo điểm giảm dần
}

// Response: Server -> Client (OPCODE_GET_SPIRIT_VEIN_STATUS_RESPONSE = 732).
message GetSpiritVeinStatusResponse {
  repeated SpiritVeinView veins = 1;
}

// ===== ADR-102 — Bang chiến. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_DECLARE_GUILD_WAR_COMMAND = 733). Chỉ bang chủ; tốn vàng của bang chủ.
message DeclareGuildWarCommand {
  string target_guild_name = 1;
}

enum DeclareGuildWarOutcome {
  DECLARE_GUILD_WAR_OUTCOME_UNSPECIFIED = 0;
  DECLARE_GUILD_WAR_OUTCOME_OK = 1;
  DECLARE_GUILD_WAR_OUTCOME_NOT_IN_GUILD = 2;
  DECLARE_GUILD_WAR_OUTCOME_NOT_LEADER = 3;
  DECLARE_GUILD_WAR_OUTCOME_UNKNOWN_GUILD = 4;
  DECLARE_GUILD_WAR_OUTCOME_SAME_GUILD = 5;
  DECLARE_GUILD_WAR_OUTCOME_ALREADY_AT_WAR = 6;   // một trong hai bang đang có trận chờ/đang đánh
  DECLARE_GUILD_WAR_OUTCOME_COOLDOWN = 7;         // cặp này vừa đánh xong chưa đủ 24 giờ
  DECLARE_GUILD_WAR_OUTCOME_INSUFFICIENT_GOLD = 8;
}

// Response: Server -> Client (OPCODE_DECLARE_GUILD_WAR_RESPONSE = 734).
message DeclareGuildWarResponse {
  DeclareGuildWarOutcome outcome = 1;
  int64 cost_gold = 2;   // giá tuyên chiến (để client hiện, server mới là nơi trừ)
}

// Request: Client -> Server (OPCODE_GET_GUILD_WAR_STATUS_REQUEST = 735).
message GetGuildWarStatusRequest {}

message GuildWarView {
  string attacker_guild_name = 1;
  string defender_guild_name = 2;
  int32 attacker_kills = 3;
  int32 defender_kills = 4;
  bool active = 5;                  // đang trong giờ đánh
  int64 seconds_until_change = 6;   // active: tới lúc hết giờ; không: tới lúc bắt đầu
  bool mine = 7;                    // bang của người hỏi là một trong hai phe
}

// Response: Server -> Client (OPCODE_GET_GUILD_WAR_STATUS_RESPONSE = 736). Mọi trận chưa chốt trên server.
message GetGuildWarStatusResponse {
  repeated GuildWarView wars = 1;
  int64 declare_cost_gold = 2;
}

// ===== ADR-112 — đấu giá bang: lô từ boss Bí Cảnh, 30 phút, vàng giữ chỗ, chốt nguyên tử. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_GUILD_AUCTIONS_REQUEST = 737).
message ListGuildAuctionsRequest {}

// Một lô còn mở của bang người hỏi.
message GuildAuctionLotView {
  int64 lot_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int64 current_bid = 4;           // 0 = chưa ai trả
  string leader_name = 5;          // rỗng = chưa ai trả
  bool leading_is_me = 6;
  int64 seconds_left = 7;
  int64 minimum_bid = 8;           // mức thấp nhất được trả lúc này (server tính)
  int32 participants = 9;          // số người chia tiền khi chốt
}

// Response: Server -> Client (OPCODE_LIST_GUILD_AUCTIONS_RESPONSE = 738).
message ListGuildAuctionsResponse {
  repeated GuildAuctionLotView lots = 1;
}

// Command: Client -> Server (OPCODE_BID_GUILD_AUCTION_COMMAND = 739). Trả giá bằng vàng của chính mình; bị trả vượt thì
// hoàn qua thư.
message BidGuildAuctionCommand {
  int64 lot_id = 1;
  int64 amount = 2;
}

enum BidGuildAuctionOutcome {
  BID_GUILD_AUCTION_OUTCOME_UNSPECIFIED = 0;
  BID_GUILD_AUCTION_OUTCOME_OK = 1;
  BID_GUILD_AUCTION_OUTCOME_NOT_FOUND = 2;          // không có lô này trong bang của bạn
  BID_GUILD_AUCTION_OUTCOME_CLOSED = 3;
  BID_GUILD_AUCTION_OUTCOME_TOO_LOW = 4;
  BID_GUILD_AUCTION_OUTCOME_ALREADY_LEADING = 5;
  BID_GUILD_AUCTION_OUTCOME_INSUFFICIENT_GOLD = 6;
}

// Response: Server -> Client (OPCODE_BID_GUILD_AUCTION_RESPONSE = 740). status là danh sách sau lần trả.
message BidGuildAuctionResponse {
  BidGuildAuctionOutcome outcome = 1;
  ListGuildAuctionsResponse status = 2;
}

// Command: Client -> Server (OPCODE_RENAME_GUILD_COMMAND = 741) — ADR-172. Chỉ bang chủ; tốn vàng của bang chủ.
message RenameGuildCommand {
  string new_name = 1;
}

enum RenameGuildOutcome {
  RENAME_GUILD_OUTCOME_UNSPECIFIED = 0;
  RENAME_GUILD_OUTCOME_OK = 1;
  RENAME_GUILD_OUTCOME_NOT_IN_GUILD = 2;
  RENAME_GUILD_OUTCOME_NOT_LEADER = 3;
  RENAME_GUILD_OUTCOME_INVALID_NAME = 4;
  RENAME_GUILD_OUTCOME_NAME_TAKEN = 5;
  RENAME_GUILD_OUTCOME_ON_COOLDOWN = 6;
  RENAME_GUILD_OUTCOME_NOT_ENOUGH_GOLD = 7;
}

// Response: Server -> Client (OPCODE_RENAME_GUILD_RESPONSE = 742).
message RenameGuildResponse {
  RenameGuildOutcome outcome = 1;
  string name = 2;
  int64 next_allowed_at_epoch_ms = 3;  // OK / ON_COOLDOWN: lúc được đổi lần sau
  int64 fee = 4;
}

// ===== ADR-179 — thông báo bang. CHỈ THÊM. Bang chủ ghi một dòng; thành viên thấy trong GetMyGuildResponse.notice.

// Command: Client -> Server (OPCODE_SET_GUILD_NOTICE_COMMAND = 743). notice rỗng = xoá. Tối đa 100 ký tự.
message SetGuildNoticeCommand {
  string notice = 1;
}

enum SetGuildNoticeOutcome {
  SET_GUILD_NOTICE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SET_GUILD_NOTICE_OUTCOME_OK = 1;
  SET_GUILD_NOTICE_OUTCOME_NOT_IN_GUILD = 2;
  SET_GUILD_NOTICE_OUTCOME_NOT_LEADER = 3;
  SET_GUILD_NOTICE_OUTCOME_TOO_LONG = 4;
  SET_GUILD_NOTICE_OUTCOME_BANNED_WORD = 5; // cùng bộ lọc từ cấm của chat
}

// Response: Server -> Client (OPCODE_SET_GUILD_NOTICE_RESPONSE = 744).
message SetGuildNoticeResponse {
  SetGuildNoticeOutcome outcome = 1;
  string notice = 2; // thông báo ĐÃ chuẩn hoá vừa lưu (khi OK)
}

// ===== ADR-180 — nhật ký bang. CHỈ THÊM. 50 dòng gần nhất (giữ 90 ngày) của bang người hỏi đang ở; mọi thành viên xem.

// Request: Client -> Server (OPCODE_GET_GUILD_LOG_REQUEST = 745). Người hỏi lấy từ session.
message GetGuildLogRequest {}

enum GuildLogKind {
  GUILD_LOG_KIND_UNSPECIFIED = 0;
  GUILD_LOG_KIND_CREATED = 1;
  GUILD_LOG_KIND_JOINED = 2;         // actor = bang chủ duyệt, subject = người vào
  GUILD_LOG_KIND_LEFT = 3;
  GUILD_LOG_KIND_KICKED = 4;         // actor = bang chủ, subject = người bị đuổi
  GUILD_LOG_KIND_DONATED = 5;        // amount = vàng góp
  GUILD_LOG_KIND_LEVEL_UP = 6;       // amount = cấp mới; actor = người góp đẩy lên cấp
  GUILD_LOG_KIND_RENAMED = 7;        // detail = tên mới
  GUILD_LOG_KIND_NOTICE_CHANGED = 8;
  GUILD_LOG_KIND_LEADER_CHANGED = 9; // ADR-183 — actor = bang chủ cũ, subject = bang chủ mới
  GUILD_LOG_KIND_VICE_APPOINTED = 10; // ADR-184 — actor = bang chủ, subject = phó mới
  GUILD_LOG_KIND_VICE_DISMISSED = 11;
  GUILD_LOG_KIND_BANK_DEPOSIT = 12;   // ADR-198 — actor gửi kho bang; amount = số lượng, detail = mã vật phẩm
  GUILD_LOG_KIND_BANK_WITHDRAW = 13;  // ADR-198 — actor rút kho bang
  GUILD_LOG_KIND_ITEM_DONATED = 14;   // ADR-207 — actor góp vật phẩm; amount = số lượng, detail = mã vật phẩm
}

message GuildLogEntry {
  GuildLogKind kind = 1;
  string actor_name = 2;   // "" = không có / nhân vật không còn
  string subject_name = 3;
  int64 amount = 4;
  string detail = 5;
  int64 at_epoch_seconds = 6;
}

// Response: Server -> Client (OPCODE_GET_GUILD_LOG_RESPONSE = 746). Mới nhất trước; rỗng nếu không ở bang nào.
message GetGuildLogResponse {
  repeated GuildLogEntry entries = 1;
}

// ===== ADR-183 — nhường chức bang chủ. CHỈ THÊM. Bang chủ cũ thành thành viên thường; cả bang nhận 720 LEADER_CHANGED.

// Command: Client -> Server (OPCODE_TRANSFER_GUILD_LEADER_COMMAND = 747). Theo TÊN người nhận.
message TransferGuildLeaderCommand {
  string target_name = 1;
}

enum TransferGuildLeaderOutcome {
  TRANSFER_GUILD_LEADER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  TRANSFER_GUILD_LEADER_OUTCOME_OK = 1;
  TRANSFER_GUILD_LEADER_OUTCOME_NOT_IN_GUILD = 2;
  TRANSFER_GUILD_LEADER_OUTCOME_NOT_LEADER = 3;
  TRANSFER_GUILD_LEADER_OUTCOME_TARGET_NOT_IN_GUILD = 4; // không tìm thấy, hoặc không cùng bang
  TRANSFER_GUILD_LEADER_OUTCOME_CANNOT_TRANSFER_TO_SELF = 5;
}

// Response: Server -> Client (OPCODE_TRANSFER_GUILD_LEADER_RESPONSE = 748).
message TransferGuildLeaderResponse {
  TransferGuildLeaderOutcome outcome = 1;
  string target_name = 2;
}

// ===== ADR-184 — phó bang chủ. CHỈ THÊM. Tối đa 2; duyệt/từ chối đơn + đăng thông báo, không đuổi/giải tán/đổi tên.

// Command: Client -> Server (OPCODE_SET_GUILD_VICE_LEADER_COMMAND = 749). Chỉ bang chủ. appoint=false = bãi nhiệm.
message SetGuildViceLeaderCommand {
  string target_name = 1;
  bool appoint = 2;
}

enum SetGuildViceLeaderOutcome {
  SET_GUILD_VICE_LEADER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SET_GUILD_VICE_LEADER_OUTCOME_OK = 1;
  SET_GUILD_VICE_LEADER_OUTCOME_NOT_IN_GUILD = 2;
  SET_GUILD_VICE_LEADER_OUTCOME_NOT_LEADER = 3;
  SET_GUILD_VICE_LEADER_OUTCOME_TARGET_NOT_IN_GUILD = 4;
  SET_GUILD_VICE_LEADER_OUTCOME_ALREADY_VICE = 5;
  SET_GUILD_VICE_LEADER_OUTCOME_NOT_VICE = 6;
  SET_GUILD_VICE_LEADER_OUTCOME_VICE_LIMIT_REACHED = 7;
}

// Response: Server -> Client (OPCODE_SET_GUILD_VICE_LEADER_RESPONSE = 750).
message SetGuildViceLeaderResponse {
  SetGuildViceLeaderOutcome outcome = 1;
  string target_name = 2;
  bool appoint = 3;
}

// ===== ADR-185 — bảng chiêu mộ bang. CHỈ THÊM. Bang chủ / phó treo lời chiêu mộ; người chưa có bang xem và gửi đơn
// bằng SendGuildJoinRequestCommand như cũ (server kiểm cấp tối thiểu ⇒ LEVEL_TOO_LOW).

// Command: Client -> Server (OPCODE_POST_GUILD_RECRUITMENT_COMMAND = 751). open=false = gỡ chiêu mộ.
message PostGuildRecruitmentCommand {
  bool open = 1;
  int32 min_level = 2; // kẹp 1..100
  string message = 3;  // tối đa 80 ký tự, một dòng, qua bộ lọc từ cấm của chat
}

enum PostGuildRecruitmentOutcome {
  POST_GUILD_RECRUITMENT_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  POST_GUILD_RECRUITMENT_OUTCOME_OK = 1;
  POST_GUILD_RECRUITMENT_OUTCOME_NOT_IN_GUILD = 2;
  POST_GUILD_RECRUITMENT_OUTCOME_NOT_ALLOWED = 3; // không phải bang chủ / phó bang chủ
  POST_GUILD_RECRUITMENT_OUTCOME_TOO_LONG = 4;
  POST_GUILD_RECRUITMENT_OUTCOME_BANNED_WORD = 5;
}

// Response: Server -> Client (OPCODE_POST_GUILD_RECRUITMENT_RESPONSE = 752).
message PostGuildRecruitmentResponse {
  PostGuildRecruitmentOutcome outcome = 1;
  bool open = 2;
}

// Request: Client -> Server (OPCODE_LIST_GUILD_RECRUITMENT_REQUEST = 753).
message ListGuildRecruitmentRequest {}

message GuildRecruitmentView {
  string guild_name = 1;
  int32 guild_level = 2;
  int32 members = 3;
  int32 max_members = 4;
  int32 min_level = 5;
  string message = 6;
}

// Response: Server -> Client (OPCODE_LIST_GUILD_RECRUITMENT_RESPONSE = 754). Cấp bang giảm dần, tối đa 50 dòng.
message ListGuildRecruitmentResponse {
  repeated GuildRecruitmentView entries = 1;
}

// ===== ADR-186 — điểm danh bang. CHỈ THÊM. Một lần mỗi nhân vật mỗi ngày (giờ Việt Nam): +100 cống hiến cho mình,
// +100 kinh nghiệm cho bang (bang lên cấp ⇒ cả bang nhận 720 LEVEL_UP như góp bang).

// Command: Client -> Server (OPCODE_GUILD_CHECK_IN_COMMAND = 755).
message GuildCheckInCommand {}

enum GuildCheckInOutcome {
  GUILD_CHECK_IN_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  GUILD_CHECK_IN_OUTCOME_OK = 1;
  GUILD_CHECK_IN_OUTCOME_NOT_IN_GUILD = 2;
  GUILD_CHECK_IN_OUTCOME_ALREADY_CHECKED_IN = 3;
}

// Response: Server -> Client (OPCODE_GUILD_CHECK_IN_RESPONSE = 756).
message GuildCheckInResponse {
  GuildCheckInOutcome outcome = 1;
  int64 contribution = 2; // cống hiến vừa cộng (0 nếu không OK)
  int64 guild_exp = 3;    // kinh nghiệm bang vừa cộng
  int32 today_count = 4;  // số người của bang đã điểm danh hôm nay (kể cả mình)
}

// ADR-207 (2026-11-07) — góp vật phẩm cho bang. Command: Client -> Server (OPCODE_DONATE_ITEM_TO_GUILD_COMMAND).
// Món biến mất; bang nhận kinh nghiệm và người góp nhận cống hiến bằng giá thu của Tàng Bảo Các × số lượng.
message DonateItemToGuildCommand {
  int64 inventory_item_id = 1;
  int32 quantity = 2;
}

enum DonateItemToGuildOutcome {
  DONATE_ITEM_TO_GUILD_OUTCOME_UNSPECIFIED = 0;
  DONATE_ITEM_TO_GUILD_OUTCOME_OK = 1;
  DONATE_ITEM_TO_GUILD_OUTCOME_NOT_IN_GUILD = 2;
  // Không có trong túi, đang mặc/khoá/cường hoá/khảm/đang chào giao dịch, hoặc Tàng Bảo Các không thu.
  DONATE_ITEM_TO_GUILD_OUTCOME_NOT_DONATABLE = 3;
  DONATE_ITEM_TO_GUILD_OUTCOME_INSUFFICIENT_QUANTITY = 4;
  DONATE_ITEM_TO_GUILD_OUTCOME_INVALID_QUANTITY = 5;
}

// Response: Server -> Client (OPCODE_DONATE_ITEM_TO_GUILD_RESPONSE).
message DonateItemToGuildResponse {
  DonateItemToGuildOutcome outcome = 1;
  int64 contribution = 2;     // cống hiến nhận được (= kinh nghiệm bang nhận được); 0 nếu không OK
  bool guild_leveled_up = 3;
}

// ADR-208 (2026-11-07) — lịch sử bang chiến. Request: Client -> Server (OPCODE_GET_GUILD_WAR_HISTORY_REQUEST).
message GetGuildWarHistoryRequest {}

enum GuildWarResult {
  GUILD_WAR_RESULT_UNSPECIFIED = 0;
  GUILD_WAR_RESULT_WIN = 1;
  GUILD_WAR_RESULT_LOSS = 2;
  GUILD_WAR_RESULT_DRAW = 3;
}

// Một trận đã chốt, nhìn từ phía bang người hỏi.
message GuildWarHistoryEntry {
  string opponent_guild_name = 1;
  bool declared_by_us = 2;
  int32 our_kills = 3;
  int32 their_kills = 4;
  GuildWarResult result = 5;
  int64 ended_epoch_seconds = 6;
}

// Response: Server -> Client (OPCODE_GET_GUILD_WAR_HISTORY_RESPONSE). Tối đa 20 trận gần nhất, mới nhất trước; rỗng nếu
// không ở bang nào hoặc bang chưa đánh trận nào.
message GetGuildWarHistoryResponse {
  repeated GuildWarHistoryEntry entries = 1;
}

// ADR-219 (2026-11-08) — mời thẳng vào bang. Command: Client -> Server (OPCODE_INVITE_TO_GUILD_COMMAND).
// Chỉ bang chủ / phó bang chủ; người được mời phải đang online. Lời mời sống 5 phút trong RAM server.
message InviteToGuildCommand {
  string target_name = 1;
}

enum InviteToGuildOutcome {
  INVITE_TO_GUILD_OUTCOME_UNSPECIFIED = 0;
  INVITE_TO_GUILD_OUTCOME_OK = 1;
  INVITE_TO_GUILD_OUTCOME_NOT_AUTHORIZED = 2;   // không ở bang, hoặc không phải bang chủ / phó
  INVITE_TO_GUILD_OUTCOME_TARGET_NOT_FOUND = 3; // không có tên đó, hoặc đang offline
  INVITE_TO_GUILD_OUTCOME_TARGET_IN_GUILD = 4;  // đã ở một bang (hoặc tự mời mình)
}

// Response: Server -> Client (OPCODE_INVITE_TO_GUILD_RESPONSE).
message InviteToGuildResponse {
  InviteToGuildOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_GUILD_INVITE_EVENT) — tới người được mời.
message GuildInviteEvent {
  string guild_name = 1;
  string inviter_name = 2;
}

// Command: Client -> Server (OPCODE_RESPOND_GUILD_INVITE_COMMAND) — trả lời lời mời đang treo của chính mình.
message RespondGuildInviteCommand {
  bool accept = 1;
}

enum RespondGuildInviteOutcome {
  RESPOND_GUILD_INVITE_OUTCOME_UNSPECIFIED = 0;
  RESPOND_GUILD_INVITE_OUTCOME_JOINED = 1;
  RESPOND_GUILD_INVITE_OUTCOME_DECLINED = 2;
  RESPOND_GUILD_INVITE_OUTCOME_NO_INVITE = 3;        // không có / hết hạn / người mời mất quyền
  RESPOND_GUILD_INVITE_OUTCOME_GUILD_FULL = 4;
  RESPOND_GUILD_INVITE_OUTCOME_ALREADY_IN_GUILD = 5;
}

// Response: Server -> Client (OPCODE_RESPOND_GUILD_INVITE_RESPONSE).
message RespondGuildInviteResponse {
  RespondGuildInviteOutcome outcome = 1;
  string guild_name = 2;
}

// ADR-235 (2026-11-08) — thư toàn bang. Command: Client -> Server (OPCODE_SEND_GUILD_MAIL_COMMAND). Bang chủ / phó.
message SendGuildMailCommand {
  string subject = 1;
  string body = 2;
}

enum SendGuildMailOutcome {
  SEND_GUILD_MAIL_OUTCOME_UNSPECIFIED = 0;
  SEND_GUILD_MAIL_OUTCOME_OK = 1;
  SEND_GUILD_MAIL_OUTCOME_NOT_IN_GUILD = 2;
  SEND_GUILD_MAIL_OUTCOME_NOT_OFFICER = 3;
  SEND_GUILD_MAIL_OUTCOME_DAILY_LIMIT = 4;
  SEND_GUILD_MAIL_OUTCOME_INVALID_CONTENT = 5;  // trống / quá dài / từ cấm, hoặc bang không còn ai khác
}

// Response: Server -> Client (OPCODE_SEND_GUILD_MAIL_RESPONSE).
message SendGuildMailResponse {
  SendGuildMailOutcome outcome = 1;
  int32 recipients = 2;       // số thành viên nhận được thư
  int32 remaining_today = 3;  // số đợt bang còn gửi được hôm nay
}
