syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Inventory / Equipment (NETWORK.md §4, dải 500-599). Phase 5 lát cắt 1 "mặc đồ"
// (feature-inventory/CLAUDE.md, DATABASE.md §2.2) thêm EquipItemCommand/UnequipItemCommand —
// item_id là inventory_item.id THẬT (feature-inventory: Inventory/ItemStack giờ có ID ổn định).

// Event: Server -> Client (OPCODE_ITEM_GRANTED_EVENT). Item THẬT SỰ đã cộng vào túi đồ (đã qua
// kiểm tra túi đầy ở feature-inventory) — KHÔNG phải "quái rơi gì", chỉ gửi khi thêm thành công.
// item_template_id (không phải code) — client CHƯA có catalog item để tra tên/icon (Phase 5 thật),
// gửi ID thật khớp cột item_template.id, giống CharacterSpawnedEvent gửi characterId thay vì tên.
message ItemGrantedEvent {
  int64 item_template_id = 1;
  int32 quantity = 2;
  int64 item_id = 3; // inventory_item.id THẬT — client cần để tham chiếu lúc mặc đồ (EquipItemCommand)
}

// 7 slot trang bị (DATABASE.md §2.2) — khớp dev.kage.inventory.domain.EquipmentSlotType.
enum EquipmentSlot {
  EQUIPMENT_SLOT_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho lệnh thật.
  EQUIPMENT_SLOT_WEAPON = 1;
  EQUIPMENT_SLOT_ARMOR = 2;
  EQUIPMENT_SLOT_HELMET = 3;
  EQUIPMENT_SLOT_GLOVE = 4;
  EQUIPMENT_SLOT_BOOT = 5;
  EQUIPMENT_SLOT_ACCESSORY_1 = 6;
  EQUIPMENT_SLOT_ACCESSORY_2 = 7;
}

// Command: Client -> Server (OPCODE_EQUIP_ITEM_COMMAND). Mặc item_id (ID thật, KHÔNG phải vị trí
// trong túi) vào slot — server tự kiểm tra item thuộc đúng nhân vật + đúng loại slot, KHÔNG tin
// client (Điều 24).
message EquipItemCommand {
  int64 item_id = 1;
  EquipmentSlot slot = 2;
}

// Response: Server -> Client (OPCODE_EQUIP_ITEM_RESPONSE).
message EquipItemResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107)
}

// Command: Client -> Server (OPCODE_UNEQUIP_ITEM_COMMAND). Gỡ trang bị khỏi slot — item vẫn còn
// trong túi đồ, không bị xoá.
message UnequipItemCommand {
  EquipmentSlot slot = 1;
}

// Response: Server -> Client (OPCODE_UNEQUIP_ITEM_RESPONSE).
message UnequipItemResponse {
  bool success = 1;
  string error_key = 2;
}

// Cường hoá (GAMEPLAY.md §7.1, Phase 5 lát cắt 5) có NHIỀU hơn 2 kết quả có ý nghĩa khác nhau với
// client (VD FAILED_DROPPED phải báo "mất 1 cấp!" khác hẳn FAILED_NO_DROP) — không đủ diễn tả bằng
// bool success + error_key như Equip/Unequip, nên dùng enum riêng thay vì tái dùng pattern đó.
enum EnhanceOutcome {
  ENHANCE_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  ENHANCE_OUTCOME_SUCCESS = 1;
  ENHANCE_OUTCOME_FAILED_NO_DROP = 2; // thất bại, KHÔNG mất cấp (dưới +10)
  ENHANCE_OUTCOME_FAILED_DROPPED = 3; // thất bại, RỚT 1 cấp (từ +10, không dùng/không có Bảo Vệ)
  ENHANCE_OUTCOME_ITEM_NOT_FOUND = 4;
  ENHANCE_OUTCOME_MAX_LEVEL = 5; // đã +15, không cường hoá thêm được
  ENHANCE_OUTCOME_INSUFFICIENT_GOLD = 6;
  ENHANCE_OUTCOME_FAILED_PROTECTED = 7; // thất bại từ +10, Bảo Vệ đã tiêu để chặn rớt cấp (§7.1)
  ENHANCE_OUTCOME_DUPLICATE_REQUEST = 8; // ADR-025: idempotency_key đã dùng trước đó (client tự retry)
}

// Command: Client -> Server (OPCODE_ENHANCE_ITEM_COMMAND). item_id là inventory_item.id THẬT
// (không phải vị trí) — server tự tính chi phí/tỉ lệ theo enhance_level hiện tại của item, KHÔNG
// tin số liệu từ client (Điều 24, GAMEPLAY.md §7.1). use_protection: người chơi CHỦ ĐỘNG chọn có
// tiêu "Bảo Vệ" hay không mỗi lần gọi — server chỉ thật sự tiêu khi roll THẤT BẠI ở +10 trở lên VÀ
// còn Bảo Vệ trong túi, không tiêu nếu thành công hoặc thất bại dưới +10 dù cờ này = true.
// idempotency_key (ADR-025, thêm 2026-08-02 — retrofit, cường hoá trừ gold thật giống BuyItemCommand
// nhưng chưa enforce lúc code lát cắt gốc): UUID v4 client tự sinh, giữ nguyên khi tự retry cùng 1
// lần cường hoá — server enforce unique ở bảng idempotency_key trong CÙNG transaction với hiệu ứng
// thật (trừ gold + đổi enhance_level), xem BuyItemCommand (shop.proto) cho pattern gốc.
message EnhanceItemCommand {
  int64 item_id = 1;
  bool use_protection = 2;
  string idempotency_key = 3;
}

// Response: Server -> Client (OPCODE_ENHANCE_ITEM_RESPONSE).
message EnhanceItemResponse {
  EnhanceOutcome outcome = 1;
}
