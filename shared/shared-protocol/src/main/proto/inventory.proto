syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Inventory / Equipment (NETWORK.md §4, dải 500-599). Phase 5 lát cắt 1 "mặc đồ"
// (feature-inventory/CLAUDE.md, DATABASE.md §2.2) thêm EquipItemCommand/UnequipItemCommand —
// item_id là inventory_item.id THẬT (feature-inventory: Inventory/ItemStack giờ có ID ổn định).

// Event: Server -> Client (OPCODE_ITEM_GRANTED_EVENT). Item THẬT SỰ đã cộng vào túi đồ (đã qua
// kiểm tra túi đầy ở feature-inventory) — KHÔNG phải "quái rơi gì", chỉ gửi khi thêm thành công.
// item_template_id (không phải code) — client CHƯA có catalog item để tra tên/icon (Phase 5 thật),
// gửi ID thật khớp cột item_template.id, giống CharacterSpawnedEvent gửi characterId thay vì tên.
message ItemGrantedEvent {
  int64 item_template_id = 1;
  int32 quantity = 2;
  int64 item_id = 3; // inventory_item.id THẬT — client cần để tham chiếu lúc mặc đồ (EquipItemCommand)
}

// 7 slot trang bị (DATABASE.md §2.2) — khớp dev.kage.inventory.domain.EquipmentSlotType.
enum EquipmentSlot {
  EQUIPMENT_SLOT_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho lệnh thật.
  EQUIPMENT_SLOT_WEAPON = 1;
  EQUIPMENT_SLOT_ARMOR = 2;
  EQUIPMENT_SLOT_HELMET = 3;
  EQUIPMENT_SLOT_GLOVE = 4;
  EQUIPMENT_SLOT_BOOT = 5;
  EQUIPMENT_SLOT_ACCESSORY_1 = 6;
  EQUIPMENT_SLOT_ACCESSORY_2 = 7;
  EQUIPMENT_SLOT_MOUNT = 8; // ADR-070 — phi kiếm, chỉ tốc độ
  EQUIPMENT_SLOT_PET = 9;   // ADR-072 — linh thú
  EQUIPMENT_SLOT_ARTIFACT = 10;  // ADR-127 — pháp bảo
}

// Command: Client -> Server (OPCODE_EQUIP_ITEM_COMMAND). Mặc item_id (ID thật, KHÔNG phải vị trí
// trong túi) vào slot — server tự kiểm tra item thuộc đúng nhân vật + đúng loại slot, KHÔNG tin
// client (Điều 24).
message EquipItemCommand {
  int64 item_id = 1;
  EquipmentSlot slot = 2;
}

// Response: Server -> Client (OPCODE_EQUIP_ITEM_RESPONSE).
message EquipItemResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107)

  // ADR-043 — máu của CHÍNH mình sau khi đổi trang bị. Field THÊM, field cũ giữ nguyên,
  // `protocolVersion` KHÔNG tăng (luật additive NETWORK.md §6) — cùng tiền lệ ADR-036/041.
  //
  // Vì sao cần: `bonus_hp` nâng MÁU TỐI ĐA thật (ADR-036), server cập nhật `HealthComponent.max`
  // ngay trong tick mặc/gỡ đồ — nhưng trước field này KHÔNG gói nào chở con số mới về client,
  // nên thanh máu kẹt ở giá trị lúc VÀO WORLD cho tới lần hồi sinh ĐẦU TIÊN. Playtest
  // 2026-09-05: mặc trọn bộ `novice_*` (+18 máu) mà HUD vẫn `100 / 100`.
  //
  // `current_hp` KHÔNG ĐƯỢC ĐIỀN — luôn bằng 0 (quyết định chủ dự án 2026-10-14, README dòng 48).
  // Server có DỊCH máu hiện tại theo độ chênh của máu tối đa (mặc đồ +HP không phải nút hồi máu,
  // gỡ đồ không được giết người chơi), nhưng việc đó xảy ra trong tick World SAU khi response này đã
  // đi (ADR-043 D5 cách (a), không chờ tick) — nên con số đúng tới bằng `HealthChangedEvent` (opcode
  // 408, ADR-046), đường ống DUY NHẤT của máu hiện tại. Client phải bỏ qua field này; giữ số hiệu
  // field vì không được xoá/tái dùng (NETWORK.md §6).
  //
  // `max_hp` chỉ có nghĩa khi thao tác THÀNH CÔNG; thất bại thì bằng 0 và client phải bỏ qua
  // (`max_hp <= 0` ⇒ giữ nguyên giá trị đang có, không đoán — cùng khuôn server cũ chưa gửi field).
  int32 current_hp = 3;
  int32 max_hp = 4;
}

// Command: Client -> Server (OPCODE_UNEQUIP_ITEM_COMMAND). Gỡ trang bị khỏi slot — item vẫn còn
// trong túi đồ, không bị xoá.
message UnequipItemCommand {
  EquipmentSlot slot = 1;
}

// Response: Server -> Client (OPCODE_UNEQUIP_ITEM_RESPONSE).
message UnequipItemResponse {
  bool success = 1;
  string error_key = 2;

  // ADR-043 — máu của CHÍNH mình sau khi đổi trang bị. Field THÊM, field cũ giữ nguyên,
  // `protocolVersion` KHÔNG tăng (luật additive NETWORK.md §6) — cùng tiền lệ ADR-036/041.
  //
  // Vì sao cần: `bonus_hp` nâng MÁU TỐI ĐA thật (ADR-036), server cập nhật `HealthComponent.max`
  // ngay trong tick mặc/gỡ đồ — nhưng trước field này KHÔNG gói nào chở con số mới về client,
  // nên thanh máu kẹt ở giá trị lúc VÀO WORLD cho tới lần hồi sinh ĐẦU TIÊN. Playtest
  // 2026-09-05: mặc trọn bộ `novice_*` (+18 máu) mà HUD vẫn `100 / 100`.
  //
  // `current_hp` KHÔNG ĐƯỢC ĐIỀN — luôn bằng 0 (quyết định chủ dự án 2026-10-14, README dòng 48).
  // Server có DỊCH máu hiện tại theo độ chênh của máu tối đa (mặc đồ +HP không phải nút hồi máu,
  // gỡ đồ không được giết người chơi), nhưng việc đó xảy ra trong tick World SAU khi response này đã
  // đi (ADR-043 D5 cách (a), không chờ tick) — nên con số đúng tới bằng `HealthChangedEvent` (opcode
  // 408, ADR-046), đường ống DUY NHẤT của máu hiện tại. Client phải bỏ qua field này; giữ số hiệu
  // field vì không được xoá/tái dùng (NETWORK.md §6).
  //
  // `max_hp` chỉ có nghĩa khi thao tác THÀNH CÔNG; thất bại thì bằng 0 và client phải bỏ qua
  // (`max_hp <= 0` ⇒ giữ nguyên giá trị đang có, không đoán — cùng khuôn server cũ chưa gửi field).
  int32 current_hp = 3;
  int32 max_hp = 4;
}

// Cường hoá (GAMEPLAY.md §7.1, Phase 5 lát cắt 5) có NHIỀU hơn 2 kết quả có ý nghĩa khác nhau với
// client (VD FAILED_DROPPED phải báo "mất 1 cấp!" khác hẳn FAILED_NO_DROP) — không đủ diễn tả bằng
// bool success + error_key như Equip/Unequip, nên dùng enum riêng thay vì tái dùng pattern đó.
enum EnhanceOutcome {
  ENHANCE_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  ENHANCE_OUTCOME_SUCCESS = 1;
  ENHANCE_OUTCOME_FAILED_NO_DROP = 2; // thất bại, KHÔNG mất cấp (dưới +10)
  ENHANCE_OUTCOME_FAILED_DROPPED = 3; // thất bại, RỚT 1 cấp (từ +10, không dùng/không có Bảo Vệ)
  ENHANCE_OUTCOME_ITEM_NOT_FOUND = 4;
  ENHANCE_OUTCOME_MAX_LEVEL = 5; // đã +15, không cường hoá thêm được
  ENHANCE_OUTCOME_INSUFFICIENT_GOLD = 6;
  ENHANCE_OUTCOME_FAILED_PROTECTED = 7; // thất bại từ +10, Bảo Vệ đã tiêu để chặn rớt cấp (§7.1)
  ENHANCE_OUTCOME_DUPLICATE_REQUEST = 8; // ADR-025: idempotency_key đã dùng trước đó (client tự retry)
}

// Command: Client -> Server (OPCODE_ENHANCE_ITEM_COMMAND). item_id là inventory_item.id THẬT
// (không phải vị trí) — server tự tính chi phí/tỉ lệ theo enhance_level hiện tại của item, KHÔNG
// tin số liệu từ client (Điều 24, GAMEPLAY.md §7.1). use_protection: người chơi CHỦ ĐỘNG chọn có
// tiêu "Bảo Vệ" hay không mỗi lần gọi — server chỉ thật sự tiêu khi roll THẤT BẠI ở +10 trở lên VÀ
// còn Bảo Vệ trong túi, không tiêu nếu thành công hoặc thất bại dưới +10 dù cờ này = true.
// idempotency_key (ADR-025, thêm 2026-08-02 — retrofit, cường hoá trừ gold thật giống BuyItemCommand
// nhưng chưa enforce lúc code lát cắt gốc): UUID v4 client tự sinh, giữ nguyên khi tự retry cùng 1
// lần cường hoá — server enforce unique ở bảng idempotency_key trong CÙNG transaction với hiệu ứng
// thật (trừ gold + đổi enhance_level), xem BuyItemCommand (shop.proto) cho pattern gốc.
message EnhanceItemCommand {
  int64 item_id = 1;
  bool use_protection = 2;
  string idempotency_key = 3;
}

// Response: Server -> Client (OPCODE_ENHANCE_ITEM_RESPONSE).
message EnhanceItemResponse {
  EnhanceOutcome outcome = 1;

  // ADR-043 — máu của CHÍNH mình sau khi đổi trang bị. Field THÊM, field cũ giữ nguyên,
  // `protocolVersion` KHÔNG tăng (luật additive NETWORK.md §6) — cùng tiền lệ ADR-036/041.
  //
  // Vì sao cần: `bonus_hp` nâng MÁU TỐI ĐA thật (ADR-036), server cập nhật `HealthComponent.max`
  // ngay trong tick mặc/gỡ đồ — nhưng trước field này KHÔNG gói nào chở con số mới về client,
  // nên thanh máu kẹt ở giá trị lúc VÀO WORLD cho tới lần hồi sinh ĐẦU TIÊN. Playtest
  // 2026-09-05: mặc trọn bộ `novice_*` (+18 máu) mà HUD vẫn `100 / 100`.
  //
  // `current_hp` KHÔNG ĐƯỢC ĐIỀN — luôn bằng 0 (quyết định chủ dự án 2026-10-14, README dòng 48).
  // Server có DỊCH máu hiện tại theo độ chênh của máu tối đa (mặc đồ +HP không phải nút hồi máu,
  // gỡ đồ không được giết người chơi), nhưng việc đó xảy ra trong tick World SAU khi response này đã
  // đi (ADR-043 D5 cách (a), không chờ tick) — nên con số đúng tới bằng `HealthChangedEvent` (opcode
  // 408, ADR-046), đường ống DUY NHẤT của máu hiện tại. Client phải bỏ qua field này; giữ số hiệu
  // field vì không được xoá/tái dùng (NETWORK.md §6).
  //
  // `max_hp` chỉ có nghĩa khi thao tác THÀNH CÔNG; thất bại thì bằng 0 và client phải bỏ qua
  // (`max_hp <= 0` ⇒ giữ nguyên giá trị đang có, không đoán — cùng khuôn server cũ chưa gửi field).
  int32 current_hp = 2;
  int32 max_hp = 3;
}

// -----------------------------------------------------------------------------------------------
// ADR-035 (Accepted 2026-08-27) — lấp khoảng trống "client không có ảnh chụp túi đồ / catalog item".
// Phần dưới CHỈ THÊM: không message/field nào ở trên bị đổi, xoá hay đánh deprecated (NETWORK.md
// §6), protocolVersion KHÔNG tăng.
// -----------------------------------------------------------------------------------------------

// Command: Client -> Server (OPCODE_LIST_INVENTORY_REQUEST = 507). Không field — characterId lấy
// từ session (SECURITY.md §4, chống IDOR), cùng khuôn ListCharactersRequest.
message ListInventoryRequest {
}

// 1 dòng túi đồ. item_id là inventory_item.id THẬT — đây chính là thứ EquipItemCommand và
// SellItemCommand cần, và là lý do gốc phải có packet này.
message InventoryItemView {
  int64 item_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int32 enhance_level = 4;
  int32 slot_index = 5;
  int64 socket_gem_template_id = 6; // ADR-064 — item_template.id của Linh Ngọc đang khảm; 0 = chưa khảm
  bool locked = 7;                  // ADR-159 — người chơi đã khoá: không bán/giao dịch/gửi thư/gửi kho/phân giải được
}

// Response: Server -> Client (OPCODE_LIST_INVENTORY_RESPONSE = 508). Ảnh chụp TOÀN BỘ túi tại thời
// điểm hỏi. `capacity` là hằng số phía code (không phải cột DB — xem V4), gửi kèm để client vẽ đủ ô
// trống mà không phải tự đoán.
message ListInventoryResponse {
  repeated InventoryItemView items = 1;
  int32 capacity = 2;
  repeated EquippedSlotView equipped = 3; // slot nào đang mặc item_id nào
}

message EquippedSlotView {
  EquipmentSlot slot = 1;
  int64 item_id = 2;
}

// Vật phẩm này làm gì khi được DÙNG (ADR-046 D5) — khớp cột `item_template.use_effect` và enum
// Java `ItemUseEffect`. UNSPECIFIED = không dùng được, đúng trạng thái của mọi trang bị/nguyên liệu.
enum ItemUseEffect {
  ITEM_USE_EFFECT_UNSPECIFIED = 0;
  ITEM_USE_EFFECT_HEAL_HP = 1;
  ITEM_USE_EFFECT_EVOLVE_PET = 2; // ADR-078 — Linh Thú Đan: tiến hoá linh thú đang mặc
  ITEM_USE_EFFECT_EXPAND_BAG = 3; // ADR-088 — Túi Càn Khôn: túi đồ +use_value ô, tới trần 40
  ITEM_USE_EFFECT_DOUBLE_EXP = 4; // ADR-164 — Đan x2 kinh nghiệm: +use_value phút x2 EXP đánh quái, dồn tới trần
}

// 1 dòng catalog. KHÔNG mang tên hiển thị và KHÔNG mang icon: tên tra qua name_key trong bundle
// i18n phía client, icon tra qua code trong atlas (ADR-028). Server chỉ gửi thứ server sở hữu.
// Mang CẢ id lẫn code vì protocol hiện tham chiếu vật phẩm bằng cả hai kiểu (ItemGrantedEvent dùng
// id, ItemRewardView của quest.proto dùng code) — catalog phải tra được cả hai chiều.
message ItemCatalogEntry {
  int64 id = 1;
  string code = 2;
  string name_key = 3;
  int32 max_stack = 4;
  EquipmentSlot equip_slot = 5; // UNSPECIFIED = không mặc được (khớp equip_slot NULL trong DB)
  int32 bonus_atk = 6;
  // ADR-036 D5 — 4 field THÊM (7..10), field 1..6 giữ NGUYÊN, protocolVersion KHÔNG tăng
  // (luật additive NETWORK.md §6). Client cũ bỏ qua field lạ; client mới nói chuyện với server cũ
  // nhận 0/0/0/0 — mặc định proto3, hiện đúng cái nó biết thay vì bịa.
  //
  // Chỉ số ở đây là chỉ số GỐC của item_template, CHƯA nhân hệ số cường hoá của một món cụ thể —
  // catalog là dữ liệu TĨNH dùng chung mọi người chơi. Chỉ số hiệu dụng do SERVER tính
  // (ComputeEquipmentBonusUseCase + EnhancementTable.enhancedBonus), client không tự suy ra.
  int32 bonus_def = 7;
  int32 bonus_res = 8;
  int32 bonus_hp = 9;
  int32 required_level = 10; // cấp tối thiểu để MẶC được; 0 nghĩa là server cũ chưa gửi field này
  // ADR-046 D5 — 2 field THÊM (11..12), field 1..10 giữ NGUYÊN, protocolVersion KHÔNG tăng (cùng
  // luật additive NETWORK.md §6 mà ADR-036 D5 đã dùng cho 7..10).
  //
  // Vì sao client cần biết: không có hai field này, nút "Dùng" phải bày ra với MỌI món rồi chờ
  // server trả `error.item_not_usable` — và ô chi tiết không nói được "hồi 50 máu", con số duy
  // nhất khiến người chơi quyết định uống hay không. Client KHÔNG tự áp hiệu ứng: nó chỉ hiện, còn
  // máu vẫn do server tính và báo qua HealthChangedEvent (Điều 24).
  ItemUseEffect use_effect = 11; // UNSPECIFIED = không dùng được (khớp use_effect NULL trong DB)
  int32 use_value = 12; // độ lớn hiệu ứng — với HEAL_HP là số máu hồi
}

// Command: Client -> Server (OPCODE_GET_ITEM_CATALOG_REQUEST = 509). Client gửi version nó đang
// cache (rỗng nếu chưa có gì). Server so, khớp thì trả về rỗng và client dùng lại bản cũ.
message GetItemCatalogRequest {
  string known_version = 1;
}

// Response: Server -> Client (OPCODE_ITEM_CATALOG_RESPONSE = 510).
// unchanged=true  -> entries RỖNG, client giữ nguyên cache.
// unchanged=false -> entries là TOÀN BỘ catalog mới (thay hẳn, không cộng dồn).
message ItemCatalogResponse {
  bool unchanged = 1;
  string version = 2; // hash nội dung catalog; server tính, client chỉ lưu và gửi lại
  repeated ItemCatalogEntry entries = 3;
}

// -----------------------------------------------------------------------------------------------
// ADR-046 D5 (Accepted 2026-09-07) — dùng vật phẩm. Phần dưới CHỈ THÊM (NETWORK.md §6),
// protocolVersion KHÔNG tăng.
// -----------------------------------------------------------------------------------------------

// Command: Client -> Server (OPCODE_USE_ITEM_COMMAND = 512). `inventory_item_id` là
// `inventory_item.id` THẬT (không phải vị trí ô túi), cùng quy ước EnhanceItemCommand.
// characterId lấy từ SESSION — server tự kiểm món đó có thuộc về người gửi hay không (chống IDOR,
// SECURITY.md §4).
//
// KHÔNG có field "dùng bao nhiêu cái": mỗi lệnh tiêu ĐÚNG một cái. Cho client chọn số lượng là mở
// đường cho "uống 20 viên trong một gói" mà không đổi lấy gì — bấm 20 lần là 20 gói, và mỗi gói
// server đều kiểm lại.
message UseItemCommand {
  int64 inventory_item_id = 1;
}

// Response: Server -> Client (OPCODE_USE_ITEM_RESPONSE = 513).
//
// ⚠️ KHÔNG mang HP. `WorldFacade.inbox` là bất đồng bộ: đọc entity ngay sau khi xếp lệnh hồi máu
// vào hàng đợi sẽ ra số CŨ — đúng cái bẫy đã trả giá một lần ở ADR-043. Máu mới về client bằng
// HealthChangedEvent (opcode 408, combat.proto), và đó chính là lý do event đó tồn tại.
message UseItemResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107)
  int32 remaining_quantity = 3; // số cái CÒN LẠI trong ô túi sau khi dùng; 0 = ô đã biến mất
}

// ===== ADR-061 — kho đồ tông môn (gửi/rút chỉ khi đứng gần Tô Vân Nhi, server kiểm) =====

// 1 dòng kho. stored_item_id là storage_item.id THẬT — thứ WithdrawItemCommand cần. Id ĐỔI mỗi lần
// chuyển túi ↔ kho (dòng mới), cấp cường hoá giữ nguyên.
message StoredItemView {
  int64 stored_item_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int32 enhance_level = 4;
}

// Command: Client -> Server (OPCODE_LIST_STORAGE_REQUEST = 514). Không field — characterId từ session.
// Server cũng tự gửi ListStorageResponse khi lựa chọn hội thoại có action "open_storage".
message ListStorageRequest {
}

// Response: Server -> Client (OPCODE_LIST_STORAGE_RESPONSE = 515).
message ListStorageResponse {
  repeated StoredItemView items = 1;
  int32 capacity = 2; // hằng số StoragePolicy.CAPACITY, gửi kèm để client không đoán
}

enum StorageOutcome {
  STORAGE_OUTCOME_UNSPECIFIED = 0;
  STORAGE_OUTCOME_OK = 1;
  STORAGE_OUTCOME_NOT_FOUND = 2;        // món/dòng không thuộc về người gửi
  STORAGE_OUTCOME_INVALID_QUANTITY = 3;
  STORAGE_OUTCOME_EQUIPPED = 4;         // đang mặc — gỡ ra trước
  STORAGE_OUTCOME_ITEM_IN_TRADE = 5;    // phần muốn gửi đang chào trong giao dịch
  STORAGE_OUTCOME_STORAGE_FULL = 6;
  STORAGE_OUTCOME_BAG_FULL = 7;
  STORAGE_OUTCOME_TOO_FAR = 8;          // không đứng gần người giữ kho
  STORAGE_OUTCOME_SOCKETED = 9;         // ADR-064 — món đang khảm Linh Ngọc, kho chưa chở được ngọc
  STORAGE_OUTCOME_LOCKED = 10;          // ADR-159 — người chơi đã khoá món này
}

// Command: Client -> Server (OPCODE_DEPOSIT_ITEM_COMMAND = 516). inventory_item_id là id THẬT trong túi.
message DepositItemCommand {
  int64 inventory_item_id = 1;
  int32 quantity = 2;
}

// Response: Server -> Client (OPCODE_DEPOSIT_ITEM_RESPONSE = 517). Mang kho SAU lệnh; túi đồ client tự hỏi lại.
message DepositItemResponse {
  StorageOutcome outcome = 1;
  repeated StoredItemView items = 2;
  int32 capacity = 3;
}

// Command: Client -> Server (OPCODE_WITHDRAW_ITEM_COMMAND = 518).
message WithdrawItemCommand {
  int64 stored_item_id = 1;
  int32 quantity = 2;
}

// Response: Server -> Client (OPCODE_WITHDRAW_ITEM_RESPONSE = 519).
message WithdrawItemResponse {
  StorageOutcome outcome = 1;
  repeated StoredItemView items = 2;
  int32 capacity = 3;
}

// ===== ADR-064 — khảm Linh Ngọc =====

// Command: Client -> Server (OPCODE_SOCKET_GEM_COMMAND = 520). Cả hai id là inventory_item.id THẬT trong
// túi người gửi (món đích có thể đang mặc). Trừ vàng + random ⇒ bắt buộc idempotency_key (ADR-025).
message SocketGemCommand {
  int64 target_item_id = 1;
  int64 gem_item_id = 2;
  string idempotency_key = 3;
}

enum SocketGemOutcome {
  SOCKET_GEM_OUTCOME_UNSPECIFIED = 0;
  SOCKET_GEM_OUTCOME_SUCCESS = 1;
  SOCKET_GEM_OUTCOME_FAILED = 2;            // mất ngọc + phí, ô giữ nguyên; bảo hiểm +1
  SOCKET_GEM_OUTCOME_NOT_FOUND = 3;
  SOCKET_GEM_OUTCOME_NOT_EQUIPMENT = 4;
  SOCKET_GEM_OUTCOME_NOT_A_GEM = 5;
  SOCKET_GEM_OUTCOME_INSUFFICIENT_GOLD = 6;
  SOCKET_GEM_OUTCOME_DUPLICATE_REQUEST = 7;
}

// Response: Server -> Client (OPCODE_SOCKET_GEM_RESPONSE = 521). max_hp > 0 khi món đích đang mặc và chỉ số
// vừa đổi (cùng quy ước EnhanceItemResponse.max_hp); túi đồ client tự hỏi lại.
message SocketGemResponse {
  SocketGemOutcome outcome = 1;
  int32 failures_in_a_row = 2;   // số lần hỏng liên tiếp hiện tại
  int32 pity_after = 3;          // hỏng tới mốc này thì lần kế chắc chắn thành công
  int32 max_hp = 4;
}

// ===== ADR-097 — phân giải pháp khí: món ở 7 ô chiến đấu ⇒ linh thạch + Linh Thảo. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_DISMANTLE_ITEM_COMMAND = 522).
message DismantleItemCommand {
  int64 item_id = 1;   // inventory_item.id của chính mình
}

enum DismantleItemOutcome {
  DISMANTLE_ITEM_OUTCOME_UNSPECIFIED = 0;
  DISMANTLE_ITEM_OUTCOME_OK = 1;
  DISMANTLE_ITEM_OUTCOME_NOT_FOUND = 2;
  DISMANTLE_ITEM_OUTCOME_NOT_DISMANTLABLE = 3;   // không phải pháp khí 7 ô chiến đấu (phi kiếm, linh thú, vật phẩm thường)
  DISMANTLE_ITEM_OUTCOME_EQUIPPED = 4;
  DISMANTLE_ITEM_OUTCOME_SOCKETED = 5;           // đang khảm Linh Ngọc — gỡ trước
  DISMANTLE_ITEM_OUTCOME_ITEM_IN_TRADE = 6;
}

// Response: Server -> Client (OPCODE_DISMANTLE_ITEM_RESPONSE = 523).
message DismantleItemResponse {
  DismantleItemOutcome outcome = 1;
  int64 gold = 2;
  int32 herb_quantity = 3;
}

// ===== ADR-111 — tẩy luyện pháp khí: 1..3 dòng chỉ số phụ do server gieo, cộng phẳng. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_REFINEMENTS_REQUEST = 524).
message ListRefinementsRequest {}

// Một dòng chỉ số phụ. stat: "ATK" | "DEF" | "RES" | "HP".
message RefinementLineView {
  int32 index = 1;
  string stat = 2;
  int32 value = 3;
}

// Một món đang mặc ở ô có chỉ số (không phi kiếm, không linh thú) kèm các dòng (rỗng = chưa tẩy lần nào).
message RefinedItemView {
  int64 item_id = 1;
  int64 item_template_id = 2;
  string slot = 3;
  repeated RefinementLineView lines = 4;
}

// Response: Server -> Client (OPCODE_LIST_REFINEMENTS_RESPONSE = 525).
message ListRefinementsResponse {
  repeated RefinedItemView items = 1;
  int32 stones = 2;          // Tẩy Luyện Thạch đang có trong túi
  int32 stone_cost = 3;      // đá mỗi lần tẩy thường
  int32 locked_cost = 4;     // đá mỗi lần tẩy có khoá một dòng
}

// Command: Client -> Server (OPCODE_REFINE_ITEM_COMMAND = 526). item_id là inventory_item.id của chính mình;
// locked_line = -1 nghĩa là không khoá dòng nào.
message RefineItemCommand {
  int64 item_id = 1;
  int32 locked_line = 2;
}

enum RefineItemOutcome {
  REFINE_ITEM_OUTCOME_UNSPECIFIED = 0;
  REFINE_ITEM_OUTCOME_OK = 1;
  REFINE_ITEM_OUTCOME_NOT_FOUND = 2;
  REFINE_ITEM_OUTCOME_NOT_REFINABLE = 3;      // không đang mặc ở ô có chỉ số
  REFINE_ITEM_OUTCOME_NOT_ENOUGH_STONES = 4;
  REFINE_ITEM_OUTCOME_INVALID_LOCK = 5;
}

// Response: Server -> Client (OPCODE_REFINE_ITEM_RESPONSE = 527). status là danh sách sau lần tẩy; max_hp > 0 khi
// chỉ số vừa áp lại (cùng quy ước SocketGemResponse.max_hp).
message RefineItemResponse {
  RefineItemOutcome outcome = 1;
  ListRefinementsResponse status = 2;
  int32 max_hp = 3;
}

// Command: Client -> Server (OPCODE_SET_ITEM_LOCK_COMMAND = 528) — ADR-159. Khoá (locked=true) hoặc mở khoá một món
// trong túi của CHÍNH người gửi (characterId lấy từ session). Mở khoá chịu cổng Mật Khẩu Bảo Hộ (ADR-118) như mọi
// thao tác làm đồ rời túi.
message SetItemLockCommand {
  int64 item_id = 1;
  bool locked = 2;
}

enum SetItemLockOutcome {
  SET_ITEM_LOCK_OUTCOME_UNSPECIFIED = 0;
  SET_ITEM_LOCK_OUTCOME_OK = 1;
  SET_ITEM_LOCK_OUTCOME_NOT_FOUND = 2;  // món không có trong túi người gửi
}

// Response: Server -> Client (OPCODE_SET_ITEM_LOCK_RESPONSE = 529).
message SetItemLockResponse {
  SetItemLockOutcome outcome = 1;
  int64 item_id = 2;
  bool locked = 3;  // trạng thái SAU lệnh (OK) — client làm mới túi để thấy
}

// Command: Client -> Server (OPCODE_SORT_INVENTORY_COMMAND = 530) — ADR-160. Gom chồng cùng loại + xếp lại túi của
// CHÍNH người gửi. Server quyết thứ tự; client hỏi lại túi để thấy.
message SortInventoryCommand {}

// Response: Server -> Client (OPCODE_SORT_INVENTORY_RESPONSE = 531).
message SortInventoryResponse {
  bool ok = 1;
  int32 merged_rows = 2;  // số chồng đã gom vào chồng khác (0 = chỉ đổi thứ tự)
}

// ===== ADR-161 — ghép Linh Ngọc: N viên cùng loại cùng bậc + vàng ⇒ 1 viên bậc trên. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_GEM_RECIPES_REQUEST = 532).
message GetGemRecipesRequest {}

message GemRecipeView {
  int64 source_item_template_id = 1;
  int64 result_item_template_id = 2;
  int32 source_quantity = 3;
  int64 gold_fee = 4;
  int32 owned = 5;  // số viên nguồn người hỏi đem ghép được (chưa khoá)
}

// Response: Server -> Client (OPCODE_GET_GEM_RECIPES_RESPONSE = 533).
message GetGemRecipesResponse {
  repeated GemRecipeView recipes = 1;
}

// Command: Client -> Server (OPCODE_COMBINE_GEMS_COMMAND = 534). Ghép MỘT lần theo công thức của viên nguồn.
message CombineGemsCommand {
  int64 source_item_template_id = 1;
}

enum CombineGemsOutcome {
  COMBINE_GEMS_OUTCOME_UNSPECIFIED = 0;
  COMBINE_GEMS_OUTCOME_OK = 1;
  COMBINE_GEMS_OUTCOME_UNKNOWN_RECIPE = 2;
  COMBINE_GEMS_OUTCOME_NOT_ENOUGH_GEMS = 3;
  COMBINE_GEMS_OUTCOME_NOT_ENOUGH_GOLD = 4;
  COMBINE_GEMS_OUTCOME_BAG_FULL = 5;
}

// Response: Server -> Client (OPCODE_COMBINE_GEMS_RESPONSE = 535). recipes = bảng sau lần ghép.
message CombineGemsResponse {
  CombineGemsOutcome outcome = 1;
  int64 result_item_template_id = 2;
  GetGemRecipesResponse recipes = 3;
}

// ===== ADR-163 — túi phúc: mở một túi ra MỘT phần quà rút theo trọng số (server rút). CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_LUCKY_BAGS_REQUEST = 536).
message GetLuckyBagsRequest {}

// Một phần quà: vàng (item_template_id = 0) hoặc một chồng đồ. weight / tổng weight = tỉ lệ rút.
message LuckyBagRewardView {
  int64 gold = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int32 weight = 4;
}

message LuckyBagView {
  int64 bag_item_template_id = 1;
  int32 owned = 2;
  repeated LuckyBagRewardView rewards = 3;
}

// Response: Server -> Client (OPCODE_GET_LUCKY_BAGS_RESPONSE = 537).
message GetLuckyBagsResponse {
  repeated LuckyBagView bags = 1;
}

// Command: Client -> Server (OPCODE_OPEN_LUCKY_BAG_COMMAND = 538). Mở MỘT túi loại này.
message OpenLuckyBagCommand {
  int64 bag_item_template_id = 1;
}

enum OpenLuckyBagOutcome {
  OPEN_LUCKY_BAG_OUTCOME_UNSPECIFIED = 0;
  OPEN_LUCKY_BAG_OUTCOME_OK = 1;
  OPEN_LUCKY_BAG_OUTCOME_NOT_A_BAG = 2;
  OPEN_LUCKY_BAG_OUTCOME_NO_BAG = 3;
  OPEN_LUCKY_BAG_OUTCOME_BAG_FULL = 4;
  OPEN_LUCKY_BAG_OUTCOME_GOLD_FULL = 5;
}

// Response: Server -> Client (OPCODE_OPEN_LUCKY_BAG_RESPONSE = 539). bags = bảng sau lần mở.
message OpenLuckyBagResponse {
  OpenLuckyBagOutcome outcome = 1;
  LuckyBagRewardView reward = 2;
  GetLuckyBagsResponse bags = 3;
}
