syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Thư (NETWORK.md §4, dải 900-999). Phase 6 lát cắt 5. recipient_name (không phải ID) —
// server-gateway tự tra CharacterFacade.findByName trước khi gọi MailFacade, cùng lý do
// SendFriendRequestCommand.
//
// ⚠️ 2026-08-28: gửi thư KHÔNG mất phí bưu điện, nhưng gold/vật phẩm ĐÍNH KÈM bị TRỪ KHỎI NGƯỜI
// GỬI ngay lúc gửi (ký quỹ), trong cùng transaction với INSERT INTO mail. Trước đó chúng được ghi
// vào thư mà không trừ của ai — ClaimMailCommand thì cấp thật, nên ai cũng tự đúc được vàng/vật
// phẩm bằng cách gửi thư cho chính mình. Xem feature-mail/CLAUDE.md.

message MailAttachmentView {
  int64 item_template_id = 1;
  int32 quantity = 2;
}

// Command: Client -> Server (OPCODE_SEND_MAIL_COMMAND).
message SendMailCommand {
  string recipient_name = 1;
  string subject = 2;
  string body = 3;
  int64 gold_amount = 4;
  repeated MailAttachmentView attachments = 5;
  // ADR-058 (2026-10-18) — chống gửi trùng (ADR-025). Rỗng = client cũ: gửi như trước, không chống trùng.
  string idempotency_key = 6;
}

// Giá trị 3-8 THÊM 2026-08-28 (chỉ thêm, không đổi/xoá 0-2 — NETWORK.md §6). Trước đó 4 trong 6
// trường hợp này ném SQLException/IllegalArgumentException trong authExecutor và client KHÔNG nhận
// được gói trả lời nào cả.
enum SendMailOutcome {
  SEND_MAIL_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  SEND_MAIL_OUTCOME_OK = 1;
  SEND_MAIL_OUTCOME_RECIPIENT_NOT_FOUND = 2;
  SEND_MAIL_OUTCOME_INSUFFICIENT_GOLD = 3;     // không đủ vàng để đính kèm gold_amount
  SEND_MAIL_OUTCOME_ATTACHMENT_NOT_OWNED = 4;  // không có/không đủ món đó (kể cả item_template_id không tồn tại)
  SEND_MAIL_OUTCOME_INVALID_GOLD_AMOUNT = 5;   // gold_amount âm
  SEND_MAIL_OUTCOME_INVALID_ATTACHMENT = 6;    // quantity <= 0 hoặc item_template_id <= 0
  SEND_MAIL_OUTCOME_SUBJECT_TOO_LONG = 7;      // vượt VARCHAR(64) của cột mail.subject (V13)
  SEND_MAIL_OUTCOME_BODY_TOO_LONG = 8;         // vượt VARCHAR(1024) của cột mail.body (V13)
  // ADR-058 (2026-10-18, chỉ thêm): idempotency_key đã dùng — lá thư đó ĐÃ được gửi, không gửi lần hai.
  SEND_MAIL_OUTCOME_DUPLICATE_REQUEST = 9;
}

// Response: Server -> Client (OPCODE_SEND_MAIL_RESPONSE).
message SendMailResponse {
  SendMailOutcome outcome = 1;
  int64 mail_id = 2;
}

message ListMailRequest {
}

// has_sender=false nghĩa là thư hệ thống (sender_id không có ý nghĩa lúc đó) — wire dùng cờ riêng
// thay vì sentinel số 0, khớp cách domain.Mail dùng Long null (feature-mail/CLAUDE.md).
message MailView {
  int64 mail_id = 1;
  bool has_sender = 2;
  int64 sender_id = 3;
  string subject = 4;
  string body = 5;
  int64 gold_amount = 6;
  repeated MailAttachmentView attachments = 7;
  bool claimed = 8;
}

message ListMailResponse {
  repeated MailView mails = 1;
}

// Command: Client -> Server (OPCODE_CLAIM_MAIL_COMMAND). idempotency_key (ADR-025, thêm
// 2026-07-24): UUID v4 client tự sinh, giữ nguyên khi tự retry cùng 1 lần nhận — server enforce
// unique ở bảng idempotency_key trong CÙNG transaction với hiệu ứng thật (cộng gold + cấp item +
// đánh dấu claimed), chống nhận trùng khi client mất kết nối trước khi nhận response.
message ClaimMailCommand {
  int64 mail_id = 1;
  string idempotency_key = 2;
}

enum ClaimMailOutcome {
  CLAIM_MAIL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  CLAIM_MAIL_OUTCOME_OK = 1;
  CLAIM_MAIL_OUTCOME_NOT_FOUND = 2;
  CLAIM_MAIL_OUTCOME_ALREADY_CLAIMED = 3;
  CLAIM_MAIL_OUTCOME_INVENTORY_FULL = 4;
  CLAIM_MAIL_OUTCOME_DUPLICATE_REQUEST = 5; // ADR-025: idempotency_key đã dùng trước đó
}

// Response: Server -> Client (OPCODE_CLAIM_MAIL_RESPONSE).
message ClaimMailResponse {
  ClaimMailOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_DELETE_MAIL_COMMAND).
message DeleteMailCommand {
  int64 mail_id = 1;
}

enum DeleteMailOutcome {
  DELETE_MAIL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  DELETE_MAIL_OUTCOME_OK = 1;
  DELETE_MAIL_OUTCOME_NOT_FOUND = 2;
  DELETE_MAIL_OUTCOME_MUST_CLAIM_FIRST = 3;
}

// Response: Server -> Client (OPCODE_DELETE_MAIL_RESPONSE).
message DeleteMailResponse {
  DeleteMailOutcome outcome = 1;
}

// Đẩy cho người nhận NẾU đang online lúc gửi — client tự gọi lại ListMailRequest để lấy nội dung
// đầy đủ (giống cách FriendOnlineEvent chỉ báo, không mang toàn bộ dữ liệu).
message NewMailEvent {
  int64 mail_id = 1;
}
