syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Thư (NETWORK.md §4, dải 900-999). Phase 6 lát cắt 5. recipient_name (không phải ID) —
// server-gateway tự tra CharacterFacade.findByName trước khi gọi MailFacade, cùng lý do
// SendFriendRequestCommand.
//
// ⚠️ 2026-08-28: gửi thư KHÔNG mất phí bưu điện, nhưng gold/vật phẩm ĐÍNH KÈM bị TRỪ KHỎI NGƯỜI
// GỬI ngay lúc gửi (ký quỹ), trong cùng transaction với INSERT INTO mail. Trước đó chúng được ghi
// vào thư mà không trừ của ai — ClaimMailCommand thì cấp thật, nên ai cũng tự đúc được vàng/vật
// phẩm bằng cách gửi thư cho chính mình. Xem feature-mail/CLAUDE.md.

message MailAttachmentView {
  int64 item_template_id = 1;
  int32 quantity = 2;
  int32 enhance_level = 3; // ADR-083 — cấp cường hoá của món (0 = chưa cường hoá); server kiểm 0..15
}

// Command: Client -> Server (OPCODE_SEND_MAIL_COMMAND).
message SendMailCommand {
  string recipient_name = 1;
  string subject = 2;
  string body = 3;
  int64 gold_amount = 4;
  repeated MailAttachmentView attachments = 5;
  // ADR-058 (2026-10-18) — chống gửi trùng (ADR-025). Rỗng = client cũ: gửi như trước, không chống trùng.
  string idempotency_key = 6;
}

// Giá trị 3-8 THÊM 2026-08-28 (chỉ thêm, không đổi/xoá 0-2 — NETWORK.md §6). Trước đó 4 trong 6
// trường hợp này ném SQLException/IllegalArgumentException trong authExecutor và client KHÔNG nhận
// được gói trả lời nào cả.
enum SendMailOutcome {
  SEND_MAIL_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  SEND_MAIL_OUTCOME_OK = 1;
  SEND_MAIL_OUTCOME_RECIPIENT_NOT_FOUND = 2;
  SEND_MAIL_OUTCOME_INSUFFICIENT_GOLD = 3;     // không đủ vàng để đính kèm gold_amount
  SEND_MAIL_OUTCOME_ATTACHMENT_NOT_OWNED = 4;  // không có/không đủ món đó (kể cả item_template_id không tồn tại)
  SEND_MAIL_OUTCOME_INVALID_GOLD_AMOUNT = 5;   // gold_amount âm
  SEND_MAIL_OUTCOME_INVALID_ATTACHMENT = 6;    // quantity <= 0 hoặc item_template_id <= 0
  SEND_MAIL_OUTCOME_SUBJECT_TOO_LONG = 7;      // vượt VARCHAR(64) của cột mail.subject (V13)
  SEND_MAIL_OUTCOME_BODY_TOO_LONG = 8;         // vượt VARCHAR(1024) của cột mail.body (V13)
  // ADR-058 (2026-10-18, chỉ thêm): idempotency_key đã dùng — lá thư đó ĐÃ được gửi, không gửi lần hai.
  SEND_MAIL_OUTCOME_DUPLICATE_REQUEST = 9;
  // ADR-212 (2026-11-07, chỉ thêm): người nhận chặn thư người lạ và người gửi không phải bạn bè của họ.
  SEND_MAIL_OUTCOME_STRANGER_MAIL_BLOCKED = 10;
}

// Response: Server -> Client (OPCODE_SEND_MAIL_RESPONSE).
message SendMailResponse {
  SendMailOutcome outcome = 1;
  int64 mail_id = 2;
}

message ListMailRequest {
}

// has_sender=false nghĩa là thư hệ thống (sender_id không có ý nghĩa lúc đó) — wire dùng cờ riêng
// thay vì sentinel số 0, khớp cách domain.Mail dùng Long null (feature-mail/CLAUDE.md).
message MailView {
  int64 mail_id = 1;
  bool has_sender = 2;
  int64 sender_id = 3;
  string subject = 4;
  string body = 5;
  int64 gold_amount = 6;
  repeated MailAttachmentView attachments = 7;
  bool claimed = 8;
  bool pinned = 9;  // ADR-217 — thư ghim; server trả thư ghim lên đầu danh sách
  bool unread = 10; // ADR-314 — chưa mở đọc (mặc định false = đã đọc; thư có từ trước V174 coi như đã đọc)
}

message ListMailResponse {
  repeated MailView mails = 1;
}

// Command: Client -> Server (OPCODE_CLAIM_MAIL_COMMAND). idempotency_key (ADR-025, thêm
// 2026-07-24): UUID v4 client tự sinh, giữ nguyên khi tự retry cùng 1 lần nhận — server enforce
// unique ở bảng idempotency_key trong CÙNG transaction với hiệu ứng thật (cộng gold + cấp item +
// đánh dấu claimed), chống nhận trùng khi client mất kết nối trước khi nhận response.
message ClaimMailCommand {
  int64 mail_id = 1;
  string idempotency_key = 2;
}

enum ClaimMailOutcome {
  CLAIM_MAIL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  CLAIM_MAIL_OUTCOME_OK = 1;
  CLAIM_MAIL_OUTCOME_NOT_FOUND = 2;
  CLAIM_MAIL_OUTCOME_ALREADY_CLAIMED = 3;
  CLAIM_MAIL_OUTCOME_INVENTORY_FULL = 4;
  CLAIM_MAIL_OUTCOME_DUPLICATE_REQUEST = 5; // ADR-025: idempotency_key đã dùng trước đó
}

// Response: Server -> Client (OPCODE_CLAIM_MAIL_RESPONSE).
message ClaimMailResponse {
  ClaimMailOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_DELETE_MAIL_COMMAND).
message DeleteMailCommand {
  int64 mail_id = 1;
}

enum DeleteMailOutcome {
  DELETE_MAIL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  DELETE_MAIL_OUTCOME_OK = 1;
  DELETE_MAIL_OUTCOME_NOT_FOUND = 2;
  DELETE_MAIL_OUTCOME_MUST_CLAIM_FIRST = 3;
}

// Response: Server -> Client (OPCODE_DELETE_MAIL_RESPONSE).
message DeleteMailResponse {
  DeleteMailOutcome outcome = 1;
}

// Đẩy cho người nhận NẾU đang online lúc gửi — client tự gọi lại ListMailRequest để lấy nội dung
// đầy đủ (giống cách FriendOnlineEvent chỉ báo, không mang toàn bộ dữ liệu).
message NewMailEvent {
  int64 mail_id = 1;
}

// ===== ADR-104 (2026-10-25) — mã quà tặng. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_REDEEM_GIFT_CODE_COMMAND = 909). Client gõ /giftcode <MÃ>.
message RedeemGiftCodeCommand {
  string code = 1;
}

enum RedeemGiftCodeOutcome {
  REDEEM_GIFT_CODE_OUTCOME_UNSPECIFIED = 0;
  REDEEM_GIFT_CODE_OUTCOME_OK = 1;              // quà đã gửi vào hòm thư
  REDEEM_GIFT_CODE_OUTCOME_UNKNOWN_CODE = 2;
  REDEEM_GIFT_CODE_OUTCOME_EXPIRED = 3;
  REDEEM_GIFT_CODE_OUTCOME_USED_UP = 4;
  REDEEM_GIFT_CODE_OUTCOME_ALREADY_REDEEMED = 5;
  REDEEM_GIFT_CODE_OUTCOME_MAIL_FAILED = 6;     // đã ghi lượt đổi nhưng thư chưa gửi được — gõ lại mã để gửi lại
}

// Response: Server -> Client (OPCODE_REDEEM_GIFT_CODE_RESPONSE = 910).
message RedeemGiftCodeResponse {
  RedeemGiftCodeOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_CLAIM_ALL_MAIL_COMMAND = 911) — ADR-167. Lĩnh vàng/đồ của MỌI thư chưa lĩnh (dừng ở
// thư đầu tiên túi không chứa nổi), rồi nếu delete_claimed thì xoá mọi thư đã lĩnh xong / không còn gì để lĩnh.
message ClaimAllMailCommand {
  bool delete_claimed = 1;
}

// Response: Server -> Client (OPCODE_CLAIM_ALL_MAIL_RESPONSE = 912).
message ClaimAllMailResponse {
  int32 claimed = 1;   // số thư vừa lĩnh
  int64 gold = 2;      // tổng vàng vừa lĩnh
  int32 items = 3;     // tổng số món vừa lĩnh
  int32 deleted = 4;   // số thư đã xoá
  bool bag_full = 5;   // dừng giữa chừng vì túi đầy — còn thư chưa lĩnh
}

// ADR-212 (2026-11-07) — chặn thư người lạ. Command: Client -> Server (OPCODE_SET_STRANGER_MAIL_BLOCK_COMMAND).
message SetStrangerMailBlockCommand {
  bool enabled = 1;
  bool query_only = 2;  // true = chỉ hỏi trạng thái, không đổi
}

// Response: Server -> Client (OPCODE_SET_STRANGER_MAIL_BLOCK_RESPONSE).
message SetStrangerMailBlockResponse {
  bool enabled = 1;
}

// ADR-216 (2026-11-08) — xoá hàng loạt thư đã nhận / không đính kèm (trừ thư ghim).
// Command: Client -> Server (OPCODE_DELETE_FINISHED_MAIL_COMMAND).
message DeleteFinishedMailCommand {}

// Response: Server -> Client (OPCODE_DELETE_FINISHED_MAIL_RESPONSE).
message DeleteFinishedMailResponse {
  int32 deleted = 1;
}

// ADR-217 (2026-11-08) — ghim / bỏ ghim một thư. Command: Client -> Server (OPCODE_PIN_MAIL_COMMAND).
message PinMailCommand {
  int64 mail_id = 1;
  bool pinned = 2;
}

// Response: Server -> Client (OPCODE_PIN_MAIL_RESPONSE). ok = false ⇒ thư không tồn tại / không phải của mình.
message PinMailResponse {
  bool ok = 1;
  bool pinned = 2;
}

// ADR-290 (2026-11-12) — thư đã gửi. Request: Client -> Server (OPCODE_LIST_SENT_MAIL_REQUEST).
message ListSentMailRequest {}

message SentMailEntry {
  string recipient_name = 1; // "?" nếu nhân vật đã xoá
  string subject = 2;
  int64 gold_amount = 3;
  int32 attachments = 4;
  bool claimed = 5;
  int64 at_epoch_seconds = 6;
}

// Response: Server -> Client (OPCODE_LIST_SENT_MAIL_RESPONSE). 20 thư gần nhất, mới trước; thư người nhận đã xoá thì không còn.
message ListSentMailResponse {
  repeated SentMailEntry entries = 1;
}

// ADR-297 (2026-11-12) — thư hẹn giờ (chỉ chữ). Command: Client -> Server (OPCODE_SCHEDULE_MAIL_COMMAND).
message ScheduleMailCommand {
  string recipient_name = 1;
  string subject = 2;
  string body = 3;
  int32 delay_minutes = 4; // 1..10080
}

enum ScheduleMailOutcome {
  SCHEDULE_MAIL_OUTCOME_UNSPECIFIED = 0;
  SCHEDULE_MAIL_OUTCOME_OK = 1;
  SCHEDULE_MAIL_OUTCOME_RECIPIENT_NOT_FOUND = 2;
  SCHEDULE_MAIL_OUTCOME_INVALID_DELAY = 3;
  SCHEDULE_MAIL_OUTCOME_TOO_MANY_PENDING = 4;
  SCHEDULE_MAIL_OUTCOME_INVALID_TEXT = 5;
}

// Response: Server -> Client (OPCODE_SCHEDULE_MAIL_RESPONSE). pending = số thư đang chờ sau lượt này.
message ScheduleMailResponse {
  ScheduleMailOutcome outcome = 1;
  int32 pending = 2;
}

// ADR-314 (2026-11-13) — đánh dấu đã đọc. Command: Client -> Server (OPCODE_MARK_MAIL_READ_COMMAND).
message MarkMailReadCommand {
  int64 mail_id = 1;
}

// Response: Server -> Client (OPCODE_MARK_MAIL_READ_RESPONSE). unread = số thư còn chưa đọc.
message MarkMailReadResponse {
  int64 mail_id = 1;
  int32 unread = 2;
}

// ADR-312 (2026-11-13) — thư chữ gửi mọi bạn bè. Command: Client -> Server (OPCODE_SEND_FRIENDS_MAIL_COMMAND).
message SendFriendsMailCommand {
  string subject = 1;
  string body = 2;
}

enum SendFriendsMailOutcome {
  SEND_FRIENDS_MAIL_OUTCOME_UNSPECIFIED = 0;
  SEND_FRIENDS_MAIL_OUTCOME_OK = 1;
  SEND_FRIENDS_MAIL_OUTCOME_NO_FRIENDS = 2;
  SEND_FRIENDS_MAIL_OUTCOME_DAILY_LIMIT = 3;
  SEND_FRIENDS_MAIL_OUTCOME_INVALID_CONTENT = 4;
}

// Response: Server -> Client (OPCODE_SEND_FRIENDS_MAIL_RESPONSE).
message SendFriendsMailResponse {
  SendFriendsMailOutcome outcome = 1;
  int32 recipients = 2;
}

// ADR-354 (2026-11-13) — lưu trữ thư. Command: Client -> Server (OPCODE_ARCHIVE_MAIL_COMMAND). archive = false để trả
// thư về hộp chính. Thư lưu trữ không hiện ở danh sách thư chính và không bị xoá hàng loạt.
message ArchiveMailCommand {
  int64 mail_id = 1;
  bool archive = 2;
}

enum ArchiveMailOutcome {
  ARCHIVE_MAIL_OUTCOME_UNSPECIFIED = 0;
  ARCHIVE_MAIL_OUTCOME_ARCHIVED = 1;
  ARCHIVE_MAIL_OUTCOME_RESTORED = 2;
  ARCHIVE_MAIL_OUTCOME_NOT_FOUND = 3;
}

// Response: Server -> Client (OPCODE_ARCHIVE_MAIL_RESPONSE).
message ArchiveMailResponse {
  ArchiveMailOutcome outcome = 1;
  int64 mail_id = 2;
}

// Request: Client -> Server (OPCODE_LIST_ARCHIVED_MAIL_REQUEST).
message ListArchivedMailRequest {}

message ArchivedMail {
  int64 mail_id = 1;
  string sender_name = 2; // "" = thư hệ thống
  string subject = 3;
  int64 sent_at_epoch_seconds = 4;
}

// Response: Server -> Client (OPCODE_LIST_ARCHIVED_MAIL_RESPONSE). Mới trước.
message ListArchivedMailResponse {
  repeated ArchivedMail mails = 1;
}
