syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Combat (NETWORK.md §4, dải 400-499). Phase 4 lát cắt 1 — đánh thường tự động
// (GDD §6 "Auto-target đánh thường"). Lát cắt 6 (2026-07-22) thêm UseSkillCommand/SkillResultEvent
// — script sandbox GraalJS thật (ADR-016), CHỈ 1 skill hardcode ("fireball", SkillConstants),
// chưa có skill_template/character_skill DB (giống monster_template — chưa DB-driven).
//
// ID mục tiêu (target_entity_id / attacker_entity_id / monster_id) dùng CHUNG 1 không gian long
// cho cả nhân vật lẫn quái, KHÔNG trùng nhau: characterId luôn DƯƠNG (DB auto-increment từ 1),
// monster instance ID cấp ÂM (server-world tự cấp, từ -1 giảm dần). Không cần field "loại entity"
// riêng — chỉ cần biết dấu. 0 = chưa chọn mục tiêu (không phải ID thật nào).

// Command: Client -> Server (OPCODE_SET_TARGET_COMMAND). Người chơi CHỌN mục tiêu.
//
// ⚠️ Từ 2026-08-09 (chủ dự án quyết sau playtest): chọn mục tiêu KHÔNG còn tự đánh nữa. Trước đó
// server tự đánh theo ATK_SPEED khi mục tiêu trong tầm (GDD §6 "Auto-target đánh thường") — chủ
// dự án thấy máu quái tự tụt dù chưa bấm gì và yêu cầu đổi thành "phải bấm mới đánh". Giờ lệnh này
// chỉ ghi nhận NHẮM AI; muốn ra đòn phải gửi AttackCommand. Quái/boss thì KHÔNG đổi — chúng vẫn
// tự đánh (AiSystem), nếu không thì không ai đánh người chơi cả.
message SetTargetCommand {
  int64 target_entity_id = 1;
}

// Command: Client -> Server (OPCODE_ATTACK_COMMAND). Ý định ra MỘT đòn đánh thường lên mục tiêu
// đang nhắm (2026-08-09, xem SetTargetCommand ở trên).
//
// KHÔNG có field: mục tiêu lấy từ TargetComponent phía server chứ không phải từ gói này — client
// không được chọn đánh ai theo từng đòn, cùng nguyên tắc JumpCommand rỗng (Server Authority,
// /CLAUDE.md §5). Server tự kiểm cooldown/tầm/stun; sai điều kiện thì bỏ qua ÂM THẦM, spam gói
// không làm đánh nhanh hơn (cooldown là của server).
message AttackCommand {
}

// Event: Server -> Client (OPCODE_ATTACK_RESULT_EVENT). Kết quả 1 đòn đánh THẬT (đã né/bạo
// kích/giảm giáp — GDD §6) — gửi cho MỌI nhân vật đang thấy mục tiêu trong AoI (SERVER.md §6),
// không chỉ người tấn công.
message AttackResultEvent {
  int64 attacker_entity_id = 1;
  int64 target_entity_id = 2;
  int32 damage = 3;
  bool is_crit = 4;
  bool is_miss = 5;
  int32 target_current_hp = 6;
  bool target_died = 7;
}

// Event: Server -> Client (OPCODE_MONSTER_SPAWNED_EVENT). Quái VỪA vào AoI (spawn lần đầu hoặc
// hồi sinh) — client tạo entity render. Mẫu y hệt CharacterSpawnedEvent (movement.proto).
message MonsterSpawnedEvent {
  int64 monster_id = 1;
  string monster_code = 2;
  float x = 3;
  float y = 4;
  int32 current_hp = 5;
  int32 max_hp = 6;
  // ADR-037 D5 — field THÊM (7), field 1..6 giữ NGUYÊN, protocolVersion KHÔNG tăng (luật additive
  // NETWORK.md §6). Khoá art của loài (`monster_template.model_key`).
  //
  // Vì sao cần: client vốn suy model bằng một PHÉP BIẾN ĐỔI THUẦN từ monster_code
  // (MonsterModelKey: training_dummy -> mob_training-dummy), và file đó CỐ Ý không phải bảng tra
  // ("client không nên là bên thứ ba phải đồng ý mỗi lần thêm một con quái"). Phép biến đổi thuần
  // không cho hai loài KHÁC NHAU dùng chung một model, mà đó chính là thứ cần trong lúc chờ art
  // riêng cho từng loài.
  //
  // RỖNG = server cũ chưa gửi, hoặc loài giữ hardcode (boss): client suy như cũ. Nên field này là
  // bổ sung, không phải thay thế — server cũ vẫn chạy với client mới.
  string model_key = 7;
}

// Event: Server -> Client (OPCODE_MONSTER_DESPAWNED_EVENT). Quái VỪA chết hoặc rời AoI — client
// xoá entity render.
message MonsterDespawnedEvent {
  int64 monster_id = 1;
}

// Event: Server -> Client (OPCODE_MONSTER_MOVED_EVENT). Quái ĐÃ ở trong AoI từ trước vừa đổi vị
// trí (AI.md §3 — Patrol/Chase/Return khiến quái di chuyển, khác lát cắt 1 khi quái đứng yên).
// Mẫu y hệt CharacterMovedEvent (movement.proto).
message MonsterMovedEvent {
  int64 monster_id = 1;
  float x = 2;
  float y = 3;
}

// Command: Client -> Server (OPCODE_USE_SKILL_COMMAND). Dùng kỹ năng nhắm mục tiêu (GAMEPLAY.md
// §3-4) — server tự kiểm tra skill có tồn tại/cooldown/đủ Khí/trong tầm, KHÔNG tin client. Sai bất
// kỳ điều kiện nào → bị bỏ qua ÂM THẦM (giống SetTargetCommand) — không trả lỗi cụ thể, tránh lộ
// ngưỡng cho client gian lận dò (SECURITY.md).
message UseSkillCommand {
  string skill_code = 1;
  int64 target_entity_id = 2;
}

// Phase 8 (4 hệ phái) — skill không còn chỉ gây damage (Thủy/Thổ có heal/khiên/buff/debuff thật).
// UNSPECIFIED coi như DAMAGE (tương thích ngược với fireball/boss cũ, không set field này).
enum EffectKind {
  EFFECT_KIND_UNSPECIFIED = 0;
  EFFECT_KIND_DAMAGE = 1;
  EFFECT_KIND_HEAL = 2;
  EFFECT_KIND_SHIELD = 3;
  EFFECT_KIND_BUFF = 4;
  EFFECT_KIND_DEBUFF = 5;
}

// Event: Server -> Client (OPCODE_SKILL_RESULT_EVENT). Kết quả 1 lần dùng skill THẬT — cùng hình
// dạng AttackResultEvent, thêm skill_code để client phát đúng hiệu ứng/animation (khác đòn đánh
// thường). Gửi cho MỌI nhân vật đang thấy mục tiêu trong AoI, không chỉ người dùng skill.
//
// `damage` là "độ lớn" DÙNG CHUNG cho mọi effect_kind, không chỉ damage thật: lượng heal
// (EFFECT_KIND_HEAL), lượng khiên (EFFECT_KIND_SHIELD) — is_crit/is_miss chỉ có ý nghĩa khi
// effect_kind=DAMAGE (Phase 8 4 hệ phái).
message SkillResultEvent {
  string skill_code = 1;
  int64 attacker_entity_id = 2;
  int64 target_entity_id = 3;
  int32 damage = 4;
  bool is_crit = 5;
  bool is_miss = 6;
  int32 target_current_hp = 7;
  bool target_died = 8;
  EffectKind effect_kind = 9;
}

// Event: Server -> Client (OPCODE_HEALTH_CHANGED_EVENT). Máu của một entity vừa đổi mà KHÔNG do
// đòn đánh nào — ADR-046. Bốn nguồn dùng CHUNG event này: hồi máu ngoài chiến đấu (D2), bước vào
// vùng an toàn tông môn (D3), quái về tới điểm spawn thì lành lại (D4), và đan dược (D5).
//
// Gửi cho MỌI nhân vật đang thấy entity đó trong AoI, y hệt AttackResultEvent.
//
// KHÔNG có field "vì sao": vạch máu không quan tâm lý do, và số "+N" client tự lấy được bằng hiệu
// với giá trị đang giữ. Thêm enum lý do là mở rộng bề mặt protocol để đổi lấy thứ client tự tính
// được (ADR-046 D1).
//
// Vì sao cần event RIÊNG: trước ADR-046, client chỉ biết HP qua AttackResultEvent/SkillResultEvent
// (javadoc CombatHudController nói thẳng "server không gửi gói đồng bộ HP nào") — máu hồi mà không
// có gói nào mang tin đi thì vạch máu đứng im tới đòn đánh kế tiếp.
message HealthChangedEvent {
  int64 entity_id = 1; // DƯƠNG = nhân vật, ÂM = quái — cùng quy ước với target_entity_id ở trên
  int32 current_hp = 2;
  int32 max_hp = 3;
}

// ---- ADR-071 — điểm công pháp ----

// Request: Client -> Server (OPCODE_LIST_SKILL_RANKS_REQUEST = 409). Không field — characterId từ session.
message ListSkillRanksRequest {}

// Một chiêu của linh căn hiện tại.
message SkillRankView {
  string skill_code = 1;
  int32 slot_index = 2;
  int32 rank = 3;            // 1..max_rank
  int32 max_rank = 4;
  int32 required_level = 5;
  bool unlocked = 6;         // đủ cấp mở chiêu
  bool passive = 7;          // ADR-077 — tâm pháp bị động: rank 0 = chưa học, mỗi bậc tốn một điểm
}

// Response: Server -> Client (OPCODE_LIST_SKILL_RANKS_RESPONSE = 410).
message ListSkillRanksResponse {
  repeated SkillRankView skills = 1;
  int32 points_total = 2;
  int32 points_available = 3;
}

// Command: Client -> Server (OPCODE_UPGRADE_SKILL_COMMAND = 411). Server kiểm linh căn, cấp, bậc, điểm.
message UpgradeSkillCommand {
  string skill_code = 1;
}

enum UpgradeSkillOutcome {
  UPGRADE_SKILL_OUTCOME_UNSPECIFIED = 0;
  UPGRADE_SKILL_OUTCOME_OK = 1;
  UPGRADE_SKILL_OUTCOME_UNKNOWN_SKILL = 2;
  UPGRADE_SKILL_OUTCOME_LEVEL_TOO_LOW = 3;
  UPGRADE_SKILL_OUTCOME_MAX_RANK = 4;
  UPGRADE_SKILL_OUTCOME_NO_POINTS = 5;
}

// Response: Server -> Client (OPCODE_UPGRADE_SKILL_RESPONSE = 412). sheet luôn là trạng thái MỚI NHẤT.
message UpgradeSkillResponse {
  UpgradeSkillOutcome outcome = 1;
  ListSkillRanksResponse sheet = 2;
}
