syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet NPC (NETWORK.md §4, dải 600-699 dùng chung với Quest). Phase 6 lát cắt 1 — NPC TĨNH
// (không AI, không di chuyển, không combat), chỉ hiện qua AoI giống quái/nhân vật. Chưa có
// NpcMovedEvent (khác MonsterMovedEvent) vì NPC không bao giờ đổi vị trí ở lát cắt này.

// Event: Server -> Client (OPCODE_NPC_SPAWNED_EVENT). NPC VỪA vào AoI của nhân vật.
message NpcSpawnedEvent {
  int64 npc_id = 1;
  string npc_code = 2;
  float x = 3;
  float y = 4;
}

// Event: Server -> Client (OPCODE_NPC_DESPAWNED_EVENT). NPC VỪA rời AoI (nhân vật đi xa — NPC
// tĩnh không tự "chết" như quái).
message NpcDespawnedEvent {
  int64 npc_id = 1;
}

// ADR-206 (2026-11-07) — tự tìm đường. Request: Client -> Server (OPCODE_LIST_NPC_LOCATIONS_REQUEST).
message ListNpcLocationsRequest {}

// Một chỗ đứng của NPC ở world chính (cùng mã có thể đứng nhiều chỗ — tiếp dẫn sứ mỗi trạm).
message NpcLocation {
  string npc_code = 1;
  float x = 2;
  float y = 3;
}

// Response: Server -> Client (OPCODE_LIST_NPC_LOCATIONS_RESPONSE). Đang không ở world chính (hầm ngục, đấu trường)
// thì in_main_world=false và danh sách rỗng — NPC chỉ đứng ở world chính.
message ListNpcLocationsResponse {
  bool in_main_world = 1;
  repeated NpcLocation locations = 2;
}
