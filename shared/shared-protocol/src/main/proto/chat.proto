syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Chat (NETWORK.md §4, dải 800-899). Phase 6 lát cắt 6 làm Thế giới/Riêng tư/Khu vực.
// Bang hội thêm ở Phase 7 lát cắt 1 (feature-guild thật, quyết định 2026-07-23, ROADMAP.md) —
// người nhận là thành viên ĐANG online của bang người gửi (server-gateway tự tra
// GuildFacade.listMembers SAU KHI gửi OK, cùng cách Khu vực tự tra AoI). Party thêm ở Phase 7 lát
// cắt 2 (feature-party thật, 2026-07-24) — cùng cơ chế, tra PartyFacade.listMembers.
enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho packet thật.
  CHAT_CHANNEL_WORLD = 1;
  CHAT_CHANNEL_PRIVATE = 2;
  CHAT_CHANNEL_AREA = 3;
  CHAT_CHANNEL_GUILD = 4;
  CHAT_CHANNEL_PARTY = 5;
  CHAT_CHANNEL_SWORN = 6;   // ADR-110 (2026-10-25) — huynh đệ kết nghĩa
  CHAT_CHANNEL_BROADCAST = 7; // ADR-152 (2026-11-02) — loa thế giới (Truyền Âm Phù); CHỈ server phát, lệnh chat thường gửi kênh này bị từ chối
  CHAT_CHANNEL_TRADE = 8;   // ADR-222 (2026-11-08) — kênh giao dịch: phát toàn server như Thế giới, tách riêng cho mua bán
}

// Command: Client -> Server (OPCODE_SEND_CHAT_MESSAGE_COMMAND). target_name CHỈ có ý nghĩa khi
// channel = CHAT_CHANNEL_PRIVATE (server-gateway tự tra CharacterFacade.findByName).
message SendChatMessageCommand {
  ChatChannel channel = 1;
  string target_name = 2;
  string body = 3;
  // ADR-188 — khoe vật phẩm: id một món TRONG TÚI người gửi (0 = không khoe). Server tự đọc món thật và gắn
  // LinkedItemView vào tin; client không khai chỉ số. Không dùng được ở kênh Khu vực.
  int64 linked_item_id = 4;
}

// ADR-188 — món được khoe, do SERVER đọc từ túi người gửi lúc gửi (ảnh chụp, không cập nhật về sau).
message LinkedItemView {
  int64 item_template_id = 1;
  int32 enhance_level = 2;
  int64 socket_gem_template_id = 3; // 0 = không khảm
  int32 quantity = 4;
  // Chỉ số HIỆU DỤNG (đã nhân cường hoá) do server tính — client không tự suy ra.
  int32 bonus_atk = 5;
  int32 bonus_def = 6;
  int32 bonus_res = 7;
  int32 bonus_hp = 8;
}

enum SendChatMessageOutcome {
  SEND_CHAT_MESSAGE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SEND_CHAT_MESSAGE_OUTCOME_OK = 1;
  SEND_CHAT_MESSAGE_OUTCOME_MESSAGE_BLANK = 2;
  SEND_CHAT_MESSAGE_OUTCOME_MESSAGE_TOO_LONG = 3;
  SEND_CHAT_MESSAGE_OUTCOME_CONTAINS_BANNED_WORD = 4;
  SEND_CHAT_MESSAGE_OUTCOME_TARGET_NOT_FOUND = 5; // PRIVATE: tên không tồn tại
  SEND_CHAT_MESSAGE_OUTCOME_TARGET_OFFLINE = 6; // PRIVATE: tồn tại nhưng không online lúc gửi
  SEND_CHAT_MESSAGE_OUTCOME_RATE_LIMITED = 7;
  SEND_CHAT_MESSAGE_OUTCOME_NOT_IN_GUILD = 8; // GUILD: người gửi chưa vào bang nào
  SEND_CHAT_MESSAGE_OUTCOME_NOT_IN_PARTY = 9; // PARTY: người gửi chưa vào party nào
  SEND_CHAT_MESSAGE_OUTCOME_MUTED = 10; // ADR-052 (2026-10-18, chỉ thêm): tài khoản đang bị GM khoá chat
  SEND_CHAT_MESSAGE_OUTCOME_NOT_SWORN = 11; // ADR-110 (2026-10-25, chỉ thêm): SWORN mà chưa kết nghĩa
  // ADR-187 (chỉ thêm): PRIVATE tới người đang offline — đã kiểm duyệt + audit, server giữ và giao khi họ vào game.
  // Thay cho TARGET_OFFLINE ở server mới (TARGET_OFFLINE vẫn giữ trong enum cho client cũ / tương thích).
  SEND_CHAT_MESSAGE_OUTCOME_DELIVERED_LATER = 12;
  SEND_CHAT_MESSAGE_OUTCOME_RECIPIENT_INBOX_FULL = 13; // người nhận đã có 20 tin chờ
  SEND_CHAT_MESSAGE_OUTCOME_LINKED_ITEM_NOT_FOUND = 14; // ADR-188 — món khoe không có trong túi người gửi
  SEND_CHAT_MESSAGE_OUTCOME_LINKED_ITEM_NOT_ON_AREA = 15; // ADR-188 — kênh Khu vực không mang món khoe
}

// Response: Server -> Client (OPCODE_SEND_CHAT_MESSAGE_RESPONSE).
message SendChatMessageResponse {
  SendChatMessageOutcome outcome = 1;
}

// Đẩy cho người nhận (World: toàn server; Riêng tư: 1 người; Khu vực: quan sát viên AoI, gồm cả
// người gửi để tự thấy tin của mình).
message ChatMessageEvent {
  ChatChannel channel = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  string body = 4;
  // ADR-062 — khoá i18n danh hiệu người gửi đang đeo; rỗng = không đeo (và mọi tin hệ thống).
  string sender_title_key = 5;
  // ADR-178 — tin TỰ TRẢ LỜI khi người kia đang treo "vắng mặt" (server gửi, không qua SendChatMessageCommand).
  bool auto_reply = 6;
  // ADR-187 — tin nhắn riêng gửi lúc mình offline, giao lúc vào game: thời điểm GỬI. 0 = tin thời gian thực.
  int64 sent_at_epoch_seconds = 7;
  LinkedItemView linked_item = 8; // ADR-188 — có khi người gửi khoe một món
}

// ===== ADR-092 — biểu cảm. CHỈ THÊM. Phát cho mọi người đang nhìn thấy mình (AoI, gồm cả chính mình); client vẽ
// bong bóng trên đầu nhân vật. Không ghi DB. =====

enum Emote {
  EMOTE_UNSPECIFIED = 0;
  EMOTE_GREET = 1;    // /chao — chắp tay chào
  EMOTE_BOW = 2;      // /cui — cúi đầu
  EMOTE_LAUGH = 3;    // /cuoi — cười
  EMOTE_CRY = 4;      // /khoc — khóc
  EMOTE_ANGRY = 5;    // /gian — giận
  EMOTE_CHEER = 6;    // /vui — reo hò
}

// Command: Client -> Server (OPCODE_SEND_EMOTE_COMMAND = 803).
message SendEmoteCommand {
  Emote emote = 1;
}

enum SendEmoteOutcome {
  SEND_EMOTE_OUTCOME_UNSPECIFIED = 0;
  SEND_EMOTE_OUTCOME_OK = 1;
  SEND_EMOTE_OUTCOME_INVALID_EMOTE = 2;
  SEND_EMOTE_OUTCOME_RATE_LIMITED = 3;   // quá 1 lần / 2 giây
  SEND_EMOTE_OUTCOME_NOT_IN_WORLD = 4;
}

// Response: Server -> Client (OPCODE_SEND_EMOTE_RESPONSE = 804).
message SendEmoteResponse {
  SendEmoteOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_EMOTE_EVENT = 805).
message EmoteEvent {
  int64 character_id = 1;
  Emote emote = 2;
}

// ===== ADR-105 (2026-10-25) — báo cáo người chơi. CHỈ THÊM. =====

enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_CHAT = 1;
  REPORT_REASON_CHEAT = 2;
  REPORT_REASON_SCAM = 3;
  REPORT_REASON_OTHER = 4;
}

// Command: Client -> Server (OPCODE_REPORT_PLAYER_COMMAND = 806). Client gõ /report <tên> <lý do> [ghi chú].
message ReportPlayerCommand {
  string target_name = 1;
  ReportReason reason = 2;
  string note = 3;   // ≤ 200 ký tự, server cắt phần thừa
}

enum ReportPlayerOutcome {
  REPORT_PLAYER_OUTCOME_UNSPECIFIED = 0;
  REPORT_PLAYER_OUTCOME_OK = 1;
  REPORT_PLAYER_OUTCOME_UNKNOWN_TARGET = 2;
  REPORT_PLAYER_OUTCOME_SELF = 3;
  REPORT_PLAYER_OUTCOME_DAILY_LIMIT = 4;        // đã gửi đủ 5 báo cáo hôm nay
  REPORT_PLAYER_OUTCOME_ALREADY_REPORTED = 5;   // đã báo cáo người này hôm nay
  REPORT_PLAYER_OUTCOME_INVALID_REASON = 6;
}

// Response: Server -> Client (OPCODE_REPORT_PLAYER_RESPONSE = 807).
message ReportPlayerResponse {
  ReportPlayerOutcome outcome = 1;
}

// ADR-122 (2026-10-31) — hỏi đáp tông môn. Trả lời bằng chat kênh THẾ GIỚI; server chấm, người đúng đầu tiên nhận thư.

// Event: Server -> Client, mọi người online (OPCODE_QUIZ_QUESTION_EVENT = 808). question_key là khoá i18n.
message QuizQuestionEvent {
  int32 index = 1;            // 0-based
  int32 total = 2;
  string question_key = 3;
  int64 ends_at_epoch_ms = 4;
}

// Event: Server -> Client, mọi người online (OPCODE_QUIZ_REVEAL_EVENT = 809). winner_name rỗng = hết giờ không ai đúng.
message QuizRevealEvent {
  int32 index = 1;
  string answer_key = 2;
  string winner_name = 3;
  int64 reward_gold = 4;
}

// ADR-152 (2026-11-02) — Truyền Âm Phù. Command: Client -> Server (OPCODE_BROADCAST_MESSAGE_COMMAND = 810). Tốn một
// Truyền Âm Phù; mọi người online nhận ChatMessageEvent kênh CHAT_CHANNEL_BROADCAST.
message BroadcastMessageCommand {
  string body = 1;
}

enum BroadcastMessageOutcome {
  BROADCAST_MESSAGE_OUTCOME_UNSPECIFIED = 0;
  BROADCAST_MESSAGE_OUTCOME_OK = 1;
  BROADCAST_MESSAGE_OUTCOME_NO_TALISMAN = 2;
  BROADCAST_MESSAGE_OUTCOME_COOLDOWN = 3;       // seconds_left cho biết còn bao lâu
  BROADCAST_MESSAGE_OUTCOME_MUTED = 4;
  BROADCAST_MESSAGE_OUTCOME_BLANK = 5;
  BROADCAST_MESSAGE_OUTCOME_TOO_LONG = 6;
  BROADCAST_MESSAGE_OUTCOME_BANNED_WORD = 7;
}

// Response: Server -> Client (OPCODE_BROADCAST_MESSAGE_RESPONSE = 811). Bị từ chối thì không mất phù.
message BroadcastMessageResponse {
  BroadcastMessageOutcome outcome = 1;
  int32 seconds_left = 2;
}

// ===== ADR-178 — tự trả lời khi vắng. CHỈ THÊM. Trạng thái chỉ nằm trong bộ nhớ gateway (mất khi thoát game).

// Command: Client -> Server (OPCODE_SET_AWAY_MESSAGE_COMMAND = 812). message rỗng (sau khi bỏ khoảng trắng) = tắt.
message SetAwayMessageCommand {
  string message = 1;
}

enum SetAwayMessageOutcome {
  SET_AWAY_MESSAGE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SET_AWAY_MESSAGE_OUTCOME_OK = 1;
  SET_AWAY_MESSAGE_OUTCOME_TOO_LONG = 2;    // quá 60 ký tự
  SET_AWAY_MESSAGE_OUTCOME_BANNED_WORD = 3; // cùng bộ lọc từ cấm của chat
}

// Response: Server -> Client (OPCODE_SET_AWAY_MESSAGE_RESPONSE = 813).
message SetAwayMessageResponse {
  SetAwayMessageOutcome outcome = 1;
  bool away = 2;      // trạng thái SAU lệnh
  string message = 3; // lời nhắn đã chuẩn hoá đang treo ("" = không vắng)
}

// ===== ADR-265 (2026-11-08) — gieo xúc xắc. CHỈ THÊM. Server bốc 1..max; kết quả là một dòng chat hệ thống tới cả nhóm
// đang online (không có nhóm ⇒ chỉ mình). Giới hạn 1 lần / 3 giây mỗi nhân vật. =====

// Command: Client -> Server (OPCODE_ROLL_DICE_COMMAND). max = 0 ⇒ 100.
message RollDiceCommand {
  int32 max = 1; // 2–1000
}

enum RollDiceOutcome {
  ROLL_DICE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  ROLL_DICE_OUTCOME_OK = 1;
  ROLL_DICE_OUTCOME_INVALID_MAX = 2;
  ROLL_DICE_OUTCOME_RATE_LIMITED = 3;
}

// Response: Server -> Client (OPCODE_ROLL_DICE_RESPONSE).
message RollDiceResponse {
  RollDiceOutcome outcome = 1;
  int32 value = 2;
  int32 max = 3;
}

// ADR-336 (2026-11-13) — bảng rao vặt. Command: Client -> Server (OPCODE_POST_BULLETIN_COMMAND).
// Mỗi nhân vật MỘT tin, sống 24 giờ; đăng tin mới thay tin cũ; body rỗng = gỡ tin của mình.
message PostBulletinCommand {
  string body = 1;
}

enum PostBulletinOutcome {
  POST_BULLETIN_OUTCOME_UNSPECIFIED = 0;
  POST_BULLETIN_OUTCOME_OK = 1;
  POST_BULLETIN_OUTCOME_REMOVED = 2;
  POST_BULLETIN_OUTCOME_INVALID_TEXT = 3;
  POST_BULLETIN_OUTCOME_TOO_SOON = 4; // đăng lại quá nhanh (dưới 1 phút)
}

// Response: Server -> Client (OPCODE_POST_BULLETIN_RESPONSE).
message PostBulletinResponse {
  PostBulletinOutcome outcome = 1;
}

// Request: Client -> Server (OPCODE_LIST_BULLETIN_REQUEST).
message ListBulletinRequest {}

message BulletinPost {
  string name = 1;
  string body = 2;
  int64 posted_at_epoch_seconds = 3;
  bool online = 4;
}

// Response: Server -> Client (OPCODE_LIST_BULLETIN_RESPONSE). Mới trước, tối đa 20 tin còn hạn.
message ListBulletinResponse {
  repeated BulletinPost posts = 1;
}
