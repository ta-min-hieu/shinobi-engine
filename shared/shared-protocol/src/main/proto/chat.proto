syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Chat (NETWORK.md §4, dải 800-899). Phase 6 lát cắt 6 làm Thế giới/Riêng tư/Khu vực.
// Bang hội thêm ở Phase 7 lát cắt 1 (feature-guild thật, quyết định 2026-07-23, ROADMAP.md) —
// người nhận là thành viên ĐANG online của bang người gửi (server-gateway tự tra
// GuildFacade.listMembers SAU KHI gửi OK, cùng cách Khu vực tự tra AoI). Party thêm ở Phase 7 lát
// cắt 2 (feature-party thật, 2026-07-24) — cùng cơ chế, tra PartyFacade.listMembers.
enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho packet thật.
  CHAT_CHANNEL_WORLD = 1;
  CHAT_CHANNEL_PRIVATE = 2;
  CHAT_CHANNEL_AREA = 3;
  CHAT_CHANNEL_GUILD = 4;
  CHAT_CHANNEL_PARTY = 5;
  CHAT_CHANNEL_SWORN = 6;   // ADR-110 (2026-10-25) — huynh đệ kết nghĩa
}

// Command: Client -> Server (OPCODE_SEND_CHAT_MESSAGE_COMMAND). target_name CHỈ có ý nghĩa khi
// channel = CHAT_CHANNEL_PRIVATE (server-gateway tự tra CharacterFacade.findByName).
message SendChatMessageCommand {
  ChatChannel channel = 1;
  string target_name = 2;
  string body = 3;
}

enum SendChatMessageOutcome {
  SEND_CHAT_MESSAGE_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SEND_CHAT_MESSAGE_OUTCOME_OK = 1;
  SEND_CHAT_MESSAGE_OUTCOME_MESSAGE_BLANK = 2;
  SEND_CHAT_MESSAGE_OUTCOME_MESSAGE_TOO_LONG = 3;
  SEND_CHAT_MESSAGE_OUTCOME_CONTAINS_BANNED_WORD = 4;
  SEND_CHAT_MESSAGE_OUTCOME_TARGET_NOT_FOUND = 5; // PRIVATE: tên không tồn tại
  SEND_CHAT_MESSAGE_OUTCOME_TARGET_OFFLINE = 6; // PRIVATE: tồn tại nhưng không online lúc gửi
  SEND_CHAT_MESSAGE_OUTCOME_RATE_LIMITED = 7;
  SEND_CHAT_MESSAGE_OUTCOME_NOT_IN_GUILD = 8; // GUILD: người gửi chưa vào bang nào
  SEND_CHAT_MESSAGE_OUTCOME_NOT_IN_PARTY = 9; // PARTY: người gửi chưa vào party nào
  SEND_CHAT_MESSAGE_OUTCOME_MUTED = 10; // ADR-052 (2026-10-18, chỉ thêm): tài khoản đang bị GM khoá chat
  SEND_CHAT_MESSAGE_OUTCOME_NOT_SWORN = 11; // ADR-110 (2026-10-25, chỉ thêm): SWORN mà chưa kết nghĩa
}

// Response: Server -> Client (OPCODE_SEND_CHAT_MESSAGE_RESPONSE).
message SendChatMessageResponse {
  SendChatMessageOutcome outcome = 1;
}

// Đẩy cho người nhận (World: toàn server; Riêng tư: 1 người; Khu vực: quan sát viên AoI, gồm cả
// người gửi để tự thấy tin của mình).
message ChatMessageEvent {
  ChatChannel channel = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  string body = 4;
  // ADR-062 — khoá i18n danh hiệu người gửi đang đeo; rỗng = không đeo (và mọi tin hệ thống).
  string sender_title_key = 5;
}

// ===== ADR-092 — biểu cảm. CHỈ THÊM. Phát cho mọi người đang nhìn thấy mình (AoI, gồm cả chính mình); client vẽ
// bong bóng trên đầu nhân vật. Không ghi DB. =====

enum Emote {
  EMOTE_UNSPECIFIED = 0;
  EMOTE_GREET = 1;    // /chao — chắp tay chào
  EMOTE_BOW = 2;      // /cui — cúi đầu
  EMOTE_LAUGH = 3;    // /cuoi — cười
  EMOTE_CRY = 4;      // /khoc — khóc
  EMOTE_ANGRY = 5;    // /gian — giận
  EMOTE_CHEER = 6;    // /vui — reo hò
}

// Command: Client -> Server (OPCODE_SEND_EMOTE_COMMAND = 803).
message SendEmoteCommand {
  Emote emote = 1;
}

enum SendEmoteOutcome {
  SEND_EMOTE_OUTCOME_UNSPECIFIED = 0;
  SEND_EMOTE_OUTCOME_OK = 1;
  SEND_EMOTE_OUTCOME_INVALID_EMOTE = 2;
  SEND_EMOTE_OUTCOME_RATE_LIMITED = 3;   // quá 1 lần / 2 giây
  SEND_EMOTE_OUTCOME_NOT_IN_WORLD = 4;
}

// Response: Server -> Client (OPCODE_SEND_EMOTE_RESPONSE = 804).
message SendEmoteResponse {
  SendEmoteOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_EMOTE_EVENT = 805).
message EmoteEvent {
  int64 character_id = 1;
  Emote emote = 2;
}

// ===== ADR-105 (2026-10-25) — báo cáo người chơi. CHỈ THÊM. =====

enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_CHAT = 1;
  REPORT_REASON_CHEAT = 2;
  REPORT_REASON_SCAM = 3;
  REPORT_REASON_OTHER = 4;
}

// Command: Client -> Server (OPCODE_REPORT_PLAYER_COMMAND = 806). Client gõ /report <tên> <lý do> [ghi chú].
message ReportPlayerCommand {
  string target_name = 1;
  ReportReason reason = 2;
  string note = 3;   // ≤ 200 ký tự, server cắt phần thừa
}

enum ReportPlayerOutcome {
  REPORT_PLAYER_OUTCOME_UNSPECIFIED = 0;
  REPORT_PLAYER_OUTCOME_OK = 1;
  REPORT_PLAYER_OUTCOME_UNKNOWN_TARGET = 2;
  REPORT_PLAYER_OUTCOME_SELF = 3;
  REPORT_PLAYER_OUTCOME_DAILY_LIMIT = 4;        // đã gửi đủ 5 báo cáo hôm nay
  REPORT_PLAYER_OUTCOME_ALREADY_REPORTED = 5;   // đã báo cáo người này hôm nay
  REPORT_PLAYER_OUTCOME_INVALID_REASON = 6;
}

// Response: Server -> Client (OPCODE_REPORT_PLAYER_RESPONSE = 807).
message ReportPlayerResponse {
  ReportPlayerOutcome outcome = 1;
}

// ADR-122 (2026-10-31) — hỏi đáp tông môn. Trả lời bằng chat kênh THẾ GIỚI; server chấm, người đúng đầu tiên nhận thư.

// Event: Server -> Client, mọi người online (OPCODE_QUIZ_QUESTION_EVENT = 808). question_key là khoá i18n.
message QuizQuestionEvent {
  int32 index = 1;            // 0-based
  int32 total = 2;
  string question_key = 3;
  int64 ends_at_epoch_ms = 4;
}

// Event: Server -> Client, mọi người online (OPCODE_QUIZ_REVEAL_EVENT = 809). winner_name rỗng = hết giờ không ai đúng.
message QuizRevealEvent {
  int32 index = 1;
  string answer_key = 2;
  string winner_name = 3;
  int64 reward_gold = 4;
}
