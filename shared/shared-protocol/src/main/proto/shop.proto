syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Shop (NETWORK.md §4, dải 1000-1099). Phase 5 "mua bán" — shop TOÀN CỤC, chưa gắn NPC/vị
// trí (Phase 6 mới có NPC/Dialogue). buy_price/sell_price đọc từ shop_item (server, KHÔNG tin
// giá client gửi lên — Điều 24).

// 1 dòng danh mục — client hỏi trước khi mua/bán để biết giá. item_template_id (không phải code),
// giống ItemGrantedEvent — client chưa có catalog để tra tên/icon ở lát cắt này.
message ShopListingView {
  int64 item_template_id = 1;
  int64 buy_price = 2;
  int64 sell_price = 3;
}

// Command: Client -> Server (OPCODE_LIST_SHOP_ITEMS_REQUEST). Không có field — luôn trả TOÀN BỘ
// danh mục (chưa có nhiều shop/NPC khác nhau để lọc).
message ListShopItemsRequest {
}

// Response: Server -> Client (OPCODE_LIST_SHOP_ITEMS_RESPONSE).
message ListShopItemsResponse {
  repeated ShopListingView listings = 1;
}

enum BuyOutcome {
  BUY_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  BUY_OUTCOME_OK = 1;
  BUY_OUTCOME_ITEM_NOT_IN_SHOP = 2;
  BUY_OUTCOME_INSUFFICIENT_GOLD = 3;
  BUY_OUTCOME_INVENTORY_FULL = 4;
  BUY_OUTCOME_DUPLICATE_REQUEST = 5; // ADR-025: idempotency_key đã dùng trước đó (client tự retry)
}

// Command: Client -> Server (OPCODE_BUY_ITEM_COMMAND). Server tự tra buy_price theo
// item_template_id hiện tại trong shop_item, KHÔNG tin giá/tổng tiền từ client.
// idempotency_key (ADR-025, thêm 2026-07-24): UUID v4 client tự sinh, giữ nguyên khi tự retry
// cùng 1 lần mua — server enforce unique ở bảng idempotency_key trong CÙNG transaction với hiệu
// ứng thật (trừ gold + cộng item), chống mua trùng khi client mất kết nối trước khi nhận response.
message BuyItemCommand {
  int64 item_template_id = 1;
  int32 quantity = 2;
  string idempotency_key = 3;
}

// Response: Server -> Client (OPCODE_BUY_ITEM_RESPONSE).
message BuyItemResponse {
  BuyOutcome outcome = 1;
}

enum SellOutcome {
  SELL_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  SELL_OUTCOME_OK = 1;
  SELL_OUTCOME_ITEM_NOT_FOUND = 2;
  SELL_OUTCOME_ITEM_NOT_SELLABLE = 3;
  SELL_OUTCOME_INSUFFICIENT_QUANTITY = 4;
  SELL_OUTCOME_DUPLICATE_REQUEST = 5; // ADR-025: idempotency_key đã dùng trước đó (client tự retry)
  // THÊM 2026-10-18 (dòng 80, chủ dự án duyệt; chỉ thêm, protocolVersion không tăng): phần muốn bán
  // đang được chào trong một phiên giao dịch còn mở — rút khỏi giao dịch rồi bán.
  SELL_OUTCOME_ITEM_IN_TRADE = 6;
}

// Command: Client -> Server (OPCODE_SELL_ITEM_COMMAND). item_id là inventory_item.id THẬT (không
// phải vị trí) — server tự tính tiền theo sell_price hiện tại trong shop_item, KHÔNG tin số liệu
// từ client (Điều 24). idempotency_key: xem BuyItemCommand ở trên (ADR-025).
message SellItemCommand {
  int64 item_id = 1;
  int32 quantity = 2;
  string idempotency_key = 3;
}

// Response: Server -> Client (OPCODE_SELL_ITEM_RESPONSE).
message SellItemResponse {
  SellOutcome outcome = 1;
}

// ===== ADR-202 (Accepted 2026-11-07, chủ dự án chọn) — mua lại đồ đã bán cho cửa hàng NPC. CHỈ THÊM. =====

// Một món mua lại được. price = đúng số vàng đã nhận lúc bán; seconds_left = còn bao lâu trước khi hết hạn (1 giờ).
message BuybackView {
  int64 entry_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int32 enhance_level = 4;
  int64 price = 5;
  int64 seconds_left = 6;
}

// Request: Client -> Server (OPCODE_LIST_BUYBACK_REQUEST = 1036).
message ListBuybackRequest {}

// Response: Server -> Client (OPCODE_LIST_BUYBACK_RESPONSE = 1037). Mới nhất trước, tối đa 10.
message ListBuybackResponse {
  repeated BuybackView entries = 1;
}

// Command: Client -> Server (OPCODE_BUYBACK_COMMAND = 1038).
message BuybackCommand {
  int64 entry_id = 1;
}

enum BuybackOutcome {
  BUYBACK_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  BUYBACK_OUTCOME_OK = 1;
  BUYBACK_OUTCOME_NOT_FOUND = 2;          // không có, của người khác, hoặc đã quá 1 giờ
  BUYBACK_OUTCOME_INSUFFICIENT_GOLD = 3;
  BUYBACK_OUTCOME_BAG_FULL = 4;
}

// Response: Server -> Client (OPCODE_BUYBACK_RESPONSE = 1039). Mang danh sách SAU lệnh; vàng mới đi bằng 209.
message BuybackResponse {
  BuybackOutcome outcome = 1;
  repeated BuybackView entries = 2;
}
