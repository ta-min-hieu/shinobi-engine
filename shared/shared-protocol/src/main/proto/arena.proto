syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Arena (NETWORK.md §4, dải 1600-1699). Phase 8 lát cắt 4 — PvP Arena 1v1 + MMR/rating cơ
// bản (GDD §6). Thách đấu bằng TÊN (giống RequestTradeCommand/SendFriendRequestCommand) — server
// tự tra CharacterFacade.findByName TRƯỚC khi gọi ArenaInstanceRegistry. Trận đấu diễn ra trong 1
// World instance riêng (ADR-026, cùng cơ chế dungeon) — CHỈ 2 người trong instance đó, không cần
// team/faction check ở CombatSystem vì cách ly instance đã đủ (xem feature-pvp/CLAUDE.md).

message ChallengeDuelCommand {
  string target_name = 1;
}

enum ChallengeDuelOutcome {
  CHALLENGE_DUEL_OUTCOME_UNSPECIFIED = 0; // protobuf enum bắt buộc có giá trị 0 — KHÔNG dùng cho kết quả thật.
  CHALLENGE_DUEL_OUTCOME_OK = 1;
  CHALLENGE_DUEL_OUTCOME_CANNOT_CHALLENGE_SELF = 2;
  CHALLENGE_DUEL_OUTCOME_ALREADY_IN_DUEL = 3;
  CHALLENGE_DUEL_OUTCOME_TARGET_ALREADY_IN_DUEL = 4;
  CHALLENGE_DUEL_OUTCOME_TARGET_NOT_FOUND = 5; // tên không tồn tại (character)
  CHALLENGE_DUEL_OUTCOME_TARGET_OFFLINE = 6;
  // Chỉ THÊM (2026-10-14, README dòng 27): trước đó người đang ở hầm ngục nhận ALREADY_IN_DUEL /
  // TARGET_ALREADY_IN_DUEL và đọc "đang đấu" — sai lý do. protocolVersion KHÔNG tăng; client cũ gặp
  // giá trị lạ thì rơi vào UNRECOGNIZED như mọi enum protobuf.
  CHALLENGE_DUEL_OUTCOME_IN_DUNGEON = 7; // người thách đang ở hầm ngục
  CHALLENGE_DUEL_OUTCOME_TARGET_IN_DUNGEON = 8; // người bị thách đang ở hầm ngục
}

message ChallengeDuelResponse {
  ChallengeDuelOutcome outcome = 1;
  int64 challenge_id = 2; // chỉ có ý nghĩa khi outcome = OK
}

message AcceptDuelCommand {
  int64 challenge_id = 1;
}

enum AcceptDuelOutcome {
  ACCEPT_DUEL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  ACCEPT_DUEL_OUTCOME_OK = 1;
  ACCEPT_DUEL_OUTCOME_NOT_FOUND = 2;
  // Chỉ THÊM (2026-10-14, README dòng 27): một trong hai người đã vào hầm ngục sau lúc thách — lời
  // thách bị tiêu, trận không mở. Trước đó trả NOT_FOUND.
  ACCEPT_DUEL_OUTCOME_IN_DUNGEON = 3;
}

message AcceptDuelResponse {
  AcceptDuelOutcome outcome = 1;
}

message DeclineDuelCommand {
  int64 challenge_id = 1;
}

enum DeclineDuelOutcome {
  DECLINE_DUEL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  DECLINE_DUEL_OUTCOME_OK = 1;
  DECLINE_DUEL_OUTCOME_NOT_FOUND = 2;
}

message DeclineDuelResponse {
  DeclineDuelOutcome outcome = 1;
}

// Bỏ cuộc giữa chừng — tính THUA thật (mất điểm MMR), khác ExitDungeonCommand (không mất gì).
// Không tham số — server tự tra nhân vật đang ở trận nào.
message ExitDuelCommand {
}

enum ExitDuelOutcome {
  EXIT_DUEL_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  EXIT_DUEL_OUTCOME_OK = 1;
  EXIT_DUEL_OUTCOME_NOT_IN_DUEL = 2;
}

message ExitDuelResponse {
  ExitDuelOutcome outcome = 1;
}

// Đẩy cho target khi có thách đấu mới — client tự quyết định hỏi Accept/Decline.
message DuelChallengeReceivedEvent {
  int64 challenge_id = 1;
  int64 challenger_character_id = 2;
  string challenger_name = 3;
}

// Đẩy cho challenger khi bị từ chối.
message DuelChallengeDeclinedEvent {
  int64 challenge_id = 1;
}

// Đẩy cho CẢ 2 người khi trận đấu bắt đầu thật (đã vào World riêng) — client chuyển màn hình Arena.
message DuelStartedEvent {
  int64 opponent_character_id = 1;
  string opponent_name = 2;
}

// Đẩy cho CẢ 2 người khi trận đấu kết thúc (hạ gục hoặc bỏ cuộc) — kèm rating mới sau khi tính Elo.
message DuelResultEvent {
  int64 winner_character_id = 1;
  int64 loser_character_id = 2;
  int32 winner_new_rating = 3;
  int32 loser_new_rating = 4;
}

message GetPvpRatingRequest {
}

message GetPvpRatingResponse {
  int32 rating = 1;
  int32 wins = 2;
  int32 losses = 3;
}

// ADR-125 (2026-10-31) — luận võ đại hội. Giải tuần (mặc định Chủ nhật 20:00 giờ VN), đăng ký trong ngày, loại trực
// tiếp: server tự mở trận đấu trường (cùng đường thách đấu ADR-051) cho từng cặp.

// Command: Client -> Server (OPCODE_REGISTER_TOURNAMENT_COMMAND = 1612).
message RegisterTournamentCommand {}

enum TournamentRegisterOutcome {
  TOURNAMENT_REGISTER_OUTCOME_UNSPECIFIED = 0;
  TOURNAMENT_REGISTER_OUTCOME_OK = 1;
  TOURNAMENT_REGISTER_OUTCOME_CLOSED = 2;              // không phải giờ đăng ký
  TOURNAMENT_REGISTER_OUTCOME_ALREADY_REGISTERED = 3;
  TOURNAMENT_REGISTER_OUTCOME_FULL = 4;
  TOURNAMENT_REGISTER_OUTCOME_LEVEL_TOO_LOW = 5;
}

// Response: Server -> Client (OPCODE_REGISTER_TOURNAMENT_RESPONSE = 1613).
message RegisterTournamentResponse {
  TournamentRegisterOutcome outcome = 1;
}

enum TournamentNoticeKind {
  TOURNAMENT_NOTICE_KIND_UNSPECIFIED = 0;
  TOURNAMENT_NOTICE_KIND_MATCH = 1;      // gửi riêng: vòng {round} gặp {name}; name rỗng = được đi thẳng
  TOURNAMENT_NOTICE_KIND_CHAMPION = 2;   // gửi cả server: {name} vô địch
}

// Event: Server -> Client (OPCODE_TOURNAMENT_NOTICE_EVENT = 1614).
message TournamentNoticeEvent {
  TournamentNoticeKind kind = 1;
  int32 round = 2;
  string name = 3;
}

// ADR-155 (2026-11-02) — Cửa hàng điểm vinh dự đấu trường. Thắng +10, thua +3, tối đa 100/ngày giờ Việt Nam.
message HonorShopItemView {
  int64 item_template_id = 1;
  int32 price = 2;
  int32 quantity = 3;           // số cái mỗi lần đổi
  int32 weekly_limit = 4;
  int32 bought_this_week = 5;
}

// Request: Client -> Server (OPCODE_GET_HONOR_SHOP_REQUEST = 1615). Chỉ đọc.
message GetHonorShopRequest {}

// Response: Server -> Client (OPCODE_GET_HONOR_SHOP_RESPONSE = 1616). available = điểm còn tiêu được.
message GetHonorShopResponse {
  int64 available = 1;
  repeated HonorShopItemView items = 2;
}

// Command: Client -> Server (OPCODE_BUY_HONOR_ITEM_COMMAND = 1617).
message BuyHonorItemCommand {
  int64 item_template_id = 1;
}

enum BuyHonorItemOutcome {
  BUY_HONOR_ITEM_OUTCOME_UNSPECIFIED = 0;
  BUY_HONOR_ITEM_OUTCOME_OK = 1;
  BUY_HONOR_ITEM_OUTCOME_UNKNOWN_ITEM = 2;
  BUY_HONOR_ITEM_OUTCOME_NOT_ENOUGH_HONOR = 3;
  BUY_HONOR_ITEM_OUTCOME_WEEKLY_LIMIT = 4;
  BUY_HONOR_ITEM_OUTCOME_BAG_FULL = 5;   // không trừ điểm
}

// Response: Server -> Client (OPCODE_BUY_HONOR_ITEM_RESPONSE = 1618). Kèm cửa hàng SAU lệnh.
message BuyHonorItemResponse {
  BuyHonorItemOutcome outcome = 1;
  GetHonorShopResponse shop = 2;
}
