syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// ADR-063 — phường thị (dải Shop/Auction 1006–1014). characterId luôn lấy từ session (SECURITY.md §4).
// Chỉ món CHƯA cường hoá được treo (D2) nên dòng treo không có cấp cường hoá.

message MarketListingView {
  int64 listing_id = 1;
  int64 seller_id = 2;
  string seller_name = 3;
  int64 item_template_id = 4;
  int32 quantity = 5;
  int64 price = 6;          // giá TỔNG cả dòng
  int64 expires_at_epoch_seconds = 7;
}

// Request: Client -> Server (OPCODE_LIST_MARKET_REQUEST = 1006). item_template_id = 0 ⇒ mọi loại.
message ListMarketRequest {
  int64 item_template_id = 1;
}

// Response: Server -> Client (OPCODE_LIST_MARKET_RESPONSE = 1007). `listings` = tối đa 50 dòng mới nhất
// (không gồm dòng của chính người hỏi); `mine` = mọi dòng người hỏi đang treo.
message ListMarketResponse {
  repeated MarketListingView listings = 1;
  repeated MarketListingView mine = 2;
  int32 max_active_listings = 3;
  int32 fee_percent = 4;
}

enum MarketResult {
  MARKET_RESULT_UNSPECIFIED = 0;
  MARKET_RESULT_OK = 1;
  MARKET_RESULT_NOT_FOUND = 2;            // dòng/món không còn (đã bán, đã huỷ, hết hạn, không phải của mình)
  MARKET_RESULT_INVALID_QUANTITY = 3;
  MARKET_RESULT_INVALID_PRICE = 4;
  MARKET_RESULT_EQUIPPED = 5;
  MARKET_RESULT_ENHANCED_NOT_ALLOWED = 6;
  MARKET_RESULT_ITEM_IN_TRADE = 7;
  MARKET_RESULT_TOO_MANY_LISTINGS = 8;
  MARKET_RESULT_OWN_LISTING = 9;
  MARKET_RESULT_INSUFFICIENT_GOLD = 10;
  MARKET_RESULT_BAG_FULL = 11;
  MARKET_RESULT_DUPLICATE_REQUEST = 12;   // ADR-025 — đã xử lý trước đó, coi như xong
}

// Command: Client -> Server (OPCODE_CREATE_LISTING_COMMAND = 1008).
message CreateListingCommand {
  int64 inventory_item_id = 1;
  int32 quantity = 2;
  int64 price = 3;
  string idempotency_key = 4;
}

// Response: Server -> Client (OPCODE_CREATE_LISTING_RESPONSE = 1009).
message CreateListingResponse {
  MarketResult outcome = 1;
}

// Command: Client -> Server (OPCODE_BUY_LISTING_COMMAND = 1010). Mua CẢ dòng.
message BuyListingCommand {
  int64 listing_id = 1;
  string idempotency_key = 2;
}

// Response: Server -> Client (OPCODE_BUY_LISTING_RESPONSE = 1011).
message BuyListingResponse {
  MarketResult outcome = 1;
}

// Command: Client -> Server (OPCODE_CANCEL_LISTING_COMMAND = 1012). Trạng thái tuyệt đối — không cần khoá.
message CancelListingCommand {
  int64 listing_id = 1;
}

// Response: Server -> Client (OPCODE_CANCEL_LISTING_RESPONSE = 1013).
message CancelListingResponse {
  MarketResult outcome = 1;
}

// Event: Server -> Client (OPCODE_LISTING_SOLD_EVENT = 1014). Gửi cho NGƯỜI BÁN đang online khi dòng của
// họ vừa bán; vàng mới tới riêng bằng GoldChangedEvent (209).
message ListingSoldEvent {
  int64 listing_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int64 proceeds = 4;       // đã trừ phí
}

// ADR-116 (2026-10-30) — cầu mua. Người đặt ký quỹ quantity × unit_price linh thạch lúc đặt; người bán bán thẳng vào
// lệnh (nhận tiền từ ký quỹ, trừ phí 5%); món vào túi người đặt. Huỷ ⇒ hoàn phần ký quỹ còn lại ngay; hết hạn 48 giờ ⇒
// hoàn qua thư. Đặt lệnh và bán vào lệnh bị khoá an toàn chặn (ADR-115).
enum BuyOrderOutcome {
  BUY_ORDER_OUTCOME_UNSPECIFIED = 0;
  BUY_ORDER_OUTCOME_OK = 1;
  BUY_ORDER_OUTCOME_NOT_FOUND = 2;
  BUY_ORDER_OUTCOME_UNKNOWN_ITEM = 3;
  BUY_ORDER_OUTCOME_INVALID_QUANTITY = 4;
  BUY_ORDER_OUTCOME_INVALID_PRICE = 5;
  BUY_ORDER_OUTCOME_TOO_MANY_ORDERS = 6;
  BUY_ORDER_OUTCOME_INSUFFICIENT_GOLD = 7;
  BUY_ORDER_OUTCOME_OWN_ORDER = 8;
  BUY_ORDER_OUTCOME_WRONG_ITEM = 9;
  BUY_ORDER_OUTCOME_EQUIPPED = 10;
  BUY_ORDER_OUTCOME_ENHANCED_NOT_ALLOWED = 11;
  BUY_ORDER_OUTCOME_ITEM_IN_TRADE = 12;
  BUY_ORDER_OUTCOME_BUYER_BAG_FULL = 13;
}

message BuyOrderView {
  int64 order_id = 1;
  int64 item_template_id = 2;
  int32 quantity_wanted = 3;
  int32 quantity_filled = 4;
  int64 unit_price = 5;
  int64 expires_at_epoch_ms = 6;
}

// Request: Client -> Server (OPCODE_LIST_BUY_ORDERS_REQUEST = 1015). item_template_id = 0 ⇒ mọi loại.
message ListBuyOrdersRequest {
  int64 item_template_id = 1;
}

// Response: Server -> Client (OPCODE_LIST_BUY_ORDERS_RESPONSE = 1016). `orders` = tối đa 50 lệnh giá cao nhất (không gồm
// lệnh của người hỏi); `mine` = lệnh người hỏi đang mở.
message ListBuyOrdersResponse {
  repeated BuyOrderView orders = 1;
  repeated BuyOrderView mine = 2;
}

// Command: Client -> Server (OPCODE_CREATE_BUY_ORDER_COMMAND = 1017).
message CreateBuyOrderCommand {
  int64 item_template_id = 1;
  int32 quantity = 2;
  int64 unit_price = 3;
}

// Response: Server -> Client (OPCODE_CREATE_BUY_ORDER_RESPONSE = 1018).
message CreateBuyOrderResponse {
  BuyOrderOutcome outcome = 1;
}

// Command: Client -> Server (OPCODE_SELL_TO_BUY_ORDER_COMMAND = 1019).
message SellToBuyOrderCommand {
  int64 order_id = 1;
  int64 inventory_item_id = 2;
  int32 quantity = 3;
}

// Response: Server -> Client (OPCODE_SELL_TO_BUY_ORDER_RESPONSE = 1020).
message SellToBuyOrderResponse {
  BuyOrderOutcome outcome = 1;
  int64 proceeds = 2;
}

// Command: Client -> Server (OPCODE_CANCEL_BUY_ORDER_COMMAND = 1021).
message CancelBuyOrderCommand {
  int64 order_id = 1;
}

// Response: Server -> Client (OPCODE_CANCEL_BUY_ORDER_RESPONSE = 1022).
message CancelBuyOrderResponse {
  BuyOrderOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_BUY_ORDER_FILLED_EVENT = 1023). Gửi người đặt (nếu online) mỗi lần có người bán vào.
message BuyOrderFilledEvent {
  int64 order_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
}

// ADR-118 (2026-10-30) — thương nhân du hành. Server tự lên lịch 2–3 lần ghé mỗi ngày (giờ VN) ở các điểm truyền tống,
// mỗi lần 30 phút, mang 3 món hiếm; số lượng mỗi món CHUNG cả server. Mua phải đứng gần trạm (≤ 8 m).
enum MerchantBuyResult {
  MERCHANT_BUY_RESULT_UNSPECIFIED = 0;
  MERCHANT_BUY_RESULT_OK = 1;
  MERCHANT_BUY_RESULT_NOT_PRESENT = 2;      // thương nhân không ở đây (chưa tới, đã đi, hoặc đứng xa trạm)
  MERCHANT_BUY_RESULT_SOLD_OUT = 3;
  MERCHANT_BUY_RESULT_NOT_FOUND = 4;
  MERCHANT_BUY_RESULT_INSUFFICIENT_GOLD = 5;
  MERCHANT_BUY_RESULT_BAG_FULL = 6;
}

message MerchantStockView {
  int64 item_template_id = 1;
  int64 price = 2;
  int32 remaining = 3;
}

// Request: Client -> Server (OPCODE_GET_TRAVELING_MERCHANT_REQUEST = 1024).
message GetTravelingMerchantRequest {
}

// Response: Server -> Client (OPCODE_GET_TRAVELING_MERCHANT_RESPONSE = 1025). present = false ⇒ các field khác rỗng.
message GetTravelingMerchantResponse {
  bool present = 1;
  string waypoint_code = 2;
  string waypoint_name_key = 3;
  float x = 4;
  int64 ends_at_epoch_ms = 5;
  repeated MerchantStockView stock = 6;
}

// Command: Client -> Server (OPCODE_BUY_FROM_MERCHANT_COMMAND = 1026). Một cái mỗi lần.
message BuyFromMerchantCommand {
  int64 item_template_id = 1;
}

// Response: Server -> Client (OPCODE_BUY_FROM_MERCHANT_RESPONSE = 1027).
message BuyFromMerchantResponse {
  MerchantBuyResult result = 1;
}

// Event: Server -> Client (OPCODE_TRAVELING_MERCHANT_ARRIVED_EVENT = 1028). Gửi MỌI người online đúng một lần mỗi lần ghé.
message TravelingMerchantArrivedEvent {
  string waypoint_code = 1;
  string waypoint_name_key = 2;
  float x = 3;
  int64 ends_at_epoch_ms = 4;
}

// ===== ADR-177 — lịch sử phường thị. CHỈ THÊM. Món mình đã bán / đã mua (đã chốt), 30 ngày, tối đa 50 dòng.

// Request: Client -> Server (OPCODE_GET_MARKET_HISTORY_REQUEST = 1029). Người hỏi lấy từ session.
message GetMarketHistoryRequest {}

message MarketHistoryEntry {
  bool sold = 1;               // true = mình bán; false = mình mua
  int64 item_template_id = 2;
  int32 quantity = 3;
  int64 price = 4;             // giá tổng cả dòng
  int64 gold_delta = 5;        // bán: +tiền thực nhận (đã trừ phí 5%); mua: -price
  string counterpart_name = 6; // người mua (khi mình bán) / người bán (khi mình mua); "" = nhân vật không còn
  int64 at_epoch_seconds = 7;
}

// Response: Server -> Client (OPCODE_GET_MARKET_HISTORY_RESPONSE = 1030). Mới nhất trước.
message GetMarketHistoryResponse {
  repeated MarketHistoryEntry entries = 1;
}

// ===== ADR-196 (Accepted 2026-11-07, chủ dự án chọn) — theo dõi phường thị. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_SET_MARKET_WATCH_COMMAND = 1031). max_unit_price = giá MỖI CÁI tối đa;
// 0 = bỏ theo dõi loại này.
message SetMarketWatchCommand {
  int64 item_template_id = 1;
  int64 max_unit_price = 2;
}

enum SetMarketWatchOutcome {
  SET_MARKET_WATCH_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  SET_MARKET_WATCH_OUTCOME_OK = 1;           // đặt mới hoặc sửa mức giá
  SET_MARKET_WATCH_OUTCOME_REMOVED = 2;
  SET_MARKET_WATCH_OUTCOME_NOT_WATCHING = 3; // bỏ một loại đang không theo dõi
  SET_MARKET_WATCH_OUTCOME_TOO_MANY = 4;     // đã theo dõi đủ max_watches loại
  SET_MARKET_WATCH_OUTCOME_INVALID = 5;
}

// Response: Server -> Client (OPCODE_SET_MARKET_WATCH_RESPONSE = 1032).
message SetMarketWatchResponse {
  SetMarketWatchOutcome outcome = 1;
  int64 item_template_id = 2;
  int64 max_unit_price = 3;
}

// Request: Client -> Server (OPCODE_LIST_MARKET_WATCH_REQUEST = 1033).
message ListMarketWatchRequest {}

message MarketWatchView {
  int64 item_template_id = 1;
  int64 max_unit_price = 2;
}

// Response: Server -> Client (OPCODE_LIST_MARKET_WATCH_RESPONSE = 1034).
message ListMarketWatchResponse {
  repeated MarketWatchView watches = 1;
  int32 max_watches = 2;
}

// Event: Server -> Client (OPCODE_MARKET_WATCH_ALERT_EVENT = 1035) — ai đó vừa bày món mình theo dõi với giá mỗi cái
// (làm tròn lên) không quá mức mình đặt. Chỉ gửi người đang online; người bán không nhận báo về món của mình.
message MarketWatchAlertEvent {
  int64 listing_id = 1;
  int64 item_template_id = 2;
  int32 quantity = 3;
  int64 price = 4;
  int64 unit_price = 5;
  string seller_name = 6;
}
