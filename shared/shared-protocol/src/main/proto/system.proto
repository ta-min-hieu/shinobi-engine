syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet hệ thống — handshake, heartbeat, lỗi (NETWORK.md §101, §107, §108). Payload PROTOBUF;
// opcode/protocolVersion/sequenceId nằm ở HEADER (không phải protobuf — xem PacketHeader.java).

// Command: Client -> Server, cần Response (OPCODE_PING).
message PingCommand {
  int64 client_timestamp_ms = 1;
}

// Response: Server -> Client, khớp Ping qua sequenceId ở header (OPCODE_PONG).
message PongResponse {
  int64 client_timestamp_ms = 1; // echo lại để client tự tính round-trip time
  int64 server_timestamp_ms = 2;
}

// Command: Client -> Server, mở phiên (OPCODE_CONNECT_REQUEST).
// Phase 3 (ADR-017 ✅ Accepted): đăng nhập bằng username, dự án cá nhân nên chưa cần mật khẩu ở
// bước này — feature-account tự tạo account nếu username chưa tồn tại. `token` giữ nguyên field 1
// (không đổi số field đang dùng — shared/CLAUDE.md) dự phòng cho luồng resume-session-bằng-token
// thật sau này; hiện chưa dùng.
message ConnectRequest {
  string token = 1; // dự phòng cho resume session bằng token — CHƯA DÙNG ở bước username-only này
  string username = 2; // Điều 24: đăng nhập/tự-tạo account qua feature-account, không lấy trực tiếp
}

// Response: Server -> Client (OPCODE_CONNECT_RESPONSE).
message ConnectResponse {
  bool success = 1;
  string session_id = 2; // = session token thật (ADR-017: opaque random 256-bit, sliding TTL 24h)
  string error_key = 3; // rỗng nếu success=true (NETWORK.md §107: key i18n, không message cứng)
  int64 account_id = 4;
}

// Response lỗi dùng chung mọi Command (NETWORK.md §107). Client hiển thị theo error_key + ngôn
// ngữ hiện tại — server không hardcode message hiển thị.
message ErrorResponse {
  uint32 error_code = 1;
  string error_key = 2;
  uint32 related_sequence_id = 3;
}

// Event: Server -> Client (OPCODE_SERVER_SHUTTING_DOWN_EVENT). Gửi cho MỌI connection đã chọn
// nhân vật NGAY TRƯỚC khi đóng kết nối lúc graceful shutdown (SERVER.md §10 bước 2) — client nên
// hiểu đây là bảo trì có chủ đích, không phải mất kết nối bất thường (không cần backoff reconnect
// ngay). Không có field — chỉ là tín hiệu, chưa có cơ chế đếm ngược 30s (follow-up).
message ServerShuttingDownEvent {
}

// ADR-103 (2026-10-25) — thông báo server. Event: Server -> Client (OPCODE_SERVER_NOTICE_EVENT = 7). Gửi ngay sau
// SelectCharacterResponse khi có thông báo, và cho mọi người online khi ADMIN đặt mới. body = chữ ADMIN gõ (nội dung
// người dùng, không phải khoá i18n — cùng ngoại lệ /gm announce).
message ServerNoticeEvent {
  string body = 1;
}
