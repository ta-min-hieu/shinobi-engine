syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Faction + CostumeTier — CharacterSpawnedEvent cần chúng để client biết nạp model nào (ADR-031).
import "character.proto";

// Packet Movement/World (NETWORK.md §4, dải 300-399). characterId lấy từ session gắn với
// connection (server-gateway), KHÔNG có field characterId trong MoveCommand — đúng
// "characterId từ session, không từ packet" (SECURITY.md §4, chống IDOR).
//
// Server SỞ HỮU tốc độ di chuyển — client CHỈ gửi hướng đã chuẩn hoá (dir_x, dir_y trong
// [-1,1]), KHÔNG BAO GIỜ gửi tốc độ hay vị trí tuyệt đối. Server tự nhân hướng với hằng số
// tốc độ (server-world WorldConstants.MOVE_SPEED_MPS) — chặn speed-hack/teleport BẰNG THIẾT
// KẾ, không cần kiểm tra khoảng cách/tick hậu kỳ (GAMEPLAY.md §12, SECURITY.md §8).

// Command: Client -> Server (OPCODE_MOVE_COMMAND). Gửi khi hướng di chuyển đổi (nhấn/nhả phím),
// KHÔNG gửi liên tục mỗi frame.
//
// ADR-033 (2026-08-08): di chuyển người chơi chỉ còn trái/phải — dir_y GIỮ NGUYÊN trong message
// (KHÔNG được đổi/xoá field protobuf đang dùng, shared/CLAUDE.md) nhưng server-world giờ LUÔN bỏ
// qua giá trị này cho nhân vật người chơi (WorldFacade.handleMoveIntent ép dirY=0 — Server
// Authority, không tin client dù field cũ còn tồn tại trên dây). Trục dọc giờ đi qua JumpCommand.
message MoveCommand {
  float dir_x = 1;
  float dir_y = 2;
}

// Command: Client -> Server (OPCODE_JUMP_COMMAND, ADR-033). Ý ĐỊNH nhảy — không có field (giống
// MoveCommand, characterId lấy từ session, chống IDOR). Server chỉ áp lực nhảy nếu nhân vật đang
// grounded (WorldFacade.handleJumpIntent); gửi khi nhấn (rising edge), KHÔNG lặp lại khi giữ phím.
message JumpCommand {}

// Response: Server -> Client (OPCODE_MOVE_RESPONSE). Vị trí THẬT của CHÍNH nhân vật gửi lệnh —
// dùng cho reconciliation phía client (CLIENT.md §6). Khớp sequenceId với MoveCommand/JumpCommand
// tương ứng (ADR-033: JumpCommand cũng được ack qua đúng response này, không cần packet riêng).
//
// z/grounded thêm ở ADR-033 (chỉ THÊM field, giữ nguyên số field x/y đã dùng — shared/CLAUDE.md).
message MoveResponse {
  float x = 1;
  float y = 2;
  float z = 3;
  bool grounded = 4;
}

// Event: Server -> Client (OPCODE_CHARACTER_MOVED_EVENT). Vị trí nhân vật KHÁC trong AoI
// (SERVER.md §6) — không gửi Event này cho chính nhân vật đó (nó đã có MoveResponse).
//
// ⚠️ ADR-033 (2026-08-08, lát cắt 1): CHƯA thêm z/grounded ở đây — nhân vật KHÁC luôn hiện z=0
// (không thấy người khác nhảy) dù server đã mô phỏng trục dọc thật cho họ. Cố tình hoãn: thêm z
// vào đây kéo theo sửa AreaOfInterestTracker.lastSyncedPosition (mảng float[2] tái dùng mỗi tick,
// PHYSICS.md hot path đã tối ưu allocation) — để riêng thành 1 lượt sau khi cơ chế nhảy của CHÍNH
// người chơi đã chạy đúng và đo được, tránh đổi 2 việc rủi ro cao cùng lúc. Xem ADR-033 "Việc cần
// làm tiếp theo".
message CharacterMovedEvent {
  int64 character_id = 1;
  float x = 2;
  float y = 3;
}

// Event: Server -> Client (OPCODE_CHARACTER_SPAWNED_EVENT). Nhân vật khác VỪA vào AoI (kết nối
// mới hoặc đi tới gần) — client tạo entity render cho nó.
//
// faction + costume_tier là NGOẠI HÌNH, không phải chỉ số: client ghép chúng thành khoá asset
// (`char_<hệ>-<bậc>`) để chọn model glTF phải nạp (ADR-031). Trước khi có 2 field này, MỌI nhân
// vật đều hiện cùng một model vì client không có cách nào biết. Server vẫn là nguồn chân lý —
// client KHÔNG tự chọn ngoại hình của người khác (Điều 15).
//
// Thêm field mới vào message đã có là TƯƠNG THÍCH NGƯỢC ở tầng dây (proto3), nên
// ProtocolVersion.CURRENT giữ nguyên — đúng javadoc của chính lớp đó.
message CharacterSpawnedEvent {
  int64 character_id = 1;
  float x = 2;
  float y = 3;
  Faction faction = 4;
  CostumeTier costume_tier = 5;
  // ADR-140 — cấp của nhân vật (client hiện tên CẢNH GIỚI trên đầu). 0 = chưa biết (đã ngắt kết nối).
  int32 level = 6;
  // ADR-142 — Ma Đầu (sát khí cao): client vẽ nhãn đỏ trên đầu để người khác biết mà truy.
  bool outlaw = 7;
}

// Event: Server -> Client (OPCODE_CHARACTER_DESPAWNED_EVENT). Nhân vật khác VỪA rời AoI (ngắt
// kết nối hoặc đi xa) — client xoá entity render tương ứng.
message CharacterDespawnedEvent {
  int64 character_id = 1;
}

// Event: Server -> Client (OPCODE_CHARACTER_RESPAWNED_EVENT). CHÍNH nhân vật gửi lệnh vừa hồi
// sinh sau khi HP về 0 — không có character_id, cùng quy ước "ngầm định là chính mình" như
// MoveResponse. x/y là vị trí hồi sinh, current_hp/current_chi luôn bằng max (server tự đặt lại
// toàn bộ khi hồi sinh) nhưng vẫn gửi cả 4 giá trị để client không tự đoán/hardcode — server luôn
// là nguồn chân lý (Điều 15), kể cả với giá trị "hiển nhiên đầy".
message CharacterRespawnedEvent {
  float x = 1;
  float y = 2;
  int32 current_hp = 3;
  int32 max_hp = 4;
  int32 current_chi = 5;
  int32 max_chi = 6;
}

// Event: Server -> Client (OPCODE_CHARACTER_APPEARANCE_CHANGED_EVENT, ADR-045). Ngoại hình của
// MỘT nhân vật đang trong tầm nhìn vừa đổi (đổi hệ phái giữa phiên chơi) — client thay model TẠI
// CHỖ, KHÔNG despawn rồi spawn lại: entity/vị trí/trạng thái động tác phải giữ nguyên, và thế bất
// biến "spawn = tạo mới" ở RemoteCharacterPresenter phải còn nguyên vẹn.
//
// Chính người vừa đổi cũng nhận event này (server tự thêm họ vào tập nhận) — nếu không, họ là
// người DUY NHẤT không thấy model mới của mình cho tới lần đăng nhập sau.
message CharacterAppearanceChangedEvent {
  int64 character_id = 1;
  Faction faction = 2;
  CostumeTier costume_tier = 3;
  // ADR-140 — cấp mới; server phát gói này cả khi chỉ CẢNH GIỚI đổi (danh hiệu trên đầu), không riêng bậc trang phục.
  int32 level = 4;
  // ADR-142 — server phát gói này cả khi chỉ trạng thái Ma Đầu đổi.
  bool outlaw = 5;
}

// ADR-051 — loại World mà người chơi vừa được đưa vào.
enum WorldKind {
  WORLD_KIND_UNSPECIFIED = 0;
  WORLD_KIND_MAIN = 1;
  WORLD_KIND_DUNGEON = 2;
  WORLD_KIND_ARENA = 3;
}

// ADR-051 — vì sao người chơi đổi World. Client dùng để chọn dòng báo; KHÔNG đổi cách dọn màn hình.
enum WorldChangeReason {
  WORLD_CHANGE_REASON_UNSPECIFIED = 0;
  WORLD_CHANGE_REASON_REQUESTED = 1;       // chính người này bấm (vào/ra hầm ngục, vào trận đấu)
  WORLD_CHANGE_REASON_PULLED_BY_PARTY = 2; // bị bạn cùng nhóm kéo vào hầm ngục
  WORLD_CHANGE_REASON_DEFEATED = 3;        // gục trong hầm ngục ⇒ đưa về world chính
  WORLD_CHANGE_REASON_DUEL_ENDED = 4;      // trận đấu chốt xong ⇒ về world chính
  WORLD_CHANGE_REASON_GM_MOVED = 5;        // ADR-052 — lệnh GM goto/summon dời người này trong world chính
  WORLD_CHANGE_REASON_TELEPORT = 6;        // ADR-100 — Truyền Tống Phù tới một điểm truyền tống đã mở
}

// Event: Server -> Client (OPCODE_WORLD_CHANGED_EVENT, ADR-051). CHÍNH nhân vật nhận gói vừa được
// đưa sang một World khác — không có character_id, cùng quy ước MoveResponse/CharacterRespawnedEvent.
//
// Luôn được ghi vào kênh SAU khi detach khỏi World cũ và TRƯỚC khi attach vào World mới được xếp
// hàng (ADR-051 D2, thừa kế ADR-047 D3) ⇒ tới trước MỌI gói spawn của World mới. Client dọn sạch
// thực thể đang hiển thị và đặt vị trí/máu của chính mình theo gói này — Response của lệnh
// vào/ra (nếu có) chỉ còn báo kết quả, không dọn màn hình nữa (ADR-051 D1).
//
// current_hp/max_hp là máu mà lệnh attach vào World mới đặt (attach luôn cho máu đầy — xem
// WorldFacade#characterMaxHp). World hầm ngục/đấu trường attach KHÔNG kèm bonus trang bị (giới hạn
// có sẵn, xem javadoc WorldFacade#attachCharacter(CharacterEntry)) nên max_hp ở đó là máu nền.
message WorldChangedEvent {
  WorldKind world_kind = 1;
  WorldChangeReason reason = 2;
  float x = 3;
  float y = 4;
  int32 current_hp = 5;
  int32 max_hp = 6;
}

// ADR-067 — loại sự kiện nhân đôi.
enum GameEventType {
  GAME_EVENT_TYPE_UNSPECIFIED = 0;
  GAME_EVENT_TYPE_EXP = 1;  // EXP đánh quái (không gồm thưởng nhiệm vụ)
  GAME_EVENT_TYPE_DROP = 2; // số lượt roll bảng rơi đồ
}

message GameEventView {
  GameEventType type = 1;
  int32 multiplier = 2;
  int64 ends_at_epoch_seconds = 3;
}

// Event: Server -> Client (OPCODE_GAME_EVENTS_CHANGED_EVENT). TOÀN BỘ sự kiện còn hiệu lực — rỗng = vừa
// tắt hết. Hết hạn tự nhiên thì KHÔNG có gói nào: client tự ẩn theo ends_at.
message GameEventsChangedEvent {
  repeated GameEventView events = 1;
}

// Event: Server -> Client (OPCODE_MOVE_SPEED_CHANGED_EVENT = 310). ADR-070 — phần trăm tốc độ cộng thêm của phi
// kiếm đang mặc (0 = không có). Server vẫn là bên quyết vị trí; con số này chỉ để client dự đoán đúng.
message MoveSpeedChangedEvent {
  int32 move_speed_percent = 1;
}

// Event: Server -> Client (OPCODE_MOVEMENT_MODIFIER_CHANGED_EVENT = 311). ADR-073 — hiệu ứng trạng thái trên CHÍNH
// mình vừa đổi tốc độ đi: status_speed_multiplier là tích các hiệu ứng tốc độ (KHÔNG gồm phi kiếm — xem 310);
// immobilized = đang choáng hoặc đã gục. Chỉ gửi lúc đổi. Client nhân vào dự đoán; server vẫn quyết vị trí.
message MovementModifierChangedEvent {
  float status_speed_multiplier = 1;
  bool immobilized = 2;
}

// ===== ADR-098 — hái linh thảo: bụi là dữ liệu (herb_node) + trạng thái RAM ở gateway; hái 3 giây do server đếm.
// CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_HERB_NODES_REQUEST = 312).
message ListHerbNodesRequest {
}

message HerbNodeView {
  int64 node_id = 1;
  string item_code = 2;
  float x = 3;
  float y = 4;
  bool ready = 5;
  int32 seconds_until_ready = 6;   // 0 khi sẵn
  float distance = 7;              // khoảng cách theo X từ người hỏi (server đo); -1 = không ở world chính
  string kind = 8;                 // ADR-107: HERB | FISH | ORE
  int32 gather_seconds = 9;        // ADR-107: số giây đứng thu
}

// Response: Server -> Client (OPCODE_LIST_HERB_NODES_RESPONSE = 313).
message ListHerbNodesResponse {
  repeated HerbNodeView nodes = 1;
}

// Command: Client -> Server (OPCODE_GATHER_HERB_COMMAND = 314).
message GatherHerbCommand {
  int64 node_id = 1;
}

enum GatherHerbOutcome {
  GATHER_HERB_OUTCOME_UNSPECIFIED = 0;
  GATHER_HERB_OUTCOME_STARTED = 1;         // đứng yên 3 giây — kết quả tới qua HerbGatheredEvent
  GATHER_HERB_OUTCOME_UNKNOWN_NODE = 2;
  GATHER_HERB_OUTCOME_TOO_FAR = 3;         // cách bụi quá 2,5 m (hoặc chưa ở world chính)
  GATHER_HERB_OUTCOME_NOT_READY = 4;       // đang hồi hoặc người khác đang hái
  GATHER_HERB_OUTCOME_ALREADY_GATHERING = 5;
  GATHER_HERB_OUTCOME_GATHERED = 6;        // chỉ trong HerbGatheredEvent
  GATHER_HERB_OUTCOME_MOVED_AWAY = 7;      // chỉ trong HerbGatheredEvent
  GATHER_HERB_OUTCOME_BAG_FULL = 8;        // chỉ trong HerbGatheredEvent
}

// Response: Server -> Client (OPCODE_GATHER_HERB_RESPONSE = 315).
message GatherHerbResponse {
  GatherHerbOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_HERB_GATHERED_EVENT = 316).
message HerbGatheredEvent {
  int64 node_id = 1;
  GatherHerbOutcome outcome = 2;
  int64 item_template_id = 3;
  int32 quantity = 4;
}

// ===== ADR-100 — truyền tống phù: điểm (waypoint) mở khi đứng gần lần đầu; dùng một phù để dời tới điểm đã mở trong
// cùng khu vực world chính (đường đổi World của ADR-051, lý do TELEPORT). CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_WAYPOINTS_REQUEST = 317).
message ListWaypointsRequest {
}

message WaypointView {
  string code = 1;
  string name_key = 2;
  float x = 3;
  bool open = 4;
}

// Response: Server -> Client (OPCODE_LIST_WAYPOINTS_RESPONSE = 318).
message ListWaypointsResponse {
  repeated WaypointView waypoints = 1;
  int32 talismans = 2;   // số Truyền Tống Phù trong túi
}

// Command: Client -> Server (OPCODE_TELEPORT_COMMAND = 319).
message TeleportCommand {
  string waypoint_code = 1;
}

enum TeleportOutcome {
  TELEPORT_OUTCOME_UNSPECIFIED = 0;
  TELEPORT_OUTCOME_OK = 1;
  TELEPORT_OUTCOME_UNKNOWN_WAYPOINT = 2;
  TELEPORT_OUTCOME_NOT_UNLOCKED = 3;
  TELEPORT_OUTCOME_NO_TALISMAN = 4;
  TELEPORT_OUTCOME_NOT_IN_MAIN_WORLD = 5;
  TELEPORT_OUTCOME_OUTLAW = 6;  // ADR-142 — Ma Đầu không được dùng trạm truyền tống
}

// Response: Server -> Client (OPCODE_TELEPORT_RESPONSE = 320). OK ⇒ WorldChangedEvent (lý do TELEPORT) đã/đang tới.
message TeleportResponse {
  TeleportOutcome outcome = 1;
}

// ADR-117 (2026-10-30) — hồi sinh tại chỗ. Event: Server -> Client (OPCODE_AWAITING_REVIVAL_EVENT = 321). CHÍNH mình
// vừa gục ở world chính và đang nằm chờ chọn: về điểm hồi sinh, hoặc Hồi Hồn Đan đứng dậy tại chỗ với 30% máu (không
// được nếu bị người chơi hạ). Hết `seconds` mà chưa chọn ⇒ tự về điểm hồi sinh (CharacterRespawnedEvent như cũ).
message AwaitingRevivalEvent {
  int32 seconds = 1;
  bool can_revive_in_place = 2;
}

enum ReviveOutcome {
  REVIVE_OUTCOME_UNSPECIFIED = 0;
  REVIVE_OUTCOME_OK = 1;
  REVIVE_OUTCOME_NOT_DEAD = 2;      // không đang nằm chờ
  REVIVE_OUTCOME_FORBIDDEN = 3;     // bị người chơi hạ — không đứng dậy tại chỗ được
  REVIVE_OUTCOME_NO_PILL = 4;       // không có Hồi Hồn Đan
}

// Command: Client -> Server (OPCODE_REVIVE_COMMAND = 322). in_place = dùng Hồi Hồn Đan.
message ReviveCommand {
  bool in_place = 1;
}

// Response: Server -> Client (OPCODE_REVIVE_RESPONSE = 323). OK thì CharacterRespawnedEvent tới kèm (vị trí + máu mới).
message ReviveResponse {
  ReviveOutcome outcome = 1;
}

// ADR-121 (2026-10-31) — kỳ ngộ. Hạ quái ở world chính có 2% (server tung) gặp kỳ ngộ, tối đa 3/ngày giờ VN; chữ là
// khoá i18n. Một lựa chọn có thể thưởng linh thạch/vật phẩm và/hoặc gọi ra một con quái cạnh người chơi.
message EncounterOptionView {
  int32 index = 1;
  string label_key = 2;
}

// Event: Server -> Client (OPCODE_ENCOUNTER_STARTED_EVENT = 324).
message EncounterStartedEvent {
  int64 instance_id = 1;
  string prompt_key = 2;
  repeated EncounterOptionView options = 3;
  int64 expires_at_epoch_ms = 4;
}

// Command: Client -> Server (OPCODE_CHOOSE_ENCOUNTER_OPTION_COMMAND = 325). Server kiểm kỳ ngộ thuộc về mình, còn hạn.
message ChooseEncounterOptionCommand {
  int64 instance_id = 1;
  int32 option_index = 2;
}

enum EncounterChoiceOutcome {
  ENCOUNTER_CHOICE_OUTCOME_UNSPECIFIED = 0;
  ENCOUNTER_CHOICE_OUTCOME_OK = 1;
  ENCOUNTER_CHOICE_OUTCOME_NOT_FOUND = 2;       // không phải của mình, đã chọn, hoặc đã hết hạn
  ENCOUNTER_CHOICE_OUTCOME_INVALID_OPTION = 3;
  ENCOUNTER_CHOICE_OUTCOME_BAG_FULL = 4;        // kỳ ngộ vẫn còn chờ — dọn túi rồi chọn lại
}

// Response: Server -> Client (OPCODE_CHOOSE_ENCOUNTER_OPTION_RESPONSE = 326).
message ChooseEncounterOptionResponse {
  EncounterChoiceOutcome outcome = 1;
  string result_key = 2;
  int64 gold = 3;
  int64 item_template_id = 4;     // 0 = không thưởng vật phẩm
  int32 quantity = 5;
  bool monster_spawned = 6;
}

// ADR-123 (2026-10-31) — ngày đêm. Event: Server -> Client, mọi người online (OPCODE_DAY_NIGHT_EVENT = 327), gửi lặp
// mỗi 30 giây. Một giờ thật là một ngày; phút 40–59 của mỗi giờ là đêm (quái mạnh hơn, rơi đồ nhiều hơn).
message DayNightEvent {
  bool night = 1;
  int32 seconds_until_change = 2;
}

// ADR-124 (2026-10-31) — thu phục yêu thú. Command: Client -> Server (OPCODE_TAME_MONSTER_COMMAND = 328). monster_id
// là id ÂM của quái đang nhắm; server kiểm tầm (6 m), máu (≤ 20%), loài, tiêu một Phong Yêu Phù và tung tỉ lệ.
message TameMonsterCommand {
  int64 monster_id = 1;
}

enum TameOutcome {
  TAME_OUTCOME_UNSPECIFIED = 0;
  TAME_OUTCOME_CAPTURED = 1;
  TAME_OUTCOME_ESCAPED = 2;        // tung trượt — mất phù, quái vẫn đó
  TAME_OUTCOME_NO_TALISMAN = 3;
  TAME_OUTCOME_NOT_FOUND = 4;      // các nhánh từ 4 trở đi hoàn phù
  TAME_OUTCOME_TOO_FAR = 5;
  TAME_OUTCOME_HP_TOO_HIGH = 6;
  TAME_OUTCOME_NOT_TAMEABLE = 7;
}

// Response: Server -> Client (OPCODE_TAME_MONSTER_RESPONSE = 329). mailed = túi đầy nên linh thú đi qua thư.
message TameMonsterResponse {
  TameOutcome outcome = 1;
  int64 pet_item_template_id = 2;
  bool mailed = 3;
}

// ADR-126 (2026-10-31) — Thiên Kiếp. Tầng 9 của 5 cảnh giới đầu (cấp 18/36/54/72/90) là trần: muốn lên cảnh giới mới
// phải độ kiếp trong một World riêng — sống qua mọi đợt lôi kích. Thua mất 10% EXP cấp kế; thắng lên cấp + chỉ số vĩnh viễn.

// Command: Client -> Server (OPCODE_START_TRIBULATION_COMMAND = 330).
message StartTribulationCommand {}

enum TribulationOutcome {
  TRIBULATION_OUTCOME_UNSPECIFIED = 0;
  TRIBULATION_OUTCOME_OK = 1;
  TRIBULATION_OUTCOME_NOT_READY = 2;        // chưa đứng ở trần hoặc EXP chưa đủ cho cấp kế
  TRIBULATION_OUTCOME_ALREADY_IN_TRIAL = 3;
  TRIBULATION_OUTCOME_BUSY = 4;             // đang ở hầm ngục/đấu trường
}

// Response: Server -> Client (OPCODE_START_TRIBULATION_RESPONSE = 331).
message StartTribulationResponse {
  TribulationOutcome outcome = 1;
  int32 waves = 2;
  int32 strike_percent = 3;
  int32 interval_seconds = 4;
}

enum TribulationEventKind {
  TRIBULATION_EVENT_KIND_UNSPECIFIED = 0;
  TRIBULATION_EVENT_KIND_STRIKE = 1;
  TRIBULATION_EVENT_KIND_PASSED = 2;
  TRIBULATION_EVENT_KIND_FAILED = 3;
  TRIBULATION_EVENT_KIND_HEART_DEMON_APPEARED = 4; // ADR-146 — lôi kiếp ngừng, hạ tâm ma trong seconds_left giây
  TRIBULATION_EVENT_KIND_HEART_DEMON_SLAIN = 5;    // ADR-146 — lôi kiếp tiếp tục
}

// Event: Server -> Client (OPCODE_TRIBULATION_EVENT = 332).
message TribulationEvent {
  TribulationEventKind kind = 1;
  int32 wave = 2;
  int32 waves = 3;
  int32 seconds_left = 4; // ADR-146 — chỉ có nghĩa với HEART_DEMON_APPEARED
}

// ADR-127 (2026-10-31) — pháp bảo. Command: Client -> Server (OPCODE_USE_ARTIFACT_COMMAND = 333): dùng chiêu của món
// đang mặc ở ô pháp bảo — server tự đọc món đang mặc, giữ hồi chiêu.
message UseArtifactCommand {}

enum ArtifactOutcome {
  ARTIFACT_OUTCOME_UNSPECIFIED = 0;
  ARTIFACT_OUTCOME_OK = 1;
  ARTIFACT_OUTCOME_NO_ARTIFACT = 2;
  ARTIFACT_OUTCOME_COOLDOWN = 3;
  ARTIFACT_OUTCOME_NOT_IN_WORLD = 4;
}

// Response: Server -> Client (OPCODE_USE_ARTIFACT_RESPONSE = 334). effect: "SHIELD" | "HEAL" | "SPEED";
// cooldown_seconds = hồi chiêu đầy (OK) hoặc số giây còn lại (COOLDOWN).
message UseArtifactResponse {
  ArtifactOutcome outcome = 1;
  string effect = 2;
  int32 magnitude_percent = 3;
  int32 duration_seconds = 4;
  int32 cooldown_seconds = 5;
}

// ADR-129 — động phủ.
enum CaveAction {
  CAVE_ACTION_UNSPECIFIED = 0;
  CAVE_ACTION_VIEW = 1;
  CAVE_ACTION_ENTER = 2;
  CAVE_ACTION_COLLECT = 3;   // chỉ khi đang đứng trong động phủ của mình
  CAVE_ACTION_UPGRADE = 4;
  CAVE_ACTION_DECORATE = 5;  // decoration_code
  CAVE_ACTION_INVITE = 6;    // target_name — bạn bè đang online
  CAVE_ACTION_VISIT = 7;     // target_name — chủ động phủ đã mời mình
}

// Command: Client -> Server (OPCODE_CAVE_COMMAND = 335).
message CaveCommand {
  CaveAction action = 1;
  string decoration_code = 2;
  string target_name = 3;
}

enum CaveOutcome {
  CAVE_OUTCOME_UNSPECIFIED = 0;
  CAVE_OUTCOME_OK = 1;
  CAVE_OUTCOME_NOTHING_TO_COLLECT = 2;
  CAVE_OUTCOME_MAX_LEVEL = 3;
  CAVE_OUTCOME_INSUFFICIENT_GOLD = 4;
  CAVE_OUTCOME_UNKNOWN_DECORATION = 5;
  CAVE_OUTCOME_ALREADY_PLACED = 6;
  CAVE_OUTCOME_GOLD_CAP = 7;
  CAVE_OUTCOME_NOT_IN_OWN_CAVE = 8;
  CAVE_OUTCOME_UNKNOWN_CHARACTER = 9;
  CAVE_OUTCOME_NOT_FRIEND = 10;
  CAVE_OUTCOME_NOT_ONLINE = 11;
  CAVE_OUTCOME_NOT_INVITED = 12;
  CAVE_OUTCOME_BUSY = 13;            // đang ở hầm ngục/đấu trường khác
}

message CaveDecorationView {
  string code = 1;
  string name_key = 2;
  int64 gold_cost = 3;
  int32 bonus_percent = 4;
  bool placed = 5;
}

// Response: Server -> Client (OPCODE_CAVE_RESPONSE = 336). Luôn kèm trạng thái động phủ của NGƯỜI GỬI.
// upgrade_cost = 0 khi đã cấp tối đa; collected = linh thạch vừa vào túi ở lượt này.
message CaveResponse {
  CaveAction action = 1;
  CaveOutcome outcome = 2;
  int32 vein_level = 3;
  int64 per_hour = 4;
  int64 stored = 5;
  int64 capacity = 6;
  int64 upgrade_cost = 7;
  repeated CaveDecorationView decorations = 8;
  int64 collected = 9;
  string target_name = 10;
}

// Event: Server -> Client (OPCODE_CAVE_INVITE_EVENT = 337).
message CaveInviteEvent {
  string owner_name = 1;
  int32 minutes = 2;
}

// ADR-128 — bậc trận theo số linh căn khác nhau có mặt.
enum FormationTier {
  FORMATION_TIER_UNSPECIFIED = 0;
  FORMATION_TIER_PLAIN = 1;          // 1–2 linh căn
  FORMATION_TIER_THREE_TALENTS = 2;  // Tam Tài Trận: 3–4 linh căn
  FORMATION_TIER_FIVE_ELEMENTS = 3;  // Ngũ Hành Trận: đủ 5
}

// Event: Server -> Client (OPCODE_FORMATION_CHANGED_EVENT = 1327). members = 0 ⇒ trận đã tan (mọi field khác rỗng).
// bonus_* = chỉ số phẳng đang cộng từ trận.
message FormationChangedEvent {
  int32 members = 1;
  repeated Faction factions = 2;
  FormationTier tier = 3;
  int32 bonus_atk = 4;
  int32 bonus_def = 5;
  int32 bonus_res = 6;
  int32 bonus_hp = 7;
}

// ADR-141 (2026-11-01) — bản đồ vùng của world chính cho HUD. Request: Client -> Server
// (OPCODE_LIST_ZONE_MAP_REQUEST = 338), gửi một lần khi vào world. Chỉ để HIỂN THỊ (biển "Vùng PvP", cho phép click
// nhắm người) — server vẫn phán quyết mọi đòn bằng luật ADR-137.
message ListZoneMapRequest {
}

// Một dải trên trục X (biên gồm cả hai đầu).
message ZoneRange {
  string code = 1;
  float min_x = 2;
  float max_x = 3;
}

// Response: Server -> Client (OPCODE_LIST_ZONE_MAP_RESPONSE = 339). pvp_ranges = bảng pvp_zone; safe_ranges = bảng
// safe_zone (an toàn thắng PvP khi chồng nhau). Chỉ world chính — dungeon/arena không có dải nào.
message ListZoneMapResponse {
  repeated ZoneRange pvp_ranges = 1;
  repeated ZoneRange safe_ranges = 2;
}

// ADR-144 (2026-11-01) — loại thời tiết (chỉ hiển thị, không đổi gameplay).
enum WeatherKind {
  WEATHER_KIND_UNSPECIFIED = 0;
  WEATHER_KIND_SPIRIT_RAIN = 1;  // mưa linh khí — tông môn
  WEATHER_KIND_SANDSTORM = 2;    // bão cát đỏ — Hoang Vực sâu
}

// Một vùng đang có thời tiết trên trục X của world chính (biên gồm cả hai đầu).
message WeatherZone {
  string code = 1;
  float min_x = 2;
  float max_x = 3;
  WeatherKind kind = 4;
}

// Event: Server -> Client, mọi người online (OPCODE_WEATHER_EVENT = 340), gửi lặp mỗi 30 giây cùng nhịp ngày đêm.
// zones = các vùng ĐANG có thời tiết (rỗng = trời quang mọi nơi). Client tự so vị trí của mình để vẽ.
message WeatherEvent {
  repeated WeatherZone zones = 1;
}

// ADR-147 (2026-11-02) — Tàng Bảo Đồ. Một lệnh, trường action (khuôn động phủ ADR-129).
enum TreasureAction {
  TREASURE_ACTION_UNSPECIFIED = 0;
  TREASURE_ACTION_STATUS = 1;  // chỉ hỏi cuộc tìm đang mở (không tiêu gì)
  TREASURE_ACTION_READ = 2;    // đọc một Tàng Bảo Đồ — server chọn điểm chôn
  TREASURE_ACTION_DIG = 3;     // đào ở chỗ đang đứng
}

// Command: Client -> Server (OPCODE_TREASURE_HUNT_COMMAND = 341).
message TreasureHuntCommand {
  TreasureAction action = 1;
}

enum TreasureOutcome {
  TREASURE_OUTCOME_UNSPECIFIED = 0;
  TREASURE_OUTCOME_OK = 1;
  TREASURE_OUTCOME_NO_HUNT = 2;            // chưa đọc bản đồ nào
  TREASURE_OUTCOME_NO_MAP = 3;             // không có Tàng Bảo Đồ trong túi
  TREASURE_OUTCOME_ALREADY_HUNTING = 4;    // đang có một cuộc tìm — đào xong mới đọc tấm khác
  TREASURE_OUTCOME_TOO_FAR = 5;            // chưa đứng đúng chỗ (distance cho biết còn bao xa)
  TREASURE_OUTCOME_NOT_IN_MAIN_WORLD = 6;  // đang ở hầm ngục / đấu trường
  TREASURE_OUTCOME_BAG_FULL = 7;           // cuộc tìm vẫn còn — dọn túi rồi đào lại
}

// Response: Server -> Client (OPCODE_TREASURE_HUNT_RESPONSE = 342). Luôn kèm cuộc tìm đang mở SAU lệnh (hunting).
// distance = khoảng cách theo X tới điểm chôn, -1 nếu không biết (không ở world chính / không có cuộc tìm).
// Phần thưởng (result_key, gold, item_*, guardian_spawned) chỉ có nghĩa khi action = DIG và outcome = OK.
message TreasureHuntResponse {
  TreasureAction action = 1;
  TreasureOutcome outcome = 2;
  bool hunting = 3;
  string spot_name_key = 4;
  float spot_x = 5;
  float distance = 6;
  string result_key = 7;
  int64 gold = 8;
  int64 item_template_id = 9;  // 0 = không thưởng vật phẩm
  int32 quantity = 10;
  bool guardian_spawned = 11;
}
