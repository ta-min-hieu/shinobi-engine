syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Faction + CostumeTier — CharacterSpawnedEvent cần chúng để client biết nạp model nào (ADR-031).
import "character.proto";

// Packet Movement/World (NETWORK.md §4, dải 300-399). characterId lấy từ session gắn với
// connection (server-gateway), KHÔNG có field characterId trong MoveCommand — đúng
// "characterId từ session, không từ packet" (SECURITY.md §4, chống IDOR).
//
// Server SỞ HỮU tốc độ di chuyển — client CHỈ gửi hướng đã chuẩn hoá (dir_x, dir_y trong
// [-1,1]), KHÔNG BAO GIỜ gửi tốc độ hay vị trí tuyệt đối. Server tự nhân hướng với hằng số
// tốc độ (server-world WorldConstants.MOVE_SPEED_MPS) — chặn speed-hack/teleport BẰNG THIẾT
// KẾ, không cần kiểm tra khoảng cách/tick hậu kỳ (GAMEPLAY.md §12, SECURITY.md §8).

// Command: Client -> Server (OPCODE_MOVE_COMMAND). Gửi khi hướng di chuyển đổi (nhấn/nhả phím),
// KHÔNG gửi liên tục mỗi frame.
//
// ADR-033 (2026-08-08): di chuyển người chơi chỉ còn trái/phải — dir_y GIỮ NGUYÊN trong message
// (KHÔNG được đổi/xoá field protobuf đang dùng, shared/CLAUDE.md) nhưng server-world giờ LUÔN bỏ
// qua giá trị này cho nhân vật người chơi (WorldFacade.handleMoveIntent ép dirY=0 — Server
// Authority, không tin client dù field cũ còn tồn tại trên dây). Trục dọc giờ đi qua JumpCommand.
message MoveCommand {
  float dir_x = 1;
  float dir_y = 2;
}

// Command: Client -> Server (OPCODE_JUMP_COMMAND, ADR-033). Ý ĐỊNH nhảy — không có field (giống
// MoveCommand, characterId lấy từ session, chống IDOR). Server chỉ áp lực nhảy nếu nhân vật đang
// grounded (WorldFacade.handleJumpIntent); gửi khi nhấn (rising edge), KHÔNG lặp lại khi giữ phím.
message JumpCommand {}

// Response: Server -> Client (OPCODE_MOVE_RESPONSE). Vị trí THẬT của CHÍNH nhân vật gửi lệnh —
// dùng cho reconciliation phía client (CLIENT.md §6). Khớp sequenceId với MoveCommand/JumpCommand
// tương ứng (ADR-033: JumpCommand cũng được ack qua đúng response này, không cần packet riêng).
//
// z/grounded thêm ở ADR-033 (chỉ THÊM field, giữ nguyên số field x/y đã dùng — shared/CLAUDE.md).
message MoveResponse {
  float x = 1;
  float y = 2;
  float z = 3;
  bool grounded = 4;
}

// Event: Server -> Client (OPCODE_CHARACTER_MOVED_EVENT). Vị trí nhân vật KHÁC trong AoI
// (SERVER.md §6) — không gửi Event này cho chính nhân vật đó (nó đã có MoveResponse).
//
// ⚠️ ADR-033 (2026-08-08, lát cắt 1): CHƯA thêm z/grounded ở đây — nhân vật KHÁC luôn hiện z=0
// (không thấy người khác nhảy) dù server đã mô phỏng trục dọc thật cho họ. Cố tình hoãn: thêm z
// vào đây kéo theo sửa AreaOfInterestTracker.lastSyncedPosition (mảng float[2] tái dùng mỗi tick,
// PHYSICS.md hot path đã tối ưu allocation) — để riêng thành 1 lượt sau khi cơ chế nhảy của CHÍNH
// người chơi đã chạy đúng và đo được, tránh đổi 2 việc rủi ro cao cùng lúc. Xem ADR-033 "Việc cần
// làm tiếp theo".
message CharacterMovedEvent {
  int64 character_id = 1;
  float x = 2;
  float y = 3;
}

// Event: Server -> Client (OPCODE_CHARACTER_SPAWNED_EVENT). Nhân vật khác VỪA vào AoI (kết nối
// mới hoặc đi tới gần) — client tạo entity render cho nó.
//
// faction + costume_tier là NGOẠI HÌNH, không phải chỉ số: client ghép chúng thành khoá asset
// (`char_<hệ>-<bậc>`) để chọn model glTF phải nạp (ADR-031). Trước khi có 2 field này, MỌI nhân
// vật đều hiện cùng một model vì client không có cách nào biết. Server vẫn là nguồn chân lý —
// client KHÔNG tự chọn ngoại hình của người khác (Điều 15).
//
// Thêm field mới vào message đã có là TƯƠNG THÍCH NGƯỢC ở tầng dây (proto3), nên
// ProtocolVersion.CURRENT giữ nguyên — đúng javadoc của chính lớp đó.
message CharacterSpawnedEvent {
  int64 character_id = 1;
  float x = 2;
  float y = 3;
  Faction faction = 4;
  CostumeTier costume_tier = 5;
}

// Event: Server -> Client (OPCODE_CHARACTER_DESPAWNED_EVENT). Nhân vật khác VỪA rời AoI (ngắt
// kết nối hoặc đi xa) — client xoá entity render tương ứng.
message CharacterDespawnedEvent {
  int64 character_id = 1;
}

// Event: Server -> Client (OPCODE_CHARACTER_RESPAWNED_EVENT). CHÍNH nhân vật gửi lệnh vừa hồi
// sinh sau khi HP về 0 — không có character_id, cùng quy ước "ngầm định là chính mình" như
// MoveResponse. x/y là vị trí hồi sinh, current_hp/current_chi luôn bằng max (server tự đặt lại
// toàn bộ khi hồi sinh) nhưng vẫn gửi cả 4 giá trị để client không tự đoán/hardcode — server luôn
// là nguồn chân lý (Điều 15), kể cả với giá trị "hiển nhiên đầy".
message CharacterRespawnedEvent {
  float x = 1;
  float y = 2;
  int32 current_hp = 3;
  int32 max_hp = 4;
  int32 current_chi = 5;
  int32 max_chi = 6;
}

// Event: Server -> Client (OPCODE_CHARACTER_APPEARANCE_CHANGED_EVENT, ADR-045). Ngoại hình của
// MỘT nhân vật đang trong tầm nhìn vừa đổi (đổi hệ phái giữa phiên chơi) — client thay model TẠI
// CHỖ, KHÔNG despawn rồi spawn lại: entity/vị trí/trạng thái động tác phải giữ nguyên, và thế bất
// biến "spawn = tạo mới" ở RemoteCharacterPresenter phải còn nguyên vẹn.
//
// Chính người vừa đổi cũng nhận event này (server tự thêm họ vào tập nhận) — nếu không, họ là
// người DUY NHẤT không thấy model mới của mình cho tới lần đăng nhập sau.
message CharacterAppearanceChangedEvent {
  int64 character_id = 1;
  Faction faction = 2;
  CostumeTier costume_tier = 3;
}

// ADR-051 — loại World mà người chơi vừa được đưa vào.
enum WorldKind {
  WORLD_KIND_UNSPECIFIED = 0;
  WORLD_KIND_MAIN = 1;
  WORLD_KIND_DUNGEON = 2;
  WORLD_KIND_ARENA = 3;
}

// ADR-051 — vì sao người chơi đổi World. Client dùng để chọn dòng báo; KHÔNG đổi cách dọn màn hình.
enum WorldChangeReason {
  WORLD_CHANGE_REASON_UNSPECIFIED = 0;
  WORLD_CHANGE_REASON_REQUESTED = 1;       // chính người này bấm (vào/ra hầm ngục, vào trận đấu)
  WORLD_CHANGE_REASON_PULLED_BY_PARTY = 2; // bị bạn cùng nhóm kéo vào hầm ngục
  WORLD_CHANGE_REASON_DEFEATED = 3;        // gục trong hầm ngục ⇒ đưa về world chính
  WORLD_CHANGE_REASON_DUEL_ENDED = 4;      // trận đấu chốt xong ⇒ về world chính
  WORLD_CHANGE_REASON_GM_MOVED = 5;        // ADR-052 — lệnh GM goto/summon dời người này trong world chính
  WORLD_CHANGE_REASON_TELEPORT = 6;        // ADR-100 — Truyền Tống Phù tới một điểm truyền tống đã mở
}

// Event: Server -> Client (OPCODE_WORLD_CHANGED_EVENT, ADR-051). CHÍNH nhân vật nhận gói vừa được
// đưa sang một World khác — không có character_id, cùng quy ước MoveResponse/CharacterRespawnedEvent.
//
// Luôn được ghi vào kênh SAU khi detach khỏi World cũ và TRƯỚC khi attach vào World mới được xếp
// hàng (ADR-051 D2, thừa kế ADR-047 D3) ⇒ tới trước MỌI gói spawn của World mới. Client dọn sạch
// thực thể đang hiển thị và đặt vị trí/máu của chính mình theo gói này — Response của lệnh
// vào/ra (nếu có) chỉ còn báo kết quả, không dọn màn hình nữa (ADR-051 D1).
//
// current_hp/max_hp là máu mà lệnh attach vào World mới đặt (attach luôn cho máu đầy — xem
// WorldFacade#characterMaxHp). World hầm ngục/đấu trường attach KHÔNG kèm bonus trang bị (giới hạn
// có sẵn, xem javadoc WorldFacade#attachCharacter(CharacterEntry)) nên max_hp ở đó là máu nền.
message WorldChangedEvent {
  WorldKind world_kind = 1;
  WorldChangeReason reason = 2;
  float x = 3;
  float y = 4;
  int32 current_hp = 5;
  int32 max_hp = 6;
}

// ADR-067 — loại sự kiện nhân đôi.
enum GameEventType {
  GAME_EVENT_TYPE_UNSPECIFIED = 0;
  GAME_EVENT_TYPE_EXP = 1;  // EXP đánh quái (không gồm thưởng nhiệm vụ)
  GAME_EVENT_TYPE_DROP = 2; // số lượt roll bảng rơi đồ
}

message GameEventView {
  GameEventType type = 1;
  int32 multiplier = 2;
  int64 ends_at_epoch_seconds = 3;
}

// Event: Server -> Client (OPCODE_GAME_EVENTS_CHANGED_EVENT). TOÀN BỘ sự kiện còn hiệu lực — rỗng = vừa
// tắt hết. Hết hạn tự nhiên thì KHÔNG có gói nào: client tự ẩn theo ends_at.
message GameEventsChangedEvent {
  repeated GameEventView events = 1;
}

// Event: Server -> Client (OPCODE_MOVE_SPEED_CHANGED_EVENT = 310). ADR-070 — phần trăm tốc độ cộng thêm của phi
// kiếm đang mặc (0 = không có). Server vẫn là bên quyết vị trí; con số này chỉ để client dự đoán đúng.
message MoveSpeedChangedEvent {
  int32 move_speed_percent = 1;
}

// Event: Server -> Client (OPCODE_MOVEMENT_MODIFIER_CHANGED_EVENT = 311). ADR-073 — hiệu ứng trạng thái trên CHÍNH
// mình vừa đổi tốc độ đi: status_speed_multiplier là tích các hiệu ứng tốc độ (KHÔNG gồm phi kiếm — xem 310);
// immobilized = đang choáng hoặc đã gục. Chỉ gửi lúc đổi. Client nhân vào dự đoán; server vẫn quyết vị trí.
message MovementModifierChangedEvent {
  float status_speed_multiplier = 1;
  bool immobilized = 2;
}

// ===== ADR-098 — hái linh thảo: bụi là dữ liệu (herb_node) + trạng thái RAM ở gateway; hái 3 giây do server đếm.
// CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_HERB_NODES_REQUEST = 312).
message ListHerbNodesRequest {
}

message HerbNodeView {
  int64 node_id = 1;
  string item_code = 2;
  float x = 3;
  float y = 4;
  bool ready = 5;
  int32 seconds_until_ready = 6;   // 0 khi sẵn
  float distance = 7;              // khoảng cách theo X từ người hỏi (server đo); -1 = không ở world chính
}

// Response: Server -> Client (OPCODE_LIST_HERB_NODES_RESPONSE = 313).
message ListHerbNodesResponse {
  repeated HerbNodeView nodes = 1;
}

// Command: Client -> Server (OPCODE_GATHER_HERB_COMMAND = 314).
message GatherHerbCommand {
  int64 node_id = 1;
}

enum GatherHerbOutcome {
  GATHER_HERB_OUTCOME_UNSPECIFIED = 0;
  GATHER_HERB_OUTCOME_STARTED = 1;         // đứng yên 3 giây — kết quả tới qua HerbGatheredEvent
  GATHER_HERB_OUTCOME_UNKNOWN_NODE = 2;
  GATHER_HERB_OUTCOME_TOO_FAR = 3;         // cách bụi quá 2,5 m (hoặc chưa ở world chính)
  GATHER_HERB_OUTCOME_NOT_READY = 4;       // đang hồi hoặc người khác đang hái
  GATHER_HERB_OUTCOME_ALREADY_GATHERING = 5;
  GATHER_HERB_OUTCOME_GATHERED = 6;        // chỉ trong HerbGatheredEvent
  GATHER_HERB_OUTCOME_MOVED_AWAY = 7;      // chỉ trong HerbGatheredEvent
  GATHER_HERB_OUTCOME_BAG_FULL = 8;        // chỉ trong HerbGatheredEvent
}

// Response: Server -> Client (OPCODE_GATHER_HERB_RESPONSE = 315).
message GatherHerbResponse {
  GatherHerbOutcome outcome = 1;
}

// Event: Server -> Client (OPCODE_HERB_GATHERED_EVENT = 316).
message HerbGatheredEvent {
  int64 node_id = 1;
  GatherHerbOutcome outcome = 2;
  int64 item_template_id = 3;
  int32 quantity = 4;
}

// ===== ADR-100 — truyền tống phù: điểm (waypoint) mở khi đứng gần lần đầu; dùng một phù để dời tới điểm đã mở trong
// cùng khu vực world chính (đường đổi World của ADR-051, lý do TELEPORT). CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_LIST_WAYPOINTS_REQUEST = 317).
message ListWaypointsRequest {
}

message WaypointView {
  string code = 1;
  string name_key = 2;
  float x = 3;
  bool open = 4;
}

// Response: Server -> Client (OPCODE_LIST_WAYPOINTS_RESPONSE = 318).
message ListWaypointsResponse {
  repeated WaypointView waypoints = 1;
  int32 talismans = 2;   // số Truyền Tống Phù trong túi
}

// Command: Client -> Server (OPCODE_TELEPORT_COMMAND = 319).
message TeleportCommand {
  string waypoint_code = 1;
}

enum TeleportOutcome {
  TELEPORT_OUTCOME_UNSPECIFIED = 0;
  TELEPORT_OUTCOME_OK = 1;
  TELEPORT_OUTCOME_UNKNOWN_WAYPOINT = 2;
  TELEPORT_OUTCOME_NOT_UNLOCKED = 3;
  TELEPORT_OUTCOME_NO_TALISMAN = 4;
  TELEPORT_OUTCOME_NOT_IN_MAIN_WORLD = 5;
}

// Response: Server -> Client (OPCODE_TELEPORT_RESPONSE = 320). OK ⇒ WorldChangedEvent (lý do TELEPORT) đã/đang tới.
message TeleportResponse {
  TeleportOutcome outcome = 1;
}
