syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Character (NETWORK.md §4, dải 200-299). accountId lấy từ session gắn với connection
// (server-gateway), KHÔNG có field nào trong Request mang accountId — đúng "characterId/accountId
// từ session, không từ packet" (SECURITY.md §4, chống IDOR).

// Nhân vật mới tạo mặc định FACTION_HOA (CreateCharacterUseCase), không có bước chọn hệ lúc tạo.
// 4 hệ còn lại chọn qua SelectFactionRequest khi đủ Lv10 (GDD §4, Phase 8).
enum Faction {
  FACTION_UNSPECIFIED = 0;
  FACTION_HOA = 1;
  FACTION_THUY = 2;
  FACTION_PHONG = 3;
  FACTION_LOI = 4;
  FACTION_THO = 5;
}

// Bậc trang phục — B1 Học Viên → B2 Nhẫn Giả → B3 Thượng Nhẫn (ART-PIPELINE §4.2, tên gọi dùng
// chung cho cả 5 hệ). Đây THUẦN ngoại hình: client dùng nó cùng Faction để suy ra model glTF phải
// nạp (ADR-031), KHÔNG có chỉ số gameplay nào gắn vào bậc này.
enum CostumeTier {
  COSTUME_TIER_UNSPECIFIED = 0;
  COSTUME_TIER_B1 = 1;
  COSTUME_TIER_B2 = 2;
  COSTUME_TIER_B3 = 3;
}

message CharacterSummary {
  int64 id = 1;
  string name = 2;
  Faction faction = 3;
  int32 level = 4;
  int64 deletion_epoch_seconds = 5; // ADR-205 — đang chờ xoá: lúc sẽ xoá hẳn; 0 = không chờ xoá
}

// Command: Client -> Server (OPCODE_LIST_CHARACTERS_REQUEST). Không field — accountId từ session.
message ListCharactersRequest {
}

// Response: Server -> Client (OPCODE_LIST_CHARACTERS_RESPONSE).
message ListCharactersResponse {
  repeated CharacterSummary characters = 1;
}

// Command: Client -> Server (OPCODE_CREATE_CHARACTER_REQUEST).
message CreateCharacterRequest {
  string name = 1;
  // ADR-025 (idempotency, Accepted) — UUID v4 client sinh, giữ nguyên khi tự retry cùng 1 hành
  // động, sinh mới khi người chơi bắt đầu hành động MỚI. Command side-effect đầu tiên của dự án
  // dùng field này — server enforce unique ở DB trong cùng transaction (DATABASE.md idempotency_key).
  string idempotency_key = 2;
}

// Response: Server -> Client (OPCODE_CREATE_CHARACTER_RESPONSE).
message CreateCharacterResponse {
  bool success = 1;
  CharacterSummary character = 2;
  string error_key = 3; // rỗng nếu success=true (NETWORK.md §107)
}

// Command: Client -> Server (OPCODE_SELECT_CHARACTER_REQUEST). Chọn nhân vật để vào world — server
// verify character_id thuộc account đã đăng nhập (session), gắn characterId vào connection
// (SECURITY.md §4, chống IDOR). KHÔNG phải Movement/World (300-399) — đây vẫn là hành động thuộc
// domain Character.
message SelectCharacterRequest {
  int64 character_id = 1;
}

// Response: Server -> Client (OPCODE_SELECT_CHARACTER_RESPONSE).
message SelectCharacterResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107)
  // Máu của CHÍNH mình ngay khi vào world — field THÊM (3..4), field 1..2 giữ nguyên,
  // protocolVersion KHÔNG tăng (luật additive NETWORK.md §6). Không có character_id: luôn là chính
  // mình, cùng quy ước ExperienceChangedEvent/GoldChangedEvent.
  //
  // Vì sao cần: từ ADR-036, `bonus_hp` của trang bị nâng MÁU TỐI ĐA thật, nên 100 không còn là
  // hằng số client tự biết. Trước field này, mẫu số vạch máu kẹt ở 100 trong khi tử số là số thật
  // của server ⇒ playtest 2026-08-30 thấy "139 / 100", thanh máu tràn, và chỉ tự đúng sau lần hồi
  // sinh ĐẦU TIÊN (CharacterRespawnedEvent vốn đã mang max_hp).
  //
  // Chỉ gửi khi success=true; success=false thì cả hai bằng 0 và client phải bỏ qua.
  int32 current_hp = 3;
  int32 max_hp = 4;
  // ADR-041 — vị trí server ĐÃ nạp và attach cho nhân vật này. Field THÊM (5..6), field 1..4 giữ
  // nguyên, protocolVersion KHÔNG tăng (cùng luật additive và cùng message với current_hp/max_hp).
  //
  // Vì sao cần: client dựng `localPlayer` bằng `new PositionComponent()` = (0,0) rồi tự chữa bằng
  // MoveResponse ĐẦU TIÊN — mà gói đó chỉ tới khi người chơi bấm phím đi. Ai đứng yên thì thấy sai
  // chỗ: playtest 2026-09-05 đăng nhập ở x=8, x=-3, x=-5 cho ra khung hình GIỐNG NHAU TỪNG PIXEL,
  // và con quái đứng ngay dưới chân thì đánh trúng được nhưng KHÔNG hiện trên màn hình.
  //
  // Không có z/grounded: lúc vào world luôn là mặt đất (ADR-033), thêm field chỉ để mang hằng số
  // là mở rộng bề mặt protocol không đổi lấy gì (ADR-041 D4).
  //
  // Chỉ gửi khi success=true; success=false thì cả hai bằng 0 và client phải bỏ qua.
  float spawn_x = 5;
  float spawn_y = 6;
}

// Command: Client -> Server (OPCODE_SELECT_FACTION_REQUEST). Chọn/đổi hệ phái khi nhân vật đủ
// Lv10 (GDD §4) — characterId lấy từ session (đã bound lúc SelectCharacterRequest), KHÔNG có field
// character_id trong Request (chống IDOR, khác SelectCharacterRequest vì lúc này đã trong world).
message SelectFactionRequest {
  Faction faction = 1;
}

// Response: Server -> Client (OPCODE_SELECT_FACTION_RESPONSE).
message SelectFactionResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107) — vd "error.level_too_low"
}

// Event: Server -> Client (OPCODE_EXPERIENCE_CHANGED_EVENT). Kinh nghiệm/cấp của CHÍNH người chơi
// vừa đổi — chủ dự án yêu cầu 2026-08-09 ("không có vạch kinh nghiệm để biết bao giờ lên level").
// Không có character_id: luôn là chính mình, cùng quy ước MoveResponse/CharacterRespawnedEvent.
//
// Gửi 2 thời điểm: NGAY sau khi vào world (để vạch có số ngay từ đầu, không phải chờ giết quái
// mới hiện), và mỗi lần nhận EXP. Server gửi sẵn `exp_into_level`/`exp_for_next_level` thay vì để
// client tự suy từ `exp` tổng — đường cong cấp độ là luật chơi, thuộc về server (Điều 15); client
// đổi công thức cũng không đổi được gì ngoài cái vạch nó tự vẽ.
message ExperienceChangedEvent {
  int32 level = 1;
  int64 total_exp = 2;         // tổng EXP tích luỹ từ đầu (khớp cột character.exp)
  int64 exp_into_level = 3;    // đã đi được bao nhiêu trong cấp HIỆN TẠI
  int64 exp_for_next_level = 4; // cần bao nhiêu để lên cấp kế; 0 = đã cấp tối đa
  bool leveled_up = 5;         // true nếu chính lần này vừa lên cấp — client mừng cho ra mừng
}

// Event: Server -> Client (OPCODE_GOLD_CHANGED_EVENT = 209). Vàng của CHÍNH người chơi vừa đổi.
// Không có character_id: luôn là chính mình, cùng quy ước ExperienceChangedEvent (ADR-034).
//
// Gửi NGAY sau khi vào world (để cửa hàng có số ngay, không phải chờ giao dịch đầu tiên) và mỗi lần
// vàng đổi: mua/bán, cường hoá, gửi/nhận thư, giao dịch. Thưởng nhiệm vụ KHÔNG trao vàng (chỉ EXP +
// vật phẩm — `QuestRewardPorts` không có cổng vàng), nên không phải một nguồn của event này.
//
// `gold` là số dư TUYỆT ĐỐI sau thay đổi, không phải delta — mất một gói giữa chừng thì gói kế tự
// sửa lại, không tích luỹ sai lệch.
message GoldChangedEvent {
  int64 gold = 1;
  int64 delta = 2;  // chênh lệch của chính lần này (âm = tiêu); thuần để client hiện "-500"
  string reason_key = 3; // vd "gold.reason.buy_item" — i18n key, KHÔNG phải câu tiếng Việt cứng
}

// -----------------------------------------------------------------------------------------------
// ADR-056 (Accepted 2026-10-18) — bảng nhân vật + Lực Chiến. CHỈ THÊM, protocolVersion không tăng.
// Số do SERVER tính từ chỉ số nền + trang bị (không gồm buff tạm thời); client chỉ định dạng.
// Tỉ lệ đi bằng PHẦN NGHÌN nguyên (không float) để hai client không bao giờ làm tròn khác nhau.
// -----------------------------------------------------------------------------------------------

// Command: Client -> Server (OPCODE_GET_CHARACTER_STATS_REQUEST = 210). characterId từ session.
message GetCharacterStatsRequest {
}

// Response: Server -> Client (OPCODE_GET_CHARACTER_STATS_RESPONSE = 211).
message GetCharacterStatsResponse {
  int32 level = 1;
  int32 strength = 2;
  int32 agility = 3;
  int32 intelligence = 4;
  int32 vitality = 5;
  int32 max_hp = 6;
  int32 attack = 7;
  int32 skill_damage = 8;
  int32 defense = 9;
  int32 resistance = 10;
  int32 hit_permille = 11;
  int32 dodge_permille = 12;
  int32 crit_permille = 13;
  int32 crit_damage_percent = 14;
  int64 combat_power = 15;
  int32 equipment_bonus_hp = 16; // phần máu tối đa đến từ trang bị
  int32 max_chi = 17;
  repeated ItemSetProgressView item_sets = 18; // ADR-065 — bộ pháp khí đang mặc ít nhất một món
  PetView pet = 19;               // ADR-072 — chỉ có khi đang mặc linh thú
  int32 move_speed_percent = 20;  // ADR-070 — tốc độ cộng thêm của phi kiếm
  int32 rebirth_count = 21;       // ADR-089 — số lần đã Độ Kiếp Chuyển Thế (Đạo Vận đã nằm trong các tổng ở trên)
}

// ADR-072 — linh thú đang mặc.
message PetView {
  int64 item_template_id = 1; // tên hiển thị tra qua catalog vật phẩm
  int32 level = 2;
  int64 exp_into_level = 3;
  int64 exp_to_next = 4;      // 0 = cấp tối đa
  int32 stage = 5;            // ADR-078 — bậc tiến hoá 1..2 (0 ở server cũ = bậc 1)
  string custom_name = 6;     // ADR-193 — tên riêng người chơi đặt ("" = dùng tên loài)
}

// ADR-065 — một bộ pháp khí trên bảng nhân vật. Chỉ số thưởng ĐÃ nằm trong các tổng ở trên.
message ItemSetProgressView {
  string name_key = 1;
  int32 worn_pieces = 2;
  int32 total_pieces = 3;
  int32 bonus_atk = 4;
  int32 bonus_def = 5;
  int32 bonus_res = 6;
  int32 bonus_hp = 7;
}

// ===== ADR-089 — Độ Kiếp Chuyển Thế: ở cấp tối đa, trùng tu từ cấp 1, giữ đồ, nhận Đạo Vận vĩnh viễn. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_REBIRTH_COMMAND = 212). Cấp + số lần đọc từ DB, không từ gói.
message RebirthCommand {}

enum RebirthOutcome {
  REBIRTH_OUTCOME_UNSPECIFIED = 0;
  REBIRTH_OUTCOME_OK = 1;
  REBIRTH_OUTCOME_LEVEL_TOO_LOW = 2;
  REBIRTH_OUTCOME_MAX_REBIRTHS = 3;
  REBIRTH_OUTCOME_NOT_FOUND = 4;
}

// Response: Server -> Client (OPCODE_REBIRTH_RESPONSE = 213). Vạch EXP mới đi bằng ExperienceChangedEvent (208).
message RebirthResponse {
  RebirthOutcome outcome = 1;
  int32 rebirth_count = 2;
}

// ===== ADR-095 — bế quan: quỹ phút offline (≤ 480) quy ra EXP lúc nhận; x2 trả linh thạch. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_SECLUSION_STATUS_REQUEST = 214).
message GetSeclusionStatusRequest {
}

// Response: Server -> Client (OPCODE_GET_SECLUSION_STATUS_RESPONSE = 215).
message GetSeclusionStatusResponse {
  int32 banked_minutes = 1;   // 0..480
  int64 exp_single = 2;       // EXP nhận được nếu nhận x1 (theo cấp HIỆN TẠI)
  int64 double_cost = 3;      // linh thạch để nhận x2
}

// Command: Client -> Server (OPCODE_CLAIM_SECLUSION_COMMAND = 216).
message ClaimSeclusionCommand {
  bool doubled = 1;
}

enum ClaimSeclusionOutcome {
  CLAIM_SECLUSION_OUTCOME_UNSPECIFIED = 0;
  CLAIM_SECLUSION_OUTCOME_OK = 1;
  CLAIM_SECLUSION_OUTCOME_NOTHING_BANKED = 2;
  CLAIM_SECLUSION_OUTCOME_INSUFFICIENT_GOLD = 3;
}

// Response: Server -> Client (OPCODE_CLAIM_SECLUSION_RESPONSE = 217). EXP mới tới qua ExperienceChangedEvent như mọi đường.
message ClaimSeclusionResponse {
  ClaimSeclusionOutcome outcome = 1;
  int64 exp_gained = 2;
}

// ===== ADR-096 — thưởng thời gian online: mốc 10/30/60 phút mỗi ngày (giờ Việt Nam), quà qua thư. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_ONLINE_REWARDS_REQUEST = 218).
message GetOnlineRewardsRequest {
}

message OnlineRewardMilestoneView {
  int32 minutes = 1;
  bool reached = 2;
  bool claimed = 3;
  int64 gold = 4;
  string item_code = 5;   // rỗng = không vật phẩm
  int32 item_quantity = 6;
}

// Response: Server -> Client (OPCODE_GET_ONLINE_REWARDS_RESPONSE = 219).
message GetOnlineRewardsResponse {
  int32 seconds_today = 1;
  repeated OnlineRewardMilestoneView milestones = 2;
}

// Command: Client -> Server (OPCODE_CLAIM_ONLINE_REWARD_COMMAND = 220).
message ClaimOnlineRewardCommand {
  int32 milestone_minutes = 1;
}

enum ClaimOnlineRewardOutcome {
  CLAIM_ONLINE_REWARD_OUTCOME_UNSPECIFIED = 0;
  CLAIM_ONLINE_REWARD_OUTCOME_OK = 1;              // quà đã gửi vào hòm thư
  CLAIM_ONLINE_REWARD_OUTCOME_NOT_REACHED = 2;
  CLAIM_ONLINE_REWARD_OUTCOME_ALREADY_CLAIMED = 3;
  CLAIM_ONLINE_REWARD_OUTCOME_UNKNOWN_MILESTONE = 4;
}

// Response: Server -> Client (OPCODE_CLAIM_ONLINE_REWARD_RESPONSE = 221).
message ClaimOnlineRewardResponse {
  ClaimOnlineRewardOutcome outcome = 1;
}

// ===== ADR-106 (2026-10-25) — lịch hoạt động + điểm năng động. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_ACTIVITY_REQUEST = 222).
message GetActivityRequest {}

message ActivityView {
  string code = 1;
  string name_key = 2;     // khoá i18n tên việc
  int32 count = 3;         // số lần đã làm hôm nay (có thể vượt max_count)
  int32 max_count = 4;
  int32 points_each = 5;
  int32 points = 6;        // điểm đã tính (kẹp ở trần)
}

message ActivityChestView {
  int32 milestone = 1;
  int64 gold = 2;
  int64 item_template_id = 3;   // 0 = chỉ vàng
  int32 quantity = 4;
  bool reached = 5;
  bool claimed = 6;
}

// Response: Server -> Client (OPCODE_GET_ACTIVITY_RESPONSE = 223).
message GetActivityResponse {
  repeated ActivityView activities = 1;
  int32 points = 2;
  repeated ActivityChestView chests = 3;
}

// Command: Client -> Server (OPCODE_CLAIM_ACTIVITY_CHEST_COMMAND = 224).
message ClaimActivityChestCommand {
  int32 milestone = 1;
}

enum ClaimActivityChestOutcome {
  CLAIM_ACTIVITY_CHEST_OUTCOME_UNSPECIFIED = 0;
  CLAIM_ACTIVITY_CHEST_OUTCOME_OK = 1;           // rương đã gửi vào hòm thư
  CLAIM_ACTIVITY_CHEST_OUTCOME_NOT_AVAILABLE = 2; // chưa đủ điểm, đã nhận, hoặc mốc lạ
}

// Response: Server -> Client (OPCODE_CLAIM_ACTIVITY_CHEST_RESPONSE = 225). status = trạng thái MỚI NHẤT.
message ClaimActivityChestResponse {
  ClaimActivityChestOutcome outcome = 1;
  GetActivityResponse status = 2;
}

// ===== ADR-108 (2026-10-25) — sổ sưu tầm yêu thú. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_BESTIARY_REQUEST = 226).
message GetBestiaryRequest {}

message BestiaryEntryView {
  string monster_code = 1;   // tên hiển thị: khoá i18n monster.<code>.name ở client
  string lore_key = 2;       // khoá i18n lời sưu tầm (chỉ hiện khi unlocked)
  int32 kills = 3;
  int32 kills_required = 4;
  bool unlocked = 5;
  string bonus_stat = 6;     // ATK | DEF | RES | HP
  int32 bonus_value = 7;
}

// Response: Server -> Client (OPCODE_GET_BESTIARY_RESPONSE = 227).
message GetBestiaryResponse {
  repeated BestiaryEntryView entries = 1;
}

// ADR-148 (2026-11-02) — Dịch Danh Phù. Command: Client -> Server (OPCODE_RENAME_CHARACTER_COMMAND = 228).
// Tên mới qua đúng luật tên lúc tạo nhân vật (server chuẩn hoá NFC rồi kiểm).
message RenameCharacterCommand {
  string new_name = 1;
}

enum RenameCharacterOutcome {
  RENAME_CHARACTER_OUTCOME_UNSPECIFIED = 0;
  RENAME_CHARACTER_OUTCOME_OK = 1;
  RENAME_CHARACTER_OUTCOME_INVALID_NAME = 2;
  RENAME_CHARACTER_OUTCOME_SAME_NAME = 3;
  RENAME_CHARACTER_OUTCOME_NAME_TAKEN = 4;
  RENAME_CHARACTER_OUTCOME_NO_TALISMAN = 5;   // không có Dịch Danh Phù trong túi
  RENAME_CHARACTER_OUTCOME_ON_COOLDOWN = 6;   // đổi lần trước chưa đủ 7 ngày
  RENAME_CHARACTER_OUTCOME_NOT_FOUND = 7;     // không thấy nhân vật (đã xoá / chưa nối DB)
}

// Response: Server -> Client (OPCODE_RENAME_CHARACTER_RESPONSE = 229). name = tên SAU lệnh;
// next_allowed_at_epoch_ms = lúc được đổi lần sau (0 = không áp dụng).
message RenameCharacterResponse {
  RenameCharacterOutcome outcome = 1;
  string name = 2;
  int64 next_allowed_at_epoch_ms = 3;
}

// ADR-149 (2026-11-02) — Quẻ bói hằng ngày. Command: Client -> Server (OPCODE_DRAW_FORTUNE_COMMAND = 230). Phải đứng
// gần trưởng lão Chu Hoành ở Tông Môn; mỗi ngày (giờ Việt Nam) một quẻ.
message DrawFortuneCommand {}

enum DrawFortuneOutcome {
  DRAW_FORTUNE_OUTCOME_UNSPECIFIED = 0;
  DRAW_FORTUNE_OUTCOME_OK = 1;
  DRAW_FORTUNE_OUTCOME_ALREADY_DRAWN = 2;  // hôm nay đã gieo — kèm lại quẻ hôm nay, không quà lần hai
  DRAW_FORTUNE_OUTCOME_TOO_FAR = 3;        // không đứng gần trưởng lão
  DRAW_FORTUNE_OUTCOME_BAG_FULL = 4;       // quẻ có quà mà túi đầy — chưa tính là đã gieo
}

// Response: Server -> Client (OPCODE_DRAW_FORTUNE_RESPONSE = 231). exp_percent: cộng (âm = trừ) vào EXP đánh quái tới
// hết ngày. gold/item_*: quà kèm quẻ, chỉ có khi outcome = OK.
message DrawFortuneResponse {
  DrawFortuneOutcome outcome = 1;
  string fortune_code = 2;
  string name_key = 3;
  string text_key = 4;
  int32 exp_percent = 5;
  int64 gold = 6;
  int64 item_template_id = 7;
  int32 quantity = 8;
  int32 drop_bonus_percent = 9;  // ADR-158 — % cơ hội rơi thêm một lượt khi hạ quái, tới hết ngày
}

// ADR-151 (2026-11-02) — Vòng quay may mắn. Mỗi ngày (giờ Việt Nam) 1 lượt miễn phí, rồi tối đa 10 lượt mua.
message WheelPrizeView {
  int32 index = 1;
  string label_key = 2;
  int64 gold = 3;
  int64 item_template_id = 4;  // 0 = ô chỉ có linh thạch
  int32 quantity = 5;
}

// Request: Client -> Server (OPCODE_GET_LUCKY_WHEEL_REQUEST = 232). Chỉ đọc.
message GetLuckyWheelRequest {}

// Response: Server -> Client (OPCODE_GET_LUCKY_WHEEL_RESPONSE = 233).
message GetLuckyWheelResponse {
  repeated WheelPrizeView prizes = 1;
  int32 free_spins_left = 2;
  int32 paid_spins_left = 3;
  int64 spin_cost = 4;
}

// Command: Client -> Server (OPCODE_SPIN_LUCKY_WHEEL_COMMAND = 234). Còn lượt miễn phí thì dùng nó, không thì lượt mua.
message SpinLuckyWheelCommand {}

enum SpinLuckyWheelOutcome {
  SPIN_LUCKY_WHEEL_OUTCOME_UNSPECIFIED = 0;
  SPIN_LUCKY_WHEEL_OUTCOME_OK = 1;
  SPIN_LUCKY_WHEEL_OUTCOME_NO_SPINS_LEFT = 2;      // hết lượt hôm nay
  SPIN_LUCKY_WHEEL_OUTCOME_INSUFFICIENT_GOLD = 3;  // không đủ linh thạch cho lượt mua
  SPIN_LUCKY_WHEEL_OUTCOME_BAG_FULL = 4;           // ô trúng có vật phẩm mà túi đầy — không mất lượt, không mất tiền
  SPIN_LUCKY_WHEEL_OUTCOME_GOLD_CAP = 5;           // ô trúng làm vàng vượt trần — như trên
}

// Response: Server -> Client (OPCODE_SPIN_LUCKY_WHEEL_RESPONSE = 235). prize chỉ có khi OK; *_spins_left là SAU lệnh.
message SpinLuckyWheelResponse {
  SpinLuckyWheelOutcome outcome = 1;
  WheelPrizeView prize = 2;
  bool paid = 3;
  int32 free_spins_left = 4;
  int32 paid_spins_left = 5;
}

// ADR-153 (2026-11-02) — Quà mốc cảnh giới. Đạt cấp của mốc thì nhận quà MỘT lần.
message RealmMilestoneView {
  int32 level = 1;
  string name_key = 2;
  int64 gold = 3;
  int64 item_template_id = 4;  // 0 = chỉ linh thạch
  int32 quantity = 5;
  bool claimed = 6;
}

// Request: Client -> Server (OPCODE_GET_REALM_MILESTONES_REQUEST = 236). Chỉ đọc.
message GetRealmMilestonesRequest {}

// Response: Server -> Client (OPCODE_GET_REALM_MILESTONES_RESPONSE = 237).
message GetRealmMilestonesResponse {
  int32 character_level = 1;
  repeated RealmMilestoneView milestones = 2;
}

// Command: Client -> Server (OPCODE_CLAIM_REALM_MILESTONE_COMMAND = 238).
message ClaimRealmMilestoneCommand {
  int32 level = 1;
}

enum ClaimRealmMilestoneOutcome {
  CLAIM_REALM_MILESTONE_OUTCOME_UNSPECIFIED = 0;
  CLAIM_REALM_MILESTONE_OUTCOME_OK = 1;
  CLAIM_REALM_MILESTONE_OUTCOME_UNKNOWN_MILESTONE = 2;
  CLAIM_REALM_MILESTONE_OUTCOME_LEVEL_TOO_LOW = 3;
  CLAIM_REALM_MILESTONE_OUTCOME_ALREADY_CLAIMED = 4;
  CLAIM_REALM_MILESTONE_OUTCOME_BAG_FULL = 5;   // quà vẫn chờ — dọn túi rồi nhận lại
  CLAIM_REALM_MILESTONE_OUTCOME_GOLD_CAP = 6;
}

// Response: Server -> Client (OPCODE_CLAIM_REALM_MILESTONE_RESPONSE = 239). Kèm bảng mốc SAU lệnh.
message ClaimRealmMilestoneResponse {
  ClaimRealmMilestoneOutcome outcome = 1;
  int32 level = 2;
  GetRealmMilestonesResponse board = 3;
}

// ADR-154 (2026-11-02) — Nhiệm vụ tuần cá nhân. Tuần bắt đầu thứ Hai 0h giờ Việt Nam.
message WeeklyTaskView {
  string code = 1;
  string name_key = 2;
  int32 target = 3;
  int32 progress = 4;
  bool claimed = 5;
  int64 gold = 6;
  int64 item_template_id = 7;  // 0 = chỉ linh thạch
  int32 quantity = 8;
}

// Request: Client -> Server (OPCODE_GET_WEEKLY_TASKS_REQUEST = 240). Chỉ đọc.
message GetWeeklyTasksRequest {}

// Response: Server -> Client (OPCODE_GET_WEEKLY_TASKS_RESPONSE = 241).
message GetWeeklyTasksResponse {
  repeated WeeklyTaskView tasks = 1;
}

// Command: Client -> Server (OPCODE_CLAIM_WEEKLY_TASK_COMMAND = 242).
message ClaimWeeklyTaskCommand {
  string task_code = 1;
}

enum ClaimWeeklyTaskOutcome {
  CLAIM_WEEKLY_TASK_OUTCOME_UNSPECIFIED = 0;
  CLAIM_WEEKLY_TASK_OUTCOME_OK = 1;
  CLAIM_WEEKLY_TASK_OUTCOME_UNKNOWN_TASK = 2;
  CLAIM_WEEKLY_TASK_OUTCOME_NOT_DONE = 3;
  CLAIM_WEEKLY_TASK_OUTCOME_ALREADY_CLAIMED = 4;
  CLAIM_WEEKLY_TASK_OUTCOME_BAG_FULL = 5;   // thưởng vẫn chờ
  CLAIM_WEEKLY_TASK_OUTCOME_GOLD_CAP = 6;
}

// Response: Server -> Client (OPCODE_CLAIM_WEEKLY_TASK_RESPONSE = 243). Kèm danh sách SAU lệnh.
message ClaimWeeklyTaskResponse {
  ClaimWeeklyTaskOutcome outcome = 1;
  string task_code = 2;
  GetWeeklyTasksResponse tasks = 3;
}

// Event: Server -> Client (OPCODE_EXP_BUFF_CHANGED_EVENT = 244) — ADR-164. Gửi khi vừa dùng Đan x2 kinh nghiệm và khi
// vào world mà x2 còn hạn. Client tự đếm ngược từ lúc nhận (chỉ để HIỂN THỊ — server mới là bên nhân EXP).
message ExpBuffChangedEvent {
  int64 seconds_left = 1;
}

// Command: Client -> Server (OPCODE_SET_COSTUME_COMMAND = 245) — ADR-166. Chọn HIỂN THỊ một bậc trang phục đã mở;
// COSTUME_TIER_UNSPECIFIED = trở về tự theo cảnh giới (miễn phí). Đổi sang một bậc cụ thể tốn vàng.
message SetCostumeCommand {
  CostumeTier tier = 1;
}

enum SetCostumeOutcome {
  SET_COSTUME_OUTCOME_UNSPECIFIED = 0;
  SET_COSTUME_OUTCOME_OK = 1;
  SET_COSTUME_OUTCOME_TIER_LOCKED = 2;     // bậc cao hơn bậc cảnh giới hiện tại đã mở
  SET_COSTUME_OUTCOME_NOT_ENOUGH_GOLD = 3;
}

// Response: Server -> Client (OPCODE_SET_COSTUME_RESPONSE = 246). shown_tier = bậc đang HIỆN sau lệnh.
message SetCostumeResponse {
  SetCostumeOutcome outcome = 1;
  CostumeTier shown_tier = 2;
  int64 fee = 3;
}

// Request: Client -> Server (OPCODE_GET_GOLD_HISTORY_REQUEST = 247) — ADR-169. Sổ vàng của CHÍNH người gửi.
message GetGoldHistoryRequest {}

message GoldHistoryEntry {
  int64 delta = 1;        // âm = trừ
  int64 balance = 2;      // số dư ngay sau lần đổi
  string reason_key = 3;  // khoá i18n "gold.reason.*"
  int64 at_epoch_ms = 4;
}

// Response: Server -> Client (OPCODE_GET_GOLD_HISTORY_RESPONSE = 248). Mới nhất trước, tối đa 50 dòng, 30 ngày gần nhất.
message GetGoldHistoryResponse {
  repeated GoldHistoryEntry entries = 1;
}

// Request: Client -> Server (OPCODE_INSPECT_CHARACTER_REQUEST = 249) — ADR-171. Soi một nhân vật theo TÊN.
message InspectCharacterRequest {
  string name = 1;
}

enum InspectCharacterOutcome {
  INSPECT_CHARACTER_OUTCOME_UNSPECIFIED = 0;
  INSPECT_CHARACTER_OUTCOME_OK = 1;
  INSPECT_CHARACTER_OUTCOME_NOT_FOUND = 2;
  INSPECT_CHARACTER_OUTCOME_HIDDEN = 3;  // người đó tắt cho xem
}

// Một món đang mặc: ô (giá trị enum EquipmentSlot của inventory.proto), mẫu, cường hoá, ngọc khảm (0 = không).
message InspectedEquipment {
  int32 slot = 1;
  int64 item_template_id = 2;
  int32 enhance_level = 3;
  int64 socket_gem_template_id = 4;
}

// Response: Server -> Client (OPCODE_INSPECT_CHARACTER_RESPONSE = 250).
message InspectCharacterResponse {
  InspectCharacterOutcome outcome = 1;
  string name = 2;
  int32 level = 3;
  Faction faction = 4;
  int64 combat_power = 5;
  repeated InspectedEquipment equipment = 6;
  string bio = 7;  // ADR-218 — dòng giới thiệu tự viết ("" = chưa viết)
}

// Command: Client -> Server (OPCODE_SET_INSPECT_PRIVACY_COMMAND = 251). hidden = true ⇒ người khác không soi được mình.
message SetInspectPrivacyCommand {
  bool hidden = 1;
}

// Response: Server -> Client (OPCODE_SET_INSPECT_PRIVACY_RESPONSE = 252).
message SetInspectPrivacyResponse {
  bool hidden = 1;
}

// ===== ADR-193 (Accepted 2026-11-07, chủ dự án chọn) — đặt tên riêng cho linh thú đang mặc. CHỈ THÊM. =====

// Command: Client -> Server (OPCODE_RENAME_PET_COMMAND = 253). name rỗng = xoá tên riêng. Miễn phí.
message RenamePetCommand {
  string name = 1;
}

enum RenamePetOutcome {
  RENAME_PET_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  RENAME_PET_OUTCOME_OK = 1;
  RENAME_PET_OUTCOME_CLEARED = 2;
  RENAME_PET_OUTCOME_NO_PET = 3;       // không mặc linh thú nào
  RENAME_PET_OUTCOME_INVALID_NAME = 4; // 2..12 ký tự, chỉ chữ / số / khoảng trắng đơn
  RENAME_PET_OUTCOME_BANNED_WORD = 5;
}

// Response: Server -> Client (OPCODE_RENAME_PET_RESPONSE = 254). name = tên đã strip mà server xét.
message RenamePetResponse {
  RenamePetOutcome outcome = 1;
  string name = 2;
}

// ===== ADR-200 (Accepted 2026-11-07, chủ dự án chọn) — đếm ngược mốc làm mới. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_GET_RESET_TIMERS_REQUEST = 255).
message GetResetTimersRequest {}

// Response: Server -> Client (OPCODE_GET_RESET_TIMERS_RESPONSE = 256). Client tính thời gian còn lại bằng hiệu hai mốc với
// server_now (không dùng đồng hồ máy mình — tránh lệch giờ).
message GetResetTimersResponse {
  int64 server_now_epoch_seconds = 1;
  int64 next_daily_epoch_seconds = 2;  // 00:00 giờ VN: nhiệm vụ ngày, điểm danh, quẻ bói, lượt hầm ngục, …
  int64 next_weekly_epoch_seconds = 3; // 00:00 thứ Hai giờ VN: nhiệm vụ tuần, cửa hàng vinh dự
}

// ===== ADR-205 (Accepted 2026-11-07, chủ dự án chọn) — xoá nhân vật có chờ 3 ngày. CHỈ THÊM. =====

// Request: Client -> Server (OPCODE_DELETE_CHARACTER_REQUEST = 257). accountId từ session. Chọn lại nhân vật đang chờ xoá
// (SelectCharacterRequest) là khôi phục.
message DeleteCharacterRequest {
  int64 character_id = 1;
}

enum DeleteCharacterOutcome {
  DELETE_CHARACTER_OUTCOME_UNSPECIFIED = 0; // KHÔNG dùng cho kết quả thật.
  DELETE_CHARACTER_OUTCOME_OK = 1;
  DELETE_CHARACTER_OUTCOME_NOT_FOUND = 2;    // không thuộc tài khoản (hoặc đã quá hạn)
  DELETE_CHARACTER_OUTCOME_IN_WORLD = 3;     // đang chơi chính nhân vật đó
  DELETE_CHARACTER_OUTCOME_GUILD_LEADER = 4; // phải nhường chức bang chủ trước
}

// Response: Server -> Client (OPCODE_DELETE_CHARACTER_RESPONSE = 258). characters = danh sách SAU lệnh.
message DeleteCharacterResponse {
  DeleteCharacterOutcome outcome = 1;
  repeated CharacterSummary characters = 2;
}

// ADR-218 (2026-11-08) — hồ sơ cá nhân. Command: Client -> Server (OPCODE_SET_BIO_COMMAND). bio rỗng = xoá.
message SetBioCommand {
  string bio = 1;
}

enum SetBioOutcome {
  SET_BIO_OUTCOME_UNSPECIFIED = 0;
  SET_BIO_OUTCOME_OK = 1;
  SET_BIO_OUTCOME_TOO_LONG = 2;      // quá 60 ký tự, hoặc chứa ký tự điều khiển
  SET_BIO_OUTCOME_BANNED_WORD = 3;   // chứa từ cấm (cùng bộ lọc chat)
}

// Response: Server -> Client (OPCODE_SET_BIO_RESPONSE).
message SetBioResponse {
  SetBioOutcome outcome = 1;
  string bio = 2;  // dòng đang lưu sau lệnh
}

// ADR-223 (2026-11-08) — thống kê cá nhân. Request: Client -> Server (OPCODE_GET_PERSONAL_STATS_REQUEST).
message GetPersonalStatsRequest {}

// Response: Server -> Client (OPCODE_GET_PERSONAL_STATS_RESPONSE). Số quái / nhiệm vụ từ bộ đếm thành tựu; giờ chơi gồm
// cả phiên đang chơi.
message GetPersonalStatsResponse {
  int64 monsters_killed = 1;
  int64 quests_claimed = 2;
  int32 deaths = 3;
  int32 pvp_wins = 4;
  int32 pvp_losses = 5;
  int32 achievements_unlocked = 6;
  int64 playtime_seconds = 7;
}

// ADR-224 (2026-11-08) — lịch sự kiện tuần. Request: Client -> Server (OPCODE_GET_EVENT_CALENDAR_REQUEST).
message GetEventCalendarRequest {}

enum CalendarEventKind {
  CALENDAR_EVENT_KIND_UNSPECIFIED = 0;
  CALENDAR_EVENT_KIND_WORLD_BOSS = 1;    // lần xuất hiện kế tiếp; active = đang sống
  CALENDAR_EVENT_KIND_DAILY_RESET = 2;
  CALENDAR_EVENT_KIND_WEEKLY_RESET = 3;
  CALENDAR_EVENT_KIND_TOURNAMENT = 4;    // Luận võ đại hội; active = đã tới giờ (đang diễn ra)
}

message CalendarEntry {
  CalendarEventKind kind = 1;
  int64 at_epoch_seconds = 2;
  bool active = 3;
}

// Response: Server -> Client (OPCODE_GET_EVENT_CALENDAR_RESPONSE). Sớm nhất trước.
message GetEventCalendarResponse {
  int64 server_now_epoch_seconds = 1;
  repeated CalendarEntry entries = 2;
}

// ADR-238 (2026-11-08) — lịch sử đăng nhập của TÀI KHOẢN. Request: Client -> Server (OPCODE_GET_LOGIN_HISTORY_REQUEST).
message GetLoginHistoryRequest {}

message LoginHistoryEntry {
  string masked_ip = 1;  // "203.113.x.x" — server không lưu IP đầy đủ
  int64 at_epoch_seconds = 2;
}

// Response: Server -> Client (OPCODE_GET_LOGIN_HISTORY_RESPONSE). 10 lần gần nhất, mới trước.
message GetLoginHistoryResponse {
  repeated LoginHistoryEntry entries = 1;
}

// ADR-240 (2026-11-08) — kỷ lục cá nhân. Request: Client -> Server (OPCODE_GET_PERSONAL_RECORDS_REQUEST).
message GetPersonalRecordsRequest {}

// Response: Server -> Client (OPCODE_GET_PERSONAL_RECORDS_RESPONSE). Phá kỷ lục thì server báo thêm một dòng chat hệ thống.
message GetPersonalRecordsResponse {
  int64 highest_hit = 1;           // sát thương một đòn cao nhất
  int64 longest_kill_streak = 2;   // chuỗi hạ quái dài nhất không chết
  int64 current_kill_streak = 3;   // chuỗi hiện tại (RAM, mất khi server khởi động lại)
}

// ADR-281 (2026-11-12) — đếm người online. Request: Client -> Server (OPCODE_GET_ONLINE_COUNT_REQUEST).
message GetOnlineCountRequest {}

message FactionCount {
  string faction = 1;  // tên enum Faction phía server (HOA, THUY…); NONE = chưa chọn linh căn
  int32 count = 2;
}

// Response: Server -> Client (OPCODE_GET_ONLINE_COUNT_RESPONSE). Không lộ tên ai — chỉ con số.
message GetOnlineCountResponse {
  int32 total = 1;
  repeated FactionCount by_faction = 2;
  repeated int32 by_realm = 3;  // chỉ số i = cảnh giới thứ i (18 cấp mỗi cảnh giới như BreakthroughHooks; Lv1–18 là 0)
}
