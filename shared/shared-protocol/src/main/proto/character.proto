syntax = "proto3";

package kage.protocol;

option java_package = "dev.kage.protocol";
option java_multiple_files = true;

// Packet Character (NETWORK.md §4, dải 200-299). accountId lấy từ session gắn với connection
// (server-gateway), KHÔNG có field nào trong Request mang accountId — đúng "characterId/accountId
// từ session, không từ packet" (SECURITY.md §4, chống IDOR).

// Nhân vật mới tạo mặc định FACTION_HOA (CreateCharacterUseCase), không có bước chọn hệ lúc tạo.
// 4 hệ còn lại chọn qua SelectFactionRequest khi đủ Lv10 (GDD §4, Phase 8).
enum Faction {
  FACTION_UNSPECIFIED = 0;
  FACTION_HOA = 1;
  FACTION_THUY = 2;
  FACTION_PHONG = 3;
  FACTION_LOI = 4;
  FACTION_THO = 5;
}

message CharacterSummary {
  int64 id = 1;
  string name = 2;
  Faction faction = 3;
  int32 level = 4;
}

// Command: Client -> Server (OPCODE_LIST_CHARACTERS_REQUEST). Không field — accountId từ session.
message ListCharactersRequest {
}

// Response: Server -> Client (OPCODE_LIST_CHARACTERS_RESPONSE).
message ListCharactersResponse {
  repeated CharacterSummary characters = 1;
}

// Command: Client -> Server (OPCODE_CREATE_CHARACTER_REQUEST).
message CreateCharacterRequest {
  string name = 1;
  // ADR-025 (idempotency, Accepted) — UUID v4 client sinh, giữ nguyên khi tự retry cùng 1 hành
  // động, sinh mới khi người chơi bắt đầu hành động MỚI. Command side-effect đầu tiên của dự án
  // dùng field này — server enforce unique ở DB trong cùng transaction (DATABASE.md idempotency_key).
  string idempotency_key = 2;
}

// Response: Server -> Client (OPCODE_CREATE_CHARACTER_RESPONSE).
message CreateCharacterResponse {
  bool success = 1;
  CharacterSummary character = 2;
  string error_key = 3; // rỗng nếu success=true (NETWORK.md §107)
}

// Command: Client -> Server (OPCODE_SELECT_CHARACTER_REQUEST). Chọn nhân vật để vào world — server
// verify character_id thuộc account đã đăng nhập (session), gắn characterId vào connection
// (SECURITY.md §4, chống IDOR). KHÔNG phải Movement/World (300-399) — đây vẫn là hành động thuộc
// domain Character.
message SelectCharacterRequest {
  int64 character_id = 1;
}

// Response: Server -> Client (OPCODE_SELECT_CHARACTER_RESPONSE).
message SelectCharacterResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107)
}

// Command: Client -> Server (OPCODE_SELECT_FACTION_REQUEST). Chọn/đổi hệ phái khi nhân vật đủ
// Lv10 (GDD §4) — characterId lấy từ session (đã bound lúc SelectCharacterRequest), KHÔNG có field
// character_id trong Request (chống IDOR, khác SelectCharacterRequest vì lúc này đã trong world).
message SelectFactionRequest {
  Faction faction = 1;
}

// Response: Server -> Client (OPCODE_SELECT_FACTION_RESPONSE).
message SelectFactionResponse {
  bool success = 1;
  string error_key = 2; // rỗng nếu success=true (NETWORK.md §107) — vd "error.level_too_low"
}
