# OBSERVABILITY.md §9-10 — Prometheus scrape + alerting rule cho server-gateway thật.
# server-gateway CHƯA có Dockerfile (chạy native qua ./gradlew run/installDist, không phải
# container trong compose này) — scrape qua host.docker.internal, xem docker-compose.yml
# "extra_hosts" trên service prometheus (Linux cần host-gateway, Windows/Mac Docker Desktop có sẵn).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kage-server-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9404"]
