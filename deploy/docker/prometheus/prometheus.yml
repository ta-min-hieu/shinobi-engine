# OBSERVABILITY.md §9-10 — Prometheus scrape + alerting rule cho server-gateway thật.
# 2 target CÙNG job — server-gateway có thể chạy container ("server", service Compose, Phase 10
# 2026-07-30) HOẶC native qua ./gradlew run (host.docker.internal, xem docker-compose.yml
# "extra_hosts" — Linux cần host-gateway, Windows/Mac Docker Desktop có sẵn). Chỉ 1 trong 2 chạy
# tại 1 thời điểm (xung đột cổng 7777/9404) — target còn lại hiện `up=0` trên Prometheus, không
# làm job lỗi hay dashboard vỡ.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kage-server-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["server:9404", "host.docker.internal:9404"]
