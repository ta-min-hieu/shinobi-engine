# OBSERVABILITY.md §8 — alert rules thật, dựa trên tên metric THẬT scrape ra (xác nhận bằng cách
# dump registry.scrape() lúc viết file này, KHÔNG đoán từ tên Micrometer dotted). ⚠️ PHÁT HIỆN THẬT:
# Micrometer/Prometheus registry chuyển "kage.gold.total" thành "kage_gold" (KHÔNG PHẢI
# "kage_gold_total" — hậu tố ".total" bị coi là marker Counter "_total" nên bị strip cho Gauge,
# không cộng lại) — nếu viết PromQL theo tên dotted + "_total" máy móc sẽ SAI. quantile percentile
# (kage_tick_duration_seconds) là Summary tính phía client (Micrometer), KHÔNG dùng
# histogram_quantile() — dùng label {quantile="0.99"} trực tiếp, đúng thiết kế đã ghi ở
# MicrometerTickMetricsPort javadoc.
#
# Ngưỡng đánh dấu [NGƯỠNG CHƯA VERIFY] là số PLACEHOLDER — OBSERVABILITY.md §8 tự ghi rõ "chưa có,
# phải đo baseline trước, đặt bừa = alert fatigue". Tick p99 16.6ms (60Hz, ADR-018) và GC pause
# (ADR-019 đo thật 0.052ms max ở tải 80 client — 100ms vẫn còn rất rộng so với số đã đo, coi là
# ngưỡng an toàn tạm thời, không phải baseline chính xác) đã có số liệu thật từ trước.
#
# 2026-08-02 — đo baseline LoginFailedSpike/GoldTotalSpike thật (`tools:load-test`, 100 client, ramp
# 10→100, giữ tải ~19.5 phút, tổng 25 phút, Postgres 17 + Redis 8 thật qua Docker cổng non-default
# 55432/55679 tránh đụng service khác trên máy, scrape /metrics mỗi 30s — xem OBSERVABILITY.md §8
# và BENCHMARK.md §5 cho chi tiết đầy đủ + giới hạn phép đo). Kết quả: LoginFailedSpike VERIFY được
# (xem ngay dưới). GoldTotalSpike — lần đo lại CÙNG NGÀY, SAU KHI thêm hành vi bán đồ vào
# `SimulatedPlayer`: kage_gold tăng THẬT 0 → 14 trong 1500s (0 lỗi client), xác nhận đường bán đồ
# hoạt động thật đầu-cuối qua socket, không còn CHƯA đo được như trước. Số tuyệt đối nhỏ vì 2 giới
# hạn RIÊNG của phép đo này (không phải trần thật của economy — xem OBSERVABILITY.md §8.1 cho phân
# tích đầy đủ): (1) chỉ có 1 quái nội dung (training dummy) tồn tại; (2) SimulatedPlayer chỉ chốt
# monsterId 1 LẦN lúc connect, không re-target sau khi dummy chết+hồi sinh (ID mới, tăng giảm dần) —
# hầu hết client trở nên "mù mục tiêu" vĩnh viễn sau lần hồi sinh đầu tiên. Vẫn GIỮ 20% (biên độ đủ
# rộng so với %/giờ đo được, xem tính toán trong OBSERVABILITY.md §8.1) nhưng thêm 1 guard mới
# (`kage_gold > 1000`) để tránh chia gần 0 (server mới khởi động, kage_gold ~0) làm tỉ lệ nổ số giả.
groups:
  - name: kage-server-gateway
    rules:
      - alert: TickP99OverBudget
        expr: kage_tick_duration_seconds{world="main",quantile="0.99"} > 0.0166
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tick p99 vượt ngân sách 16.6ms (60Hz, ADR-018)"
          description: "World '{{ $labels.world }}' tick p99 = {{ $value }}s, liên tục 5 phút."

      - alert: ServerDown
        expr: up{job="kage-server-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Không scrape được server-gateway (down hoặc mất kết nối tới host.docker.internal:9404)"

      - alert: DbPoolExhausted
        expr: kage_db_pool_pending > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP có thread đang chờ connection liên tục — pool quá nhỏ (BENCHMARK.md §5.2)"

      # ĐO LẠI 2026-08-02 (SimulatedPlayer giờ có bán đồ, xem block đầu file + OBSERVABILITY.md
      # §8.1): kage_gold tăng 0 → 14 trong 1500s (100 client) = ~34/giờ TUYỆT ĐỐI đo được — quy đổi
      # %/giờ cần chia cho tổng gold server hiện có (mẫu số không cố định, phụ thuộc tuổi đời
      # server), nên KHÔNG quy đổi máy móc thành 1 con số %/giờ duy nhất; thay vào đó so sánh biên
      # độ: 34 gold/giờ chỉ vượt 20% NẾU tổng gold server hiện tại < 170 — với guard
      # `kage_gold > 1000` bên dưới, %/giờ tương ứng từ đúng mức tăng trưởng đo được luôn < 3.4%,
      # cách xa 20% nhiều lần — biên độ giữ 20% vẫn AN TOÀN dù chưa đo được trần thật (2 giới hạn ở
      # block đầu file khiến số đo được là CẬN DƯỚI, không phải cận trên, của tăng trưởng hợp lệ).
      # Guard `kage_gold > 1000` mới thêm — PHÁT HIỆN THẬT lúc đo: server mới khởi động có
      # kage_gold ~0, biểu thức tỉ lệ gốc (không guard) chia gần 0 → giá trị nổ số/không xác định,
      # có thể false-positive ngay lúc bootstrap dù tăng trưởng tuyệt đối rất nhỏ và hợp lệ.
      - alert: GoldTotalSpike
        expr: (increase(kage_gold[1h]) / kage_gold) > 0.20 and kage_gold > 1000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tổng gold toàn server tăng >20%/giờ (kage_gold > 1000) — nghi duplicate (OBSERVABILITY.md §3.5, §8.1)"

      - alert: GcPauseHigh
        expr: jvm_gc_pause_seconds_max > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GC pause tối đa > 100ms (ADR-019 đo thật ZGC max 0.052ms ở tải 80 client — 100ms là ngưỡng an toàn tạm, không phải baseline chính xác)"

      # ✅ Đo thật 2026-08-02 (xem block đầu file) — kage_login_failed_total = 0 tuyệt đối suốt 25
      # phút/100 client thật (noise floor thật đo được = 0). LoginOrCreateAccountUseCase KHÔNG có
      # mật khẩu (kage_no_password_auth, MVP cắt) — account tự tạo nếu username chưa tồn tại, nên
      # đường "login thất bại" DUY NHẤT ở normal play là username sai định dạng (độ dài/ký tự,
      # Account.java) hoặc lỗi hạ tầng (DB/Redis down — đã có ServerDown/DbPoolExhausted alert riêng
      # bắt việc đó). Không có "sai mật khẩu" để gõ nhầm như game thường — noise thật còn THẤP HƠN
      # cả giả định "gõ nhầm mật khẩu" thông thường. Ngưỡng 5/phút là LỰA CHỌN CÓ LÝ DO (KHÔNG phải
      # đo được trực tiếp — `tools:load-test` dùng username hợp lệ cố định, không mô phỏng người
      # gõ sai được): margin rộng so với noise floor=0 thật đã xác nhận, đủ thấp để vẫn bắt được
      # brute-force thật (hàng chục+ lần thất bại/phút liên tục) — thấp hơn placeholder cũ (10) vì
      # giờ đã CÓ bằng chứng thật (không phải đoán) rằng noise thật bằng 0.
      - alert: LoginFailedSpike
        expr: increase(kage_login_failed_total[1m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Đăng nhập thất bại tăng vọt (>5/phút, ngưỡng có lý do — noise floor thật đo được = 0, OBSERVABILITY.md §8) — nghi brute-force"
