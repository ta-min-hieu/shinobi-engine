# Môi trường Production (DOCKER.md §6, ADR-014 — không K8s, VM đơn chạy Compose).
# KHÁC docker-compose.yml (dev) ở 4 điểm:
#   1. `server` PULL image đã build sẵn từ GHCR (CI đã build+push, xem ci.yml job "docker-build-push"),
#      KHÔNG build lại tại chỗ — image phải PIN version thật (DOCKER.md Technical Decision #3), không
#      dùng "latest" trôi nổi cho Production.
#   2. Log JSON structured (OBSERVABILITY.md §5.1, `logback-production.xml`) thay vì console
#      human-readable mặc định của dev.
#   3. Cổng nội bộ (Postgres/Redis/metrics 9404/Prometheus/Alertmanager/Grafana/Jaeger UI) KHÔNG public
#      ra Internet — chỉ publish 7777 (game) ra ngoài; phần còn lại bind `127.0.0.1` (chỉ máy VM tự gọi
#      được, admin truy cập qua SSH tunnel: `ssh -L 3000:localhost:3000 <vm>`).
#   4. `restart: unless-stopped` + giới hạn log file (Docker json-file driver mặc định phình vô hạn —
#      DOCKER.md §9 "không log rotate trong app, Docker/orchestrator lo", đây chính là chỗ lo).
#
# ⚠️ ⚠️ ⚠️ TLS (ADR-027, Accepted 2026-07-31, code xong) — ĐỌC TRƯỚC KHI DÙNG FILE NÀY CHO PRODUCTION:
# Server BẮT BUỘC 1 cặp cert/key THẬT của bạn — KHÔNG dùng
# server/server-gateway/src/test/resources/tls/dev-cert.pem (cert TEST, private key tương ứng đã
# public trên GitHub, ai cũng lấy được — dùng cert đó cho Production là KHÔNG BẢO VỆ GÌ CẢ). Tạo
# cert riêng (self-signed, đủ cho Closed Beta qua VPN/mạng riêng — xem ADR-027 Revisit Trigger cho
# lúc cần CA-signed công khai):
#   openssl genpkey -algorithm RSA -out key.pem -pkeyopt rsa_keygen_bits:2048
#   openssl req -new -x509 -key key.pem -out cert.pem -days 3650 -subj "/CN=<domain-hoac-IP-VM>"
# Rồi: (1) trỏ TLS_CERT_HOST_PATH/TLS_KEY_HOST_PATH trong .env.prod tới 2 file đó trên VM; (2) copy
# NỘI DUNG cert.pem (KHÔNG PHẢI key.pem) đè vào
# client/client-core/src/main/resources/tls/dev-cert.pem rồi build lại client — client PIN đúng
# cert bundled, đổi cert mà không build lại client = client không kết nối được (đúng thiết kế
# ADR-027, không phải bug). KHÔNG mở cổng 7777 ra Internet công khai cho tới khi làm đủ 2 bước trên.
#
# ⚠️ ⚠️ ⚠️ AUTH (phát hiện 2026-07-31, chủ dự án xác nhận CHẤP NHẬN ĐƯỢC cho Closed Beta nội bộ, KHÔNG
# phải bug bị bỏ sót — nhưng PHẢI nhớ trước khi mở rộng ra người lạ): `ConnectRequest` hiện CHỈ có
# `username`, KHÔNG có password (V1__create_account_table.sql: "đăng nhập username-only, chưa cần
# mật khẩu"). Nghĩa là AI GÕ ĐÚNG 1 username đã tồn tại đều đăng nhập được vào account đó — TLS chỉ
# bảo vệ đường truyền, KHÔNG bảo vệ khỏi việc này. Chỉ mời người quen/tin tưởng vào Closed Beta cho
# tới khi có password auth thật (SECURITY.md §3 đã thiết kế Argon2id/bcrypt, CHƯA code — thay đổi
# protocol lớn, cần bàn riêng trước khi làm, không phải việc trong phạm vi file Compose này).
#
# Chạy (KHÔNG dùng chung .env với dev — tránh lẫn secret dev/prod):
#   cp deploy/docker/.env.prod.example deploy/docker/.env.prod   # rồi sửa password thật, mạnh
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file deploy/docker/.env.prod \
#       up -d
#
# Theo GIT-WORKFLOW.md: Không auto-deploy Production (Điều — deploy = đá người chơi đang online),
# lệnh trên luôn chạy TAY bởi người, không có bước CI nào gọi tới `up -d` này.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kage
      POSTGRES_USER: kage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD trong .env.prod}
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8" # UTF-8 collation — DATABASE.md §1, xem docker-compose.yml
    # KHÔNG publish cổng ra host — chỉ service khác trong network Compose này gọi được `postgres:5432`.
    # Cần psql thật từ ngoài (backup, sự cố) → SSH vào VM rồi `docker exec -it <container> psql ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kage"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  cache:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${CACHE_PASSWORD:?set CACHE_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  server:
    # Pull image CI đã build+push (ci.yml "docker-build-push") — KHÔNG build tại chỗ trên VM Production.
    # IMAGE_TAG bắt buộc chỉ định tường minh (vd "0.1.0" hoặc "master-<sha>" cụ thể), KHÔNG có default
    # "latest" — cùng nguyên tắc "pin version, không latest" đã áp cho base image (DOCKER.md #3).
    image: ghcr.io/ta-min-hieu/shinobi-engine/server-gateway:${IMAGE_TAG:?set IMAGE_TAG trong .env.prod, pin version cu the, khong dung latest}
    # Graceful shutdown (SERVER.md §10) cần nhiều hơn 10s mặc định của Docker trong ca xấu: đếm ngược
    # bảo trì 30s (KAGE_SHUTDOWN_NOTICE_SECONDS, dòng 76(b) 2026-10-17) + event loop ≤5s + auth/lưu vị
    # trí logout ≤10s + persister ≤5s + thưởng hạ quái ≤10s + Hikari đóng pool (≤10s, nó ABORT
    # connection còn mượn chứ không chờ). Hết hạn là SIGKILL — chính các lượt ghi đang chờ đó bị cắt.
    # Cộng đúng các trần xấu nhất (dòng 76(c), 2026-10-17): 30 đếm ngược + 5 event loop + 10 auth +
    # 5 dừng World + 5 persister + 10 thưởng hạ quái + 10 Hikari = 75s, cộng biên cho JVM thoát ⇒ 120s.
    # Đổi KAGE_SHUTDOWN_NOTICE_SECONDS thì đổi số này theo (giữ ≥ đếm ngược + 90s).
    stop_grace_period: 120s
    restart: unless-stopped
    # Sidecar `autoheal` (dưới) restart container này khi HEALTHCHECK báo unhealthy (dòng 62(ii)). Trần chờ
    # của lần restart đó = stop_grace_period, để lần tự chữa cũng tắt êm như `docker stop`.
    labels:
      autoheal: "true"
      autoheal.stop.timeout: "120"
    depends_on:
      postgres: { condition: service_healthy }
      cache:    { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kage
      DB_USER: kage
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD trong .env.prod}
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      CACHE_PASSWORD: ${CACHE_PASSWORD:?set CACHE_PASSWORD}
      KAGE_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # ADR-027 — mặc định TlsConfig.fromEnvironment() đã BẬT nếu không set gì, nhưng ghi tường
      # minh ở đây cho rõ ràng (Production không được vô tình chạy thiếu dòng KAGE_TLS_CERT_PATH
      # bên dưới rồi server tự crash lúc khởi động vì thiếu biến bắt buộc — thà thấy ngay ở đây).
      KAGE_TLS_ENABLED: "true"
      KAGE_TLS_CERT_PATH: /run/secrets/tls/cert.pem
      KAGE_TLS_KEY_PATH: /run/secrets/tls/key.pem
      # Ghi đè TOÀN BỘ JAVA_OPTS của server.Dockerfile (Docker Compose "environment" thay thế, không
      # cộng dồn) — giữ NGUYÊN mọi flag GC/JFR đã verify thật qua ADR-019 soak test 2h14, chỉ thêm
      # `-Dlogback.configurationFile=logback-production.xml` (OBSERVABILITY.md §5.1 — JSON log, cách
      # kích hoạt đúng như comment trong chính file logback-production.xml).
      JAVA_OPTS: >-
        -XX:+UseZGC -XX:MaxRAMPercentage=75.0 -XX:MaxDirectMemorySize=512m -XX:+ExitOnOutOfMemoryError
        -Dio.netty.leakDetection.level=simple
        -XX:+FlightRecorder -XX:StartFlightRecording=disk=true,maxsize=1g,maxage=24h,dumponexit=true,filename=/app/diagnostics/kage.jfr
        -Xlog:gc*:file=/app/diagnostics/gc.log:time,uptime:filecount=5,filesize=10m
        -Dlogback.configurationFile=logback-production.xml
    ports:
      - "7777:7777" # game port — an toàn public SAU khi làm đủ 2 bước cert thật ở cảnh báo đầu file
      # 9404 (metrics + /health/*) CỐ Ý không publish — không xác thực (MetricsHttpServer), lộ ra
      # Internet là rò rỉ thông tin nội bộ (OBSERVABILITY.md). Prometheus (cùng network Compose) gọi
      # thẳng `server:9404`, admin cần xem trực tiếp thì SSH tunnel.
    volumes:
      # Cert/key THẬT của bạn, KHÔNG bake vào image (DOCKER.md Technical Decision #4 "không secret
      # trong image") — bind-mount read-only từ VM. Đường dẫn HOST đọc từ .env.prod (ADR-027).
      - ${TLS_CERT_HOST_PATH:?set TLS_CERT_HOST_PATH trong .env.prod, xem canh bao TLS dau file}:/run/secrets/tls/cert.pem:ro
      - ${TLS_KEY_HOST_PATH:?set TLS_KEY_HOST_PATH trong .env.prod, xem canh bao TLS dau file}:/run/secrets/tls/key.pem:ro
      # JFR + GC log sống qua lần tạo lại container (dòng 63(iii), 2026-10-17) — xem server.Dockerfile.
      - server-diagnostics:/app/diagnostics
    # Trần bộ nhớ (dòng 59, 2026-10-17). Không có trần thì MaxRAMPercentage=75 tính theo RAM của CẢ VM —
    # VM dùng chung với Postgres/Redis/monitoring, JVM có thể đòi 75% máy rồi bị OOM-killer giết. 6g là
    # số TẠM cho Closed Beta (heap 75% = 4,5g + direct 512m + metaspace/stack), CHƯA đo ở cấu hình prod;
    # VM nhỏ hơn 8 GB thì hạ số này trước khi chạy.
    mem_limit: 6g
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  # Docker thuần không restart container `unhealthy` (`restart:` chỉ áp khi tiến trình THOÁT) — dòng 62(ii),
  # chủ dự án duyệt 2026-10-17. autoheal chỉ đụng container mang nhãn `autoheal=true` (chỉ `server`).
  # Pin theo digest, đọc thật bằng `docker pull` 2026-10-17. ⚠️ Mount docker.sock = quyền root trên VM:
  # container này không publish cổng nào và không nhận đầu vào từ mạng — giữ nguyên như vậy.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  prometheus:
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # loopback-only — SSH tunnel để xem, không public
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD trong .env.prod}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI — SSH tunnel để xem
      # OTLP/HTTP nhận trace — chỉ container "server" gọi thật, qua network Compose (`jaeger:4318`),
      # KHÔNG cần publish. Bản cũ publish "4318:4318" = 0.0.0.0, trái điểm 3 đầu file ("chỉ 7777
      # public"): ai trên Internet cũng bơm span giả được vào Jaeger không xác thực. Giữ loopback
      # để gỡ lỗi thủ công qua SSH tunnel như các cổng admin khác (sửa 2026-10-03).
      - "127.0.0.1:4318:4318"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

volumes:
  server-diagnostics:
  pgdata:
  prometheus-data:
  grafana-data:
