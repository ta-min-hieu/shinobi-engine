# Môi trường Development (DOCKER.md §5). `docker compose up` dựng TOÀN BỘ stack: DB + cache +
# server (container, từ `server.Dockerfile`, Phase 10 2026-07-30) + observability.
# ⚠️ Xung đột cổng nếu chạy CẢ container này LẪN `./gradlew run` cùng lúc — cả hai đều bind
# 7777/9404 trên host, container sẽ chiếm cổng trước và native start sẽ lỗi "address already in
# use". Chọn 1 trong 2: `docker compose up` (full stack đóng gói) HOẶC
# `docker compose up postgres cache prometheus alertmanager grafana jaeger` (loại "server", chạy
# server native qua `./gradlew run` để lặp code nhanh không cần rebuild image).
# ⚠️ PHÁT HIỆN THẬT lúc verify (2026-07-30): khi container "server" chạy VÀ publish cổng 9404 ra
# host, prometheus.yml's 2 target (`server:9404` + `host.docker.internal:9404`) đều BÁO "up" —
# nhưng đó là CÙNG 1 tiến trình (host.docker.internal:9404 vòng qua cổng host đã publish, trỏ về
# lại đúng container đó), KHÔNG PHẢI 2 instance thật. Dashboard nào `sum` theo `instance` sẽ đếm
# gấp đôi trong tình huống này — chỉ đáng tin cách chạy tách biệt như trên (container HOẶC native,
# không chạy song song).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kage
      POSTGRES_USER: kage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD trong .env}
      # ⚠️ PHÁT HIỆN THẬT: lc_collate/lc_ctype là tham số lúc initdb (tạo cluster), KHÔNG phải
      # GUC runtime — `postgres -c lc_collate=...` bị postgres:17 từ chối thẳng lúc khởi động
      # ("FATAL: unrecognized configuration parameter"). Phải truyền qua POSTGRES_INITDB_ARGS để
      # image tự chuyển cho initdb (UTF-8 collation từ đầu — tiếng Việt, DATABASE.md §1).
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kage"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    # Redis 8.x — AGPLv3, OSI-approved (ADR-005, Accepted 2026-07-19).
    image: redis:8
    command: ["redis-server", "--requirepass", "${CACHE_PASSWORD:?set CACHE_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    # Graceful shutdown (SERVER.md §10) cần nhiều hơn 10s mặc định của Docker trong ca xấu: đếm ngược
    # bảo trì 30s (KAGE_SHUTDOWN_NOTICE_SECONDS, dòng 76(b) 2026-10-17) + event loop ≤5s + auth/lưu vị
    # trí logout ≤10s + persister ≤5s + thưởng hạ quái ≤10s + Hikari đóng pool (≤10s, nó ABORT
    # connection còn mượn chứ không chờ). Hết hạn là SIGKILL — chính các lượt ghi đang chờ đó bị cắt.
    # Cộng đúng các trần xấu nhất (dòng 76(c), 2026-10-17): 30 đếm ngược + 5 event loop + 10 auth +
    # 5 dừng World + 5 persister + 10 thưởng hạ quái + 10 Hikari = 75s, cộng biên cho JVM thoát ⇒ 120s.
    # Đổi KAGE_SHUTDOWN_NOTICE_SECONDS thì đổi số này theo (giữ ≥ đếm ngược + 90s).
    stop_grace_period: 120s
    depends_on:
      postgres: { condition: service_healthy }
      cache:    { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kage
      DB_USER: kage
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD trong .env}
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      CACHE_PASSWORD: ${CACHE_PASSWORD:?set CACHE_PASSWORD}
      # GatewayTracing mặc định trỏ localhost:4318 (đúng cho ./gradlew run native) — container
      # phải trỏ qua tên service Compose "jaeger" thay vì localhost.
      KAGE_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # ADR-027 — TẮT TƯỜNG MINH cho dev (đúng NETWORK.md §2 "dev có thể tắt qua flag tường minh,
      # không mặc định tắt" — flag đó CHÍNH LÀ dòng này). Không tắt thì cần KAGE_TLS_CERT_PATH/
      # KAGE_TLS_KEY_PATH trỏ cert thật; dev.compose ưu tiên chạy nhanh không cần chuẩn bị cert.
      KAGE_TLS_ENABLED: "false"
    ports:
      - "7777:7777"
      - "9404:9404"

  prometheus:
    # OBSERVABILITY.md §9-10 (Phase 9 lát cắt 9). Scrape CẢ container "server" (service ở trên) LẪN
    # server-gateway chạy NATIVE trên host qua host.docker.internal — xem prometheus.yml (Docker
    # Desktop Windows/Mac có sẵn; Linux cần extra_hosts bên dưới).
    image: prom/prometheus:v3.15.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.32.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    # AGPLv3 (grafana/grafana) — chấp nhận được, cùng tiền lệ Redis AGPLv3 (ADR-005, dự án cá
    # nhân ưu tiên miễn phí hơn thuần OSI).
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD trong .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  jaeger:
    # OBSERVABILITY.md §6 (Tracing, ADR-015) — all-in-one: nhận OTLP/HTTP (4318) + UI (16686),
    # đủ cho dự án cá nhân single-instance, không cần Collector/Storage backend riêng.
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
