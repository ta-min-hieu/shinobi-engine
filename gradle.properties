# Ngân sách RAM cho máy dev tối đa 32GB (2026-10-23). `check` toàn repo từng bị giết vì cạn RAM:
# không có file này thì Gradle mở tới 32 worker (= số lõi) và mỗi JVM con (test, SpotBugs, PMD)
# được trần heap mặc định 1/4 RAM vật lý = 8GB.
# Đỉnh dự tính: daemon 2GB + 4 worker x tối đa 1,5GB (trần đặt ở build-logic) + chi phí JVM
# ~= 9-10GB, chừa chỗ cho IDE, Docker (Postgres/Redis của test) và trình duyệt.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
