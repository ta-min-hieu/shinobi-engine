# ADR-130 - arc 3 Inner Sect (Purple Mansion, Lv37-54), STORY.md §6.
dialogue.option.ask_inner_exam=I have survived the Heavenly Tribulation. I ask to take the inner sect examination.
dialogue.town_elder.inner_exam=Purple Mansion already? I can feel it, your aura has changed. The inner sect is not the outer sect: nobody there asks where you came from, only how long you can stand. In the eastern trial yard waits an Inner Trial Construct. Bring it down and I will hand you the robes of the inner sect.
dialogue.option.accept_quest_inner_exam=I will go at once.
dialogue.option.ask_forbidden_archive=I wish to go down to the forbidden floor of the archive.
dialogue.town_elder.forbidden_archive=Inner disciples may go down, but stone wardens still guard the stairs. They do not care whether you belong to the sect. Bring down two, read what you will, then report to me. And... that old jade shard you found years ago, you still keep it? Take it with you. No, it is nothing. Just take it.
dialogue.option.accept_quest_forbidden_archive=I am on my way.
dialogue.option.ask_leaked_exam=Strangers are lurking around the examination yard.
dialogue.town_elder.leaked_exam=I have seen them too. Your shard glowed on the forbidden floor... I once read about such a thing in a book I should never have opened. The Heaven Gate... no, not now. What matters now: those strangers carry the mark of the Blood Sand. Bring down three and see what they carry.
dialogue.option.accept_quest_leaked_exam=I will find out.
dialogue.option.ask_grand_contest=The grand contest of the whole sect is about to open.
dialogue.town_elder.grand_contest=The examination schedule they carried is something only elders may see. You understand what that means, but tell no one; even I cannot guess who it is. As for the contest, go. Bach Kinh Chi waits for you on the eastern stage, saying you came in through the back door. Show him which door.
dialogue.option.accept_quest_grand_contest=I will take the stage.
dialogue.option.ask_altar_master=The Blood Sand is attacking the contest!
dialogue.town_elder.altar_master=They want the seeds of the Purple Mansion, which means all of you. Their altar master stands at the far end of the eastern yard. Clear his acolytes, then drive him back. If you have reached your Ultimate Skill, use it; if not, use your head. Then report to me.
dialogue.option.accept_quest_altar_master=I will drive them out.
