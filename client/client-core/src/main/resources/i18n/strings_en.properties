# Quest 9 (V42) - arc 2 CLIMAX. Zhou Heng names the steward; see town_elder.js branch
# `confront_steward` for how far he is allowed to go (STORY section 8, rule 2).
quest.name.confront_the_steward=The Steward Confronted
dialogue.option.ask_confront_steward=Elder, that token I brought back — have you looked at it?
dialogue.town_elder.confront_steward=I have. Three times. The seal on the back of that token belongs to the Hall of Discipline, and only one man in the Hall holds the seal: Steward Xing Yunshan. You see it now. The man who signed those disappearances off as runaways is the same man who left that thing in the cave. Three children, half a year, and every time it was he who investigated, he who ruled, he who closed the ledger. I cannot call the guards — call them to arrest whom, himself? So you go. Stand in front of him and ask him one question, and you will see the face under that skin. Be careful: a man who has hidden this many years inside a sect is no mere clerk.
dialogue.option.accept_quest_confront_steward=I will go and ask him.
dialogue.option.accept_quest_abandoned_cave=I will go and look at that cave.

