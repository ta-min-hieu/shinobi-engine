# --- Mail (mail.proto 900-908) ---
# WARNING: two real limitations, documented in MailPanel's javadoc, that must NOT be papered over:
#   1) Attachments can only be shown as NUMBERS — the client has no item catalog to resolve
#      name/icon (Gap 2 of ADR-035, still awaiting the project owner's decision). That is why
#      mail.attachment.raw_item says "Item #<id>" instead of inventing a name.
