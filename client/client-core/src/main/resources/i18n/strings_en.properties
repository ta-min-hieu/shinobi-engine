quest.name.spirit_vein_raiders=Take Back the Spirit Vein
quest.name.first_cultivation_manual=The First Manual
quest.name.break_the_raider_band=Break the Raider Band
quest.name.dead_vein_intruders=Strangers at the Dead Vein
quest.name.blood_sand_trail=The Blood Sand Trail
quest.name.scatter_the_blood_sand_band=Scatter the Blood Sand Band
dialogue.option.ask_dead_vein=Elder, there are people out at the dead vein.
dialogue.town_elder.dead_vein=People? That place ran dry generations ago, not even grass takes there. The ore party came back saying three figures in strange robes were digging; asked them a question, got a drawn blade. Not rogue cultivators — those rob you and run. These ones STAYED. Go and look for me. Do not be gentle: they draw first.
dialogue.option.accept_quest_dead_vein=I will go and look.
dialogue.option.ask_blood_sand_trail=Elder, there are strange marks where they stood.
dialogue.town_elder.blood_sand_trail=Marks? ... Say that again, slowly. Grey earth, grass dead in a ring, the spirit force drained from the centre outward? I have heard that once before, in the cave you and the girl came back from. Go and search it properly, then show her — she stood in that cave with you, she remembers it better than I do.
dialogue.option.accept_quest_blood_sand_trail=I will search it again.
dialogue.option.ask_scatter_band=Elder, that band has a leader.
dialogue.town_elder.scatter_band=I expected as much. Stragglers do not stand and face sect colours. He will be dug in furthest east, where the vein is dead outright — break him and the band scatters, and the ore road opens again. Let me be plain: scattering one band is not finishing with them. But the sect needs that road, and you are strong enough now.
dialogue.option.accept_quest_scatter_band=I will go and break them.

dialogue.option.ask_spirit_vein=Elder, I hear someone has taken the spirit vein outside the mountain?
dialogue.town_elder.spirit_vein=Taken it indeed. A band of rogue cultivators camped straight on the small vein to the east, drinking while they siphon off the sect's spiritual energy. Outer sect disciples collecting the monthly ore have been walking the long way round ever since. You have just awakened your spirit root, so here is the first task I give to someone who HAS one: go and drive them off. Three of them lead the outer band; fell those and the rest scatter on their own. Do not try to do it in one breath - the vein is far, so when a fight ends, stand still and get your wind back.
dialogue.option.accept_quest_spirit_vein=I will go and take the vein back.

dialogue.option.ask_first_manual=Elder, I hear the sect issues cultivation manuals?
dialogue.town_elder.first_manual=It does, and you are due one. But your year's copies are sitting with the vein raiders - they took them off an ore cart last month, and since none of them can read the script, all they know is that it belongs to the sect. Go and get two of them back. Once I have checked them I will hand them over, along with an outer sect robe. And so you are not disappointed later: that robe is not a reward for fetching books. It is what you will need for what comes NEXT.
dialogue.option.accept_quest_first_manual=I will go and bring the manuals back.

dialogue.option.ask_raider_band=Elder, the vein raiders still will not leave.
dialogue.town_elder.raider_band=I know. Drive off the underlings and the underlings come back; that knot does not come undone in the middle. Their head sits further east, where the vein runs dry - a rogue cultivator with real skill, drunk all day, and not one man in the outer sect has beaten him. Put the robe on before you go; without it, do not go at all. Fell him and your years of chore work are finished for good - and I will have something else to discuss with you.
dialogue.option.accept_quest_raider_band=I will go and break them.
