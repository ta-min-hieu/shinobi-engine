# --- NPC dialogue (keys come from the server in text_key/label_key, see town_elder.js) ---
# ARC 1 "Chore Disciple" content — STORY.md §6 arc 1 and §5 (Chu Hoành). Reveal cadence per
# STORY.md §8 rule 2: arc 1 may only PLANT seeds, never mention the Heaven Gate or the truth of
# the Great Calamity.
#
# WARNING: the key names are LEGACY. The node id `about_town` and the key
# `dialogue.town_elder.about_town` were born in the ninja-village setting. ADR-038 D7.2 forbids
# renaming keys (the server sends this exact string in text_key), so the key still says "town"
# while the content is a cultivation sect. Read the content, not the key name.
dialogue.town_elder.greeting=So you came. I am Zhou Heng, the elder who minds the outer sect. Do not let the broom discourage you — sixty years ago I swept this same yard. Speak, if you need something.
dialogue.town_elder.greeting_pills_missing=Where are the three Minor Origin-Restoring Pills? I am in no hurry, but a task you took on must come back whole. The Wasteland Ferals often carry pills on them — and if you are short, the Treasure Pavilion sells them too.
dialogue.town_elder.greeting_beasts_missing=The pills are all here. But the task was to bring down two Wasteland Ferals — pills can be bought, nerve cannot. Go on, and come back when it is done.
dialogue.town_elder.about_town=This is the Azure Void Sect, built where five spirit veins cross — a rare thing in an age of thinning spiritual energy. Chore disciples like you carry water, sweep, and gather spirit herbs. Humble work, but this mountain's energy soaks into you a little more each day.
dialogue.town_elder.about_realm=Cultivation has an order to it: Qi Condensation, then Foundation Establishment, then realms I will not name too early. Nine tiers to each. At the fifth tier of Qi Condensation your spirit root can be measured — only then will you know what heaven gave you.
dialogue.town_elder.about_elder=I have been stuck at Golden Core for forty years without gaining a single tier. They say my spirit root is too thin. I say a spirit root decides how FAST you travel, not how FAR you may go. So here I remain, still taking in the disciples everyone else turns away.
dialogue.option.ask_about_town=This disciple would ask about the sect.
dialogue.option.ask_about_realm=How are the realms of cultivation divided?
dialogue.option.ask_about_elder=What realm has the elder reached?
dialogue.option.back=This disciple has another question.
dialogue.option.accept_quest_kill_dummies=I will take the work at the puppet yard.
dialogue.option.open_shop=May I see the sect's supplies?
dialogue.option.bye=This disciple begs leave.

