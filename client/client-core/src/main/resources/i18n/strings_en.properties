# --- Extra item names (V21 seed_starter_equipment) — the "only 3 real rows" comment above is
# --- STALE since V21; the DB now holds 20 item_template rows.
#
# WARNING: the item CODES (`novice_*`, `genin_*`, `steel_katana`, `chakra_shard`) are ninja-era and
# STAY: they are the business keys of `item_template.code`, real `inventory_item` rows point at
# them, and ADR-038 D5 forbids renaming them. The two tiers now read as the Azure Void Sect's
# disciple ranks (STORY.md §4.1): `novice_*` = chore disciple (arc 1), `genin_*` = outer disciple
# (arc 2, after the spirit root awakens).
# WARNING: keep item names short (~17 characters in Vietnamese). A shop row packs
# "<name> — Buy: X  Sell: Y" into one non-wrapping label; a 2026-09-01 playtest showed a 22-character
# name swallowing the sell price entirely. English is not the rendered locale today (KageI18n pins
# "vi"), so these stay descriptive — but the same cap applies the day English ships.
# "Chore disciple" tier — the 6 equipment slots other than the artifact
item.novice_vest.name=Chore Cloth Vest
item.novice_headband.name=Chore Head Cloth
item.novice_wraps.name=Chore Hand Wraps
item.novice_sandals.name=Chore Straw Shoes
item.novice_bracelet.name=Chore Wooden Bangle
item.novice_necklace.name=Chore Cord Pendant
# "Outer disciple" tier — all 7 slots
item.steel_katana.name=Steel Longsword
item.genin_vest.name=Outer Robe
item.genin_headband.name=Outer Headpiece
item.genin_wraps.name=Outer Handguards
item.genin_sandals.name=Outer Boots
item.genin_bracelet.name=Outer Bracelet
item.genin_necklace.name=Outer Jade Pendant
# Beast materials — sell them for spirit stones
item.iron_scrap.name=Iron Scrap
item.chakra_shard.name=Beast Core Shard

