dialogue.option.ask_night_watch=I hear the herb garden keeps losing plants?
dialogue.town_elder.night_watch=Three nights running, the Azure Cloud Grass beyond the fence has been stripped bare. Not a beast — a beast cannot tell which plant is worth coin. It is a rogue cultivator, the sort with no sect and no master, living off what others grow. Tonight the watch falls to you. I am not telling you to beat him; I am telling you to DRIVE HIM OFF. Stand your ground until dawn and someone in this sect will remember your face.
dialogue.option.accept_quest_night_watch=This disciple will take tonight's watch.
quest.name.night_watch_bandit=The Night Watch

# --- Quest 3 (arc 1, the SEED — STORY.md §6): sweep the abandoned archive wing. Seeded by V30 ---
# Elder Zhou Heng only hands out the chore. The ancient jade shard is something the player picks up
# on their own (the quest reward); he does not know of it and must never mention it — §8 rule 2.
dialogue.option.ask_old_archive=Is there other work for this disciple, elder?
dialogue.town_elder.old_archive=There is. The west corner of the Archive Hall has stood empty for years, the scrolls rotted waist deep, and nobody will set foot in it. Not out of laziness — the ancients left constructs in there to guard the shelves, and the things still move, and still strike. Their masters died a thousand years ago; nobody told them. Clear two of them for me and I will find someone for the rest. And wear your gear. Stone does not pull its blows.
dialogue.option.accept_quest_old_archive=This disciple will clear the archive.
quest.name.clear_old_archive=Sweep the Old Archive
hud.monster.archive_warden=Archive Stone Warden
item.ancient_jade_shard.name=Ancient Jade Shard
item.minor_healing_pill.name=Minor Origin-Restoring Pill
item.faction_change_pill.name=Root-Cleansing Pill

# --- Quest 4 (arc 1, the CLOSE — STORY.md §6): the spirit-root awakening trial. Seeded by V33 ---
# Elder Zhou Heng speaks about the EXAMINATION and about vouching for the player himself. He does
# not mention the ancient jade shard (he does not know it exists), nor the Heaven Gate, nor Blood
# Sand — §8 rule 2, arc 1 only sows. The dialogue says outright that the walk to the trial ground
# is part of the test: the ground sits at x=-47, and getting there costs a measured 40 HP (V33 §3).
dialogue.option.ask_awakening_trial=This disciple hears the spirit-root awakening trial is near?
dialogue.town_elder.awakening_trial=It is. And I have already entered your name — before you could ask. The stewards laughed at me all morning: a chore disciple, a spirit root so thin the gauge talisman will not take ink. I told them to measure it with something that cannot lie. Behind the old Archive Hall, to the west, there is an abandoned yard, and in it stands a Spirit-Gauge Construct the sect salvaged from the ancients and repaired. It kills nobody; it simply stands there taking blows and counting how long you can hold your spiritual energy together. Strike it until it stops, and the examination is done. Three things: wear your gear; slip past the two stone wardens on the way, for nobody told them what day it is; and do not rush — most who fall at the trial fall on the road to it.
dialogue.option.accept_quest_awakening_trial=This disciple will attend the trial.
quest.name.awakening_trial=The Spirit-Root Trial
hud.monster.trial_construct=Spirit-Gauge Construct

# --- Quest 5 (arc 2, the OPENING — STORY.md §6 Outer Sect): report in. Seeded by V37 ---
# This is where Elder Zhou Heng HANDS THE PLAYER OVER. Arc 1 is closed (trial passed, spirit root
# awakened), the chore-disciple standing has lapsed, and Su Yun'er (§5) takes it from here.
# §8 rule 2 — arc 2 opens on RANKING and RESOURCES. He does not mention the missing disciples nor
# Blood Sand (both are the mid-arc-2 twist), nor the Heaven Gate or the jade shard (arc 3 / arc 5).
dialogue.option.ask_outer_sect=Now that the trial is passed, what should this disciple do?
dialogue.town_elder.outer_sect=You stop being a chore disciple, that is what. From today your name is in the outer sect register — a monthly share of resources, and a great heap of rules I am far too old to keep straight. Go find Su Yun'er out by the puppet yard; she came in three years before you and she LIVES by those rules. One word of warning: outer sect resources are handed out by ranking, and you are at the bottom of it. Do not take that as an insult. Everyone starts there. Most people simply stay.
dialogue.option.accept_quest_report_to_outer_sect=This disciple will go and report in.
quest.name.report_to_outer_sect=Reporting to the Outer Sect

# --- NPC 2: Su Yun'er (STORY.md §5) — the game's second NPC, seeded by V37 ---
# WARNING: forms of address (STORY.md §8 rule 4) are why her back/leave options do NOT share keys
# with the elder's: to an elder it is "this disciple takes his leave", to a senior sister of the
# same rank it is "sister" and "this junior". Sharing the keys saves four lines and gets the
# social register wrong in every single sentence.
# WARNING: she gives away nothing about the arc 5 twist (that she is a coerced informant). In arc 2
# she shelters her juniors GENUINELY — writing her as someone performing ruins the twist early.
npc.senior_sister.name=Senior Sister Su Yun'er
dialogue.senior_sister.greeting=Ah — you are the one who just passed the trial, aren't you? The whole outer sect has been talking since morning: Elder Zhou vouched for a chore disciple, and the chore disciple actually passed. I am Su Yun'er, three years ahead of you. Call me senior sister, or call me by name, I am not the sort to make a fuss about it. Ask me anything you don't understand — better me than the wrong person.
dialogue.senior_sister.greeting_tallies_missing=Where are the tallies? I need both of them before I can hand them in. The rogue cultivators along the trail still have them — take each one back from whoever is holding it.
dialogue.senior_sister.greeting_talisman_missing=You still have not got that talisman? It has to be in my hands, or there is nothing to put before anyone. The Blood Sand Scouts carry it — be careful.
dialogue.option.ask_outer_sect_rank=Sister, how are the outer sect's resources handed out?
dialogue.senior_sister.about_rank=By ranking, reviewed every month. Top of the board gets spirit stones, pills, the good spots on the veins — bottom of the board gets rations. It sounds cruel, but it is fairer than you think: it counts the work you do, not how thick your spirit root is. Take work steadily and you will be off the bottom within a month. Three years ago I stood exactly where you are standing.
dialogue.option.ask_rival=I hear there is someone difficult here?
dialogue.senior_sister.about_rival=You mean Bai Jingzhi. Yes, he has said a few things about "the one who came in through the back door" — said to your face, not behind your back, I will give him that. And I have to be fair to him: he really is good, the finest spirit root of his generation, and he still works harder than people with thin ones. Do not quarrel with him, and do not avoid him either. Just do your work. In the end this sect looks at the ranking board, not at who talks loudest.
dialogue.option.ask_senior_sister=How did you come to the sect, sister?
dialogue.senior_sister.about_herself=My family were merchants, comfortable enough — and then it was all gone in a single season. My father scraped together what was left and brought me up the mountain, saying at least there would be food here. My first three years I carried water, same as you. I tell you so you know: almost nobody in this outer sect came in through the front gate. So if anyone sneers at where you came from, let it go past you.
dialogue.option.back_senior_sister=This junior has another question.
dialogue.option.bye_senior_sister=This junior takes her leave, sister.
dialogue.option.open_storage=Could you keep a few things for me, senior sister?

# --- Arc 2, quest 6: "Reclaim the Tallies" (V38) ----------------------------------------------------
quest.name.recover_outer_sect_tallies=Reclaim the Tallies
item.outer_sect_tally.name=Outer Sect Tally
dialogue.option.ask_outer_sect_work=Sister, is there work for me?
dialogue.senior_sister.about_work=There is, and it is dirty work. At the foot of the mountain a band of rogue cultivators has been stopping disciples on their way to collect rations, and taking their tallies too. Lose your tally and the month counts for nothing, while the steward writes down a single word: "lost". Bring me back two of them and I will check the ledger and return them to their owners. One of the two belongs to Li San — the boy has not come back for days now, and the steward says he could not take it and ran. I am not so sure: he carried water more diligently than I ever did.
dialogue.option.accept_quest_outer_sect_tallies=I will get them back for you, sister.

# --- Arc 2, quest 7: "The Trail of Li San" (V39) ----------------------------------------------
quest.name.missing_disciple_trail=The Trail of Li San
dialogue.option.ask_missing_disciple=Elder, about the outer sect disciples who have not come back?
dialogue.town_elder.missing_disciple=So you have heard as well. The Hall of Discipline looked into it once and ruled: the boy could not take the hardship and ran off down the mountain. One word in the ledger — "fled" — and the matter was closed. I am not convinced, and not out of pity: he is the third in half a year, and all three left their belongings behind. A boy who runs takes his blanket and his coat with him, you understand. If you want to know more, ask at the places they went to, not the ledger.
dialogue.option.accept_quest_missing_disciple=I will find out what happened to Li San.

