# ADR-139 — arc 4 Descending the Mountain (Golden Core, Lv55-72), STORY.md §6.
dialogue.option.ask_descend=I have formed my Golden Core. I ask leave to descend the mountain.
dialogue.town_elder.descend=A Golden Core already. The sect's old rule: a Golden Core must go down the mountain and temper the heart in the mortal world. Nobody is exempt, this old man included. Head east past the inner sect gate into the deep Wasteland. There is no law there, no sect to shield you, and a disciple of another sect is not necessarily a friend. Rogue cultivators block the way in; put one down to get your hand in, then report back. I will give you the Golden Core attire.
dialogue.option.accept_quest_descend=I will descend.
dialogue.option.ask_trace_blood_sand=There are Blood Sand tracks in the Wasteland.
dialogue.town_elder.trace_blood_sand=I guessed as much. They are not in the Wasteland for the view. Word is they dig around dead spirit veins, and they dig without taking spirit stones, because a dead vein has none left. They are looking for something. Put down two of their vein diggers and come back.
dialogue.option.accept_quest_trace_blood_sand=I will look into it.
dialogue.option.ask_awakened_beast=The Blood Sand hold a demon-kin that speaks like a person.
dialogue.town_elder.awakened_beast=An awakened demon-kin... Our people are used to fighting beasts; few remember they lived in the Wasteland before the Great Calamity. If they use it to find veins, it is still alive. Take down the warden and free it. Listen well to whatever it says, then tell me.
dialogue.option.accept_quest_awakened_beast=I will free it.
dialogue.option.ask_frenzied_kin=The demon-kin says its own kind are going mad.
dialogue.town_elder.frenzied_kin=Wherever the dead vein spreads, beasts go frenzied. We call them demon beasts; to it they are brothers. It asks you to release two of them near the dead vein. There is no glory in this, but it is the right thing. Come back when it is done.
dialogue.option.accept_quest_frenzied_kin=I accept.
dialogue.option.ask_colossus=The Blood Sand woke an ancient stone colossus under the dead vein!
dialogue.town_elder.colossus=A vein guardian from the Spirit Dynasty era... that thing has slept for a thousand years. You cannot do this alone. Bach Kinh Chi has reached the Wasteland; I have told him to hold the left flank, and the demon-kin you saved can call its people. Three sides against one monster sounds like a joke, but in the Wasteland it is ordinary. Bring it down, then report.
dialogue.option.accept_quest_colossus=I will go.
