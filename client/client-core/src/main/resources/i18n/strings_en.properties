# --- V48 (2026-09-17) — the five branches of the Lv28-36 stretch ---------------------------------
dialogue.option.ask_wasteland_edge=Elder, is the eastern road clear now?
dialogue.town_elder.wasteland_edge=The near stretch, yes. The far one, no — the Blood Sand ringleaders still have a band clinging to the dead vein, and past their backs lies the edge of the Wasteland. You will have to go out there, and going out there in old outer sect cloth is handing in your life. Put down the one leading them, then come back and I will issue you a new set — the sect does not send a disciple to the Foundation trial empty-handed.
dialogue.option.accept_quest_wasteland_edge=I will finish clearing it.
dialogue.option.ask_rank_board=Elder, where is my allotment this month?
dialogue.town_elder.rank_board=The ranking board. Bai Jingzhi and the ones who follow him put you at the bottom, and the allotment follows the ranking — you know how that goes. I can say a word about it; I cannot say two. Distribution is not mine to rule. So: go to the Wasteland edge and take your own. The ferals out there carry pills enough to see you through the trial. When it is done, find Su Yun'er — she reads those boards better than I do.
dialogue.option.accept_quest_rank_board=I will take my own, then.
dialogue.option.ask_pill_run=What does the Foundation trial require?
dialogue.town_elder.pill_run=Pills. Foundation is not the work of one breath — the cultivation settles into the dantian, and meridians that cannot take it fail, permanently. Three is the least I will let you enter on. Gather them out there and bring them back. Do not buy them; nobody vouches for what is sold at a market stall.
dialogue.option.accept_quest_pill_run=I will gather them.
dialogue.option.ask_proving=Am I fit to sit the trial?
dialogue.town_elder.proving=Not yet. That is not me making it hard — it is the rule: whoever enters proves first that they can hold their ground out there. Three of them, by yourself, with nobody beside you. Report back when it is done and I will put your name on the list.
dialogue.option.accept_quest_proving=I will prove it.
dialogue.option.ask_breakthrough=Elder, I ask to sit the trial.
dialogue.option.ask_daily_duty=Is there any sect work for me today?
dialogue.town_elder.daily_duty=There is sect work every day, and when it is done there is more tomorrow. Drill five rounds on the training dummies; drive off three rogue cultivators loitering by the fence; or carry water to Senior Sister Su at the training yard and report back to me. Any of them will do, and the sect pays its spirit stones.
dialogue.option.accept_quest_daily_dummy_drill=I will go to the training dummies.
dialogue.option.accept_quest_daily_mountain_patrol=I will patrol the mountain.
dialogue.option.accept_quest_daily_water_duty=I will carry the water.
dialogue.town_elder.breakthrough=Granted. In the yard stands a Foundation Trial Warden — built by the sect for this, not salvage repaired like the one you faced when your spirit root woke. It will not kill you, and it will not yield either. Hold your ground before it and the cultivation settles; your Foundation is established. Go. I will be here.
dialogue.option.accept_quest_breakthrough=This disciple will face it.
# --- Way posts along the trunk (ADR-050 D6) — ONE npc_template standing in SIX places, deliberately nameless ---
npc.waypost_attendant.name=Way Post Attendant
dialogue.waypost_attendant.greeting=Catch your breath, fellow cultivator. Nothing out there can reach you inside this array — it is a small thing, one corner of the sect's mountain-warding array, enough to cover a place to sit. Beyond it I promise nothing.
dialogue.option.ask_waypost_rest=Can I recover my strength here?
dialogue.option.ask_waypost_road=What lies further along the road?
dialogue.option.bye_waypost=My thanks. I will move on.
dialogue.waypost_attendant.about_rest=You can, but you must SIT STILL. This array is not a pill — it pours nothing into anyone, it only buys you the quiet to mend on your own. Stand a while, keep your blade down, and you will see it. And remember: the moment you strike outward, the array stops counting you as someone at rest, and the thing out there will find you.
dialogue.waypost_attendant.about_road=The further east, the fewer people and the more of everything else. Where I stand is the last ground that still counts as the sect's; past this is the edge of the Wasteland, a dead spirit vein, and the law died along with it. Outer disciples cut from their share have to go out there to find their own — I know, I am the one who hands out the rations. Go if you must, but stop here on the way back.
