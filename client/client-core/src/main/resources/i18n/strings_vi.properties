# GIỮ NGUYÊN: chúng là khoá nghiệp vụ của `item_template.code`, có `inventory_item` thật trỏ vào,
# và ADR-038 D5 cấm đổi. Hai BẬC trang bị giờ đọc theo bậc đệ tử của Thanh Hư Tông (STORY.md §4.1):
# `novice_*` = tạp dịch (arc 1), `genin_*` = ngoại môn (arc 2, sau khi thức tỉnh linh căn).
# ⚠️ TRẦN ĐỘ DÀI ~17 KÝ TỰ cho tên vật phẩm. Dòng cửa hàng ghép "<tên> — Mua: X  Bán: Y" trong một
