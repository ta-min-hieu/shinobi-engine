# --- Hội thoại NPC (khoá do server gửi trong text_key/label_key, xem town_elder.js) ---
# Nội dung ARC 1 "Tạp Dịch" — STORY.md §6 arc 1 + §5 (Chu Hoành). Nhịp hé lộ theo STORY.md §8 quy
# tắc 2: arc 1 chỉ ĐƯỢC GIEO MẦM, KHÔNG được nói tới Thiên Môn hay chân tướng Đại Kiếp.
#
# ⚠️ Tên khoá là DI SẢN: mã node `about_town` và khoá `dialogue.town_elder.about_town` ra đời thời
# bối cảnh làng ninja. ADR-038 D7.2 cấm đổi khoá (server gửi chính chuỗi này trong text_key), nên
# khoá giữ chữ "town" trong khi nội dung đã là tông môn. Đọc theo nội dung, đừng theo tên khoá.
dialogue.town_elder.greeting=Ngươi tới rồi. Ta là Chu Hoành, trưởng lão coi việc ngoại môn. Đừng nhìn cái chổi mà nản — sáu mươi năm trước ta cũng quét đúng sân này. Có việc gì thì nói.
dialogue.town_elder.about_town=Đây là Thanh Hư Tông, dựng trên chỗ năm đạo linh mạch giao nhau — thứ hiếm ở cái thời linh khí cạn này. Đệ tử tạp dịch như ngươi gánh nước, quét sân, hái linh thảo. Việc mọn, nhưng linh khí núi này thấm vào người từng ngày.
dialogue.town_elder.about_realm=Tu luyện có thứ tự: Luyện Khí, rồi Trúc Cơ, rồi mới tới những cảnh giới ta không tiện nói sớm. Mỗi cảnh giới chín tầng. Tới Luyện Khí tầng năm thì đo được linh căn — lúc đó ngươi mới biết trời cho mình cái gì.
dialogue.town_elder.about_elder=Ta kẹt ở Kim Đan bốn mươi năm, không lên nổi một tầng. Người ta bảo tại linh căn ta mỏng. Ta thì cho rằng linh căn quyết định ngươi đi NHANH tới đâu, không quyết định ngươi đi ĐƯỢC tới đâu. Nên ta vẫn ở đây, vẫn nhận đệ tử người khác chê.
# Xưng hô theo STORY.md §8 quy tắc 4: đệ tử tạp dịch tự xưng "đệ tử", gọi Chu Hoành là "trưởng lão".
dialogue.option.ask_about_town=Đệ tử xin hỏi về tông môn.
dialogue.option.ask_about_realm=Cảnh giới tu luyện chia thế nào ạ?
dialogue.option.ask_about_elder=Trưởng lão tu tới cảnh giới nào rồi ạ?
dialogue.option.back=Đệ tử còn muốn hỏi chuyện khác.
dialogue.option.accept_quest_kill_dummies=Đệ tử xin nhận việc ở bãi mộc nhân.
dialogue.option.open_shop=Xin trưởng lão cho xem chỗ vật tư.
dialogue.option.bye=Đệ tử xin phép lui.

