bestiary.inner_trial_construct.lore=Cỗ máy Linh Triều cuối cùng tông môn sửa lại cho kỳ khảo hạch nội môn. Nó không đo sức, nó đo xem ai đứng được lâu.
bestiary.blood_sand_infiltrator.lore=Tế đồ Huyết Sa khoác áo đệ tử trà trộn vào tông. Trong người chúng có lịch khảo hạch mà chỉ hàng trưởng lão được xem.
bestiary.bach_kinh_chi.lore=Thiên tài linh căn dày nhất một thế hệ. Kiêu nhưng không hèn: thua thì nhận, và nhớ.
bestiary.blood_sand_altar_master.lore=Đàn chủ dẫn toán tập kích lễ bỉ võ, tìm hạt giống Tử Phủ để làm nhiên liệu cho tế đàn.
