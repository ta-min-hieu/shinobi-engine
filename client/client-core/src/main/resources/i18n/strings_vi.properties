item.minor_healing_pill.name=Tiểu Hồi Nguyên Đan

# --- Quest 4 (arc 1, nhịp ĐÓNG — STORY.md §6): kỳ khảo hạch thức tỉnh linh căn. Seed V33 ---
# Chu Hoành nói về KỲ THI và về việc chính ông đứng ra bảo lãnh. Ông KHÔNG nhắc mảnh ngọc cổ (ông
# không biết nó tồn tại), không nhắc Thiên Môn, không nhắc Huyết Sa — §8 quy tắc 2, arc 1 chỉ gieo.
# Lời thoại nói THẲNG rằng quãng đường tới sân khảo hạch là một phần bài thi: sân ở x=-47, đi tới
# đó phải lách qua hai cỗ thạch vệ và tốn 40 máu đo được (V33 §3).
dialogue.option.ask_awakening_trial=Đệ tử nghe nói sắp tới kỳ khảo hạch thức tỉnh linh căn?
dialogue.town_elder.awakening_trial=Sắp. Và ta đã ghi tên ngươi vào rồi — trước khi ngươi kịp hỏi. Mấy vị chấp sự cười ta suốt buổi sáng: một đứa tạp dịch, linh căn mỏng tới mức trắc linh phù không ăn mực. Ta bảo họ đo lại bằng thứ không biết nói dối. Sau lưng Tàng Thư Đường cũ, phía tây, có cái sân bỏ hoang — trong đó dựng một cỗ Trắc Linh Thạch Nhân tông môn nhặt được của người xưa rồi sửa lại. Nó không giết ai; nó chỉ đứng đó chịu đòn và đếm xem ngươi còn duy trì linh khí được bao lâu. Ngươi đánh cho tới lúc nó dừng, thế là xong bài. Ba điều ta dặn: mặc đủ đồ vào; đi thì lách qua hai cỗ thạch vệ ở giữa đường, bọn chúng không biết hôm nay là ngày thi; và đừng vội — kẻ ngã ở khảo hạch phần lớn là ngã trên đường tới đó.
dialogue.option.accept_quest_awakening_trial=Đệ tử xin đi dự khảo hạch.
quest.name.awakening_trial=Khảo Hạch Thức Tỉnh Linh Căn
hud.monster.trial_construct=Trắc Linh Thạch Nhân

# --- Quest 5 (arc 2, nhịp MỞ — STORY.md §6 Ngoại Môn): báo danh ngoại môn. Seed V37 ---
# Đây là chỗ Chu Hoành BÀN GIAO người chơi. Arc 1 đã đóng (khảo hạch xong, linh căn đã thức tỉnh),
# thân phận tạp dịch hết hiệu lực, và người dẫn tiếp là Tô Vân Nhi (§5).
# §8 quy tắc 2 — arc 2 mở bằng THỨ HẠNG và TÀI NGUYÊN. Ông KHÔNG nhắc chuỗi đệ tử mất tích, không
# nhắc Huyết Sa (cả hai là twist GIỮA arc 2), không nhắc Thiên Môn hay mảnh ngọc cổ (arc 3/arc 5).
dialogue.option.ask_outer_sect=Qua khảo hạch rồi thì đệ tử nên làm gì ạ?
dialogue.town_elder.outer_sect=Thì thôi làm tạp dịch. Từ hôm nay ngươi là đệ tử ngoại môn — có tên trong sổ, có phần tài nguyên hàng tháng, và có cả một đống quy củ mà ta thì già quá rồi, không nhớ nổi cái nào còn hiệu lực. Ra chỗ bãi mộc nhân tìm Tô Vân Nhi, nó vào trước ngươi ba năm và nó ĐANG sống bằng đúng những quy củ ấy. Ta dặn trước một câu: tài nguyên ngoại môn phát theo thứ hạng, mà ngươi thì đang đứng cuối bảng. Đừng lấy đó làm nhục — ai cũng bắt đầu ở đó, chỉ là phần lớn dừng lại ở đó luôn.
dialogue.option.accept_quest_report_to_outer_sect=Đệ tử xin đi báo danh ngoại môn.
quest.name.report_to_outer_sect=Báo Danh Ngoại Môn

# --- NPC 2: Tô Vân Nhi (STORY.md §5) — NPC thứ hai của game, seed V37 ---
# ⚠️ Xưng hô (STORY.md §8 quy tắc 4) là lý do bộ "lui/hỏi tiếp" của cô KHÔNG dùng chung khoá với
# Chu Hoành: với trưởng lão thì "đệ tử xin phép lui", với sư tỷ cùng ngoại môn thì gọi "sư tỷ" và
# tự xưng "muội". Dùng chung khoá là tiết kiệm được bốn dòng và sai vai vế ở mọi câu.
# ⚠️ Cô KHÔNG úp mở gì về twist arc 5 (chính cô là tai mắt bị ép buộc). Ở arc 2 cô che chở đàn em
# THẬT LÒNG — viết cô thành kẻ đang diễn là hỏng cú twist trước khi nó kịp xảy ra.
npc.senior_sister.name=Sư tỷ Tô Vân Nhi
dialogue.senior_sister.greeting=A, ngươi là đứa vừa qua khảo hạch phải không? Cả ngoại môn đồn từ sáng: trưởng lão Chu đứng ra bảo lãnh một đứa tạp dịch, mà đứa đó qua thật. Ta là Tô Vân Nhi, vào trước ngươi ba năm. Gọi ta sư tỷ cũng được, mà gọi tên cũng chẳng sao — ta không phải hạng người bắt bẻ mấy chuyện đó. Có gì không hiểu thì hỏi, hỏi ta còn hơn hỏi sai người.
dialogue.senior_sister.greeting_tallies_missing=Thẻ bài đâu rồi? Ta cần đủ hai tấm mới nộp lên được. Mấy tên tán tu ngoài đường mòn còn giữ đấy — gặp đứa nào thì lấy lại đứa ấy.
dialogue.senior_sister.greeting_talisman_missing=Ngươi chưa lấy được cái lệnh phù sao? Thứ đó phải nằm trong tay ta thì mới có cái mà trình lên. Bọn Thám Tử Huyết Sa mang theo nó — cẩn thận một chút.
dialogue.option.ask_outer_sect_rank=Sư tỷ, tài nguyên ngoại môn phát thế nào ạ?
dialogue.senior_sister.about_rank=Theo thứ hạng, tháng nào cũng xét lại. Đứng đầu bảng thì linh thạch, đan dược, chỗ tốt ở linh mạch — đứng cuối bảng thì được đúng phần khẩu phần. Nghe thì tàn nhẫn, nhưng nó công bằng hơn ngươi tưởng: nó đếm việc ngươi làm, không đếm linh căn ngươi dày mỏng. Muội cứ nhận việc đều tay, một tháng là ra khỏi đáy bảng. Ta ba năm trước cũng ở đúng chỗ muội đang đứng.
dialogue.option.ask_rival=Nghe nói ngoại môn có người khó chịu lắm ạ?
dialogue.senior_sister.about_rival=Ý muội là Bạch Kính Chi. Ừ, hắn có nói vài câu về "đứa đi cửa sau" — nói thẳng trước mặt, không nói sau lưng, hắn được cái đó. Và ta phải công bằng với hắn: hắn giỏi thật, linh căn hạng nhất một thế hệ, mà hắn còn chăm hơn cả người linh căn mỏng. Muội đừng cãi nhau với hắn, cũng đừng tránh hắn. Cứ làm việc của mình. Ở tông này rốt cuộc người ta nhìn bảng xếp hạng, không nhìn mồm ai to hơn.
dialogue.option.ask_senior_sister=Sư tỷ vào tông môn thế nào ạ?
dialogue.senior_sister.about_herself=Nhà ta buôn bán, có của ăn của để — rồi mất sạch trong một mùa. Cha ta gom nốt chỗ còn lại đưa ta lên núi, bảo ở đây ít ra có cơm. Ba năm đầu ta cũng gánh nước như muội thôi. Nói vậy để muội biết: ở ngoại môn này chẳng mấy ai tới bằng cửa trước cả. Nên có ai chê muội xuất thân, cứ để ngoài tai.
dialogue.option.back_senior_sister=Muội còn muốn hỏi chuyện khác.
dialogue.option.bye_senior_sister=Muội xin phép, sư tỷ.
dialogue.option.open_storage=Sư tỷ giữ giúp muội ít đồ được không?

# --- Arc 2, quest 6: "Đòi Lại Thẻ Bài" (V38) -------------------------------------------------
quest.name.recover_outer_sect_tallies=Đòi Lại Thẻ Bài
item.outer_sect_tally.name=Thẻ Bài Ngoại Môn
dialogue.option.ask_outer_sect_work=Sư tỷ, có việc gì cho muội làm không ạ?
dialogue.senior_sister.about_work=Có, mà là việc bẩn tay. Dưới chân núi có đám tán tu chặn đường đệ tử đi lĩnh khẩu phần, cướp cả thẻ bài. Mất thẻ bài thì tháng đó coi như làm không công, mà chấp sự thì chỉ ghi một chữ "mất". Muội đòi về cho ta hai cái, ta đối chiếu sổ rồi trả lại chủ. Một trong hai cái là của Lý Tam — thằng bé mấy hôm nay không thấy về, chấp sự bảo nó chịu không nổi mà bỏ trốn. Ta thì tiếc: nó gánh nước còn chăm hơn ta hồi đó.
dialogue.option.accept_quest_outer_sect_tallies=Muội đi đòi về cho sư tỷ.

# --- Arc 2, quest 7: "Dấu Vết Lý Tam" (V39) ---------------------------------------------------
quest.name.missing_disciple_trail=Dấu Vết Lý Tam
dialogue.option.ask_missing_disciple=Trưởng lão, chuyện đệ tử ngoại môn không thấy về ạ?
dialogue.town_elder.missing_disciple=Ngươi cũng nghe rồi à. Hình Đường tra một lượt rồi kết: đứa đó chịu không nổi khổ, bỏ trốn xuống núi. Sổ ghi đúng một chữ "trốn", đóng lại, xong việc. Lão phu thì chưa tin — không phải vì thương nó, mà vì đây là đứa thứ ba trong nửa năm, và cả ba đều bỏ lại đồ đạc. Người bỏ trốn thì mang theo chăn áo, ngươi hiểu chứ. Muốn hỏi nữa thì ra hỏi chính chỗ chúng hay lui tới, đừng hỏi cái sổ.
dialogue.option.accept_quest_missing_disciple=Muội đi hỏi cho ra chuyện Lý Tam.

