# bán ("... Bá..."). "Băng Tay Tạp Dịch" (17) hiện đủ — đó là mốc đã ĐO, không phải mốc đoán.
# Bậc "Tạp Dịch" — 6 ô trang bị còn lại ngoài pháp khí
