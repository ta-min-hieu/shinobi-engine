hud.monster.blood_sand_scout=Thám Tử Huyết Sa
# Vỏ bọc: thanh máu phải đọc là CHẤP SỰ, không phải danh phận thật của hắn — việc lộ mặt là
# của script (ADR-048 / STORY.md §6), không phải của cái tên.
hud.monster.blood_sand_enforcer=Chấp sự Hình Vân Sơn
# Quest 9 (V42) — CAO TRÀO arc 2. Chu Hoành chỉ đích danh chấp sự; xem town_elder.js nhánh
# `confront_steward` để biết ông ĐƯỢC nói tới đâu (STORY §8 quy tắc 2).
quest.name.confront_the_steward=Đối Chất Chấp Sự
dialogue.option.ask_confront_steward=Trưởng lão, cái lệnh phù đệ tử mang về... người xem chưa ạ?
dialogue.town_elder.confront_steward=Lão phu xem rồi. Xem ba lần. Dấu triện trên mặt sau cái lệnh phù ấy là dấu của Hình Đường — mà cả Hình Đường chỉ có một người cầm triện, là chấp sự Hình Vân Sơn. Ngươi hiểu chưa: kẻ ký đóng hồ sơ "bỏ trốn" chính là kẻ để lại vật ấy trong hang. Ba đứa nhỏ, nửa năm, và mỗi lần đều là hắn tra, hắn kết, hắn đóng. Lão phu không gọi người gác được — gọi ai, gọi chính hắn à? Ngươi đi. Đứng trước mặt hắn mà hỏi một câu thôi, rồi ngươi sẽ thấy cái mặt dưới lớp da kia. Cẩn thận: kẻ giấu mình ngần ấy năm giữa tông môn thì không phải hạng chấp sự quèn đâu.
dialogue.option.accept_quest_confront_steward=Đệ tử đi hỏi hắn một câu.
dialogue.option.accept_quest_abandoned_cave=Muội đi xem cái hang ấy.

