# ADR-139 — arc 4 Hạ Sơn (Kim Đan, Lv55-72), STORY.md §6.
dialogue.option.ask_descend=Đệ tử đã kết Kim Đan. Xin lệnh xuống núi.
dialogue.town_elder.descend=Kim Đan rồi à. Lệ cũ của tông: Kim Đan phải xuống núi luyện tâm trong hồng trần, không ai được miễn, kể cả lão phu năm xưa. Đi về phía đông, qua cổng nội môn là Hoang Vực sâu. Ở đó không có luật, không có tông môn che cho ngươi, gặp đệ tử tông khác cũng chưa chắc là bạn. Tà tu chắn ở cửa ngõ, hạ một tên cho quen tay rồi về báo. Lão phu sẽ giao ngươi bộ y phục Kim Đan.
dialogue.option.accept_quest_descend=Đệ tử xin hạ sơn.
dialogue.option.ask_trace_blood_sand=Ở Hoang Vực có dấu vết Huyết Sa.
dialogue.town_elder.trace_blood_sand=Lão phu đoán thế. Bọn chúng không ở Hoang Vực để ngắm cát. Có tin đồn chúng đào bới quanh những linh mạch đã chết, đào mà không lấy linh thạch, vì mạch chết thì làm gì còn linh thạch. Chúng tìm thứ gì đó. Hạ hai tên quật mạch đồ rồi về đây.
dialogue.option.accept_quest_trace_blood_sand=Đệ tử đi dò.
dialogue.option.ask_awakened_beast=Huyết Sa giam một yêu tộc biết nói tiếng người.
dialogue.town_elder.awakened_beast=Yêu tộc khai trí... Người tông ta quen đánh yêu thú, ít ai nhớ chúng ở Hoang Vực từ trước cả Đại Kiếp. Chúng dùng nó dò mạch thì nó còn sống. Hạ cai ngục, thả nó ra. Nó nói gì, ngươi nghe cho kỹ rồi về kể lão phu.
dialogue.option.accept_quest_awakened_beast=Đệ tử đi cứu.
dialogue.option.ask_frenzied_kin=Yêu tộc nói đồng loại của nó đang hoá cuồng.
dialogue.town_elder.frenzied_kin=Mạch chết lan tới đâu, thú hoá cuồng tới đó. Chúng ta gọi chúng là yêu thú, nhưng với nó đó là anh em. Nó nhờ ngươi giải thoát cho hai con quanh mạch chết. Việc này không vinh quang gì, nhưng là việc nên làm. Xong thì về.
dialogue.option.accept_quest_frenzied_kin=Đệ tử nhận lời.
dialogue.option.ask_colossus=Huyết Sa đánh thức một cổ thạch quái dưới mạch chết!
dialogue.town_elder.colossus=Máy hộ mạch thời Linh Triều... thứ đó ngủ cả nghìn năm rồi. Một mình ngươi không đủ. Bạch Kính Chi đã tới Hoang Vực, lão phu nhắn nó giữ sườn trái; con yêu tộc ngươi cứu cũng gọi được người của nó. Ba phe đánh một con quái, nghe như chuyện cười, nhưng ở Hoang Vực đó là chuyện thường. Hạ nó rồi về báo.
dialogue.option.accept_quest_colossus=Đệ tử xin đi.
