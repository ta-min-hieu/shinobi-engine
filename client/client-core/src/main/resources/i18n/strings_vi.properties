# --- V48 (2026-09-17) — năm nhánh thoại của quãng Lv28–36 ---------------------------------------
dialogue.option.ask_wasteland_edge=Trưởng lão, đường đông đã sạch chưa?
dialogue.town_elder.wasteland_edge=Sạch phần trong. Phần ngoài thì không — đám đàn chủ Huyết Sa còn một toán bám lại chỗ mạch chết, và sau lưng chúng là rìa Hoang Vực. Ngươi sắp phải ra tới đó, mà ra tới đó với bộ đồ ngoại môn cũ là đi nộp mạng. Hạ nốt tên cầm đầu đi, rồi về đây lão phu cấp cho bộ mới — tông môn không để đệ tử sắp khảo hạch Trúc Cơ đi tay không.
dialogue.option.accept_quest_wasteland_edge=Đệ tử đi dọn nốt.
dialogue.option.ask_rank_board=Phần tài nguyên tháng này của đệ tử đâu ạ?
dialogue.town_elder.rank_board=Bảng thứ hạng. Bạch Kính Chi và đám theo hắn xếp ngươi xuống đáy, mà phần phát theo thứ hạng thì ngươi biết rồi đấy. Lão phu nói được một câu, không nói được hai — chuyện phân phát không thuộc quyền lão. Cách duy nhất: ra rìa Hoang Vực tự kiếm. Yêu nhân ngoài đó mang đan dược trong người, đủ cho ngươi qua kỳ khảo hạch. Xong thì tìm Tô Vân Nhi, nó rành chuyện bảng biểu hơn lão phu.
dialogue.option.accept_quest_rank_board=Đệ tử tự đi kiếm.
dialogue.option.ask_pill_run=Khảo hạch Trúc Cơ cần chuẩn bị những gì?
dialogue.town_elder.pill_run=Đan dược. Trúc Cơ không phải chuyện một hơi thở — tu vi dồn xuống đan điền, kinh mạch chịu không nổi là hỏng, mà hỏng thì hỏng vĩnh viễn. Ba viên là mức tối thiểu lão phu dám cho ngươi vào. Ra ngoài kiếm đủ rồi mang về đây, đừng mua của ai — thứ mua ngoài chợ không ai bảo đảm.
dialogue.option.accept_quest_pill_run=Đệ tử đi gom đủ.
dialogue.option.ask_proving=Đệ tử đã đủ tư cách dự khảo hạch chưa?
dialogue.town_elder.proving=Chưa. Không phải lão phu làm khó — quy củ là vậy: ai vào khảo hạch cũng phải chứng minh mình đứng vững được ngoài kia đã. Ba con, tự ngươi, không ai đi cùng. Làm xong thì về báo, lão phu ghi tên ngươi vào danh sách.
dialogue.option.accept_quest_proving=Đệ tử đi chứng minh.
dialogue.option.ask_breakthrough=Đệ tử xin vào khảo hạch.
dialogue.option.ask_daily_duty=Hôm nay tông môn có việc gì cho đệ tử?
dialogue.town_elder.daily_duty=Việc tông môn ngày nào cũng có, làm xong thì mai lại có. Sáng ra bãi mộc nhân luyện tay năm hiệp; tán tu lảng vảng ngoài rào thì đuổi ba tên; nước cho sân luyện công thì gánh tới chỗ Tô sư tỷ rồi về báo lão phu. Làm việc nào cũng được, linh thạch tông môn phát đủ.
dialogue.option.accept_quest_daily_dummy_drill=Đệ tử ra bãi mộc nhân.
dialogue.option.accept_quest_daily_mountain_patrol=Đệ tử đi tuần sơn.
dialogue.option.accept_quest_daily_water_duty=Đệ tử đi gánh nước.
dialogue.option.accept_quest_daily_caravan_escort=Đệ tử đi áp tải xe linh thảo tới trạm Linh Mạch.
dialogue.town_elder.breakthrough=Được. Trong sân có một cỗ Trắc Trúc Cơ Thạch Nhân — tông môn dựng riêng cho kỳ này, không phải đồ nhặt về sửa lại như cỗ hồi ngươi thức tỉnh linh căn. Nó không giết ngươi, nhưng nó không nhường. Đứng vững trước nó thì tu vi tự dồn xuống, Trúc Cơ thành. Đi đi. Lão phu đợi ở đây.
dialogue.option.accept_quest_breakthrough=Đệ tử xin lĩnh giáo.
# --- Trạm tiếp ứng dọc trục (ADR-050 D6) — MỘT npc_template đứng ở SÁU chỗ, cố ý vô danh ---
npc.waypost_attendant.name=Đệ tử trực trạm
dialogue.waypost_attendant.greeting=Đứng lại thở đã, đạo hữu. Trong vòng trận này thì không con gì mò tới được đâu — nó nhỏ thôi, một góc trận pháp hộ sơn của tông chia ra, đủ che một chỗ ngồi. Ngoài kia thì ta không hứa được gì.
dialogue.option.ask_waypost_rest=Nghỉ ở đây thì hồi được sức chứ?
dialogue.option.ask_waypost_road=Đường phía trước thế nào?
dialogue.option.bye_waypost=Đa tạ, ta đi tiếp.
dialogue.waypost_attendant.about_rest=Hồi được, nhưng phải NGỒI YÊN. Trận này không phải đan dược — nó không nhét tu vi vào người ai cả, nó chỉ làm cho ngươi được yên mà tự hồi. Cứ đứng im một lát, đừng rút kiếm, rồi khắc thấy. Mà nhớ: hễ ngươi đánh ra ngoài thì trận thôi nhận ngươi là người đang nghỉ, con bên kia sẽ tìm được ngươi.
dialogue.waypost_attendant.about_road=Càng ra đông càng thưa người mà càng dày thứ khác. Chỗ ta đứng đây là chỗ cuối cùng còn tính là đất của tông; qua khỏi đây là rìa Hoang Vực, linh mạch chết, luật lệ cũng chết theo. Đệ tử ngoại môn bị cắt phần thì phải ra đó kiếm — ta biết, ta phát khẩu phần cho các ngươi mà. Đi thì đi, nhưng lượt về nhớ ghé lại.
