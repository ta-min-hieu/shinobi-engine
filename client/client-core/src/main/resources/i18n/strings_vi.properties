# ADR-130 — arc 3 Nội Môn (Tử Phủ, Lv37-54), STORY.md §6.
dialogue.option.ask_inner_exam=Đệ tử đã qua Thiên Kiếp. Xin dự khảo hạch nội môn.
dialogue.town_elder.inner_exam=Tử Phủ rồi sao? Lão phu nhìn là biết, khí tức ngươi đã khác. Nội môn không như ngoại môn: ở đó người ta không hỏi ngươi xuất thân từ đâu, chỉ hỏi ngươi đứng vững được bao lâu. Sân khảo hạch phía đông có một cỗ Trắc Nội Môn Thạch Nhân. Hạ được nó, lão phu sẽ trao bộ y phục nội môn cho ngươi.
dialogue.option.accept_quest_inner_exam=Đệ tử xin đi ngay.
dialogue.option.ask_forbidden_archive=Đệ tử muốn xuống Tàng Thư Đường tầng cấm.
dialogue.town_elder.forbidden_archive=Đệ tử nội môn được phép xuống đó, nhưng lối xuống vẫn có thạch vệ canh. Chúng không phân biệt người trong tông hay kẻ ngoài. Hạ hai con mở lối, đọc gì thì đọc, rồi về báo lão phu. Mà khoan... mảnh ngọc cổ ngươi nhặt năm xưa, vẫn còn giữ đấy chứ? Mang theo. Không, không có gì. Cứ mang theo.
dialogue.option.accept_quest_forbidden_archive=Đệ tử đi đây.
dialogue.option.ask_leaked_exam=Có kẻ lạ trà trộn quanh sân khảo hạch.
dialogue.town_elder.leaked_exam=Lão phu cũng thấy. Mảnh ngọc của ngươi phát sáng dưới tầng cấm... thứ đó lão phu từng đọc trong một cuốn sách không nên đọc. Thiên Môn... thôi, không phải chuyện bây giờ. Việc trước mắt: bọn trà trộn kia mang dấu Huyết Sa. Hạ ba tên, lục xem chúng mang theo gì.
dialogue.option.accept_quest_leaked_exam=Đệ tử sẽ lục cho rõ.
dialogue.option.ask_grand_contest=Đại bỉ võ toàn tông sắp mở.
dialogue.town_elder.grand_contest=Lịch khảo hạch trong người bọn chúng là thứ chỉ hàng trưởng lão được xem. Ngươi hiểu nghĩa là gì rồi đấy, nhưng đừng nói với ai, kể cả lão phu cũng không đoán được là ai. Còn bỉ võ thì cứ đi. Bạch Kính Chi chờ ngươi ở đài phía đông, nó nói ngươi đi cửa sau. Cho nó biết cửa nào.
dialogue.option.accept_quest_grand_contest=Đệ tử lên đài.
dialogue.option.ask_altar_master=Huyết Sa tập kích lễ bỉ võ!
dialogue.town_elder.altar_master=Chúng nhắm vào những hạt giống Tử Phủ, tức là các ngươi. Đàn chủ của chúng đứng cuối sân phía đông. Dẹp đám tế đồ mở đường rồi đẩy lui hắn. Ngươi đã chạm tới Thần Thông thì cứ dùng, không chạm tới thì dùng cái đầu. Về đây báo lão phu.
dialogue.option.accept_quest_altar_master=Đệ tử xin dẹp chúng.
