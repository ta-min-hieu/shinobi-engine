dialogue.option.ask_dead_vein=Trưởng lão, ngoài mạch chết phía đông có người.
dialogue.town_elder.dead_vein=Người? Chỗ ấy linh khí cạn từ đời nào, cỏ còn không mọc nổi, ai ra đấy làm gì. Đội lấy khoáng về báo thấy ba bóng áo lạ đứng đào bới, hỏi thì không đáp, tới gần thì rút đao. Không phải tán tu — tán tu cướp xong là chạy, còn đám này ĐỨNG LẠI. Ngươi ra xem giúp lão phu. Đừng nương tay: chúng rút đao trước.
dialogue.option.accept_quest_dead_vein=Đệ tử đi xem.
dialogue.option.ask_blood_sand_trail=Trưởng lão, chỗ chúng đứng có vết lạ.
dialogue.town_elder.blood_sand_trail=Vết gì? ... Ngươi nói chậm lại. Đất xám, cỏ chết theo vòng tròn, linh khí hút sạch từ giữa ra? Lão phu nghe cái đó một lần rồi, trong cái hang mà ngươi với con bé kéo nhau về báo. Ngươi ra lục lại cho kỹ, rồi mang về cho nó xem — nó đứng trong hang ấy cùng ngươi, nó nhớ rõ hơn lão phu.
dialogue.option.accept_quest_blood_sand_trail=Đệ tử đi lục lại.
dialogue.option.ask_scatter_band=Trưởng lão, đám ấy có kẻ cầm đầu.
dialogue.town_elder.scatter_band=Ta đoán vậy. Loại đi lẻ không ai dám đứng lại nhìn mặt người của tông. Hắn đóng sâu nhất phía đông, chỗ mạch cạn hẳn — hạ hắn thì toán ấy tan, đường lấy khoáng thông lại. Lão phu nói trước cho rõ: tan một toán không phải là xong với chúng. Nhưng tông môn cần con đường ấy, mà ngươi thì đủ sức rồi.
dialogue.option.accept_quest_scatter_band=Đệ tử đi dẹp.

dialogue.option.ask_spirit_vein=Trưởng lão, nghe nói linh mạch ngoài núi có người chiếm?
dialogue.town_elder.spirit_vein=Chiếm thật. Một đám tán tu kéo tới cắm trại ngay trên mạch nhỏ phía đông, hút linh khí của tông môn mà uống rượu. Bọn ngoại môn đi lấy phần khoáng hàng tháng nay phải đi vòng. Ngươi vừa thức tỉnh linh căn, đây là việc đầu tiên ta giao cho một người CÓ linh căn: ra đó đuổi chúng đi. Ba đứa cầm đầu toán ngoài cùng, hạ được là đám còn lại tự tan. Đừng tham đánh một hơi — mạch ở xa, đánh xong thì đứng lại thở đã.
dialogue.option.accept_quest_spirit_vein=Đệ tử xin đi đòi lại linh mạch.

dialogue.option.ask_first_manual=Đệ tử nghe nói tông môn có phát công pháp?
dialogue.town_elder.first_manual=Có, và ngươi tới tuổi rồi. Nhưng mấy quyển của khoá ngươi thì nằm trong tay đám đoạt mạch — chúng lấy được trong đợt cướp xe khoáng tháng trước, mà chữ thì chúng không đọc nổi, chỉ biết đó là đồ của tông. Ngươi ra đòi về hai quyển, ta xét xong thì trao lại cho ngươi cùng bộ pháp y ngoại môn. Nói trước cho khỏi tủi: pháp y ấy không phải thưởng cho việc đi đòi sách. Nó là thứ ngươi sẽ cần cho việc TIẾP THEO.
dialogue.option.accept_quest_first_manual=Đệ tử xin đi đòi công pháp về.

dialogue.option.ask_raider_band=Trưởng lão, đám đoạt mạch vẫn chưa chịu đi.
dialogue.town_elder.raider_band=Ta biết. Đuổi đàn em thì đàn em quay lại, chuyện đó không dứt được ở giữa. Cái đầu của nó nằm sâu phía đông, chỗ mạch cạn — một gã tán tu có chút bản lĩnh thật, uống rượu suốt ngày mà chưa ai trong ngoại môn đánh lại. Ngươi mặc pháp y vào rồi hẵng đi; không có nó thì đừng đi. Hạ được hắn thì phần việc tạp dịch của ngươi coi như xong hẳn, và ta có chuyện khác muốn bàn.
dialogue.option.accept_quest_raider_band=Đệ tử xin đi dẹp đám ấy.
