dialogue.option.ask_night_watch=Nghe nói dạo này vườn linh thảo hay mất đồ?
dialogue.town_elder.night_watch=Ba đêm liền, luống Thanh Vân Thảo ngoài rào bị vặt trụi. Không phải thú — thú không biết chọn cây nào đáng tiền. Là tán tu, loại không tông không môn, sống bằng nghề nhặt của người khác. Đêm nay tới phiên ngươi trực. Ta không bảo ngươi thắng hắn; ta bảo ngươi ĐUỔI hắn đi. Đứng được ở đó tới sáng thì tự khắc có người trong tông nhớ mặt ngươi.
